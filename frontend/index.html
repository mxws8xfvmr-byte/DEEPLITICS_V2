<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deeplitics</title>
<style>
/* ============================================================
   DEEPLITICS v7 — Design-System
   Dunkelmodus ist Standard. Farben sind CSS-Variablen, die beim
   Theme-Wechsel (data-theme) und je Story (data-cat) neu gesetzt
   werden. Kategorie-Farben sind FEST zugeordnet (dataviz-Skill:
   kategoriale Farben in fester Reihenfolge, nie rotierend).
   ============================================================ */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

:root {
  --radius-s: 10px;
  --radius-m: 16px;
  --radius-l: 22px;
  --radius-xl: 28px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Segoe UI", Helvetica, Arial, sans-serif;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

html[data-theme="dark"] {
  --bg: #050506;
  --bg-soft: #0b0c0f;
  --bg-elevated: #14151a;
  --bg-card: #15161b;
  --bg-card-hover: #1b1c22;
  --ink: #f5f5f7;
  --ink-secondary: #a6a6ad;
  --ink-muted: #7b7b83;
  --border: rgba(255,255,255,0.09);
  --border-strong: rgba(255,255,255,0.16);
  --overlay-bg: rgba(5,5,6,0.72);
  --scrim-top: rgba(0,0,0,0);
  --scrim-bottom: rgba(0,0,0,0.85);
  --shadow: 0 20px 60px rgba(0,0,0,0.55);
  --input-bg: rgba(255,255,255,0.06);
}
html[data-theme="light"] {
  --bg: #f4f4f6;
  --bg-soft: #ffffff;
  --bg-elevated: #ffffff;
  --bg-card: #ffffff;
  --bg-card-hover: #fbfbfc;
  --ink: #1d1d1f;
  --ink-secondary: #55565b;
  --ink-muted: #86868b;
  --border: rgba(0,0,0,0.08);
  --border-strong: rgba(0,0,0,0.14);
  --overlay-bg: rgba(244,244,246,0.78);
  --scrim-top: rgba(0,0,0,0);
  --scrim-bottom: rgba(0,0,0,0.62);
  --shadow: 0 20px 50px rgba(0,0,0,0.14);
  --input-bg: rgba(0,0,0,0.045);
}

/* Kategorie-Paletten: fest je Thema, light/dark-Variante je Modus.
   Werte angelehnt an bekannte, kontraststarke iOS-Systemfarben. */
html[data-theme="dark"] {
  --cat-security:      #0a84ff;
  --cat-diplomacy:      #40c8e0;
  --cat-trade:          #ff9f0a;
  --cat-rights:         #bf5af2;
  --cat-conflict:       #ff453a;
  --cat-surveillance:   #32d74b;
  --good: #32d74b;
  --bad: #ff6961;
}
html[data-theme="light"] {
  --cat-security:      #0071e3;
  --cat-diplomacy:      #0a9396;
  --cat-trade:          #c9750b;
  --cat-rights:         #8944ab;
  --cat-conflict:       #d70015;
  --cat-surveillance:   #248a3d;
  --good: #1f8a3c;
  --bad: #c9342a;
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

a { color: inherit; }
button { font-family: inherit; cursor: pointer; }

.wrap { max-width: 1080px; margin: 0 auto; padding: 0 24px; }
@media (max-width: 640px) { .wrap { padding: 0 16px; } }

/* ---------- Topbar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 40;
  backdrop-filter: blur(20px) saturate(1.4);
  background: var(--overlay-bg);
  border-bottom: 1px solid var(--border);
}
.topbar-inner {
  max-width: 1080px; margin: 0 auto; padding: 0 24px;
  height: 56px; display: flex; align-items: center; justify-content: space-between;
}
.brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 18px; letter-spacing: -0.01em; cursor: pointer; border: none; background: none; color: var(--ink); }
.brand-dot { width: 9px; height: 9px; border-radius: 50%; background: linear-gradient(135deg, var(--cat-security), var(--cat-rights)); }
.top-actions { display: flex; align-items: center; gap: 12px; }
.last-updated { font-size: 12px; color: var(--ink-muted); font-weight: 550; white-space: nowrap; }
@media (max-width: 560px) { .last-updated { display: none; } }
.icon-btn {
  width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border);
  background: var(--bg-elevated); color: var(--ink); display: flex; align-items: center; justify-content: center;
  transition: transform .15s var(--ease), background .15s;
}
.icon-btn:hover { background: var(--bg-card-hover); transform: scale(1.06); }
.icon-btn svg { width: 17px; height: 17px; }
.avatar-btn {
  width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border-strong);
  padding: 0; overflow: hidden; transition: transform .15s var(--ease);
}
.avatar-btn:hover { transform: scale(1.07); }
.avatar-btn svg, .avatar-mini svg { width: 100%; height: 100%; display: block; }

/* ---------- Greeting / Home header ---------- */
.greeting { padding: 46px 0 22px; }
.greeting-eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 10px; }
.greeting-title { font-size: 38px; line-height: 1.12; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 10px; max-width: 720px; }
.greeting-sub { font-size: 16px; color: var(--ink-secondary); margin: 0; max-width: 620px; }
@media (max-width: 640px) { .greeting-title { font-size: 28px; } }

.pref-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 22px 0 8px; }
.pref-chip {
  border: 1px solid var(--border); background: var(--bg-elevated); color: var(--ink-secondary);
  border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 600; transition: all .15s var(--ease);
}
.pref-chip.active { color: #fff; border-color: transparent; }
.pref-chip:hover { border-color: var(--border-strong); }

/* ---------- Story grid / cards ---------- */
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px; padding: 18px 0 60px; }
@media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }

.card {
  background: var(--bg-card); border-radius: var(--radius-l); overflow: hidden;
  border: 1px solid var(--border); cursor: pointer;
  transition: transform .28s var(--ease), box-shadow .28s var(--ease), background .2s;
  display: flex; flex-direction: column;
}
.card:hover { transform: translateY(-3px); box-shadow: var(--shadow); background: var(--bg-card-hover); }

.media { position: relative; width: 100%; overflow: hidden; background: var(--bg-elevated); }
.media .fallback {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  background: var(--fb-grad, linear-gradient(135deg, var(--cat-c1), var(--cat-c2)));
}
.media .fallback svg { width: 34%; height: 34%; opacity: .92; }
.media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }

.card-media { aspect-ratio: 16/10.5; border-radius: var(--radius-l) var(--radius-l) 0 0; }
.card-media::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.55), rgba(0,0,0,0) 55%);
}
.cat-chip {
  position: absolute; top: 12px; left: 12px; z-index: 2;
  font-size: 11.5px; font-weight: 700; letter-spacing: .02em; color: #fff;
  padding: 5px 11px; border-radius: 999px; backdrop-filter: blur(6px);
  background: color-mix(in srgb, var(--cat-color) 78%, #000 6%);
}
.save-btn {
  position: absolute; top: 10px; right: 10px; z-index: 3;
  width: 32px; height: 32px; border-radius: 50%; border: none;
  background: rgba(0,0,0,0.38); backdrop-filter: blur(6px);
  display: flex; align-items: center; justify-content: center; color: #fff;
  transition: transform .15s var(--ease), background .15s;
}
.save-btn:hover { transform: scale(1.08); background: rgba(0,0,0,0.55); }
.save-btn svg { width: 16px; height: 16px; }
.save-btn.saved svg path { fill: currentColor; }

.card-body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.card-title { font-size: 18px; font-weight: 750; letter-spacing: -0.012em; line-height: 1.28; margin: 0; }
.card-dek {
  font-size: 14px; color: var(--ink-secondary); line-height: 1.5; margin: 0;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.card-meta { margin-top: auto; padding-top: 6px; font-size: 12.5px; color: var(--ink-muted); display: flex; gap: 8px; align-items: center; }
.card-meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--ink-muted); }

/* ---------- Overlay / Detail view ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 100; background: var(--bg);
  transform: translateY(100%); transition: transform .38s var(--ease);
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.overlay.open { transform: translateY(0); }
.overlay-topbar {
  position: sticky; top: 0; z-index: 20; display: flex; justify-content: space-between; align-items: center;
  padding: 12px 18px; background: var(--overlay-bg); backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
}
.pill-btn {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border-strong);
  background: var(--bg-elevated); color: var(--ink); border-radius: 999px; padding: 8px 14px;
  font-size: 13.5px; font-weight: 600; transition: background .15s;
}
.pill-btn:hover { background: var(--bg-card-hover); }
.pill-btn svg { width: 14px; height: 14px; }

.detail-hero { position: relative; width: 100%; aspect-ratio: 16/8.2; margin-bottom: -64px; }
@media (max-width: 640px) { .detail-hero { aspect-ratio: 4/3.4; margin-bottom: -46px; } }
.detail-hero::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(to top, var(--bg-soft) 0%, var(--bg-soft) 4%, var(--scrim-bottom) 22%, transparent 62%);
}

.detail-content { position: relative; max-width: 760px; margin: 0 auto; padding: 0 24px 90px; }
.detail-eyebrow { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; font-size: 13px; color: var(--ink-muted); font-weight: 600; }
.detail-cat-chip { color: #fff; padding: 4px 11px; border-radius: 999px; font-size: 11.5px; font-weight: 700; background: var(--cat-color); }
.detail-title { font-size: 33px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.18; margin: 0 0 14px; text-shadow: 0 2px 24px var(--bg-soft); }
@media (max-width: 640px) { .detail-title { font-size: 26px; } }
.detail-dek { font-size: 18px; color: var(--ink-secondary); line-height: 1.5; margin: 0 0 28px; }

.summary-list { list-style: none; margin: 0 0 28px; padding: 0; display: flex; flex-direction: column; gap: 13px; }
.summary-list li { display: flex; gap: 12px; font-size: 16px; line-height: 1.55; }
.summary-list li::before { content: ""; flex: 0 0 6px; width: 6px; height: 6px; border-radius: 50%; margin-top: 9px; background: var(--cat-color); }
.summary-list li .li-text { flex: 1 1 auto; min-width: 0; }

.deep-dive { font-size: 16.5px; line-height: 1.75; color: var(--ink); margin: 0 0 22px; white-space: pre-line; }
.deep-dive b, .lk { color: var(--ink); font-weight: 650; text-decoration: none; border-bottom: 1.5px solid color-mix(in srgb, var(--cat-color) 55%, transparent); cursor: pointer; }

.callout {
  margin: 24px 0; padding: 18px 20px; border-radius: var(--radius-m);
  background: color-mix(in srgb, var(--cat-color) 12%, var(--bg-elevated));
  border: 1px solid color-mix(in srgb, var(--cat-color) 30%, var(--border));
}
.callout-label { font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--cat-color); margin-bottom: 8px; }
.callout p { margin: 0; font-size: 15.5px; line-height: 1.6; }

/* ---------- Horizontal slideable tabs ---------- */
.tabbar {
  display: flex; gap: 8px; margin: 34px 0 18px; overflow-x: auto; scrollbar-width: none;
  padding-bottom: 2px;
}
.tabbar::-webkit-scrollbar { display: none; }
.tab-btn {
  flex: 0 0 auto; border: 1px solid var(--border); background: var(--bg-elevated); color: var(--ink-secondary);
  border-radius: 999px; padding: 9px 16px; font-size: 14px; font-weight: 650; white-space: nowrap;
  transition: all .18s var(--ease);
}
.tab-btn.active { background: var(--cat-color); color: #fff; border-color: transparent; }

.tab-viewport { overflow: hidden; border-radius: var(--radius-m); }
.tab-track { display: flex; width: 500%; transition: transform .42s var(--ease); }
.tab-pane { width: 20%; flex: 0 0 20%; min-width: 0; padding: 2px 1px; }

/* Übersicht-Pane: Bullet-Stichpunkte + „Weiterlesen“-Aufklappbereich */
.readmore-toggle { margin: 10px 0 4px; }
.readmore-box { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows .38s var(--ease), opacity .3s var(--ease); }
.readmore-box.open { grid-template-rows: 1fr; opacity: 1; }
.readmore-box > div { overflow: hidden; }
.readmore-box .deep-dive { margin: 14px 0 0; }

/* Stakeholders-Pane: Pro / Con */
.stake-section { margin-bottom: 22px; }
.stake-section:last-child { margin-bottom: 0; }
.stake-heading { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 750; text-transform: uppercase; letter-spacing: .03em; margin-bottom: 12px; }
.stake-heading.pro { color: var(--good); }
.stake-heading.con { color: var(--bad); }
.stake-heading svg { width: 15px; height: 15px; flex: none; }
.stake-list { display: flex; flex-direction: column; gap: 10px; }
.stake-card { display: flex; gap: 12px; padding: 13px 14px; border-radius: var(--radius-m); background: var(--bg-elevated); border: 1px solid var(--border); border-left: 3px solid transparent; cursor: pointer; transition: background .15s, transform .15s var(--ease); text-align: left; }
.stake-card:hover { background: var(--bg-card-hover); transform: translateY(-1px); }
.stake-card.pro { border-left-color: var(--good); }
.stake-card.con { border-left-color: var(--bad); }
.stake-avatar { width: 40px; height: 40px; border-radius: 50%; position: relative; overflow: hidden; flex: none; }
.stake-avatar .fallback svg { width: 46%; height: 46%; }
.stake-body { min-width: 0; }
.stake-name { font-size: 14.5px; font-weight: 700; margin-bottom: 3px; }
.stake-reason { font-size: 13.5px; line-height: 1.5; color: var(--ink-secondary); }
.stake-note { font-size: 13px; color: var(--ink-muted); line-height: 1.55; padding: 12px 14px; border-radius: var(--radius-m); background: var(--bg-elevated); border: 1px dashed var(--border-strong); margin-top: 4px; }
.stake-empty { font-size: 13.5px; color: var(--ink-muted); padding: 4px 2px; }

/* Historien */
.thread-tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 18px; scrollbar-width: none; }
.thread-tabs::-webkit-scrollbar { display: none; }
.thread-tab { flex: 0 0 auto; border: 1px solid var(--border); background: transparent; color: var(--ink-secondary); border-radius: var(--radius-s); padding: 8px 13px; font-size: 13px; font-weight: 600; }
.thread-tab.active { background: var(--bg-elevated); color: var(--ink); border-color: var(--border-strong); }
.timeline { position: relative; padding-left: 22px; }
.timeline::before { content: ""; position: absolute; left: 5px; top: 6px; bottom: 6px; width: 1.5px; background: var(--border-strong); }
.tl-item { position: relative; padding-bottom: 22px; }
.tl-item:last-child { padding-bottom: 0; }
.tl-dot { position: absolute; left: -22px; top: 4px; width: 11px; height: 11px; border-radius: 50%; background: var(--bg); border: 2.5px solid var(--cat-color); }
.tl-year { font-size: 12.5px; font-weight: 700; color: var(--cat-color); margin-bottom: 3px; }
.tl-one { font-size: 15px; line-height: 1.5; cursor: pointer; }
.tl-ext { font-size: 14.5px; line-height: 1.6; color: var(--ink-secondary); margin-top: 8px; display: none; }
.tl-item.expanded .tl-ext { display: block; }
.tl-item.expanded .tl-one { color: var(--ink); }
.tl-toggle-hint { font-size: 12px; color: var(--ink-muted); margin-left: 6px; }

/* Akteure / entities */
.entity-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 10px; }
.entity-chip { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 8px; border-radius: var(--radius-m); border: 1px solid var(--border); background: var(--bg-elevated); text-align: center; transition: background .15s, transform .15s var(--ease); }
.entity-chip:hover { background: var(--bg-card-hover); transform: translateY(-2px); }
.entity-avatar { width: 56px; height: 56px; border-radius: 50%; position: relative; overflow: hidden; flex: none; }
.entity-avatar .fallback { border-radius: 50%; }
.entity-avatar .fallback svg { width: 46%; height: 46%; }
.entity-name { font-size: 13px; font-weight: 650; line-height: 1.3; }
.entity-role { font-size: 11.5px; color: var(--ink-muted); line-height: 1.3; }

.entity-modal-scrim { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 150; opacity: 0; pointer-events: none; transition: opacity .25s; }
.entity-modal-scrim.open { opacity: 1; pointer-events: auto; }
.entity-modal {
  position: fixed; left: 50%; bottom: 0; transform: translate(-50%, 100%); width: min(560px, 92vw);
  max-height: 86vh; overflow-y: auto; background: var(--bg-soft); border-radius: 22px 22px 0 0; z-index: 151;
  transition: transform .32s var(--ease), opacity .25s var(--ease), visibility 0s linear .32s;
  box-shadow: var(--shadow); opacity: 0; visibility: hidden; pointer-events: none;
}
@media (min-width: 720px) { .entity-modal { bottom: 6vh; border-radius: 22px; transform: translate(-50%, 40px) scale(.97); } }
.entity-modal.open {
  transform: translate(-50%, 0); opacity: 1; visibility: visible; pointer-events: auto;
  transition: transform .32s var(--ease), opacity .25s var(--ease), visibility 0s linear 0s;
}
@media (min-width: 720px) { .entity-modal.open { transform: translate(-50%, 0) scale(1); } }
.entity-modal-hero { position: relative; aspect-ratio: 16/9; }
.entity-modal-body { padding: 22px 24px 32px; }
.entity-modal-close { position: absolute; top: 12px; right: 12px; z-index: 3; }
.entity-modal-type { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--cat-color); margin-bottom: 6px; }
.entity-modal-name { font-size: 24px; font-weight: 800; letter-spacing: -0.015em; margin: 0 0 4px; }
.entity-modal-role { font-size: 14.5px; color: var(--ink-secondary); margin: 0 0 16px; }
.entity-modal-bio { font-size: 15.5px; line-height: 1.65; color: var(--ink); margin: 0 0 18px; }

/* Märkte */
.market-empty { padding: 34px 20px; text-align: center; border-radius: var(--radius-m); border: 1px dashed var(--border-strong); color: var(--ink-secondary); font-size: 14.5px; }
.chart-card { border: 1px solid var(--border); border-radius: var(--radius-m); padding: 18px 18px 8px; background: var(--bg-elevated); }
.chart-title { font-size: 15px; font-weight: 700; margin: 0 0 2px; }
.chart-sub { font-size: 13px; color: var(--ink-muted); margin: 0 0 14px; }
.chart-note { font-size: 13px; color: var(--ink-secondary); margin: 14px 0 6px; line-height: 1.55; }
.legend-row { display: flex; gap: 16px; margin-bottom: 4px; flex-wrap: wrap; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-secondary); }
.legend-swatch { width: 9px; height: 9px; border-radius: 2px; }
.tooltip { position: absolute; pointer-events: none; background: var(--bg-elevated); border: 1px solid var(--border-strong); border-radius: 10px; padding: 8px 11px; font-size: 12.5px; box-shadow: var(--shadow); opacity: 0; transition: opacity .1s; z-index: 5; white-space: nowrap; }
.tooltip.show { opacity: 1; }

/* Zitate */
.section-heading { font-size: 20px; font-weight: 800; letter-spacing: -0.01em; margin: 40px 0 16px; }
.quote-card { border-left: 3px solid var(--cat-color); padding: 4px 0 4px 18px; margin-bottom: 18px; }
.quote-text { font-size: 17px; line-height: 1.55; margin: 0 0 6px; font-style: italic; }
.quote-attr { font-size: 13.5px; color: var(--ink-muted); }

/* Quellen als Buttons (keine sichtbaren Links) */
.source-row { display: flex; flex-wrap: wrap; gap: 9px; margin-bottom: 26px; }
.source-btn {
  display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--border);
  background: var(--bg-elevated); color: var(--ink); border-radius: 999px; padding: 8px 14px 8px 10px;
  font-size: 13.5px; font-weight: 600; transition: background .15s, transform .15s var(--ease);
}
.source-btn:hover { background: var(--bg-card-hover); transform: translateY(-1px); }
.source-btn .bias-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.source-btn svg { width: 12px; height: 12px; opacity: .55; margin-left: 2px; }
.bias-left { background: #5aa9ff; } .bias-center-left { background: #7ec8b0; }
.bias-center { background: #9a9aa2; } .bias-center-right { background: #e0b25a; }
.bias-right { background: #e0705a; } .bias-unknown { background: #6e6e73; }

.primary-source-card { border: 1px solid var(--border); border-radius: var(--radius-s); padding: 12px 14px; margin-bottom: 10px; background: var(--bg-elevated); }
.primary-source-title { font-size: 14px; font-weight: 650; margin: 0 0 4px; }
.primary-source-desc { font-size: 13px; color: var(--ink-secondary); margin: 0 0 8px; line-height: 1.5; }

.theory-concept { font-size: 17px; font-weight: 750; letter-spacing: -0.01em; margin: 2px 0 12px; }
.theory-lead { font-size: 15.5px; line-height: 1.62; color: var(--ink-secondary); margin: 0; }
.theory-points { margin: 0; padding-left: 20px; }
.theory-points li { font-size: 14.5px; line-height: 1.6; margin-bottom: 8px; color: var(--ink-secondary); }

/* ---------- Profile panel ---------- */
.profile-scrim { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 90; opacity: 0; pointer-events: none; transition: opacity .2s; }
.profile-scrim.open { opacity: 1; pointer-events: auto; }
.profile-panel {
  position: fixed; top: 64px; right: 16px; width: 320px; max-width: 90vw; z-index: 91;
  background: var(--bg-soft); border: 1px solid var(--border); border-radius: var(--radius-l);
  box-shadow: var(--shadow); transform: translateY(-8px) scale(.98); opacity: 0; pointer-events: none;
  transition: all .18s var(--ease); max-height: 82vh; overflow-y: auto;
}
.profile-panel.open { transform: translateY(0) scale(1); opacity: 1; pointer-events: auto; }
.profile-head { display: flex; align-items: center; gap: 12px; padding: 18px; border-bottom: 1px solid var(--border); }
.profile-avatar-lg { width: 48px; height: 48px; border-radius: 50%; overflow: hidden; flex: none; }
.profile-name { font-weight: 700; font-size: 15px; }
.profile-shuffle { font-size: 12.5px; color: var(--ink-muted); border: none; background: none; padding: 0; margin-top: 2px; text-decoration: underline; }
.profile-section { padding: 14px 18px; border-bottom: 1px solid var(--border); }
.profile-section:last-child { border-bottom: none; }
.profile-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--ink-muted); margin-bottom: 10px; }
.seg-control { display: flex; background: var(--input-bg); border-radius: 10px; padding: 3px; gap: 2px; }
.seg-btn { flex: 1; border: none; background: none; color: var(--ink-secondary); padding: 7px 0; border-radius: 8px; font-size: 13px; font-weight: 650; }
.seg-btn.active { background: var(--bg-card); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,0.15); }
.check-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; font-size: 14px; }
.check-row input { width: 16px; height: 16px; accent-color: var(--cat-security); }
.menu-link { display: flex; align-items: center; justify-content: space-between; width: 100%; border: none; background: none; color: var(--ink); font-size: 14.5px; font-weight: 600; padding: 10px 0; }
.menu-link .chev { color: var(--ink-muted); }
.session-note { padding: 12px 18px; font-size: 11.5px; color: var(--ink-muted); line-height: 1.5; }

/* ---------- History / Saved list views ---------- */
.list-row { display: flex; gap: 14px; align-items: center; padding: 14px 4px; border-bottom: 1px solid var(--border); cursor: pointer; }
.list-row:hover .card-title-sm { text-decoration: underline; }
.list-thumb { width: 64px; height: 64px; border-radius: var(--radius-s); overflow: hidden; flex: none; position: relative; }
.card-title-sm { font-size: 15px; font-weight: 650; margin: 0 0 3px; }
.list-meta { font-size: 12.5px; color: var(--ink-muted); }
.empty-state { padding: 60px 20px; text-align: center; color: var(--ink-muted); font-size: 14.5px; }

.fade-in { animation: fadeIn .35s var(--ease); }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
</style>

<script>
window.__STORIES__ = [{"title": "USA verhängen umfassendste Wirtschaftssanktionen gegen Iran", "theme_category": "trade", "one_line": "Die [[USA]] kündigten weitreichende Sanktionen gegen [[Iran]] an und drohten allen Handelspartnern mit wirtschaftlicher Isolation, während [[Iran]] mit der Blockade aller Ölexporte aus der Golfregion kontert.", "summary": ["US-Finanzminister [[Scott Bessent]] verkündete am 24. August 2026 die \"größte finanzielle Offensive aller Zeiten\" gegen [[Iran]], die als \"ökonomischer D-Day\" bezeichnet wird und jeden Akteur vom US-Dollar-System ausschließen soll, der mit Iran Geschäfte macht.", "Die Maßnahmen umfassen Sanktionen gegen fünf Wirtschaftssektoren (digitale Vermögenswerte, Technologie, Gold, Luftfahrt und Schifffahrt) sowie fast 60 Einzelpersonen, Einrichtungen und Schiffe, die Irans [[Revolutionsgarden]] und das Regime finanzieren sollen.", "[[Iran]] reagierte mit der Warnung, bei Fortführung des Konflikts alle Ölexporte aus der Region zu stoppen, und forderte alle Schiffe auf, die [[Straße von Hormus]] nicht ohne iranische Genehmigung zu passieren. Ein Fünftel der weltweiten Öl- und Gasexporte verläuft normalerweise durch diese Meerenge.", "Der iranische Wirtschaftsminister [[Ali Madanizadeh]] kündigte eine \"weitere Niederlage\" für die USA an und erklärte, Iran verfüge über einen \"Zwei-Jahres-Plan\" zur Bewältigung der neuen Sanktionen.", "[[Pakistan]] versucht zwischen den Konfliktparteien zu vermitteln. Armeechef [[Asim Munir]] traf am Montag in Teheran den iranischen Präsidenten [[Masoud Pezeshkian]], während die Friedensverhandlungen derzeit ins Stocken geraten sind.", "Die US-Marine hat nach eigenen Angaben im Rahmen ihrer Blockade gegen Iran bereits 71 Handelsschiffe umgeleitet, drei Schiffe außer Gefecht gesetzt und zwei geentert, während über 40 Schiffe mit humanitärer Hilfe passieren durften."], "deep_dive": "Die neue Sanktionsrunde markiert eine deutliche Eskalation im sechsmonatigen Konflikt zwischen den [[USA]] und [[Iran]]. Die Maßnahmen zielen darauf ab, sämtliche wirtschaftlichen Lebensadern des iranischen Regimes zu kappen, indem nicht nur Iran selbst, sondern auch alle Länder und Unternehmen sanktioniert werden, die mit dem Land Handel treiben. [[Scott Bessent]] betonte, die USA würden die iranische Bedrohung nicht mehr nur verwalten, sondern beenden. Das [[US-Finanzministerium]] hat nach eigenen Angaben die Netzwerke, Vermittler und Finanzkanäle kartiert, über die Iran trotz bestehender Sanktionen Öl verkauft.\n\nDie iranische Reaktion zeigt, dass Teheran bereit ist, den wirtschaftlichen Druck mit eigenen Mitteln zu kontern. Die Drohung, alle Ölexporte aus der Golfregion zu blockieren, ist keine leere Geste: Seit Konfliktbeginn Ende Februar hat Iran den Fluss durch die [[Straße von Hormus]] faktisch unterbunden, was bereits zu global steigenden Ölpreisen geführt hat. Ein vollständiger Stopp würde die Weltwirtschaft erheblich treffen, da ein Fünftel der globalen Öl- und Gaslieferungen durch diese enge Wasserstraße südlich von Iran verlaufen.\n\nExperten bezweifeln jedoch die unmittelbare Wirksamkeit der neuen Sanktionen. David Oxley von Capital Economics bezeichnete den \"ökonomischen D-Day\" als \"Rohrkrepierer\", da die bereits bestehende US-Seeblockade Irans Ölexporte ohnehin bereits stark einschränke. Die Geschichte der Iran-Sanktionen zeigt zudem, dass das Land über Jahrzehnte Umgehungsmechanismen entwickelt hat. [[Ali Madanizadeh]]s Verweis auf einen Zwei-Jahres-Plan deutet darauf hin, dass Iran sich auf diese Eskalation vorbereitet hat.\n\nDie Vermittlungsversuche [[Pakistan]]s unterstreichen die regionale Dimension des Konflikts. Islamabad hatte im Juni ein Memorandum of Understanding vermittelt, doch die Friedensgespräche scheinen festgefahren. Parallel zum wirtschaftlichen Druck melden sich auch andere Konfliktlinien: [[Benjamin Netanyahu]] behauptete, Iran habe versucht, einen seiner Söhne zu ermorden, was die persönliche und sicherheitspolitische Dimension des Konflikts zeigt. Zudem berichten britische Medien von iranisch-gesteuerten Cyberangriffen auf kritische Infrastruktur in Großbritannien und den USA, was auf eine zunehmend hybride Kriegsführung hindeutet.", "cui_bono": "Die [[USA]] versuchen, ihre geopolitische Dominanz im Nahen Osten zu festigen und Iran wirtschaftlich in die Knie zu zwingen, was auch innenpolitisch der Trump-Regierung als Demonstration von Stärke dient. [[China]], das nicht namentlich genannt wird, aber als großer Abnehmer iranischen Öls bekannt ist, könnte von steigenden Ölpreisen und einer Schwächung des US-geführten Finanzsystems profitieren, wenn alternative Handelswege etabliert werden. [[Pakistan]] positioniert sich als unverzichtbarer regionaler Vermittler und stärkt damit seinen strategischen Wert gegenüber allen Seiten.", "historical_threads": [{"id": "usa_iran_konflikt", "title": "USA-Iran-Konflikt", "entries": [{"date": "1979", "title": "Islamische Revolution und Geiselnahme", "one_line": "Die islamische Revolution stürzt den vom Westen unterstützten Schah, radikale Studenten besetzen die US-Botschaft in Teheran und halten 52 Amerikaner 444 Tage lang als Geiseln, was den Beginn der anhaltenden Feindschaft markiert.", "extended": "Der Sturz des Schahs Mohammad Reza Pahlavi beendete Jahrzehnte enger amerikanisch-iranischer Beziehungen. Die USA hatten 1953 den demokratisch gewählten Premierminister Mohammad Mossadegh gestürzt und den Schah wieder eingesetzt. Die Geiselkrise von 1979 bis 1981 wurde zum traumatischen Symbol amerikanischer Ohnmacht und prägt bis heute das gegenseitige Misstrauen."}, {"date": "2015", "title": "Atomabkommen (JCPOA)", "one_line": "Nach jahrelangen Verhandlungen einigen sich Iran, die USA und fünf weitere Mächte auf ein Abkommen, das Irans Atomprogramm begrenzt und im Gegenzug Sanktionen aufhebt.", "extended": "Das Joint Comprehensive Plan of Action war der bislang erfolgreichste Versuch, den Konflikt diplomatisch zu entschärfen. Iran verpflichtete sich, seine Urananreicherung drastisch zu reduzieren und internationalen Inspektionen zuzustimmen. Im Gegenzug wurden jahrzehntelange Wirtschaftssanktionen gelockert, was Iran kurzzeitig wirtschaftliche Erholung ermöglichte."}, {"date": "2018", "title": "Trump zieht USA aus Atomabkommen zurück", "one_line": "Präsident Donald Trump erklärt das Abkommen für gescheitert und führt erneut umfassende Wirtschaftssanktionen ein, die Irans Ölexporte und Zugang zum internationalen Finanzsystem massiv einschränken.", "extended": "Trumps Politik der \"maximalen Druck\" zielte darauf ab, Iran zu einem neuen, umfassenderen Abkommen zu zwingen, das auch Irans Raketenprogramm und regionale Aktivitäten einschließen sollte. Die einseitige Kündigung isolierte die USA jedoch von europäischen Verbündeten, die am Abkommen festhalten wollten. Iran reagierte schrittweise mit der Aufgabe seiner Verpflichtungen aus dem JCPOA."}, {"date": "Ende Februar 2026", "title": "Beginn des aktuellen Konflikts", "one_line": "Ein nicht näher beschriebenes Ereignis eskaliert zu einem offenen Konflikt, der seit sechs Monaten andauert und zur faktischen Blockade der Straße von Hormus sowie steigenden globalen Ölpreisen führt.", "extended": "Die Quellen nennen keine Details zum Auslöser, doch die Entwicklung führte zu einer US-Seeblockade und iranischen Gegenmaßnahmen. Die Trump-Regierung hat nach mehreren Kurswechseln und Fristverlängerungen nun die härteste Sanktionsrunde aller Zeiten verhängt. Der Konflikt hat sowohl militärische als auch wirtschaftliche Dimensionen und bedroht die globale Energieversorgung."}]}, {"id": "iran_sanktionen", "title": "Iran-Sanktionsregime", "entries": [{"date": "1979-1981", "title": "Erste US-Sanktionen nach Geiselkrise", "one_line": "Nach der Botschaftsbesetzung verhängen die USA erste wirtschaftliche Sanktionen gegen Iran, einschließlich eingefrorener Vermögenswerte und Handelsbeschränkungen.", "extended": "Präsident Jimmy Carter fror iranische Vermögenswerte in den USA ein und verhängte ein Importverbot für iranisches Öl. Diese Maßnahmen bildeten die Grundlage für ein Sanktionsregime, das in den folgenden Jahrzehnten sukzessive ausgebaut wurde und sich zunehmend auf Irans Atomprogramm und Unterstützung terroristischer Gruppen konzentrierte."}, {"date": "2010-2012", "title": "Multilaterale UN- und EU-Sanktionen", "one_line": "Die internationale Gemeinschaft verhängt koordinierte Sanktionen wegen Irans Atomprogramm, die den Energie-, Finanz- und Schifffahrtssektor treffen und Irans Wirtschaft massiv schädigen.", "extended": "Der UN-Sicherheitsrat verabschiedete mehrere Resolutionen, die EU verhängte Embargen auf iranisches Öl und schnitt iranische Banken vom SWIFT-System ab. Diese Maßnahmen führten zu einer Halbierung der iranischen Ölexporte, drastischer Währungsabwertung und Inflation. Der wirtschaftliche Druck war ein Hauptgrund, warum Iran 2013 Verhandlungen über sein Atomprogramm aufnahm."}, {"date": "2018-2021", "title": "Trumps \"Maximum Pressure\"-Kampagne", "one_line": "Nach dem Austritt aus dem Atomabkommen führen die USA einseitig die schärfsten Sanktionen der Geschichte ein und drohen internationalen Unternehmen mit Sekundärsanktionen, wenn sie mit Iran handeln.", "extended": "Die USA sanktionierten praktisch alle Bereiche der iranischen Wirtschaft, einschließlich der Revolutionsgarden als Terrororganisation. Besonders wirksam waren Sekundärsanktionen, die ausländische Firmen vor die Wahl stellten: Geschäfte mit Iran oder Zugang zum US-Markt. Dies zwang selbst europäische Unternehmen zum Rückzug aus Iran. Irans Wirtschaft schrumpfte dramatisch, doch das Regime überlebte durch Schwarzmarkthandel und Unterstützung aus China und Russland."}, {"date": "August 2026", "title": "Operation Economic Outcast", "one_line": "Die Trump-Regierung kündigt die umfassendste Sanktionsoffensive aller Zeiten an, die fünf Wirtschaftssektoren abdeckt und explizit darauf abzielt, jede internationale wirtschaftliche Verbindung zu Iran zu kappen.", "extended": "Die neue Runde geht über bisherige Maßnahmen hinaus, indem sie systematisch Umgehungsnetzwerke ins Visier nimmt und jedem Land mit wirtschaftlicher Isolation droht, das weiter mit Iran handelt. Das Finanzministerium hat nach eigenen Angaben die gesamte Struktur iranischer Sanktionsumgehung kartiert. Die Maßnahmen zielen darauf ab, nicht nur Irans Ölexporte zu stoppen, sondern auch alle anderen Einnahmequellen der Revolutionsgarden und des Regimes zu blockieren."}]}, {"id": "strasse_hormus", "title": "Straße von Hormus als Engpass", "entries": [{"date": "1980er", "title": "Tankerkrieg im Iran-Irak-Krieg", "one_line": "Während des Iran-Irak-Kriegs greifen beide Seiten Öltanker in der Straße von Hormus an, was zu internationalen Geleitschutz-Missionen und ersten Zusammenstößen zwischen Iran und der US-Marine führt.", "extended": "Der Tankerkrieg von 1984 bis 1988 zeigte erstmals Irans Bereitschaft, die Meerenge als strategische Waffe einzusetzen. Die USA reflaggierten kuwaitische Tanker und eskortierten sie militärisch. 1988 schoss das US-Kriegsschiff USS Vincennes versehentlich ein iranisches Passagierflugzeug ab und tötete 290 Menschen, ein Ereignis, das in Iran bis heute als Symbol amerikanischer Aggression gilt."}, {"date": "2011-2012", "title": "Iranische Drohung während Sanktionsverschärfung", "one_line": "Als der Westen Ölsanktionen verhängt, droht Iran wiederholt mit der Schließung der Straße von Hormus, führt Marineübungen durch und zeigt seine Fähigkeit, den globalen Ölfluss zu unterbrechen.", "extended": "Iran machte deutlich, dass es die Meerenge blockieren könnte, wenn seine eigenen Ölexporte verhindert würden. Die Drohung ließ die Ölpreise steigen und zeigte Irans asymmetrische Macht: Auch ohne militärische Überlegenheit kann es durch Kontrolle dieses Nadelöhrs massive wirtschaftliche Schäden verursachen. Die USA verstärkten ihre Marinepräsenz im Persischen Golf erheblich."}, {"date": "2019", "title": "Angriffe auf Tanker im Golf von Oman", "one_line": "Mehrere Öltanker werden nahe der Straße von Hormus angegriffen, die USA machen Iran verantwortlich, was die Spannungen auf einen Höhepunkt treibt und fast zu einem militärischen Konflikt führt.", "extended": "Sechs Tanker wurden in zwei separaten Vorfällen beschädigt, die USA veröffentlichten Videomaterial, das iranische Revolutionsgarden bei der Entfernung nicht explodierter Minen zeigen soll. Iran bestritt jede Beteiligung. Die Vorfälle führten zu internationalen Forderungen nach Schutz der Schifffahrt und zeigten die Verwundbarkeit globaler Energieversorgung durch diese enge Passage."}, {"date": "Ende Februar 2026", "title": "Faktische Blockade seit Konfliktbeginn", "one_line": "Seit Beginn des aktuellen Konflikts hat Iran den Ölfluss durch die Straße von Hormus praktisch unterbunden, was zu den anhaltend hohen globalen Ölpreisen führt und die wirtschaftliche Dimension der Auseinandersetzung unterstreicht.", "extended": "Die Blockade markiert die erste längerfristige Unterbrechung des Ölflusses durch diese strategisch kritische Meerenge. Die USA haben eine Gegenblockade verhängt und bereits über 70 Handelsschiffe umgeleitet. Iran warnt nun, dass kein Schiff ohne iranische Genehmigung passieren dürfe. Die Situation zeigt, wie wirtschaftliche und militärische Druckmittel ineinandergreifen und beide Seiten versuchen, die Weltwirtschaft als Hebel zu nutzen."}]}], "entities": [{"name": "USA", "type": "country", "role_in_story": "Verhängen umfassende Wirtschaftssanktionen gegen Iran und drohen allen Handelspartnern mit wirtschaftlicher Isolation", "profile": "Die USA verfolgen seit der islamischen Revolution 1979 eine Politik der Eindämmung und Isolation Irans. Unter wechselnden Regierungen schwankt der Ansatz zwischen maximaler wirtschaftlicher Druckausübung und Verhandlungslösungen. Die Trump-Regierung setzt konsequent auf Konfrontation und nutzt die Dominanz des US-Dollar-Systems als Waffe. Amerikas strategische Interessen im Nahen Osten umfassen die Sicherung der Energieversorgung, den Schutz Israels und die Eindämmung iranischen Einflusses.", "established": "1776", "image_url": null}, {"name": "Iran", "type": "country", "role_in_story": "Sieht sich der umfassendsten Sanktionsoffensive aller Zeiten ausgesetzt und droht mit der Blockade aller Ölexporte aus der Golfregion", "profile": "Die Islamische Republik Iran versteht sich seit 1979 als antiwestliche Macht und nutzt asymmetrische Strategien zur Verteidigung seiner Interessen. Das Land hat über Jahrzehnte Mechanismen zur Sanktionsumgehung entwickelt und pflegt Bündnisse mit Russland, China und nichtstaatlichen Akteuren in der Region. Iran setzt auf eine Kombination aus wirtschaftlicher Resilienz, regionaler Stellvertreter-Politik und der strategischen Kontrolle über die Straße von Hormus als Druckmittel gegen westliche Interventionen.", "established": "1979", "image_url": null}, {"name": "Scott Bessent", "type": "person", "role_in_story": "Verkündet als US-Finanzminister die neue Sanktionsoffensive gegen Iran und bezeichnet sie als größte finanzielle Offensive aller Zeiten", "profile": "Bessent agiert als zentraler Architekt der Trump-Administration bei der Umsetzung wirtschaftlicher Zwangsmaßnahmen. Seine Rhetorik verbindet militärische Metaphern mit Finanzpolitik und signalisiert einen kompromisslosen Ansatz. Er betont die systematische Kartierung iranischer Umgehungsnetzwerke und droht explizit mit der Abkopplung vom US-Dollar-System als ultimativem Druckmittel.", "established": null, "image_url": null}, {"name": "Ali Madanizadeh", "type": "person", "role_in_story": "Reagiert als iranischer Wirtschaftsminister auf die US-Sanktionen und kündigt eine weitere Niederlage für die USA sowie einen Zwei-Jahres-Plan zur Bewältigung an", "profile": "Madanizadeh verkörpert Irans Haltung der Unbeirrbarkeit gegenüber amerikanischem Druck. Seine öffentlichen Äußerungen zielen darauf ab, innenpolitisch Zuversicht zu vermitteln und nach außen Entschlossenheit zu demonstrieren. Der Verweis auf einen vorbereiteten Zwei-Jahres-Plan suggeriert, dass Iran die Eskalation antizipiert hat und sich auf eine längere Phase wirtschaftlicher Autarkie eingestellt hat.", "established": null, "image_url": null}, {"name": "Pakistan", "type": "country", "role_in_story": "Versucht zwischen den USA und Iran zu vermitteln, wobei Armeechef Asim Munir hochrangige iranische Vertreter in Teheran trifft", "profile": "Pakistan positioniert sich traditionell als regionaler Vermittler und pflegt Beziehungen sowohl zum Westen als auch zu Iran. Das Land hat wirtschaftliche und sicherheitspolitische Interessen an Stabilität in der Region und nutzt Vermittlungsrollen, um seinen eigenen strategischen Wert zu erhöhen. Die Führung der Diplomatie durch den Armeechef unterstreicht die dominante Rolle des Militärs in Pakistans Außenpolitik.", "established": "1947", "image_url": null}, {"name": "Asim Munir", "type": "person", "role_in_story": "Trifft als pakistanischer Armeechef den iranischen Präsidenten und andere Spitzenvertreter in Teheran im Rahmen von Vermittlungsbemühungen", "profile": "Als Chef der mächtigen pakistanischen Armee ist Munir eine Schlüsselfigur in der Außenpolitik des Landes. Seine direkte Involvierung in diplomatische Missionen spiegelt die zentrale Rolle des Militärs in Pakistans strategischen Entscheidungen wider. Die Vermittlung zwischen verfeindeten Großmächten dient auch der Stärkung von Pakistans eigener regionaler Position.", "established": null, "image_url": null}, {"name": "Masoud Pezeshkian", "type": "person", "role_in_story": "Empfängt als iranischer Präsident den pakistanischen Armeechef zu Vermittlungsgesprächen", "profile": "Pezeshkian repräsentiert die politische Führung Irans in einer Zeit extremer außenpolitischer Spannungen. Als Präsident ist er Teil eines komplexen Machtsystems, in dem der Oberste Führer und die Revolutionsgarden ebenfalls zentrale Rollen spielen. Seine Bereitschaft, Vermittler zu empfangen, deutet auf iranisches Interesse hin, trotz harter Rhetorik diplomatische Kanäle offen zu halten.", "established": null, "image_url": null}, {"name": "Benjamin Netanyahu", "type": "person", "role_in_story": "Behauptet, Iran habe versucht, einen seiner Söhne zu ermorden, was die persönliche und sicherheitspolitische Dimension des Konflikts unterstreicht", "profile": "Netanyahu ist seit Jahrzehnten einer der schärfsten Kritiker Irans und hat die Bekämpfung iranischer Einflussnahme zur Priorität israelischer Politik gemacht. Seine Behauptungen zu Attentatsversuchen fügen dem geopolitischen Konflikt eine persönliche Note hinzu und werden im Kontext der bevorstehenden israelischen Wahlen getätigt, was auch innenpolitische Kalküle nahelegt.", "established": "1949", "image_url": null}, {"name": "Revolutionsgarden", "type": "organization", "role_in_story": "Werden von den USA als Hauptziel der Sanktionen genannt, da diese darauf abzielen, jede Einnahmequelle der Organisation zu blockieren", "profile": "Die Islamischen Revolutionsgarden (IRGC) sind weit mehr als eine Militärorganisation. Sie kontrollieren große Teile der iranischen Wirtschaft, betreiben eigene Unternehmen in Bereichen von Bauwesen bis Telekommunikation und sind zentral für Irans regionale Stellvertreter-Netzwerke. Die USA stufen die IRGC als Terrororganisation ein. Ihre wirtschaftliche Macht macht sie zum primären Ziel von Sanktionen, die Iran strategisch schwächen sollen.", "established": "1979", "image_url": null}, {"name": "Straße von Hormus", "type": "concept", "role_in_story": "Bildet den zentralen geografischen Engpass, durch den normalerweise ein Fünftel der weltweiten Öl- und Gasexporte fließen und den Iran faktisch blockiert hat", "profile": "Diese nur 39 Kilometer breite Meerenge zwischen Iran und Oman ist der einzige Seeweg vom Persischen Golf zum offenen Ozean. Sie ist damit die wichtigste Öl-Durchgangsroute der Welt. Wer die Straße kontrolliert oder blockiert, kann massive Auswirkungen auf die Weltwirtschaft ausüben. Iran nutzt of the Iranian people and the country's officials, but they have failed every time. It seems they wished to suffer yet another defeat", "attribution": "Ali Madanizadeh, iranischer Wirtschaftsminister", "context": "Reaktion auf die angekündigten US-Sanktionen", "source_url": "https://www.cbsnews.com"}, {"text": "With the renewed US naval blockade already strangling Iran's oil exports, the direct impact of 'economic D-Day' on Iran's energy revenues will be somewhat of a damp squib", "attribution": "David Oxley, Chief Climate and Commodities Economist bei Capital Economics", "context": "Einschätzung zur tatsächlichen Wirksamkeit der neuen Sanktionen", "source_url": "https://www.bbc.com"}], "political_theory": {"theory": "[[Wirtschaftssanktionen als Instrument der Außenpolitik]]", "points": ["Die USA setzen ihre Kontrolle über das globale Finanzsystem und den [[US-Dollar]]-Handel als Machtinstrument ein, um politische Ziele ohne militärische Gewalt durchzusetzen, was dem Konzept des 'economic statecraft' entspricht.", "Sekundärsanktionen zwingen Drittstaaten wie [[China]] zur Wahl zwischen Zugang zum US-Markt oder Handel mit [[Iran]], was die extraterritoriale Reichweite amerikanischer Macht demonstriert und internationale Spannungen erzeugt.", "[[Iran]]s angekündigter Zwei-Jahres-Plan zur Sanktionsbewältigung zeigt das klassische Problem der Sanktionswirksamkeit: Zielstaaten entwickeln Resilienz und Umgehungsmechanismen, während Regime oft härter werden statt nachzugeben.", "Die Drohung mit der Blockade der [[Straße von Hormus]] illustriert asymmetrische Machtstrategien: Ein militärisch unterlegener Staat nutzt geografische Kontrolle über kritische Infrastruktur, um disproportionale wirtschaftliche Schäden zu verursachen.", "Die zentrale Rolle der [[Revolutionsgarden]] in Irans Wirtschaft zeigt, wie Sanktionen oft zivile Bevölkerung treffen, während sanktionierende Eliten ihre Position durch Kontrolle von Schwarzmärkten sogar stärken können."]}, "connections": [{"source": "Scott Bessent", "target": "US-Finanzministerium", "relation": "leitet als Finanzminister"}, {"source": "US-Finanzministerium", "target": "Iran", "relation": "verhängt umfassende Sanktionen gegen"}, {"source": "USA", "target": "Iran", "relation": "führt Wirtschaftskrieg gegen"}, {"source": "Iran", "target": "Straße von Hormus", "relation": "kontrolliert und blockiert faktisch"}, {"source": "Pakistan", "target": "USA", "relation": "vermittelt zwischen"}, {"source": "Pakistan", "target": "Iran", "relation": "vermittelt zwischen"}, {"source": "Asim Munir", "target": "Masoud Pezeshkian", "relation": "trifft zu Vermittlungsgesprächen"}, {"source": "US-Finanzministerium", "target": "Revolutionsgarden", "relation": "zielt mit Sanktionen auf"}, {"source": "China", "target": "USA", "relation": "kritisiert Sanktionspolitik von"}, {"source": "China", "target": "Iran", "relation": "importiert Öl von"}, {"source": "Benjamin Netanyahu", "target": "Iran", "relation": "beschuldigt des Attentatsversuchs"}, {"source": "Ali Madanizadeh", "target": "USA", "relation": "widerspricht Sanktionsstrategie von"}], "countries_covered": ["USA", "Iran", "Pakistan", "China", "Israel", "Vereinigtes Königreich"], "image_url": "https://ichef.bbci.co.uk/ace/branded_news/1200/cpsprodpb/de12/live/09a94a20-9fe6-11f1-8ed1-41aaf1fca4f2.jpg", "stakeholders": {"pro": [{"entity": "USA", "reason": "Demonstrieren wirtschaftliche und geopolitische Macht, üben maximalen Druck auf Iran aus und stärken innenpolitisch das Image entschlossenen Handelns"}, {"entity": "Pakistan", "reason": "Positioniert sich als unverzichtbarer regionaler Vermittler und erhöht damit seinen strategischen Wert gegenüber allen Konfliktparteien"}, {"entity": "Benjamin Netanyahu", "reason": "Kann die Spannungen mit Iran innenpolitisch vor Wahlen nutzen und erhält möglicherweise verstärkte US-Unterstützung für Israels Sicherheitsinteressen"}], "con": [{"entity": "Iran", "reason": "Sieht sich der umfassendsten wirtschaftlichen Isolation aller Zeiten ausgesetzt, die Staatseinnahmen, Handel und Lebensstandard der Bevölkerung massiv bedroht"}, {"entity": "China", "reason": "Verliert einen wichtigen Öllieferanten oder muss sich zwischen Zugang zum US-Markt und iranischem Öl entscheiden"}, {"entity": "Revolutionsgarden", "reason": "Werden explizit als Hauptziel genannt und sollen von allen Einnahmequellen abgeschnitten werden, was ihre wirtschaftliche und militärische Macht schwächt"}], "note": "Die globale Wirtschaft könnte durch anhaltend hohe Ölpreise und Versorgungsunsicherheit leiden, was sowohl Verbraucher als auch Industrien weltweit betrifft"}, "id": "f296da25", "generated_at": "2026-08-24T20:35:31Z", "sources": ["BBC News – World", "Bloomberg – Politics", "CBS News – World", "France24 – World (EN)", "NPR – World", "The New York Times – World"], "article_urls": ["https://www.bbc.co.uk/news/articles/c0qxew81y83o?at_medium=RSS&at_campaign=rss", "https://www.france24.com/en/middle-east/20260824-middle-east-live-iran-warns-of-a-harsh-response-to-anticipated-us-sanctions", "https://www.bloomberg.com/news/articles/2026-08-24/bessent-pledges-to-isolate-iran-from-global-economy", "https://www.npr.org/2026/08/24/g-s1-139743/treasury-secretary-scott-bessent-to-unveil-new-economic-sanctions-on-iran", "https://www.nytimes.com/2026/08/24/world/middleeast/iran-sanctions-economy-us-trump.html", "https://www.cbsnews.com/live-updates/iran-war-us-trump-sanctions-strait-of-hormuz/"], "primary_sources": [], "market_correlation": null, "_pipeline_meta": {"model": "claude-sonnet-4-5", "research_depth": "lite", "articles_used": 6, "input_tokens": 6324, "output_tokens": 9083}}, {"title": "USA-Kanada-Handelskrieg eskaliert: 50%-Autozölle ab 2027", "theme_category": "trade", "one_line": "[[Donald Trump]] kündigt drastische Zollerhöhungen auf kanadische Fahrzeuge und Stahl für 2027 an, nachdem Verhandlungen gescheitert sind und [[Mark Carney]] Vergeltungsmaßnahmen angekündigt hat.", "summary": ["[[Donald Trump]] hat angekündigt, die Zölle auf alle kanadischen Autos, Lastwagen, Autoteile und Stahl ab dem 1. Januar 2027 auf 50% zu erhöhen, eine Verdoppelung der aktuellen Sätze für Nicht-US-Produkte.", "Die Ankündigung folgt dem Scheitern von Verhandlungen am Wochenende, nachdem die USA bereits 50%-Zölle auf kanadische Waren im Wert von 20 Milliarden Dollar verhängt hatten, darunter Hockeyausrüstung und Elektronik.", "[[Mark Carney]] bezeichnete die Situation als Kriegszustand und kündigte an, die US-Zölle ab dem 8. September 'Dollar für Dollar' zu erwidern, lehnte aber ein Abkommen 'um jeden Preis' ab.", "Das jährliche Handelsvolumen zwischen den beiden Nachbarstaaten beträgt rund 909 Milliarden Dollar, wobei [[Kanada]] etwa 95% seines Handels mit den [[USA]] abwickelt und der größte Abnehmer amerikanischer Automobile ist.", "Kanadische Regierungsvertreter rechnen nicht mit einer Einigung vor den US-Zwischenwahlen 2026, was auf einen langanhaltenden Handelskonflikt hindeutet."], "deep_dive": "Der Handelskrieg zwischen den [[USA]] und [[Kanada]] markiert einen historischen Bruch in den Wirtschaftsbeziehungen zweier Staaten, die über Jahrzehnte als engste Handelspartner galten. Die Eskalation begann mit Vorwürfen der [[Trump-Administration]] gegen [[Kanada]], US-Alkohol-, Automobil- und Milchprodukte diskriminierend zu behandeln. Als Reaktion verhängten die [[USA]] zunächst selektive 50%-Zölle, die [[Trump]] kurzzeitig um drei Tage verschob, um Verhandlungsraum zu schaffen.\n\nDie gescheiterten Gespräche offenbaren grundsätzliche Differenzen über die Struktur der Handelsbeziehungen. Während [[Jamieson Greer]], Trumps Chefunterhändler für Handel, von einem Jahr kanadischer Vergeltungsmaßnahmen spricht, die amerikanische Arbeiter schädigen, betont [[Mark Carney]], dass [[Kanada]] pragmatisch und geduldig verhandelt habe, aber seine Priorität auf dem besten Abkommen für sein Land liege, nicht auf einem Abkommen zu beliebigen Bedingungen. Die Kriegsrhetorik Carneys unterstreicht die Schärfe des Konflikts.\n\nDie wirtschaftlichen Auswirkungen könnten erheblich sein. [[Kanada]] ist der größte Abnehmer amerikanischer Automobile, größer als die EU, Japan, Korea und Großbritannien zusammen. Die angekündigten Zölle auf Fahrzeuge und Autoteile würden integrierte Lieferketten treffen, die über Jahrzehnte gewachsen sind. Arbeiter in Michigan, Ohio, Kentucky und Alabama, die von kanadischer Nachfrage abhängen, könnten ebenso betroffen sein wie kanadische Exporteure.\n\nDie Zeitplanung deutet auf eine längerfristige Konfrontation hin. Bloomberg berichtet, dass kanadische Regierungsvertreter nicht mit einer Einigung vor den US-Zwischenwahlen 2026 rechnen, was bedeutet, dass der Konflikt mindestens über die nächsten Monate andauern könnte. [[Jamie Raskin]] kritisierte die Politik als 'idiotischen Handelskrieg', der amerikanische Unternehmen töte, während kanadische Verbraucher bereits amerikanische Produkte boykottieren.", "cui_bono": "Innenpolitisch könnte [[Donald Trump]] von der Konfrontation profitieren, indem er sich als harter Verteidiger amerikanischer Interessen inszeniert, besonders vor den Zwischenwahlen 2026. [[Mark Carney]], der erst seit kurzem im Amt ist, kann durch entschlossenes Auftreten nationale Geschlossenheit demonstrieren. Langfristig könnten Drittstaaten wie [[China]] oder die EU von einer Schwächung der nordamerikanischen Wirtschaftsintegration profitieren, während heimische Produzenten in beiden Ländern kurzfristig durch reduzierten Wettbewerb gewinnen, aber mittelfristig durch gestörte Lieferketten und höhere Inputkosten verlieren könnten.", "historical_threads": [{"id": "us_canada_trade", "title": "US-kanadische Handelsbeziehungen", "entries": [{"date": "1988-01", "title": "Freihandelsabkommen USA-Kanada", "one_line": "Das Canada-United States Free Trade Agreement (CUSFTA) tritt in Kraft und schafft eine der umfassendsten Freihandelszonen der Welt zwischen beiden Ländern.", "extended": "Das Abkommen beseitigte schrittweise die meisten Zölle zwischen den USA und Kanada und schuf einen Mechanismus zur Streitbeilegung. Es war politisch umstritten, besonders in Kanada, wo Kritiker den Verlust wirtschaftlicher Souveränität befürchteten. Das Abkommen legte den Grundstein für tiefere wirtschaftliche Integration."}, {"date": "1994-01", "title": "NAFTA tritt in Kraft", "one_line": "Das Nordamerikanische Freihandelsabkommen (NAFTA) erweitert die Freihandelszone auf Mexiko und vertieft die Integration zwischen allen drei nordamerikanischen Volkswirtschaften.", "extended": "NAFTA schuf einen Binnenmarkt von über 400 Millionen Menschen und intensivierte grenzüberschreitende Lieferketten, besonders in der Automobilindustrie. Das Abkommen führte zu einem starken Anstieg des trilateralen Handels, machte die Volkswirtschaften aber auch voneinander abhängiger. Kritik kam von Gewerkschaften, die Arbeitsplatzverluste befürchteten."}, {"date": "2018-2020", "title": "NAFTA-Neuverhandlung durch Trump", "one_line": "Donald Trump erzwingt in seiner ersten Amtszeit eine Neuverhandlung von NAFTA, die zum USMCA (United States-Mexico-Canada Agreement) führt, mit strengeren Regeln für Automobilinhalte.", "extended": "Trump hatte NAFTA als schlimmsten Handelsdeal der Geschichte bezeichnet und drohte mit Austritt. Das resultierende USMCA erhöhte die Anforderungen für nordamerikanischen Inhalt bei Fahrzeugen und führte neue Arbeitsstandards ein. Die Neuverhandlung signalisierte bereits Trumps Bereitschaft, traditionelle Handelsbeziehungen infrage zu stellen."}, {"date": "2025", "title": "Trumps zweite Amtszeit beginnt", "one_line": "Donald Trump kehrt ins Weiße Haus zurück und kündigt an, die Ära der 'tiefen Bindungen' mit Kanada zu beenden, wie Mark Carney später beschreiben wird.", "extended": "Trumps aggressive Handelspolitik in der zweiten Amtszeit geht über die erste hinaus. Während USMCA formal weiter gilt, nutzt die Administration Ausnahmeklauseln und nationale Sicherheitsargumente, um neue Zölle zu verhängen. Die Rhetorik verschärft sich deutlich."}, {"date": "2026-08", "title": "Eskalation zum offenen Handelskrieg", "one_line": "Nach dem Scheitern von Verhandlungen verhängen beide Länder gegenseitige 50%-Zölle auf zentrale Produkte, und Mark Carney erklärt, Kanada sei 'im Krieg' mit den USA.", "extended": "Die Situation markiert den tiefsten Bruch in den bilateralen Wirtschaftsbeziehungen seit Generationen. Während frühere Handelskonflikte meist in Verhandlungen mündeten, spricht Carney nun von wirtschaftlicher Integration als Waffe und von Kanadas Angegriffensein. Die Kriegsrhetorik und gegenseitigen Vergeltungsmaßnahmen deuten auf eine grundlegende Neudefinition der Beziehung hin."}]}, {"id": "trump_trade_policy", "title": "Trumps protektionistische Handelspolitik", "entries": [{"date": "2016", "title": "Wahlkampf gegen Freihandel", "one_line": "Donald Trump macht die Ablehnung multilateraler Handelsabkommen zum Kernthema seiner Präsidentschaftskampagne und verspricht, Arbeitsplätze nach Amerika zurückzubringen.", "extended": "Trump brach mit dem republikanischen Konsens für Freihandel und versprach, NAFTA neu zu verhandeln und aus der Trans-Pacific Partnership (TPP) auszutreten. Seine Botschaft fand besonderen Anklang in Industrieregionen des Rust Belt, die Arbeitsplatzverluste durch Verlagerungen erlebt hatten."}, {"date": "2018-03", "title": "Stahl- und Aluminiumzölle", "one_line": "Trump verhängt Zölle auf Stahl und Aluminium gegen zahlreiche Verbündete, darunter Kanada, mit Verweis auf nationale Sicherheit, was internationale Empörung auslöst.", "extended": "Die Zölle von 25% auf Stahl und 10% auf Aluminium trafen auch engste Verbündete. Die Berufung auf nationale Sicherheit (Artikel 232) wurde weithin als Missbrauch eines Notfallmechanismus kritisiert. Kanada, die EU und andere verhängten Vergeltungszölle."}, {"date": "2018-2019", "title": "Handelskrieg mit China", "one_line": "Trump startet einen umfassenden Handelskrieg mit China, mit gegenseitigen Zöllen auf Hunderte Milliarden Dollar Waren, der die Weltwirtschaft belastet.", "extended": "Der Konflikt mit China wurde zum definierenden Merkmal von Trumps Handelspolitik. Er verhängte Zölle auf chinesische Waren im Wert von über 360 Milliarden Dollar, China revanchierte sich. Die Phase-1-Vereinbarung von 2020 brachte nur teilweise Entspannung."}, {"date": "2025-2026", "title": "Zweite Amtszeit verschärft Kurs", "one_line": "In seiner zweiten Amtszeit intensiviert Trump die protektionistische Politik und wendet sich nun auch gegen traditionelle Verbündete wie Kanada mit beispielloser Härte.", "extended": "Die zweite Trump-Administration geht aggressiver vor als die erste. Während Trump 2018 letztlich Ausnahmen für Verbündete gewährte, scheint diese Bereitschaft nun zu fehlen. Die Rhetorik ist schärfer, die Bereitschaft zu Kompromissen geringer, und auch enge Partner werden als Gegner behandelt."}]}, {"id": "carney_leadership", "title": "Mark Carneys politische Wende", "entries": [{"date": "2008-2013", "title": "Gouverneur der Bank of Canada", "one_line": "Mark Carney leitet die kanadische Zentralbank durch die Finanzkrise und erwirbt sich den Ruf eines pragmatischen, technokratischen Krisenmanagers.", "extended": "Unter Carneys Führung navigierte Kanada die Finanzkrise besser als die meisten entwickelten Volkswirtschaften. Seine Mischung aus Vorsicht und Innovation, einschließlich früher Zinssenkungen und makroprudenzieller Maßnahmen, brachte ihm internationales Ansehen ein."}, {"date": "2013-2020", "title": "Gouverneur der Bank of England", "one_line": "Carney wird als erster Nicht-Brite Gouverneur der Bank of England und managt die wirtschaftliche Unsicherheit rund um Brexit.", "extended": "Die Ernennung war historisch und zeigte Carneys internationale Reputation. Er warnte früh vor den Risiken des Brexit und stabilisierte die britische Wirtschaft nach dem Referendum 2016. Seine aktive öffentliche Rolle brachte ihm aber auch Kritik von Brexit-Befürwortern ein, die ihn der politischen Parteinahme beschuldigten."}, {"date": "2025", "title": "Eintritt in die Politik", "one_line": "Nach Jahren der Spekulation kandidiert Carney für die Liberal Party und wird nach einem knappen Wahlsieg kanadischer Premierminister.", "extended": "Der Übergang vom Zentralbanker zum Politiker war ungewöhnlich, aber nicht beispiellos. Carney versprach wirtschaftliche Kompetenz und internationale Erfahrung in einer Zeit zunehmender globaler Unsicherheit. Sein Wahlsieg war eng, was seine Position innenpolitisch nicht unbedingt stärkt."}, {"date": "2026-08", "title": "Konfrontation mit Trump", "one_line": "In seiner ersten großen außenpolitischen Bewährungsprobe lehnt Carney Zugeständnisse an die USA ab und wählt bewusst martialische Sprache, um nationale Einheit zu demonstrieren.", "extended": "Carneys Kriegsrhetorik markiert einen Stilwandel vom technokratischen Zentralbanker zum konfrontativen Politiker. Die Aussage, Kanada sei 'angegriffen' worden und befinde sich 'im Krieg', ist für kanadische Verhältnisse außergewöhnlich scharf. Sie signalisiert, dass er bereit ist, wirtschaftliche Kosten zu tragen, um nicht als schwach zu erscheinen, was seine innenpolitische Position stärken soll."}]}], "entities": [{"name": "Donald Trump", "type": "person", "role_in_story": "Kündigt als US-Präsident drastische Zollerhöhungen auf kanadische Fahrzeuge und Stahl ab 2027 an und bezeichnet Kanada als eines der schlimmsten Länder im Handel.", "profile": "Trump verfolgt seit seiner ersten Präsidentschaft eine protektionistische Handelspolitik, die multilaterale Abkommen ablehnt und auch traditionelle Verbündete als Gegner behandelt. Seine Strategie kombiniert wirtschaftlichen Nationalismus mit innenpolitischer Mobilisierung, wobei er Handelsdefizite und ausländische Praktiken als Bedrohung amerikanischer Arbeiter darstellt. In seiner zweiten Amtszeit agiert er noch kompromissloser als zuvor.", "established": "1946-06-14", "image_url": null}, {"name": "Mark Carney", "type": "person", "role_in_story": "Lehnt als kanadischer Premierminister ein Handelsabkommen mit den USA ab, kündigt Vergeltungszölle an und erklärt, Kanada sei 'im Krieg' mit den USA.", "profile": "Carney wechselte nach erfolgreichen Karrieren als Gouverneur der Bank of Canada und Bank of England in die Politik und wurde Premierminister. Er präsentiert sich als pragmatischer Technokrat, zeigt aber in der Konfrontation mit Trump Bereitschaft zu harter Rhetorik und wirtschaftlichen Kosten, um nationale Interessen zu verteidigen. Seine internationale Erfahrung prägt seinen Ansatz, keine Vereinbarung 'um jeden Preis' einzugehen.", "established": "1965-03-16", "image_url": null}, {"name": "Kanada", "type": "country", "role_in_story": "Ziel massiver US-Zollerhöhungen und Ausgangspunkt von Vergeltungsmaßnahmen in einem eskalierenden Handelskrieg mit dem wichtigsten Handelspartner.", "profile": "Kanada ist mit etwa 95% seines Handels stark von den USA abhängig und der größte Handelspartner der USA mit einem bilateralen Volumen von rund 909 Milliarden Dollar jährlich. Das Land ist besonders im Automobilsektor eng mit den USA integriert und der größte Abnehmer amerikanischer Fahrzeuge. Diese asymmetrische Abhängigkeit macht Kanada verletzlich, zwingt es aber auch zu klarer Positionierung, um nicht als schwach wahrgenommen zu werden.", "established": "1867-07-01", "image_url": null}, {"name": "USA", "type": "country", "role_in_story": "Verhängen massive Zölle gegen den engsten Handelspartner Kanada und erhöhen diese trotz gescheiterter Verhandlungen weiter.", "profile": "Die USA sind die größte Volkswirtschaft der Welt und traditionell Verfechter multilateraler Handelsordnung, haben aber unter Trump eine protektionistische Wende vollzogen. Das Land nutzt seine wirtschaftliche Macht zunehmend als politisches Instrument, auch gegen Verbündete. Die gegenwärtige Politik riskiert integrierte nordamerikanische Lieferketten zugunsten innenpolitischer Ziele.", "established": "1776-07-04", "image_url": null}, {"name": "Jamie Raskin", "type": "person", "role_in_story": "Kritisiert als demokratischer Kongressabgeordneter die Zollpolitik als 'idiotischen Handelskrieg', der amerikanische Unternehmen tötet.", "profile": "Raskin ist ein progressiver Demokrat aus Maryland, bekannt für seine verfassungsrechtliche Expertise und scharfe Kritik an Trump. Er gehört zur Opposition gegen Trumps Handelspolitik und argumentiert, dass diese amerikanischen Wirtschaftsinteressen schadet. Seine Kritik verbindet wirtschaftliche mit diplomatischen Argumenten gegen die Konfrontation mit Verbündeten.", "established": "1962-12-13", "image_url": null}, {"name": "Jamieson Greer", "type": "person", "role_in_story": "Verteidigt als Trumps Chefunterhändler für Handel die US-Zölle als notwendige Gegenmaßnahme nach einem Jahr kanadischer Vergeltung.", "profile": "Greer ist ein erfahrener Handelsanwalt, der bereits in Trumps erster Amtszeit im Büro des US-Handelsbeauftragten arbeitete. Er vertritt eine harte Linie in Handelsverhandlungen und sieht Zölle als legitimes Mittel zum Schutz amerikanischer Arbeiter. Seine Argumentation folgt der Logik, dass Handelspartner die USA ausnutzen und nur durch Druck zu fairen Praktiken bewegt werden können.", "established": null, "image_url": null}, {"name": "Trump-Administration", "type": "organization", "role_in_story": "Verhängt Zölle gegen Kanada mit der Begründung diskriminierender Behandlung amerikanischer Produkte und verweigert Kompromisse in Verhandlungen.", "profile": "Die zweite Trump-Administration verfolgt eine noch aggressivere protektionistische Politik als die erste, mit geringerer Bereitschaft zu Ausnahmen für Verbündete. Sie nutzt nationale Sicherheitsargumente und Handelsrecht flexibel, um wirtschaftlichen Druck auszuüben. Die innenpolitische Mobilisierung gegen 'unfaire' Handelspartner steht im Zentrum ihrer Strategie.", "established": "2025-01-20", "image_url": null}], "quotes": [{"text": "Stop Trump's idiotic trade war killing American businesses. Let peaceful commerce among the nations prevail. And hands off Canada, America's #1 trading partner, whose people are now boycotting American products because of Trump's imbecilic policies", "attribution": "Jamie Raskin", "context": "Demokratischer Kongressabgeordneter aus Maryland", "source_url": "https://thehill.com"}, {"text": "You're at war when you get attacked", "attribution": "Mark Carney", "context": "Kanadischer Premierminister zur Situation nach den US-Zöllen", "source_url": "https://www.france24.com"}, {"text": "The goal of our trade negotiations with the United States has always been to get the best deal for Canadians, never a deal at any price or on any time frame", "attribution": "Mark Carney", "context": "Bei einer Veranstaltung zur Schiffbauindustrie", "source_url": "https://www.france24.com"}], "political_theory": {"theory": "[[Wirtschaftsnationalismus]]", "points": ["[[Donald Trump]]s Zollpolitik exemplifiziert die Rückkehr zu merkantilistischem Denken, bei dem Handelsdefizite als Niederlage und Zölle als Waffe zur Durchsetzung nationaler Interessen verstanden werden, nicht als Instrument multilateraler Wohlfahrtsmaximierung.", "Der Konflikt zeigt die Spannung zwischen internationaler wirtschaftlicher Integration und nationaler politischer Souveränität: [[Trump]] nutzt die Abhängigkeit [[Kanada]]s von US-Märkten als Hebel, während [[Mark Carney]] diese asymmetrische Interdependenz durch harte Rhetorik und Vergeltung zu neutralisieren versucht.", "Die Eskalation verdeutlicht, wie wirtschaftliche Instrumente zunehmend für innenpolitische Mobilisierung genutzt werden. Beide Regierungen riskieren wirtschaftliche Kosten, um gegenüber ihrer jeweiligen Wählerschaft Stärke zu demonstrieren, ein klassisches Muster wirtschaftsnationalistischer Politik.", "Die Kriegsrhetorik [[Mark Carney]]s ('at war when you get attacked') zeigt die Securitization von Handelspolitik: Ökonomische Konflikte werden in die Sprache von Sicherheit und existenzieller Bedrohung übersetzt, was Kompromisse erschwert und den Handlungsspielraum einengt."]}, "connections": [{"source": "Donald Trump", "target": "Trump-Administration", "relation": "leitet als Präsident"}, {"source": "Trump-Administration", "target": "Jamieson Greer", "relation": "beschäftigt als Chefunterhändler"}, {"source": "Donald Trump", "target": "Kanada", "relation": "verhängt Zölle gegen"}, {"source": "Mark Carney", "target": "Kanada", "relation": "führt als Premierminister"}, {"source": "Mark Carney", "target": "USA", "relation": "kündigt Vergeltungszölle gegen an"}, {"source": "Jamie Raskin", "target": "Donald Trump", "relation": "kritisiert Handelspolitik von"}, {"source": "USA", "target": "Kanada", "relation": "größter Handelspartner von"}, {"source": "Kanada", "target": "USA", "relation": "wickelt 95% des Handels mit ab"}], "countries_covered": ["USA", "Kanada"], "image_url": "https://s.france24.com/media/display/3d7cb31a-9fc7-11f1-95d5-005056a97e36/w:1280/p:16x9/063-2291195686.jpg", "stakeholders": {"pro": [{"entity": "Donald Trump", "reason": "Kann sich innenpolitisch als harter Verteidiger amerikanischer Interessen inszenieren und protektionistische Wählerbasis mobilisieren"}, {"entity": "Mark Carney", "reason": "Stärkt durch entschlossene Haltung seine innenpolitische Position und demonstriert nationale Geschlossenheit gegen externen Druck"}], "con": [{"entity": "Kanada", "reason": "Extrem abhängig von US-Märkten und wird durch Zölle auf Kernexporte wie Automobile und Stahl wirtschaftlich getroffen"}, {"entity": "USA", "reason": "Arbeiter in Automobilstaaten verlieren kanadische Nachfrage, Lieferketten werden gestört, Konsumenten zahlen höhere Preise"}], "note": "Langfristig könnten beide Volkswirtschaften durch gestörte Integration verlieren, während Drittstaaten von geschwächter nordamerikanischer Konkurrenz profitieren"}, "id": "8d35f0ea", "generated_at": "2026-08-24T20:34:47Z", "sources": ["Bloomberg – Politics", "France24 – World (EN)", "NPR – Politics", "NPR – World", "The Guardian – World", "The Hill"], "article_urls": ["https://thehill.com/homenews/house/6047644-raskin-criticizes-trump-canada-tariffs/", "https://www.france24.com/en/americas/20260824-canada-trump-threatens-double-auto-tariffs-after-trade-talks-collapse", "https://www.bloomberg.com/news/videos/2026-08-24/canada-sees-us-trade-war-dragging-past-midterms-video", "https://www.npr.org/2026/08/22/nx-s1-5941584/us-canada-tariffs", "https://www.npr.org/2026/08/22/nx-s1-5937895/week-in-politics-canada-talks-collapse-u-s-economic-d-day-record-national-debt", "https://www.theguardian.com/us-news/2026/aug/24/canada-tariff-increase-trump-auto"], "primary_sources": [], "market_correlation": null, "_pipeline_meta": {"model": "claude-sonnet-4-5", "research_depth": "lite", "articles_used": 6, "input_tokens": 5740, "output_tokens": 6894}}, {"title": "Saudi-Arabien investiert 6 Milliarden Euro in Themenparks bei Paris", "theme_category": "trade", "one_line": "[[Saudi-Arabien]] unterzeichnet während des Staatsbesuchs von [[Mohammed bin Salman]] eine Vereinbarung über eine 6-Milliarden-Euro-Investition in drei Freizeitparks nahe Paris, darunter einen Manga-Park.", "summary": ["[[Frankreich]] und [[Saudi-Arabien]] einigten sich auf eine Investition von 6 Milliarden Euro für drei Themenparks bei Cergy-Pontoise, etwa 30 Kilometer nordwestlich von Paris, mit erwarteten 22.000 direkten Arbeitsplätzen.", "Einer der Parks soll dem Manga-Genre gewidmet sein, inspiriert von einem Gespräch zwischen [[Emmanuel Macron]] und [[Mohammed bin Salman]] im Dezember 2024 in Riad über ihre gemeinsame Begeisterung für Dragon Ball Z.", "Das Projekt wird von [[Qiddiya]], einer Tochtergesellschaft des saudischen Staatsfonds, geleitet und soll über mehrere Jahre in Etappen gebaut werden.", "Die Vereinbarung wurde während des zweitägigen Staatsbesuchs von [[Mohammed bin Salman]] in [[Frankreich]] unterzeichnet, seiner ersten derartigen Reise außerhalb von Gipfeltreffen seit fast einem Jahr.", "[[Macron]] bezeichnete den Besuch als wichtigen Meilenstein für die bilateralen Beziehungen und betonte die französisch-saudische Zusammenarbeit bei Großprojekten, Technologie und gemeinsamen internationalen Veranstaltungen wie der Esports World Cup.", "Die Investition ist Teil einer umfassenderen wirtschaftlichen Partnerschaft mit einer bestehenden Investitionsbasis von 16,3 Milliarden Euro, die sich zunehmend auf Zukunftssektoren wie Künstliche Intelligenz, digitale Infrastruktur und Energie konzentriert."], "deep_dive": "Die Themenpark-Investition markiert einen ungewöhnlichen Schritt in der französisch-saudischen Wirtschaftskooperation. Während die bilateralen Beziehungen traditionell auf Energie, Rüstung und Infrastruktur fokussiert waren, signalisiert das Freizeitprojekt eine Diversifizierung in Richtung Kultur und Tourismus. Die Vereinbarung entstand aus einem persönlichen Austausch zwischen [[Macron]] und [[Mohammed bin Salman]] über ihre gemeinsame Leidenschaft für japanische Manga, insbesondere Dragon Ball Z, während Macrons Besuch in Riad Ende 2024. Diese persönliche Ebene unterstreicht die Bedeutung direkter Beziehungen zwischen Staatsoberhäuptern für große Investitionsentscheidungen.\n\nDie Dimension des Projekts ist beachtlich: Mit erwarteten 22.000 direkten Arbeitsplätzen würde es ähnlich viele Jobs schaffen wie [[Disneyland Paris]], das seit Jahrzehnten als wichtigster Themenpark-Arbeitgeber der Region gilt. Die Umsetzung durch [[Qiddiya]], eine Tochter des saudischen Staatsfonds, passt in die Strategie der [[Vision 2030]], die saudische Wirtschaft zu diversifizieren und internationale Investitionen zu tätigen. [[Qiddiya]] entwickelt bereits einen großen Entertainment-Komplex nahe Riad und überträgt nun dieses Know-how nach Europa.\n\nDer Besuch von [[Mohammed bin Salman]] in [[Frankreich]] fand vor dem Hintergrund anhaltender internationaler Kritik an Saudi-Arabiens Menschenrechtsbilanz statt. Drei französische Journalistengewerkschaften protestierten gegen den Empfang des Kronprinzen. Die französische Präsidentschaft wies Kritik zurück und erklärte, man wolle bei Investitionsprojekten keine Belehrungen erteilen. Diese Position spiegelt ein wiederkehrendes Spannungsfeld in den Beziehungen westlicher Demokratien mit autoritären Regimen wider: wirtschaftliche Interessen versus wertebasierte Außenpolitik.\n\nDie französisch-saudischen Wirtschaftsbeziehungen haben sich systematisch ausgebaut. Die im Dezember 2024 unterzeichnete umfassende strategische Partnerschaft öffnete neue Kooperationsfelder. Der bilaterale Handel erreichte 2025 etwa 10,1 Milliarden Euro, ein Anstieg von 7,2 Prozent gegenüber dem Vorjahr. [[Frankreich]] ist mit 16,3 Milliarden Euro Investitionsvolumen der viertgrößte ausländische Direktinvestor in [[Saudi-Arabien]]. Französische Unternehmen halten 651 Investitionslizenzen in 18 Sektoren im Königreich. Die Themenpark-Investition kehrt diese Richtung um und bringt saudisches Kapital in die französische Wirtschaft, wobei sie sich in einen wachsenden Trend einfügt, bei dem Golfstaaten verstärkt in europäische Kultur-, Sport- und Freizeitprojekte investieren.", "cui_bono": "[[Saudi-Arabien]] gewinnt durch die Investition eine sichtbare wirtschaftliche Präsenz im Herzen Europas und kann sein Image als moderner, kulturbewusster Investor jenseits des Öl- und Rüstungssektors stärken. [[Mohammed bin Salman]] persönlich profitiert von der Normalisierung seiner internationalen Stellung durch hochrangige Staatsbesuche, die seine Rolle als faktischer Herrscher legitimieren. [[Macron]] kann innenpolitisch mit Zehntausenden neuen Arbeitsplätzen punkten und demonstriert außenpolitisch Frankreichs Fähigkeit, große ausländische Investitionen anzuziehen, während er gleichzeitig die strategische Partnerschaft mit einem einflussreichen Golfstaat ausbaut. [[Qiddiya]] etabliert sich als internationaler Akteur im Freizeitsektor und sammelt Erfahrungen außerhalb des heimischen Marktes.", "historical_threads": [{"id": "frankreich_saudi_beziehungen", "title": "Französisch-saudische Beziehungen", "entries": [{"date": "1974", "title": "Grundstein der Wirtschaftspartnerschaft", "one_line": "Nach der Ölkrise verstärkten Frankreich und Saudi-Arabien ihre Wirtschaftsbeziehungen, wobei Frankreich Waffen und Technologie lieferte und Saudi-Arabien im Gegenzug Öl und Investitionen bereitstellte.", "extended": "Die erste Ölkrise von 1973 führte zu einer Neuausrichtung der französischen Außenpolitik im Nahen Osten. Frankreich suchte stabile Energiepartnerschaften und fand in Saudi-Arabien einen verlässlichen Lieferanten. Im Gegenzug etablierte sich Frankreich als wichtiger Rüstungslieferant und Technologiepartner. Diese transaktionale Beziehung bildete die Grundlage für die heutige umfassende Partnerschaft."}, {"date": "2015-2018", "title": "Kontroversen um Waffenlieferungen", "one_line": "Französische Waffenverkäufe an Saudi-Arabien während des Jemen-Kriegs führten zu innenpolitischen Debatten über die Balance zwischen wirtschaftlichen Interessen und Menschenrechten.", "extended": "Der Jemen-Konflikt, in dem Saudi-Arabien militärisch intervenierte, löste in Frankreich Kontroversen über Waffenexporte aus. NGOs und Oppositionspolitiker kritisierten die Lieferungen als Unterstützung für Kriegsverbrechen. Die französische Regierung argumentierte mit wirtschaftlichen Interessen und strategischen Partnerschaften. Diese Debatte prägt bis heute die Diskussion über die Beziehungen zu Riad."}, {"date": "2018-10", "title": "Khashoggi-Mord und diplomatische Krise", "one_line": "Die Ermordung des Journalisten Jamal Khashoggi im saudischen Konsulat in Istanbul belastete die internationalen Beziehungen zu Mohammed bin Salman, doch Frankreich hielt an der wirtschaftlichen Partnerschaft fest.", "extended": "Der Mord an Khashoggi führte zu internationaler Empörung und zeitweiliger Isolation Mohammed bin Salmans. Während andere westliche Staaten Distanz wahrten, setzte Frankreich unter Macron auf fortgesetzte Z
