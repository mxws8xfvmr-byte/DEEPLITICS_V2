<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deeplitics</title>
<style>
/* ============================================================
   DEEPLITICS v7 — Design-System
   Dunkelmodus ist Standard. Farben sind CSS-Variablen, die beim
   Theme-Wechsel (data-theme) und je Story (data-cat) neu gesetzt
   werden. Kategorie-Farben sind FEST zugeordnet (dataviz-Skill:
   kategoriale Farben in fester Reihenfolge, nie rotierend).
   ============================================================ */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

:root {
  --radius-s: 10px;
  --radius-m: 16px;
  --radius-l: 22px;
  --radius-xl: 28px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Segoe UI", Helvetica, Arial, sans-serif;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

html[data-theme="dark"] {
  --bg: #050506;
  --bg-soft: #0b0c0f;
  --bg-elevated: #14151a;
  --bg-card: #15161b;
  --bg-card-hover: #1b1c22;
  --ink: #f5f5f7;
  --ink-secondary: #a6a6ad;
  --ink-muted: #7b7b83;
  --border: rgba(255,255,255,0.09);
  --border-strong: rgba(255,255,255,0.16);
  --overlay-bg: rgba(5,5,6,0.72);
  --scrim-top: rgba(0,0,0,0);
  --scrim-bottom: rgba(0,0,0,0.85);
  --shadow: 0 20px 60px rgba(0,0,0,0.55);
  --input-bg: rgba(255,255,255,0.06);
}
html[data-theme="light"] {
  --bg: #f4f4f6;
  --bg-soft: #ffffff;
  --bg-elevated: #ffffff;
  --bg-card: #ffffff;
  --bg-card-hover: #fbfbfc;
  --ink: #1d1d1f;
  --ink-secondary: #55565b;
  --ink-muted: #86868b;
  --border: rgba(0,0,0,0.08);
  --border-strong: rgba(0,0,0,0.14);
  --overlay-bg: rgba(244,244,246,0.78);
  --scrim-top: rgba(0,0,0,0);
  --scrim-bottom: rgba(0,0,0,0.62);
  --shadow: 0 20px 50px rgba(0,0,0,0.14);
  --input-bg: rgba(0,0,0,0.045);
}

/* Kategorie-Paletten: fest je Thema, light/dark-Variante je Modus.
   Werte angelehnt an bekannte, kontraststarke iOS-Systemfarben. */
html[data-theme="dark"] {
  --cat-security:      #0a84ff;
  --cat-diplomacy:      #40c8e0;
  --cat-trade:          #ff9f0a;
  --cat-rights:         #bf5af2;
  --cat-conflict:       #ff453a;
  --cat-surveillance:   #32d74b;
  --good: #32d74b;
  --bad: #ff6961;
}
html[data-theme="light"] {
  --cat-security:      #0071e3;
  --cat-diplomacy:      #0a9396;
  --cat-trade:          #c9750b;
  --cat-rights:         #8944ab;
  --cat-conflict:       #d70015;
  --cat-surveillance:   #248a3d;
  --good: #1f8a3c;
  --bad: #c9342a;
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

a { color: inherit; }
button { font-family: inherit; cursor: pointer; }

.wrap { max-width: 1080px; margin: 0 auto; padding: 0 24px; }
@media (max-width: 640px) { .wrap { padding: 0 16px; } }

/* ---------- Topbar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 40;
  backdrop-filter: blur(20px) saturate(1.4);
  background: var(--overlay-bg);
  border-bottom: 1px solid var(--border);
}
.topbar-inner {
  max-width: 1080px; margin: 0 auto; padding: 0 24px;
  height: 56px; display: flex; align-items: center; justify-content: space-between;
}
.brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 18px; letter-spacing: -0.01em; cursor: pointer; border: none; background: none; color: var(--ink); }
.brand-dot { width: 9px; height: 9px; border-radius: 50%; background: linear-gradient(135deg, var(--cat-security), var(--cat-rights)); }
.top-actions { display: flex; align-items: center; gap: 12px; }
.last-updated { font-size: 12px; color: var(--ink-muted); font-weight: 550; white-space: nowrap; }
@media (max-width: 560px) { .last-updated { display: none; } }
.icon-btn {
  width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border);
  background: var(--bg-elevated); color: var(--ink); display: flex; align-items: center; justify-content: center;
  transition: transform .15s var(--ease), background .15s;
}
.icon-btn:hover { background: var(--bg-card-hover); transform: scale(1.06); }
.icon-btn svg { width: 17px; height: 17px; }
.avatar-btn {
  width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border-strong);
  padding: 0; overflow: hidden; transition: transform .15s var(--ease);
}
.avatar-btn:hover { transform: scale(1.07); }
.avatar-btn svg, .avatar-mini svg { width: 100%; height: 100%; display: block; }

/* ---------- Greeting / Home header ---------- */
.greeting { padding: 46px 0 22px; }
.greeting-eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 10px; }
.greeting-title { font-size: 38px; line-height: 1.12; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 10px; max-width: 720px; }
.greeting-sub { font-size: 16px; color: var(--ink-secondary); margin: 0; max-width: 620px; }
@media (max-width: 640px) { .greeting-title { font-size: 28px; } }

.pref-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 22px 0 8px; }
.pref-chip {
  border: 1px solid var(--border); background: var(--bg-elevated); color: var(--ink-secondary);
  border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 600; transition: all .15s var(--ease);
}
.pref-chip.active { color: #fff; border-color: transparent; }
.pref-chip:hover { border-color: var(--border-strong); }

/* ---------- Story grid / cards ---------- */
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px; padding: 18px 0 60px; }
@media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }

.card {
  background: var(--bg-card); border-radius: var(--radius-l); overflow: hidden;
  border: 1px solid var(--border); cursor: pointer;
  transition: transform .28s var(--ease), box-shadow .28s var(--ease), background .2s;
  display: flex; flex-direction: column;
}
.card:hover { transform: translateY(-3px); box-shadow: var(--shadow); background: var(--bg-card-hover); }

.media { position: relative; width: 100%; overflow: hidden; background: var(--bg-elevated); }
.media .fallback {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  background: var(--fb-grad, linear-gradient(135deg, var(--cat-c1), var(--cat-c2)));
}
.media .fallback svg { width: 34%; height: 34%; opacity: .92; }
.media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }

.card-media { aspect-ratio: 16/10.5; border-radius: var(--radius-l) var(--radius-l) 0 0; }
.card-media::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.55), rgba(0,0,0,0) 55%);
}
.cat-chip {
  position: absolute; top: 12px; left: 12px; z-index: 2;
  font-size: 11.5px; font-weight: 700; letter-spacing: .02em; color: #fff;
  padding: 5px 11px; border-radius: 999px; backdrop-filter: blur(6px);
  background: color-mix(in srgb, var(--cat-color) 78%, #000 6%);
}
.save-btn {
  position: absolute; top: 10px; right: 10px; z-index: 3;
  width: 32px; height: 32px; border-radius: 50%; border: none;
  background: rgba(0,0,0,0.38); backdrop-filter: blur(6px);
  display: flex; align-items: center; justify-content: center; color: #fff;
  transition: transform .15s var(--ease), background .15s;
}
.save-btn:hover { transform: scale(1.08); background: rgba(0,0,0,0.55); }
.save-btn svg { width: 16px; height: 16px; }
.save-btn.saved svg path { fill: currentColor; }

.card-body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.card-title { font-size: 18px; font-weight: 750; letter-spacing: -0.012em; line-height: 1.28; margin: 0; }
.card-dek {
  font-size: 14px; color: var(--ink-secondary); line-height: 1.5; margin: 0;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.card-meta { margin-top: auto; padding-top: 6px; font-size: 12.5px; color: var(--ink-muted); display: flex; gap: 8px; align-items: center; }
.card-meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--ink-muted); }

/* ---------- Overlay / Detail view ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 100; background: var(--bg);
  transform: translateY(100%); transition: transform .38s var(--ease);
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.overlay.open { transform: translateY(0); }
.overlay-topbar {
  position: sticky; top: 0; z-index: 20; display: flex; justify-content: space-between; align-items: center;
  padding: 12px 18px; background: var(--overlay-bg); backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
}
.pill-btn {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border-strong);
  background: var(--bg-elevated); color: var(--ink); border-radius: 999px; padding: 8px 14px;
  font-size: 13.5px; font-weight: 600; transition: background .15s;
}
.pill-btn:hover { background: var(--bg-card-hover); }
.pill-btn svg { width: 14px; height: 14px; }

.detail-hero { position: relative; width: 100%; aspect-ratio: 16/8.2; margin-bottom: -64px; }
@media (max-width: 640px) { .detail-hero { aspect-ratio: 4/3.4; margin-bottom: -46px; } }
.detail-hero::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(to top, var(--bg-soft) 0%, var(--bg-soft) 4%, var(--scrim-bottom) 22%, transparent 62%);
}

.detail-content { position: relative; max-width: 760px; margin: 0 auto; padding: 0 24px 90px; }
.detail-eyebrow { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; font-size: 13px; color: var(--ink-muted); font-weight: 600; }
.detail-cat-chip { color: #fff; padding: 4px 11px; border-radius: 999px; font-size: 11.5px; font-weight: 700; background: var(--cat-color); }
.detail-title { font-size: 33px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.18; margin: 0 0 14px; text-shadow: 0 2px 24px var(--bg-soft); }
@media (max-width: 640px) { .detail-title { font-size: 26px; } }
.detail-dek { font-size: 18px; color: var(--ink-secondary); line-height: 1.5; margin: 0 0 28px; }

.summary-list { list-style: none; margin: 0 0 28px; padding: 0; display: flex; flex-direction: column; gap: 13px; }
.summary-list li { display: flex; gap: 12px; font-size: 16px; line-height: 1.55; }
.summary-list li::before { content: ""; flex: 0 0 6px; width: 6px; height: 6px; border-radius: 50%; margin-top: 9px; background: var(--cat-color); }
.summary-list li .li-text { flex: 1 1 auto; min-width: 0; }

.deep-dive { font-size: 16.5px; line-height: 1.75; color: var(--ink); margin: 0 0 22px; white-space: pre-line; }
.deep-dive b, .lk { color: var(--ink); font-weight: 650; text-decoration: none; border-bottom: 1.5px solid color-mix(in srgb, var(--cat-color) 55%, transparent); cursor: pointer; }

.callout {
  margin: 24px 0; padding: 18px 20px; border-radius: var(--radius-m);
  background: color-mix(in srgb, var(--cat-color) 12%, var(--bg-elevated));
  border: 1px solid color-mix(in srgb, var(--cat-color) 30%, var(--border));
}
.callout-label { font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--cat-color); margin-bottom: 8px; }
.callout p { margin: 0; font-size: 15.5px; line-height: 1.6; }

/* ---------- Horizontal slideable tabs ---------- */
.tabbar {
  display: flex; gap: 8px; margin: 34px 0 18px; overflow-x: auto; scrollbar-width: none;
  padding-bottom: 2px;
}
.tabbar::-webkit-scrollbar { display: none; }
.tab-btn {
  flex: 0 0 auto; border: 1px solid var(--border); background: var(--bg-elevated); color: var(--ink-secondary);
  border-radius: 999px; padding: 9px 16px; font-size: 14px; font-weight: 650; white-space: nowrap;
  transition: all .18s var(--ease);
}
.tab-btn.active { background: var(--cat-color); color: #fff; border-color: transparent; }

.tab-viewport { overflow: hidden; border-radius: var(--radius-m); }
.tab-track { display: flex; width: 500%; transition: transform .42s var(--ease); }
.tab-pane { width: 20%; flex: 0 0 20%; min-width: 0; padding: 2px 1px; }

/* Übersicht-Pane: Bullet-Stichpunkte + „Weiterlesen“-Aufklappbereich */
.readmore-toggle { margin: 10px 0 4px; }
.readmore-box { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows .38s var(--ease), opacity .3s var(--ease); }
.readmore-box.open { grid-template-rows: 1fr; opacity: 1; }
.readmore-box > div { overflow: hidden; }
.readmore-box .deep-dive { margin: 14px 0 0; }

/* Stakeholders-Pane: Pro / Con */
.stake-section { margin-bottom: 22px; }
.stake-section:last-child { margin-bottom: 0; }
.stake-heading { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 750; text-transform: uppercase; letter-spacing: .03em; margin-bottom: 12px; }
.stake-heading.pro { color: var(--good); }
.stake-heading.con { color: var(--bad); }
.stake-heading svg { width: 15px; height: 15px; flex: none; }
.stake-list { display: flex; flex-direction: column; gap: 10px; }
.stake-card { display: flex; gap: 12px; padding: 13px 14px; border-radius: var(--radius-m); background: var(--bg-elevated); border: 1px solid var(--border); border-left: 3px solid transparent; cursor: pointer; transition: background .15s, transform .15s var(--ease); text-align: left; }
.stake-card:hover { background: var(--bg-card-hover); transform: translateY(-1px); }
.stake-card.pro { border-left-color: var(--good); }
.stake-card.con { border-left-color: var(--bad); }
.stake-avatar { width: 40px; height: 40px; border-radius: 50%; position: relative; overflow: hidden; flex: none; }
.stake-avatar .fallback svg { width: 46%; height: 46%; }
.stake-body { min-width: 0; }
.stake-name { font-size: 14.5px; font-weight: 700; margin-bottom: 3px; }
.stake-reason { font-size: 13.5px; line-height: 1.5; color: var(--ink-secondary); }
.stake-note { font-size: 13px; color: var(--ink-muted); line-height: 1.55; padding: 12px 14px; border-radius: var(--radius-m); background: var(--bg-elevated); border: 1px dashed var(--border-strong); margin-top: 4px; }
.stake-empty { font-size: 13.5px; color: var(--ink-muted); padding: 4px 2px; }

/* Historien */
.thread-tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 18px; scrollbar-width: none; }
.thread-tabs::-webkit-scrollbar { display: none; }
.thread-tab { flex: 0 0 auto; border: 1px solid var(--border); background: transparent; color: var(--ink-secondary); border-radius: var(--radius-s); padding: 8px 13px; font-size: 13px; font-weight: 600; }
.thread-tab.active { background: var(--bg-elevated); color: var(--ink); border-color: var(--border-strong); }
.timeline { position: relative; padding-left: 22px; }
.timeline::before { content: ""; position: absolute; left: 5px; top: 6px; bottom: 6px; width: 1.5px; background: var(--border-strong); }
.tl-item { position: relative; padding-bottom: 22px; }
.tl-item:last-child { padding-bottom: 0; }
.tl-dot { position: absolute; left: -22px; top: 4px; width: 11px; height: 11px; border-radius: 50%; background: var(--bg); border: 2.5px solid var(--cat-color); }
.tl-year { font-size: 12.5px; font-weight: 700; color: var(--cat-color); margin-bottom: 3px; }
.tl-one { font-size: 15px; line-height: 1.5; cursor: pointer; }
.tl-ext { font-size: 14.5px; line-height: 1.6; color: var(--ink-secondary); margin-top: 8px; display: none; }
.tl-item.expanded .tl-ext { display: block; }
.tl-item.expanded .tl-one { color: var(--ink); }
.tl-toggle-hint { font-size: 12px; color: var(--ink-muted); margin-left: 6px; }

/* Akteure / entities */
.entity-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 10px; }
.entity-chip { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 8px; border-radius: var(--radius-m); border: 1px solid var(--border); background: var(--bg-elevated); text-align: center; transition: background .15s, transform .15s var(--ease); }
.entity-chip:hover { background: var(--bg-card-hover); transform: translateY(-2px); }
.entity-avatar { width: 56px; height: 56px; border-radius: 50%; position: relative; overflow: hidden; flex: none; }
.entity-avatar .fallback { border-radius: 50%; }
.entity-avatar .fallback svg { width: 46%; height: 46%; }
.entity-name { font-size: 13px; font-weight: 650; line-height: 1.3; }
.entity-role { font-size: 11.5px; color: var(--ink-muted); line-height: 1.3; }

.entity-modal-scrim { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 150; opacity: 0; pointer-events: none; transition: opacity .25s; }
.entity-modal-scrim.open { opacity: 1; pointer-events: auto; }
.entity-modal {
  position: fixed; left: 50%; bottom: 0; transform: translate(-50%, 100%); width: min(560px, 92vw);
  max-height: 86vh; overflow-y: auto; background: var(--bg-soft); border-radius: 22px 22px 0 0; z-index: 151;
  transition: transform .32s var(--ease), opacity .25s var(--ease), visibility 0s linear .32s;
  box-shadow: var(--shadow); opacity: 0; visibility: hidden; pointer-events: none;
}
@media (min-width: 720px) { .entity-modal { bottom: 6vh; border-radius: 22px; transform: translate(-50%, 40px) scale(.97); } }
.entity-modal.open {
  transform: translate(-50%, 0); opacity: 1; visibility: visible; pointer-events: auto;
  transition: transform .32s var(--ease), opacity .25s var(--ease), visibility 0s linear 0s;
}
@media (min-width: 720px) { .entity-modal.open { transform: translate(-50%, 0) scale(1); } }
.entity-modal-hero { position: relative; aspect-ratio: 16/9; }
.entity-modal-body { padding: 22px 24px 32px; }
.entity-modal-close { position: absolute; top: 12px; right: 12px; z-index: 3; }
.entity-modal-type { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--cat-color); margin-bottom: 6px; }
.entity-modal-name { font-size: 24px; font-weight: 800; letter-spacing: -0.015em; margin: 0 0 4px; }
.entity-modal-role { font-size: 14.5px; color: var(--ink-secondary); margin: 0 0 16px; }
.entity-modal-bio { font-size: 15.5px; line-height: 1.65; color: var(--ink); margin: 0 0 18px; }

/* Märkte */
.market-empty { padding: 34px 20px; text-align: center; border-radius: var(--radius-m); border: 1px dashed var(--border-strong); color: var(--ink-secondary); font-size: 14.5px; }
.chart-card { border: 1px solid var(--border); border-radius: var(--radius-m); padding: 18px 18px 8px; background: var(--bg-elevated); }
.chart-title { font-size: 15px; font-weight: 700; margin: 0 0 2px; }
.chart-sub { font-size: 13px; color: var(--ink-muted); margin: 0 0 14px; }
.chart-note { font-size: 13px; color: var(--ink-secondary); margin: 14px 0 6px; line-height: 1.55; }
.legend-row { display: flex; gap: 16px; margin-bottom: 4px; flex-wrap: wrap; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-secondary); }
.legend-swatch { width: 9px; height: 9px; border-radius: 2px; }
.tooltip { position: absolute; pointer-events: none; background: var(--bg-elevated); border: 1px solid var(--border-strong); border-radius: 10px; padding: 8px 11px; font-size: 12.5px; box-shadow: var(--shadow); opacity: 0; transition: opacity .1s; z-index: 5; white-space: nowrap; }
.tooltip.show { opacity: 1; }

/* Zitate */
.section-heading { font-size: 20px; font-weight: 800; letter-spacing: -0.01em; margin: 40px 0 16px; }
.quote-card { border-left: 3px solid var(--cat-color); padding: 4px 0 4px 18px; margin-bottom: 18px; }
.quote-text { font-size: 17px; line-height: 1.55; margin: 0 0 6px; font-style: italic; }
.quote-attr { font-size: 13.5px; color: var(--ink-muted); }

/* Quellen als Buttons (keine sichtbaren Links) */
.source-row { display: flex; flex-wrap: wrap; gap: 9px; margin-bottom: 26px; }
.source-btn {
  display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--border);
  background: var(--bg-elevated); color: var(--ink); border-radius: 999px; padding: 8px 14px 8px 10px;
  font-size: 13.5px; font-weight: 600; transition: background .15s, transform .15s var(--ease);
}
.source-btn:hover { background: var(--bg-card-hover); transform: translateY(-1px); }
.source-btn .bias-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.source-btn svg { width: 12px; height: 12px; opacity: .55; margin-left: 2px; }
.bias-left { background: #5aa9ff; } .bias-center-left { background: #7ec8b0; }
.bias-center { background: #9a9aa2; } .bias-center-right { background: #e0b25a; }
.bias-right { background: #e0705a; } .bias-unknown { background: #6e6e73; }

.primary-source-card { border: 1px solid var(--border); border-radius: var(--radius-s); padding: 12px 14px; margin-bottom: 10px; background: var(--bg-elevated); }
.primary-source-title { font-size: 14px; font-weight: 650; margin: 0 0 4px; }
.primary-source-desc { font-size: 13px; color: var(--ink-secondary); margin: 0 0 8px; line-height: 1.5; }

.theory-concept { font-size: 17px; font-weight: 750; letter-spacing: -0.01em; margin: 2px 0 12px; }
.theory-lead { font-size: 15.5px; line-height: 1.62; color: var(--ink-secondary); margin: 0; }
.theory-points { margin: 0; padding-left: 20px; }

<script>
window.__STORIES__ = [{"id": "uss-lincoln-oversight-2026-08", "title": "Nach Berichten über Zustände an Bord: Senatoren fordern Aufsicht über die USS Abraham Lincoln", "one_line": "Nachdem Berichte über Versorgungsengpässe und psychische Belastung an Bord der [[USS Abraham Lincoln]] öffentlich wurden, verlangen mehrere Senatoren unabhängig voneinander Aufklärung, das Pentagon weist die Darstellung zurück.", "summary": ["Die [[USS Abraham Lincoln]] ist seit über 250 Tagen im Nahost-Einsatz und seit mehr als 200 Tagen ohne Hafenaufenthalt auf See, ein Rekordwert für einen US-Flugzeugträger, der auf wiederholte Verschiebungen des eigentlich für Mai geplanten Ablöseturnus im Zuge der Spannungen mit [[Iran]] zurückgeht.", "Berichte aus der Besatzung nennen Versorgungsengpässe, defekte sanitäre Anlagen, Schimmelbefall und psychische Belastung — Zustände, auf die inzwischen drei Senatoren unabhängig voneinander öffentlich reagiert haben.", "[[Richard Blumenthal]] verlangt in einem offiziellen Schreiben Antworten zu Einsatzverlängerung, Wohnbedingungen und Besatzungsmoral, mit Frist zum 27. August.", "[[Ruben Gallego]] fordert unabhängig davon einen offiziellen Aufsichtsbesuch einer überparteilichen Kongressdelegation an Bord und wirft der Marineführung vor, ohne erkennbaren Plan zu improvisieren.", "[[Mark Kelly]], selbst ehemaliger Marineoffizier, äußert sich öffentlich besorgt über die Lage der Besatzung, was der Kritik zusätzliches fachliches Gewicht verleiht.", "[[Pete Hegseth]] und das Verteidigungsministerium weisen die Darstellung der Zustände als übertrieben zurück und betonen, jedes Schiff und jede Besatzung erhalte alles Notwendige."], "deep_dive": "Diese Story ist auf den ersten Blick ein Streit um Fürsorgepflicht an Bord eines einzelnen Schiffs. Auf der tieferen Ebene zeigt sie ein wiederkehrendes Muster in der Beziehung zwischen dem [[Kongress]] und der Exekutive bei Militäreinsätzen: Seit der [[War Powers Resolution]] von 1973 versucht der Kongress immer wieder, über Anhörungen, Briefe und Delegationsbesuche Einfluss auf Entscheidungen zu behalten, die formal beim Präsidenten und dem Verteidigungsministerium liegen. Eine bindende Abstimmung über den Einsatz selbst findet dabei so gut wie nie statt, stattdessen setzen einzelne Abgeordnete auf öffentlichen Druck, in diesem Fall gleich mit drei unterschiedlichen Werkzeugen desselben Instrumentariums: einem formellen Aufsichtsbrief, einer Forderung nach einem Delegationsbesuch und einer öffentlichen Stellungnahme, jeweils unabhängig voneinander.\n\nDer eigentliche Auslöser der Krise an Bord liegt in der Eskalation des [[US-Israel-Iran-Konflikt]]s vom Februar 2026: Der ursprünglich für Mai geplante Ablöseturnus der [[USS Abraham Lincoln]] wurde wiederholt verschoben, weil die Trägerkampfgruppe im Rahmen der Spannungen mit [[Iran]] gebunden blieb. Das erklärt sowohl die außergewöhnliche Einsatzdauer als auch, warum nun die [[USS George Washington]] aus dem Pazifik abgezogen werden muss, um die Lücke zu schließen.\n\nDass mehrere Senatoren gleichzeitig aktiv werden, darunter mit [[Mark Kelly]] ein ehemaliger Marineoffizier, deutet darauf hin, dass die Kritik über reine Parteipolitik hinausgeht und auch grundsätzliche Fragen zur Belastbarkeit der Flotte berührt, insbesondere wenn militärische Präsenz gleichzeitig in mehreren Weltregionen aufrechterhalten werden muss.", "cui_bono": "Für [[Ruben Gallego]], [[Richard Blumenthal]] und [[Mark Kelly]] bietet die Situation, jeweils unabhängig voneinander, eine Gelegenheit, sich als Verfechter der Fürsorgepflicht gegenüber Truppen zu positionieren, unabhängig vom Ausgang einer möglichen Untersuchung. Für [[Pete Hegseth]] und das Pentagon steht vor allem die eigene Handlungsfähigkeit auf dem Spiel: Eine schnelle, entschiedene Zurückweisung der Berichte vermeidet, dass die strukturelle Überlastung der Flotte, verursacht durch die gleichzeitige Bindung im [[US-Israel-Iran-Konflikt]] und im Pazifik, zum eigentlichen Thema wird.", "historical_threads": [{"id": "usa-iran", "title": "USA-Iran-Konflikt", "entries": [{"date": "1979", "title": "Islamische Revolution & Geiselnahme von Teheran", "one_line": "Der Sturz des US-gestützten Schahs und die anschließende Geiselnahme in der US-Botschaft besiegeln den bis heute andauernden Bruch zwischen den USA und Iran.", "extended": "444 Tage lang wurden 52 US-Diplomaten festgehalten. Seither bestehen keine offiziellen diplomatischen Beziehungen zwischen beiden Staaten, die strukturelle Grundlage jeder späteren Eskalation."}, {"date": "2015", "title": "Atomabkommen (JCPOA)", "one_line": "Iran und mehrere Weltmächte einigen sich auf eine Begrenzung des iranischen Atomprogramms gegen Sanktionserleichterungen.", "extended": null}, {"date": "2018", "title": "US-Ausstieg aus dem Atomabkommen", "one_line": "Die erste Trump-Administration steigt einseitig aus dem JCPOA aus und verhängt eine Sanktionskampagne unter dem Namen 'Maximum Pressure'.", "extended": "Die Kampagne zielte darauf, Irans Ölexporte auf nahe null zu drücken. Iran reagierte mit schrittweiser Wiederaufnahme der Urananreicherung, dem Beginn der aktuellen Eskalationsspirale."}, {"date": "2020", "title": "Tötung von Qassem Soleimani", "one_line": "Ein US-Drohnenangriff tötet den iranischen General Qassem Soleimani, die bis dahin schärfste direkte Konfrontation.", "extended": null}, {"date": "2026-02-28", "title": "Gemeinsame US-israelische Angriffe auf Iran", "one_line": "Gemeinsame US-israelische Luftschläge treffen iranische Ziele, das Weiße Haus meldet dem Kongress die Angriffe unter Berufung auf die Befugnisse des Präsidenten als Oberbefehlshaber.", "extended": "Genau diese Eskalation ist der unmittelbare Auslöser der jetzigen Story: Sie verlängerte den Lincoln-Einsatz auf unbestimmte Zeit und löste die Krise an Bord aus, die jetzt Senatoren auf den Plan ruft. An den Finanzmärkten war die Eskalation direkt sichtbar, siehe die Marktkorrelation unten."}]}, {"id": "congressional-oversight", "title": "Kongressaufsicht über Militäreinsätze", "entries": [{"date": "1973", "title": "War Powers Resolution", "one_line": "Der Kongress verabschiedet gegen ein Veto von Präsident Nixon die War Powers Resolution, die Unterrichtungs- und Konsultationspflichten der Exekutive bei Truppeneinsätzen festschreibt.", "extended": "Ausgelöst durch die Erfahrung des Vietnamkriegs, in dem sich der Kongress systematisch übergangen sah. Bindende Vorabzustimmungen zu einzelnen Einsätzen blieben aber die Ausnahme, das Gesetz wurde seither von jeder Administration unterschiedlich ausgelegt."}, {"date": "1991", "title": "Autorisierung des Golfkriegs", "one_line": "Der Kongress stimmt vor dem Zweiten Golfkrieg erstmals seit Vietnam wieder förmlich über eine Kriegsermächtigung ab, ein seltener Fall direkter Mitsprache statt bloßer Aufsicht.", "extended": null}, {"date": "2001-2002", "title": "Kriegsermächtigungen nach dem 11. September", "one_line": "Zwei breit gefasste Ermächtigungen zum Einsatz militärischer Gewalt geben der Exekutive über zwei Jahrzehnte weiten Spielraum, der Kongress verlagert sich zunehmend auf nachträgliche Aufsicht statt Vorabkontrolle.", "extended": "Diese Ermächtigungen wurden seither von mehreren Administrationen als Rechtsgrundlage für Einsätze weit über den ursprünglichen Anlass hinaus herangezogen, was die Kontrollfunktion des Kongresses in der Praxis weiter schwächte."}, {"date": "2026-03", "title": "Kongressdebatte über eine War-Powers-Resolution zu Iran", "one_line": "Nach den Angriffen vom 28. Februar meldet das Weiße Haus die Angriffe formal an den Kongress, mehrere Abgeordnete bringen eine Resolution zur Beendigung der Feindseligkeiten ein.", "extended": "Die Debatte im Repräsentantenhaus zeigt die klassische Grenze des Instruments: Die Resolution wird diskutiert, ändert aber nichts an der fortgesetzten Bindung der Flotte im Nahen Osten, die wenige Monate später zur Ausgangslage der jetzigen Lincoln-Krise wird."}, {"date": "2026-08", "title": "Senatoren fordern Aufsicht über die USS Abraham Lincoln", "one_line": "Statt einer bindenden Resolution setzen mehrere Senatoren, unabhängig voneinander, auf die klassischen Werkzeuge der nachträglichen Aufsicht: Briefe, öffentliche Kritik und die Forderung nach einem Delegationsbesuch.", "extended": null}]}], "quotes": [{"text": "That's not proper leadership.", "attribution": "Senator Ruben Gallego (Demokrat, Arizona)", "context": "Kritisiert die Reaktion der Marineführung auf die Berichte über die Zustände an Bord der USS Abraham Lincoln.", "source_url": "https://www.npr.org/2026/08/14/nx-s1-5930365/uss-abraham-lincoln-iran-navy-ruben-gallego"}, {"text": "They're just kind of winging it right now.", "attribution": "Senator Ruben Gallego (Demokrat, Arizona)", "context": "", "source_url": "https://www.npr.org/2026/08/14/nx-s1-5930365/uss-abraham-lincoln-iran-navy-ruben-gallego"}, {"text": "We make sure that every ship, every crew, every captain has everything we can provide them.", "attribution": "Pete Hegseth, US-Verteidigungsminister", "context": "Reaktion auf die Kritik an den Zuständen an Bord der USS Abraham Lincoln.", "source_url": "https://www.cbsnews.com/news/uss-abraham-lincoln-democratic-senators-inquiry-demand/"}], "entities": [{"name": "USS Abraham Lincoln", "type": "organization", "role_in_story": "Seit über 250 Tagen im Nahost-Einsatz und über 200 Tagen ohne Hafenaufenthalt, Ausgangspunkt der Berichte über Versorgungsengpässe und psychische Belastung.", "profile": "Flugzeugträger der Nimitz-Klasse, seit 1989 im Dienst, einer der älteren aktiven US-Flugzeugträger.", "established": "1989", "image_url": "https://commons.wikimedia.org/wiki/Special:FilePath/USS_Abraham_Lincoln_%28CVN-72%29_underway_in_the_Atlantic_Ocean_on_30_January_2019_%28190130-N-PW716-1312%29.JPG", "context_image_url": "https://commons.wikimedia.org/wiki/Special:FilePath/USS_Abraham_Lincoln_%28CVN-72%29%2C_USS_George_Washington_%28CVN-73%29%2C_USS_Gerald_R._Ford_%28CVN-78%29_and_USS_Dwight_D._Eisenhower_ s://de.wikipedia.org/wiki/Iran"}, {"name": "Kongress", "type": "organization", "role_in_story": "Übt über einzelne Senatoren Aufsicht über die Verhältnisse an Bord aus.", "profile": "Gesetzgebendes Organ der USA, versucht seit der War Powers Resolution von 1973 wiederkehrend, über Anhörungen und Aufsicht Einfluss auf Militäreinsätze der Exekutive zu behalten.", "established": "1789", "image_url": "https://commons.wikimedia.org/wiki/Special:FilePath/United_States_Capitol_-_west_front.jpg", "context_image_url": "https://commons.wikimedia.org/wiki/Special:FilePath/United_States_Capitol_dome_daylight.jpg", "wikipedia_url": "https://de.wikipedia.org/wiki/Kongress_der_Vereinigten_Staaten"}, {"name": "War Powers Resolution", "type": "concept", "role_in_story": "Rechtlicher Hintergrund, vor dem die heutige Aufsichtsforderung einzuordnen ist.", "profile": "US-Bundesgesetz von 1973, das Unterrichtungs- und Konsultationspflichten der Exekutive gegenüber dem Kongress bei Truppeneinsätzen festschreibt, aber keine bindende Vorabzustimmung erzwingt.", "established": "1973", "image_url": null, "wikipedia_url": "https://de.wikipedia.org/wiki/War_Powers_Resolution"}, {"name": "US-Israel-Iran-Konflikt", "type": "event", "role_in_story": "Bindet seit Februar 2026 US-Trägerkapazitäten im Nahen Osten und ist der eigentliche Auslöser der jetzigen Krise an Bord.", "profile": "Militärische Eskalation seit den gemeinsamen US-israelischen Angriffen vom 28. Februar 2026, Auslöser der Verlängerung des Lincoln-Einsatzes und einer sichtbaren Reaktion an den Finanzmärkten.", "established": "2026-02-28", "image_url": null}, {"name": "Prinzipal-Agent-Theorie", "type": "concept", "role_in_story": "Zentraler Fachbegriff der politikwissenschaftlichen Einordnung dieser Story.", "profile": "Beschreibt Situationen, in denen ein Auftraggeber (Prinzipal) eine Aufgabe an einen Ausführenden (Agent) delegiert, dessen laufendes Handeln er wegen eines Informationsvorsprungs nicht vollständig überwachen kann — ein Kernproblem demokratischer Kontrolle von Exekutive und Militär.", "wikipedia_url": "https://de.wikipedia.org/wiki/Prinzipal-Agent-Theorie"}], "connections": [{"source": "USS George Washington", "target": "USS Abraham Lincoln", "relation": "soll ablösen"}, {"source": "USS Abraham Lincoln", "target": "US-Israel-Iran-Konflikt", "relation": "im Einsatz seit Februar-Eskalation"}, {"source": "Ruben Gallego", "target": "Kongress", "relation": "fordert als Mitglied eine Aufsichtsdelegation"}, {"source": "Richard Blumenthal", "target": "Pete Hegseth", "relation": "verlangt in einem offiziellen Schreiben Aufklärung von"}, {"source": "Kongress", "target": "War Powers Resolution", "relation": "stützt seine Aufsichtsrolle auf"}], "sources": ["NPR – Politics", "Al Jazeera – All", "CBS News – World"], "article_urls": ["https://www.npr.org/2026/08/14/nx-s1-5930365/uss-abraham-lincoln-iran-navy-ruben-gallego", "https://www.aljazeera.com/news/2026/8/13/reports-of-us-sailors-in-middle-east-trying-to-jump-ship-spark-outcry", "https://www.cbsnews.com/news/uss-abraham-lincoln-democratic-senators-inquiry-demand/", "https://www.npr.org/2026/08/13/g-s1-138591/uss-abraham-lincoln-conditions"], "countries_covered": ["USA", "Iran"], "primary_sources": [{"title": "Brief an Verteidigungsminister Hegseth und die amtierende Marine-Staatssekretärin zu den Zuständen an Bord der USS Abraham Lincoln", "issuer": "Büro von Senator Richard Blumenthal", "url": "https://www.blumenthal.senate.gov/imo/media/doc/2026-8-12_letter_to_sec_hegseth__cao_re_uss_lincoln.pdf", "date": "2026-08-12", "note": "Amtliches PDF, stellt sechs konkrete Fragen mit Frist zum 27.08.2026."}, {"title": "Pressemitteilung: Forderung nach einem offiziellen Aufsichtsbesuch an Bord", "issuer": "Büro von Senator Ruben Gallego", "url": "https://www.gallego.senate.gov/news/press-releases/senator-gallego-on-reporting-of-abysmal-uss-lincoln-conditions-i-am-seeking-an-official-oversight-visit/", "date": "2026-08-12", "note": ""}, {"title": "Kongressprotokoll: Debatte über eine War-Powers-Resolution zur Beendigung der Feindseligkeiten mit Iran", "issuer": "U.S. Congressional Record (govinfo.gov)", "url": "https://www.govinfo.gov/content/pkg/CREC-2026-03-04/html/CREC-2026-03-04-pt1-PgH2395.htm", "date": "2026-03-04", "note": "Offizielles Kongressprotokoll zu H. Con. Res. 38."}], "political_theory": {"theory": "[[Prinzipal-Agent-Theorie]] in der zivil-militärischen Aufsicht", "points": ["Der Kongress (Prinzipal) beauftragt Exekutive und Militär (Agent) mit der Durchführung von Einsätzen, kann deren laufende Entscheidungen aber nicht direkt kontrollieren, ein klassisches Informationsgefälle.", "Weil eine bindende Vorabkontrolle einzelner Einsätze politisch fast nie durchsetzbar ist, greift der Kongress auf schwächere Instrumente zurück: Anhörungen, Briefe, Delegationsbesuche.", "Die [[War Powers Resolution]] von 1973 sollte dieses Ungleichgewicht beheben, wurde aber seither von jeder Administration unterschiedlich ausgelegt, ein Beispiel dafür, wie Kontrollmechanismen ohne Durchsetzungsmacht erodieren.", "Dass drei Senatoren unabhängig voneinander tätig werden, zeigt, dass Aufsicht in der Praxis oft fragmentiert und individuell erfolgt, statt als koordinierte institutionelle Reaktion."]}, "market_correlation": {"has_correlation": true, "explanation": "Nicht die heutige Meldung selbst, sondern die zugrunde liegende Eskalation vom 28. Februar 2026 zeigt einen klaren, mehrfach belegten Marktzusammenhang: Am ersten Handelstag danach (2. März 2026) stieg der Ölpreis deutlich, und Rüstungsaktien wie Lockheed Martin erreichten Rekordstände. Das illustriert, wie diese historische Linie über die Berichterstattung hinaus messbare wirtschaftliche Folgen hatte.", "series": [{"label": "Brent Crude Oil", "raw_unit": "USD/Barrel", "points": [{"date": "2026-02-24", "value": 99.5}, {"date": "2026-02-25", "value": 100.3}, {"date": "2026-02-26", "value": 99.8}, {"date": "2026-02-27", "value": 100.0}, {"date": "2026-03-02", "value": 108.2}, {"date": "2026-03-03", "value": 106.5}], "source_url": "https://finance.yahoo.com/news/oil-prices-surge-to-cross-80-after-us-iran-conflict-engulfs-middle-east-and-strait-of-hormuz-233642824.html"}, {"label": "Lockheed Martin (LMT)", "raw_unit": "USD", "points": [{"date": "2026-02-24", "value": 99.2}, {"date": "2026-02-25", "value": 99.6}, {"date": "2026-02-26", "value": 100.1}, {"date": "2026-02-27", "value": 100.0}, {"date": "2026-03-02", "value": 104.4}, {"date": "2026-03-03", "value": 105.1}], "source_url": "https://www.schaeffersresearch.com/content/news/2026/03/02/lockheed-martin-stock-hits-record-as-iran-conflict-heightens"}], "note": "Werte indexiert auf 100 = Schlusskurs 27.02.2026 (letzter Handelstag vor der Eskalation vom 28.02.). Der Verlauf vor der Eskalation ist als nahezu flach angenähert, nicht einzeln tagesgenau belegt. Die Bewegung zum 2.3.2026 entspricht den berichteten Werten: Brent Crude etwa +8% auf rund 79 US-Dollar (intraday bis zu +13%), Lockheed Martin +4,4% auf ein Rekordhoch von 692 US-Dollar."}, "image_url": "https://commons.wikimedia.org/wiki/Special:FilePath/USS_Abraham_Lincoln_%28CVN-72%29_underway_in_the_Atlantic_Ocean_on_30_January_2019_%28190130-N-PW716-1312%29.JPG", "theme_category": "security", "stakeholders": {"pro": [{"entity": "Ruben Gallego", "reason": "Positioniert sich unabhängig vom Ausgang einer Untersuchung als schärfster Verfechter der Fürsorgepflicht gegenüber der Truppe."}, {"entity": "Richard Blumenthal", "reason": "Gewinnt politisches Profil durch das offizielle Aufklärungs-Schreiben ans Verteidigungsministerium."}, {"entity": "Mark Kelly", "reason": "Positioniert sich als besorgter Fürsprecher der Besatzung, unabhängig vom weiteren Verlauf."}], "con": [{"entity": "USS Abraham Lincoln", "reason": "Die Besatzung selbst trägt die eigentliche Last: über 250 Tage Einsatz, über 200 Tage ohne Hafenaufenthalt, im Zentrum der Vorwürfe."}, {"entity": "Pete Hegseth", "reason": "Riskiert Glaubwürdigkeit, falls sich die zurückgewiesenen Berichte über die Zustände an Bord später als zutreffend erweisen."}], "note": "Kein klarer Konflikt zwischen zwei Lagern, eher mehrere Akteure, die dieselbe Krise für unterschiedliche eigene Positionierungen nutzen."}}, {"id": "afghan-siv-revocations-2026-08", "title": "Fünf Jahre nach der Evakuierung: USA stellen Green Cards afghanischer Kriegsverbündeter infrage", "one_line": "Hunderte Afghanen, die über das [[Special Immigrant Visa (SIV) Programm]] als Kriegsverbündete der [[USA]] eingewandert waren, erhalten Schreiben, die ihre bereits erteilten Green Cards infrage stellen, Ergebnis der verschärften Überprüfungspolitik der [[Trump-Regierung]].", "summary": ["Hunderte Afghanen mit bereits erteilten, über das [[Special Immigrant Visa (SIV) Programm]] erhaltenen Green Cards erhalten Schreiben, die ihren Aufenthaltsstatus rückwirkend infrage stellen — obwohl das 2009 als Dank für afghanische Ortskräfte geschaffene Programm seit Ende 2025 für neue Anträge bereits geschlossen ist.", "Grundlage ist eine Anordnung der [[Trump-Regierung]] zur umfassenden Neuüberprüfung von Green-Card-Inhabern aus als sicherheitsrelevant eingestuften Ländern, die denselben Personenkreis nun als potenzielles Risiko statt als Kriegsverbündete behandelt.", "Ein Bundesgericht erklärte im Juni 2026 Teile dieser pauschalen Überprüfungspolitik bereits für rechtswidrig, was die praktische Wirkung der aktuellen Widerrufswelle zusätzlich unklar macht.", "Rechtsorganisationen wie die [[International Refugee Assistance Project (IRAP)]] und [[AfghanEvac]] bezeichnen den nachträglichen Widerruf bereits erteilter Visa als verfahrensrechtlich neuartig — einen Widerruf Jahre nach der eigentlichen Visaerteilung habe es zuvor in diesem Umfang nicht gegeben.", "Betroffene berichten von Unsicherheit im Alltag zwischen Arbeit, Familie und der Suche nach rechtlichem Beistand, ohne selbst Einfluss auf die politische Linie zu haben, der sie unterliegen."], "deep_dive": "Diese Story ist der jüngste Punkt zweier eigenständiger Entwicklungslinien. Die eine ist die institutionelle Geschichte des [[Special Immigrant Visa (SIV) Programm]]s selbst: 2009 als Dank und Schutz für afghanische Ortskräfte geschaffen, seit jeher von Bearbeitungsstaus geprägt, seit der überstürzten Evakuierung 2021 stark ausgeweitet und seit Ende 2025 für neue Anträge geschlossen. Die andere ist eine deutlich jüngere, unabhängige Linie: die sicherheitsgetriebene Verschärfung der US-Einwanderungspolitik seit 2025, ausgelöst durch einen einzelnen Vorfall und seither auf ganze Bevölkerungsgruppen ausgeweitet.\n\nBeide Linien betreffen dieselben Menschen, folgen aber unterschiedlichen Logiken: Das SIV-Programm ist als Belohnung für geleistete Kriegsunterstützung gedacht, die neue Überprüfungspolitik behandelt denselben Personenkreis als potenzielles Sicherheitsrisiko. Ein Bundesgericht erklärte im Juni 2026 Teile der pauschalen Überprüfungspolitik für rechtswidrig, was die praktische Wirkung der aktuellen Widerrufswelle zusätzlich unklar macht.\n\nRechtsorganisationen wie die [[International Refugee Assistance Project (IRAP)]] bezeichnen die Praxis als verfahrensrechtlich neuartig: Ein Widerruf einer Zulassung Jahre nach der eigentlichen Visaerteilung hat es in diesem Umfang zuvor nicht gegeben.", "cui_bono": "Für die migrationspolitische Linie der [[Trump-Regierung]] dient die umfassende Überprüfung als sichtbares Zeichen konsequenter Sicherheitspolitik, unabhängig davon, wie viele der überprüften Fälle am Ende tatsächlich einen Betrugs- oder Sicherheitsbezug haben. Organisationen wie die [[International Refugee Assistance Project (IRAP)]] und [[AfghanEvac]] gewinnen durch ihre Fürsprecherrolle an Sichtbarkeit und politischem Gewicht. Die unmittelbar betroffenen ehemaligen afghanischen Kriegsverbündeten tragen dagegen die Kosten der Unsicherheit, ohne selbst Einfluss auf die politische Linie zu haben, der sie unterliegen.", "historical_threads": [{"id": "siv-programme", "title": "SIV-Einwanderungsprogramm", "entries": [{"date": "2009", "title": "Afghan Allies Protection Act", "one_line": "Der US-Kongress schafft das Special-Immigrant-Visa-Programm für afghanische Staatsbürger, die für die US-Regierung oder das US-Militär gearbeitet haben.", "extended": "Gedacht als Dank und Schutz für Ortskräfte (Dolmetscher, Fahrer, Kontaktpersonen), die durch ihre Zusammenarbeit mit den USA in ihrer Heimat gefährdet waren."}, {"date": "2013", "title": "Bearbeitungsstau wird öffentlich", "one_line": "Berichte über jahrelange Wartezeiten und einen riesigen SIV-Antragsstau häufen sich.", "extended": null}, {"date": "2021-08", "title": "Evakuierungswelle", "one_line": "Im Chaos des US-Abzugs werden zehntausende Afghanen im Eilverfahren über das SIV-Programm evakuiert.", "extended": "Viele Verfahren wurden unter enormem Zeitdruck abgeschlossen, genau diese beschleunigten Fälle stehen laut heutigen Berichten jetzt besonders im Fokus der rückwirkenden Prüfungen."}, {"date": "2022", "title": "Afghan Adjustment Act scheitert im Kongress", "one_line": "Ein Gesetzesvorschlag, der evakuierten Afghanen einen dauerhaften Rechtsstatus verschaffen sollte, findet keine Mehrheit.", "extended": "Viele Evakuierte blieben dadurch auf befristete, konditionale Status angewiesen, die rechtliche Unsicherheit, die die heutigen Widerrufe erst möglich macht."}, {"date": "2025-12", "title": "Programm stoppt neue Anträge", "one_line": "Das SIV-Programm nimmt nach über 15 Jahren keine neuen Anträge über den diplomatischen Weg mehr an.", "extended": null}]}, {"id": "immigration-crackdown", "title": "Verschärfte Sicherheitsüberprüfung (2025/26)", "entries": [{"date": "2025", "title": "Schusswaffenvorfall und Überprüfungsanordnung", "one_line": "Nach einem Schusswaffenvorfall mit Beteiligung eines afghanischen Asylbewerbers und Angehörigen der Nationalgarde von West Virginia ordnet die Trump-Regierung eine umfassende Neuüberprüfung von Green-Card-Inhabern aus als sicherheitsrelevant eingestuften Ländern an.", "extended": "Die zuständige Einwanderungsbehörde begründete den Schritt damit, dass die Sicherheit der amerikanischen Bevölkerung immer an erster Stelle stehe."}, {"date": "2025-12", "title": "Ausgeweiteter Einreisestopp", "one_line": "Ein per Proklamation erweiterter Einreisestopp, der auch afghanische Staatsbürger betrifft, wird verkündet und tritt zum Jahreswechsel in Kraft.", "extended": null}, {"date": "2026-06", "title": "Bundesgericht kippt Teile der Politik", "one_line": "Ein Bundesgericht in Rhode Island erklärt mehrere USCIS-Politiken zur pauschalen Aussetzung und Überprüfung für rechtswidrig.", "extended": null}, {"date": "2026-08", "title": "Hunderte Widerrufsschreiben", "one_line": "Hunderte Inhaber afghanistanbezogener Green Cards erhalten Schreiben, die ihre Zulassung rückwirkend infrage stellen.", "extended": null}]}], "quotes": [{"text": "We are trying to work, study, raise our children and build a normal life in the U.S. But now we are also trying to find lawyers, contact congressional offices and understand what may happen to our green cards.", "attribution": "M., afghanischer Staatsbürger mit widerrufener SIV-Zusage (vollständiger Name laut NPR aus Sicherheitsgründen nicht genannt)", "context": "", "source_url": "https://www.npr.org/2026/08/15/nx-s1-5897606/afghanistan-visa-green-card-deport"}, {"text": "To get a withdrawal of approval letter years after the actual visa has been issued is something we haven't ever seen before.", "attribution": "Jennifer Patota, stellvertretende Direktorin für US-Rechtsdienste, International Refugee Assistance Project (IRAP)", "context": "", "source_url": "https://www.npr.org/2026/08/15/nx-s1-5897606/afghanistan-visa-green-card-deport"}], "entities": [{"name": "Special Immigrant Visa (SIV) Programm", "type": "concept", "role_in_story": "Programm, über das afghanische Kriegsverbündete US-Visa erhalten hatten, dessen Zusagen jetzt rückwirkend geprüft werden.", "profile": "Seit 2009 laufendes US-Einwanderungsprogramm für afghanische und irakische Staatsbürger, die für die US-Regierung oder das US-Militär gearbeitet haben, seit Ende 2025 für neue Anträge geschlossen.", "established": "2009", "image_url": null, "wikipedia_url": "https://en.wikipedia.org/wiki/Special_Immigrant_Visa"}, {"name": "USA", "type": "country", "role_in_story": "Stellt fünf Jahre nach dem Abzug aus Afghanistan bereits erteilte Aufenthaltszusagen an ehemalige Verbündete infrage.", "profile": "Führte 2001 bis 2021 den längsten Auslandseinsatz seiner Geschichte in Afghanistan.", "established": null, "image_url": "https://commons.wikimedia.org/wiki/Special:FilePath/Flag_of_the_United_States.svg", "context_image_url": "https://commons.wikimedia.org/wiki/Special:FilePath/Flag_of_the_United_States.svg", "wikipedia_url": "https://de.wikipedia.org/wiki/Vereinigte_Staaten"}, {"name": "Trump-Regierung", "type": "organization", "role_in_story": "Ordnet die umfassende Neuüberprüfung an, aus der die aktuellen Widerrufsschreiben hervorgehen.", "profile": "Aktuelle US-Regierung, verfolgt eine Linie deutlich verschärfter Einwanderungskontrolle.", "established": null, "image_url": "https://commons.wikimedia.org/wiki/Special:FilePath/Official%20Presidential%20Portrait%20of%20President%20Donald%20J.%20Trump%20%282025%29.jpg", "context_image_url": "https://commons.wikimedia.org/wiki/Special:FilePath/White%20House%20north%20and%20south%20sides.jpg", "wikipedia_url": "https://de.wikipedia.org/wiki/Zweite_Pr%C3%A4sidentschaft_von_Donald_Trump"}, {"name": "USCIS", "type": "organization", "role_in_story": "Führt die Neuüberprüfung durch und verschickt die Widerrufsschreiben.", "profile": "US-Einwanderungsbehörde (U.S. Citizenship and Immigration Services), zuständig für die Bearbeitung und Überprüfung von Einwanderungsanträgen.", "established": "2003", "image_url": "https://commons.wikimedia.org/wiki/Special:FilePath/USCIS%20logo%20English.svg", "context_image_url": "https://commons.wikimedia.org/wiki/Special:FilePath/Department%20of%20Homeland%20Security%27s%20new%20headquarters%20is%20ceremoniously%20opened.jpg", "wikipedia_url": "https://de.wikipedia.org/wiki/United_States_Citizenship_and_Immigration_Services"}, {"name": "International Refugee Assistance Project (IRAP)", "type": "organization", "role_in_story": "Vertritt betroffene Visa-Inhaber rechtlich und ordnet die Widerrufspraxis öffentlich ein.", "profile": "Gemeinnützige Rechtsorganisation, die Geflüchtete und Einwanderer, darunter viele ehemalige afghanische Kriegsverbündete, in Einwanderungsverfahren vertritt.", "established": null, "image_url": null, "wikipedia_url": "https://en.wikipedia.org/wiki/International_Refugee_Assistance_Project"}, {"name": "AfghanEvac", "type": "organization", "role_in_story": "Setzt sich als Fürsprecher für die Rechte betroffener Afghanen ein.", "profile": "Veteranengeführte Koalition, die sich seit der Evakuierung 2021 für die Neuansiedlung afghanischer Kriegsverbündeter in den USA einsetzt.", "established": "2021", "image_url": null}, {"name": "Versicherheitlichung (Securitization Theory)", "type": "concept", "role_in_story": "Zentraler Fachbegriff der politikwissenschaftlichen Einordnung dieser Story.", "profile": "Konzept der Kopenhagener Schule der Sicherheitsstudien: Ein Thema wird 'versicherheitlicht', wenn ein politischer Akteur es erfolgreich als existenzielle Bedrohung rahmt und damit Maßnahmen rechtfertigt, die außerhalb normaler rechtsstaatlicher Verfahren liegen würden.", "wikipedia_url": "https://de.wikipedia.org/wiki/Versicherheitlichung"}, {"name": "Kopenhagener Schule", "type": "concept", "role_in_story": "Zentraler Fachbegriff der politikwissenschaftlichen Einordnung dieser Story.", "profile": "Denkschule der internationalen Sicherheitsstudien (u.a. Barry Buzan, Ole Wæver), die untersucht, wie Themen durch politische Sprechakte zu 'Sicherheitsfragen' erklärt werden und damit außergewöhnliche Maßnahmen jenseits normaler demokratischer Kontrolle legitimieren.", "wikipedia_url": "https://en.wikipedia.org/wiki/Copenhagen_School_(international_relations)"}], "connections": [{"source": "Trump-Regierung", "target": "Special Immigrant Visa (SIV) Programm", "relation": "ordnet rückwirkende Überprüfung von Visa aus diesem Programm an"}, {"source": "USCIS", "target": "Special Immigrant Visa (SIV) Programm", "relation": "führt die Neuüberprüfung der erteilten Visa durch"}, {"source": "International Refugee Assistance Project (IRAP)", "target": "Special Immigrant Visa (SIV) Programm", "relation": "vertritt betroffene Visa-Inhaber rechtlich"}, {"source": "AfghanEvac", "target": "USA", "relation": "setzt sich für die Neuansiedlung afghanischer Kriegsverbündeter ein in"}], "sources": ["NPR – World", "Fox News – World"], "article_urls": ["https://www.npr.org/2026/08/15/nx-s1-5897606/afghanistan-visa-green-card-deport", "https://www.foxnews.com/politics/how-green-card-can-revoked-where-trumps-new-review-order-fits-process", "https://support.iraplegalinfo.org/hc/en-us/articles/43977659159188-What-do-the-recent-U-S-immigration-changes-mean-for-Afghans"], "countries_covered": ["Afghanistan", "USA"], "primary_sources": [{"title": "Proclamation 10998: Ausweitung der Einreisebeschränkungen auf 39 Länder", "issuer": "Federal Register / The White House", "url": "https://www.federalregister.gov/documents/2025/12/19/2025-23570/restricting-and-limiting-the-entry-of-foreign-nationals-to-protect-the-security-of-the-united-states", "date": "2025-12-19", "note": ""}, {"title": "Beendigung des Temporary Protected Status für Afghanistan", "issuer": "U.S. Department of Homeland Security / Federal Register", "url": "https://www.federalregister.gov/documents/2025/05/13/2025-08201/termination-of-the-designation-of-afghanistan-for-temporary-protected-status", "date": "2025-05-13", "note": ""}, {"title": "Dorcas International Institute of Rhode Island v. USCIS (Az. 1:26-cv-00132)", "issuer": "U.S. District Court, District of Rhode Island", "url": "https://www.nixonpeabody.com/insights/alerts/2026/06/08/rhode-island-federal-court-vacates-uscis-immigration-benefit-freeze-policies", "date": "2026-06-05", "note": "Volltext des Urteils ist über PACER zugänglich, verlinkt ist eine Kanzlei-Zusammenfassung mit direkten Zitaten aus der Entscheidung."}], "political_theory": {"theory": "[[Versicherheitlichung (Securitization Theory)]]", "points": ["Nach der [[Kopenhagener Schule]] wird ein Thema 'versicherheitlicht', wenn ein politischer Akteur es erfolgreich als existenzielle Bedrohung rahmt und damit Maßnahmen rechtfertigt, die außerhalb normaler rechtsstaatlicher Verfahren liegen würden.", "Ein einzelner Vorfall wird hier zum Auslöser, eine ganze, bereits rechtmäßig im Land lebende Bevölkerungsgruppe pauschal neu zu überprüfen, ein typisches Muster versicherheitlichter Politik.", "Die Gerichtsentscheidung vom Juni 2026 zeigt die Gegenkraft zur Versicherheitlichung: rechtsstaatliche Institutionen, die die pauschale Einstufung als Sicherheitsrisiko wieder an individuelle Prüfung binden.", "Das SIV-Programm selbst entstand aus der gegenteiligen Logik, Zugehörigkeit durch Verdienst um die USA, ein Beispiel dafür, wie sich politische Rahmungen desselben Personenkreises über Zeit umkehren können."]}, "market_correlation": {"has_correlation": false, "explanation": "Es wurde geprüft, ob sich diese Politik in Aktien von privaten Haftanstaltsbetreibern wie GEO Group oder CoreCivic niederschlägt, da diese Unternehmen auf allgemeine Einwanderungsvollzugspolitik reagieren. Für die SIV-Widerrufswelle speziell wurde jedoch keine erkennbare Marktreaktion gefunden: Die Betroffenen sind eine kleine, bereits legal im Land lebende Gruppe ohne Bezug zu neuer Haftkapazität, ein plausibler Grund für das Ausbleiben einer messbaren Reaktion.", "series": [], "note": ""}, "image_url": "https://commons.wikimedia.org/wiki/Special:FilePath/August%2019%202021%20Evacuation%20at%20Hamid%20Karzai%20International%20Airport%202.jpg", "theme_category": "rights", "stakeholders": {"pro": [{"entity": "Trump-Regierung", "reason": "Die Überprüfung dient als sichtbares Zeichen konsequenter Sicherheitspolitik, unabhängig vom tatsächlichen Anteil begründeter Fälle."}, {"entity": "International Refugee Assistance Project (IRAP)", "reason": "Gewinnt durch die Fürsprecherrolle für Betroffene an Sichtbarkeit und politischem Gewicht."}, {"entity": "AfghanEvac", "reason": "Gewinnt ebenfalls an Sichtbarkeit und politischem Gewicht durch die öffentliche Fürsprecherrolle."}], "con": [{"entity": "USA", "reason": "Die unmittelbar betroffenen ehemaligen afghanischen Kriegsverbündeten (vertreten durch das SIV-Programm, über das sie einreisten) tragen die Kosten der Unsicherheit, ohne selbst Einfluss auf die politische Linie zu haben."}]}}, {"id": "sudan-national-dialogue-2026-08", "title": "Sudans Armeechef verspricht Dialog und Immunität, schließt Rückkehr der RSF an die Macht aus", "one_line": "[[Abdel Fattah al-Burhan]] kündigt einen landesweiten Dialog mit befristeter Immunität für Teilnehmende an, macht aber klar, dass er keinen Frieden akzeptiert, der die [[Rapid Support Forces (RSF)]] unter [[Mohamed Hamdan Dagalo]] zurück an die Macht bringt.", "summary": ["[[Abdel Fattah al-Burhan]] kündigt einen landesweiten, inklusiven Dialog mit politischen und zivilen Parteien an, mit rechtlichen, politischen, sicherheitsbezogenen und logistischen Garantien durch den Staat.", "Teilnehmenden mit laufenden Strafverfahren soll für die Dauer des Dialogs eine befristete Aussetzung dieser Verfahren gewährt werden — ausdrücklich kein Straferlass, sondern eine zeitlich begrenzte Geste.", "Ein Frieden, der die [[Rapid Support Forces (RSF)]] unter [[Mohamed Hamdan Dagalo]] zurück an die Macht bringen würde, wird ausdrücklich ausgeschlossen — eine klare Linie angesichts des seit April 2023 andauernden Machtkampfs zwischen beiden Lagern.", "Die [[Sudanesische Armee (SAF)]] kündigt gleichzeitig an, den militärischen Kampf gegen die RSF fortzusetzen, während zivile Gruppen wie das Bündnis Somoud bereits vor der Ankündigung Vorbehalte gegen einen von der Militärführung initiierten Dialog äußerten.", "Die Ankündigung fällt zeitlich mit einem Besuch einer Delegation der Afrikanischen Union und Sudans Bitte um Aufhebung seiner seit dem Putsch von 2021 bestehenden Suspendierung zusammen."], "deep_dive": "Diese Story ist der jüngste Punkt zweier miteinander verflochtener, aber unterscheidbarer Linien. Die eine ist der Bürgerkrieg selbst: Der offene Machtkampf zwischen [[Sudanesische Armee (SAF)]] und [[Rapid Support Forces (RSF)]] brach im April 2023 aus, nachdem beide Seiten zuvor gemeinsam den zivilen Übergang nach dem Sturz von Omar al-Bashir 2019 per Putsch beendet hatten. Die andere, viel längere Linie ist das wiederkehrende Muster sudanesischer Politik seit der Unabhängigkeit 1956: Volksaufstände stürzen Militärregime, eine zivile Übergangsphase folgt, und ein neuer Putsch beendet sie wieder, ein Zyklus, der sich seit den 1950er-Jahren mehrfach wiederholt hat.\n\nDas jetzige Dialogangebot fällt in eine Phase, in der [[Sudanesische Armee (SAF)]] gleichzeitig militärisch weiterkämpft und diplomatisch um internationale Anerkennung wirbt, sichtbar am zeitgleichen Besuch einer Delegation der Afrikanischen Union und Sudans Bitte um Aufhebung seiner seit dem Putsch von 2021 bestehenden Suspendierung.\n\nZivile Gruppen wie die Bündnisallianz Somoud reagierten bereits vor der offiziellen Ankündigung mit Vorbehalten. Aus ihrer Sicht ist ein von der Militärführung initiierter Dialog schwer von einer Vereinnahmung des zivilen Übergangs zu unterscheiden, die genau diesem Muster wiederholter Putsche entspricht.", "cui_bono": "Für [[Abdel Fattah al-Burhan]] bietet die Dialoginitiative die Möglichkeit, sich international als Befürworter einer politischen Lösung zu positionieren, während die [[Sudanesische Armee (SAF)]] militärisch weiterkämpft, ein doppeltes Signal an unterschiedliche Adressaten: an ausländische Vermittler und an die eigene Basis. Für die [[Demokratische Blockpartei]], die die Ankündigung begrüßte, bedeutet Teilnahme am Dialog eine Gelegenheit zu politischem Einfluss, birgt aber das Risiko, eine militärisch dominierte Prozessführung zu legitimieren. Zivile Kräfte, die sich aus Sorge vor genau dieser Legitimierung fernhalten, laufen umgekehrt Gefahr, von der Gestaltung eines möglichen Übergangs ausgeschlossen zu bleiben.", "historical_threads": [{"id": "sudan-civil-war", "title": "Sudans Bürgerkrieg (SAF gegen RSF)", "entries": [{"date": "2019", "title": "Sturz von Omar al-Bashir", "one_line": "Ein Volksaufstand stürzt den langjährigen Machthaber Omar al-Bashir, SAF und RSF übernehmen gemeinsam mit zivilen Kräften einen Übergangsprozess.", "extended": null}, {"date": "2021-10", "title": "Militärputsch beendet zivilen Übergang", "one_line": "SAF unter al-Burhan und RSF unter Hemedti stürzen gemeinsam die zivil geführte Übergangsregierung.", "extended": "Der gemeinsame Putsch der beiden späteren Kriegsgegner zeigt, dass der heutige Konflikt kein von Anfang an angelegter Gegensatz war, sondern aus einem späteren Machtkampf zwischen denselben Verbündeten entstand."}, {"date": "2023-04", "title": "Ausbruch des offenen Bürgerkriegs", "one_line": "Kämpfe zwischen SAF und RSF um die Kontrolle über den Staat brechen offen aus, beginnend in Khartum.", "extended": null}, {"date": "2023-2025", "title": "Vertreibung und humanitäre Krise", "one_line": "Millionen Menschen werden landesweit vertrieben, weite Landesteile geraten unter wechselnde Kontrolle beider Kriegsparteien.", "extended": null}, {"date": "2026-08", "title": "Dialogangebot bei fortgesetztem Kampf", "one_line": "Al-Burhan bietet einen zivilen Dialog mit befristeter Immunität an, kündigt aber gleichzeitig die Fortsetzung des militärischen Kampfes gegen die RSF an.", "extended": null}]}, {"id": "sudan-coup-cycle", "title": "Sudans Zyklus aus Militärherrschaft und Aufständen", "entries": [{"date": "1956", "title": "Unabhängigkeit Sudans", "one_line": "Der Sudan wird unabhängig, die junge Demokratie wird bereits 1958 durch den ersten Militärputsch beendet.", "extended": null}, {"date": "1969 & 1989", "title": "Weitere Militärputsche", "one_line": "Zwei weitere Putsche etablieren jeweils langjährige Militärregime, zuletzt unter Omar al-Bashir ab 1989.", "extended": null}, {"date": "2018-2019", "title": "Volksaufstand gegen al-Bashir", "one_line": "Monatelange Massenproteste zwingen das Militär, al-Bashir abzusetzen, eine zivil-militärische Übergangsregierung wird vereinbart.", "extended": null}, {"date": "2021-10", "title": "Putsch beendet den Übergang erneut", "one_line": "Wie schon 1958 folgt auf eine zivile Öffnung ein Putsch, diesmal von SAF und RSF gemeinsam getragen.", "extended": null}, {"date": "2026-08", "title": "Neues Dialogangebot unter Kriegsbedingungen", "one_line": "Ein neuer ziviler Dialog wird angeboten, diesmal während eines laufenden Krieges statt nach einem abgeschlossenen Machtwechsel, ein Novum in diesem wiederkehrenden Muster.", "extended": null}]}], "quotes": [{"text": "an incomplete peace", "attribution": "Abdel Fattah al-Burhan, Vorsitzender des sudanesischen Übergangssouveränitätsrats", "context": "Bezeichnung für ein Friedensszenario, das die RSF zurück an die Macht bringen würde und das er ausschließt.", "source_url": "https://www.aljazeera.com/news/2026/8/15/sudans-al-burhan-pledges-immunity-for-dialogue-rules-out-hemedti-return"}, {"text": "is not considered a pardon, but rather means suspending the criminal proceedings", "attribution": "Abdel Fattah al-Burhan, Vorsitzender des sudanesischen Übergangssouveränitätsrats", "context": "Erklärung zur angebotenen befristeten Immunität für Dialogteilnehmende.", "source_url": "https://english.aawsat.com/arab-world/5307459-sudan%E2%80%99s-al-burhan-backs-inclusive-dialogue-pledges-continue-fighting-rsf"}, {"text": "a significant step towards addressing the crisis", "attribution": "Mohamed Zakaria, Sprecher der Demokratischen Blockpartei", "context": "Reaktion auf die Ankündigung al-Burhans.", "source_url": "https://english.aawsat.com/arab-world/5307459-sudan%E2%80%99s-al-burhan-backs-inclusive-dialogue-pledges-continue-fighting-rsf"}], "entities": [{"name": "Abdel Fattah al-Burhan", "type": "person", "role_in_story": "Kündigt den Dialog und die befristete Immunität an, schließt eine Rückkehr der RSF an die Macht aus.", "profile": "Vorsitzender des sudanesischen Übergangssouveränitätsrats und Oberbefehlshaber der Sudanesischen Armee, an der Macht seit dem Putsch von 2021.", "established": null, "image_url": "https://commons.wikimedia.org/wiki/Special:FilePath/Abdel%20Fattah%20al-Burhan%2C%202019%20%28cropped%29.jpg", "context_image_url": "https://commons.wikimedia.org/wiki/Special:FilePath/Abdel%20Fattah%20al-Burhan%2C%202019%20%28cropped%29.jpg", "wikipedia_url": "https://en.wikipedia.org/wiki/Abdel_Fattah_al-Burhan"}, {"name": "Rapid Support Forces (RSF)", "type": "organization", "role_in_story": "Kriegsgegner der Sudanesischen Armee, deren Rückkehr an die Macht al-Burhan ausschließt.", "profile": "Paramilitärische Truppe, ging aus den Dschandschawid-Milizen hervor, seit April 2023 im offenen Krieg gegen die Sudanesische Armee.", "established": null, "image_url": "https://commons.wikimedia.org/wiki/Special:FilePath/Emblem%20of%20the%20Rapid%20Support%20Forces.png", "context_image_url": "https://commons.wikimedia.org/wiki/Special:FilePath/Flag%20of%20the%20Rapid%20Support%20Forces%20%28Sudan%29.png", "wikipedia_url": "https://en.wikipedia.org/wiki/Rapid_Support_Forces"}, {"name": "Mohamed Hamdan Dagalo", "type": "person", "role_in_story": "Führt als 'Hemedti' die RSF an, deren Rückkehr an die Macht al-Burhan explizit ausschließt.", "profile": "Kommandeur der Rapid Support Forces, war bis 2023 gemeinsam mit al-Burhan Teil der herrschenden Militärführung, seither dessen Kriegsgegner.", "established": null, "image_url": "https://commons.wikimedia.org/wiki/Special:FilePath/Mohamed%20Hamdan%20Dagalo%202022%20%28cropped%29.jpg", "context_image_url": "https://commons.wikimedia.org/wiki/Special:FilePath/Mohamed%20Hamdan%20Dagalo%202022%20%28cropped%29.jpg", "wikipedia_url": "https://de.wikipedia.org/wiki/Mohammed_Hamdan_Daglo"}, {"name": "Sudanesische Armee (SAF)", "type": "organization", "role_in_story": "Kämpft unter al-Burhans Führung weiter gegen die RSF, während der Staat zivilen Dialog anbietet.", "profile": "Reguläre Streitkräfte Sudans, seit April 2023 im offenen Bürgerkrieg gegen die Rapid Support Forces.", "established": null, "image_url": "https://commons.wikimedia.org/wiki/Special:FilePath/Insignia%20of%20the%20Sudanese%20Armed%20Forces.svg", "context_image_url": "https://commons.wikimedia.org/wiki/Special:FilePath/Insignia%20of%20the%20Sudanese%20Armed%20Forces.svg", "wikipedia_url": "https://de.wikipedia.org/wiki/Sudanesische_Streitkr%C3%A4fte"}, {"name": "Demokratische Blockpartei", "type": "organization", "role_in_story": "Begrüßt al-Burhans Dialogangebot öffentlich als bedeutenden Schritt.", "profile": "Sudanesische politische Gruppierung, die sich zum Dialogangebot der Übergangsführung positioniert.", "established": null, "image_url": null}, {"name": "Sudan", "type": "country", "role_in_story": "Schauplatz des Bürgerkriegs und des jetzt angebotenen Dialogs.", "profile": "Nordostafrikanisches Land, seit der Unabhängigkeit 1956 von wiederkehrenden Militärputschen und zivilen Übergangsphasen geprägt.", "established": "1956", "image_url": "https://commons.wikimedia.org/wiki/Special:FilePath/Flag_of_Sudan.svg", "context_image_url": "https://commons.wikimedia.org/wiki/Special:FilePath/Flag_of_Sudan.svg", "wikipedia_url": "https://de.wikipedia.org/wiki/Sudan"}, {"name": "Begrenzte Zugangsordnungen (Limited Access Orders)", "type": "concept", "role_in_story": "Zentraler Fachbegriff der politikwissenschaftlichen Einordnung dieser Story.", "profile": "Konzept von Douglass North, John Wallis und Barry Weingast: Gesellschaften, in denen politische Stabilität nicht über unpersönliche Institutionen, sondern über die gezielte Verteilung von Renten und Privilegien an mächtige, oft bewaffnete Gruppen organisiert wird."}], "connections": [{"source": "Abdel Fattah al-Burhan", "target": "Sudanesische Armee (SAF)", "relation": "befehligt als Oberbefehlshaber"}, {"source": "Mohamed Hamdan Dagalo", "target": "Rapid Support Forces (RSF)", "relation": "führt als Kommandeur"}, {"source": "Sudanesische Armee (SAF)", "target": "Rapid Support Forces (RSF)", "relation": "bekämpft seit April 2023 im Bürgerkrieg"}, {"source": "Demokratische Blockpartei", "target": "Abdel Fattah al-Burhan", "relation": "begrüßt dessen Dialogangebot"}, {"source": "Abdel Fattah al-Burhan", "target": "Sudan", "relation": "regiert als Vorsitzender des Übergangssouveränitätsrats"}], "sources": ["Al Jazeera – All", "Asharq Al-Awsat English"], "article_urls": ["https://www.aljazeera.com/news/2026/8/15/sudans-al-burhan-pledges-immunity-for-dialogue-rules-out-hemedti-return", "https://english.aawsat.com/arab-world/5307459-sudan%E2%80%99s-al-burhan-backs-inclusive-dialogue-pledges-continue-fighting-rsf", "https://sudantribune.com/article/317214"], "countries_covered": ["Sudan"], "primary_sources": [{"title": "Offizielle Statements des sudanesischen Armeechefs zur Bedingung für Dialog und Frieden", "issuer": "SUNA, Sudan News Agency (staatliche Nachrichtenagentur)", "url": "https://suna-sd.net", "date": "2026-08-15", "note": "Offizieller Regierungskanal, verifiziert erreichbar; die konkrete Rede vom 15.08. war über automatisierten Abruf nicht einzeln als Dokument auffindbar."}, {"title": "Treffen einer AU-Delegation mit al-Burhan, Bekräftigung von Sudans Souveränität", "issuer": "African Union Peace and Security Council (über sudanesische Staatsmedien berichtet)", "url": "https://allafrica.com/stories/202608170084.html", "date": "2026-08-16", "note": "Keine direkt von der AU selbst gehostete Version des Statements gefunden, nur die staatsmedial verbreitete Zusammenfassung."}], "political_theory": {"theory": "[[Begrenzte Zugangsordnungen (Limited Access Orders)]] und neopatrimoniale Konfliktzyklen", "points": ["Nach North, Wallis und Weingast organisieren 'begrenzte Zugangsordnungen' politische Stabilität über die Verteilung von Renten und Privilegien an bewaffnete Machtgruppen statt über unpersönliche Institutionen, das erklärt, warum Machtkämpfe hier häufig in Gewalt statt in Wahlen ausgetragen werden.", "Der gemeinsame Putsch von SAF und RSF 2021 gegen die eigene zivile Übergangsregierung zeigt das Muster: Koalitionen bewaffneter Akteure halten nur so lange, wie die Verteilung von Macht und Ressourcen zwischen ihnen stimmt.", "Ein von der Militärführung selbst initiierter ziviler Dialog lässt sich in diesem Rahmen doppelt lesen: als echter Öffnungsversuch oder als Versuch, die eigene Zugangsordnung durch kontrollierte Einbindung ziviler Kräfte zu stabilisieren, ohne sie tatsächlich zu teilen.", "Die wiederholten Zyklen aus Aufstand, Übergang und Putsch seit 1956 legen nahe, dass die entscheidende Frage nicht ist, ob Dialog stattfindet, sondern ob er die zugrunde liegende Verteilung von Zwangsmitteln verändert."]}, "market_correlation": {"has_correlation": false, "explanation": "Es wurde geprüft, ob sich Sudans Bürgerkrieg oder die aktuelle Dialoginitiative im globalen Goldpreis, in Währungs- oder Anleihemärkten niederschlagen. Beim Goldpreis verläuft der recherchierbare Zusammenhang tatsächlich umgekehrt: Sudans Kriegsökonomie wird durch den ohnehin hohen globalen Goldpreis mitfinanziert, nicht umgekehrt. Ein liquide gehandelter sudanesischer Staatsanleihenmarkt existiert nicht mehr, der sudanesische Pfund verfällt strukturell seit Kriegsbeginn, aber ohne belegbaren Ausschlag speziell zur aktuellen Dialogankündigung.", "series": [], "note": ""}, "image_url": "https://commons.wikimedia.org/wiki/Special:FilePath/War%20in%20Sudan%20%282023%29.svg", "theme_category": "conflict", "stakeholders": {"pro": [{"entity": "Abdel Fattah al-Burhan", "reason": "Kann sich international als Befürworter einer politischen Lösung positionieren, während die Armee militärisch weiterkämpft."}], "con": [{"entity": "Demokratische Blockpartei", "reason": "Teilnahme am Dialog bietet Einfluss, birgt aber das Risiko, eine militärisch dominierte Prozessführung zu legitimieren."}], "note": "Zivile Kräfte, die sich aus Sorge vor genau dieser Legitimierung vom Dialog fernhalten, laufen umgekehrt Gefahr, von der Gestaltung eines möglichen Übergangs ausgeschlossen zu bleiben – im Datensatz aber keine eigene benannte Entität."}}, {"id": "ukraine-long-range-strikes-2026-08", "title": "Ukraine trifft mit Langstreckenraketen Ziele tief in Russland, Streit um US-Waffenlieferung über die Türkei", "one_line": "Ukrainische [[Flamingo-Marschflugkörper]] treffen das russische Progress-Raumfahrtzentrum und den Luftwaffenstützpunkt Sawasleika, während Russland [[USA]] und [[Türkei]] wegen einer geplanten Waffenlieferung an die [[Ukraine]] mit Schäden an den bilateralen Beziehungen droht.", "summary": ["Ukrainische, im eigenen Land entwickelte [[Flamingo-Marschflugkörper]] treffen das [[Progress-Raumfahrtzentrum]] in der russischen Region Samara sowie den Luftwaffenstützpunkt Sawasleika, von dem aus Kinschal-Trägerjets starten — ein weiterer Beleg für die wachsende eigenständige Reichweite ukrainischer Waffensysteme.", "Russland reagiert in derselben Nacht mit einem Großangriff von 152 Drohnen auf ukrainische Städte, einem der massivsten Drohnenangriffe der letzten Zeit.", "Parallel dazu protestiert Russland gegen eine über die [[Türkei]] laufende Lieferung von ATACMS-Raketen, M270-Systemen und Munition aus den [[USA]] an die [[Ukraine]] und zeigt damit, wie Drittstaaten inzwischen als Zwischenstationen für westliche Rüstungslieferungen dienen.", "Russland droht mit Schäden an den bilateralen Beziehungen zu Washington und Ankara.", "Die Angriffe und der Waffenlieferungsstreit fallen zeitlich zusammen, sind aber unabhängige Entwicklungen entlang zweier getrennter Eskalationslinien — der militärischen und der diplomatischen."], "deep_dive": "Diese Story verbindet zwei eigenständige Linien, die an diesem Tag zufällig zusammenfielen. Die eine ist die militärische Eskalationslogik des Krieges selbst, der seit der Annexion der Krim 2014 und dem Beginn des Kriegs im Donbass in mehreren Phasen verlief und seit der vollumfänglichen Invasion im Februar 2022 offen geführt wird: Ukrainische Angriffe reichen inzwischen mit im eigenen Land entwickelten Langstreckensystemen wie den [[Flamingo-Marschflugkörper]]n Hunderte Kilometer tief nach Russland hinein.\n\nDie andere Linie ist die politisch-diplomatische Geschichte westlicher Waffenlieferungen an die [[Ukraine]]: von anfänglich zurückhaltenden Lieferungen leichter Panzerabwehrwaffen 2022 über die Debatte um weitreichende Systeme wie ATACMS bis zur aktuellen, über die [[Türkei]] abgewickelten Lieferung, die zeigt, wie Drittstaaten inzwischen als Zwischenstationen für westliche Rüstungslieferungen dienen und damit selbst zur Zielscheibe russischer diplomatischer Proteste werden.\n\nDass Russland am selben Tag sowohl mit einem der größten Drohnenangriffe der letzten Zeit reagierte als auch diplomatisch gegen die Türkei protestierte, zeigt zwei parallele Reaktionskanäle auf denselben grundlegenden Trend: die wachsende Reichweite und Substanz westlicher beziehungsweise ukrainischer Waffenfähigkeiten.", "cui_bono": "Für [[Ukraine]] demonstrieren die Treffer tief in Russland hinein die wachsende eigenständige Fähigkeit, unabhängig von der jeweils aktuellen Lieferbereitschaft westlicher Partner. Für Russland dient sowohl der Drohnengroßangriff als auch der diplomatische Protest gegen [[Türkei]] und [[USA]] dazu, den Preis weiterer westlicher Unterstützung sichtbar zu erhöhen, militärisch für die ukrainische Bevölkerung, diplomatisch für die beteiligten Drittstaaten. Für die [[Türkei]] wiederum ist ihre Rolle als Transitstaat für US-Waffenlieferungen eine Gelegenheit, sich als unverzichtbarer Vermittler und Partner beider Seiten zu positionieren, auch wenn das diplomatische Kosten mit Russland mit sich bringt.", "historical_threads": [{"id": "russia-ukraine-invasion", "title": "Russlands Krieg gegen die Ukraine", "entries": [{"date": "2014-03", "title": "Annexion der Krim", "one_line": "Russland annektiert die ukrainische Halbinsel Krim nach einem international nicht anerkannten Referendum.", "extended": null}, {"date": "2014-04", "title": "Beginn des Kriegs im Donbass", "one_line": "Von Russland unterstützte Separatisten rufen abtrünnige Gebiete in der Ostukraine aus, ein jahrelanger, zunächst begrenzter Krieg beginnt.", "extended": null}, {"date": "2022-02", "title": "Vollumfängliche Invasion", "one_line": "Russland startet eine landesweite Invasion der Ukraine, der Krieg wird von einem begrenzten zu einem offenen, landesweiten Konflikt.", "extended": null}, {"date": "2023-2025", "title": "Stellungskrieg und Zermürbung", "one_line": "Der Krieg entwickelt sich zu einem langwierigen Abnutzungskrieg entlang weitgehend stabiler Frontlinien, mit wiederholten Luftangriffen auf beiden Seiten.", "extended": null}, {"date": "2026-08", "title": "Ukrainische Langstreckenschläge tief in Russland", "one_line": "Ukraine trifft mit selbst entwickelten Flamingo-Marschflugkörpern Ziele Hunderte Kilometer hinter der Front, während Russland mit einem Großangriff von 152 Drohnen antwortet.", "extended": null}]}, {"id": "western-arms-supply", "title": "Westliche Waffenlieferungen und Russlands Reaktion", "entries": [{"date": "2022", "title": "Erste westliche Waffenlieferungen", "one_line": "Westliche Staaten liefern zunächst vor allem leichte Panzerabwehrwaffen und Flugabwehrsysteme, aus Sorge vor einer Eskalation mit Russland zunächst ohne weitreichende Systeme.", "extended": null}, {"date": "2023", "title": "Debatte um weitreichende Systeme", "one_line": "Die Diskussion um die Lieferung von Kampfpanzern und später weitreichenden Raketensystemen wie ATACMS nimmt zu, begleitet von wiederholten russischen Eskalationswarnungen.", "extended": null}, {"date": "2024", "title": "Erlaubnis für Angriffe auf russisches Gebiet", "one_line": "Mehrere westliche Partner erlauben der Ukraine erstmals den begrenzten Einsatz gelieferter Waffensysteme gegen Ziele auf russischem Staatsgebiet.", "extended": null}, {"date": "2026-08", "title": "Über die Türkei abgewickelte US-Waffenlieferung", "one_line": "Russland protestiert öffentlich gegen eine über die Türkei laufende Lieferung von ATACMS-Raketen, M270-Systemen und Munition aus den USA an die Ukraine und droht mit Schäden an den Beziehungen zu beiden Staaten.", "extended": null}]}], "quotes": [{"text": "Our plan of long-range sanctions against Russia for this war is being implemented, and it is important that Russia's war potential be reduced.", "attribution": "Wolodymyr Selenskyj, Präsident der Ukraine", "context": "", "source_url": "https://kyivindependent.com/ukraine-reportedly-strikes-russian-military-airbase-behind-ballistic-missile-attacks-as-rockets-target-samara-oblast/"}, {"text": "The progress center, which was involved, among other things in producing electronics, was hit. Flamingo missiles were used, a good achievement.", "attribution": "Wolodymyr Selenskyj, Präsident der Ukraine", "context": "Übersetzte Aussage, kleinere Grammatikkorrektur gegenüber der Originalwiedergabe.", "source_url": "https://kyivindependent.com/ukraine-reportedly-strikes-russian-military-airbase-behind-ballistic-missile-attacks-as-rockets-target-samara-oblast/"}, {"text": "Attempts to use peace-promoting rhetoric while simultaneously supplying weapons to Ukraine inevitably erode mutual trust.", "attribution": "Maria Sacharowa, Sprecherin des russischen Außenministeriums", "context": "Reaktion auf eine über die Türkei laufende US-Waffenlieferung an die Ukraine.", "source_url": "https://kyivindependent.com/russia-threatens-serious-damage-to-relations-with-us-turkey-over-weapons-shipme
