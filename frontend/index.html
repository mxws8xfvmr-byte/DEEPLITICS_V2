<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deeplitics</title>
<style>
/* ============================================================
   DEEPLITICS v7 — Design-System
   Dunkelmodus ist Standard. Farben sind CSS-Variablen, die beim
   Theme-Wechsel (data-theme) und je Story (data-cat) neu gesetzt
   werden. Kategorie-Farben sind FEST zugeordnet (dataviz-Skill:
   kategoriale Farben in fester Reihenfolge, nie rotierend).
   ============================================================ */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

:root {
  --radius-s: 10px;
  --radius-m: 16px;
  --radius-l: 22px;
  --radius-xl: 28px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Segoe UI", Helvetica, Arial, sans-serif;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

html[data-theme="dark"] {
  --bg: #050506;
  --bg-soft: #0b0c0f;
  --bg-elevated: #14151a;
  --bg-card: #15161b;
  --bg-card-hover: #1b1c22;
  --ink: #f5f5f7;
  --ink-secondary: #a6a6ad;
  --ink-muted: #7b7b83;
  --border: rgba(255,255,255,0.09);
  --border-strong: rgba(255,255,255,0.16);
  --overlay-bg: rgba(5,5,6,0.72);
  --scrim-top: rgba(0,0,0,0);
  --scrim-bottom: rgba(0,0,0,0.85);
  --shadow: 0 20px 60px rgba(0,0,0,0.55);
  --input-bg: rgba(255,255,255,0.06);
}
html[data-theme="light"] {
  --bg: #f4f4f6;
  --bg-soft: #ffffff;
  --bg-elevated: #ffffff;
  --bg-card: #ffffff;
  --bg-card-hover: #fbfbfc;
  --ink: #1d1d1f;
  --ink-secondary: #55565b;
  --ink-muted: #86868b;
  --border: rgba(0,0,0,0.08);
  --border-strong: rgba(0,0,0,0.14);
  --overlay-bg: rgba(244,244,246,0.78);
  --scrim-top: rgba(0,0,0,0);
  --scrim-bottom: rgba(0,0,0,0.62);
  --shadow: 0 20px 50px rgba(0,0,0,0.14);
  --input-bg: rgba(0,0,0,0.045);
}

/* Kategorie-Paletten: fest je Thema, light/dark-Variante je Modus.
   Werte angelehnt an bekannte, kontraststarke iOS-Systemfarben. */
html[data-theme="dark"] {
  --cat-security:      #0a84ff;
  --cat-diplomacy:      #40c8e0;
  --cat-trade:          #ff9f0a;
  --cat-rights:         #bf5af2;
  --cat-conflict:       #ff453a;
  --cat-surveillance:   #32d74b;
  --good: #32d74b;
  --bad: #ff6961;
}
html[data-theme="light"] {
  --cat-security:      #0071e3;
  --cat-diplomacy:      #0a9396;
  --cat-trade:          #c9750b;
  --cat-rights:         #8944ab;
  --cat-conflict:       #d70015;
  --cat-surveillance:   #248a3d;
  --good: #1f8a3c;
  --bad: #c9342a;
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

a { color: inherit; }
button { font-family: inherit; cursor: pointer; }

.wrap { max-width: 1080px; margin: 0 auto; padding: 0 24px; }
@media (max-width: 640px) { .wrap { padding: 0 16px; } }

/* ---------- Topbar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 40;
  backdrop-filter: blur(20px) saturate(1.4);
  background: var(--overlay-bg);
  border-bottom: 1px solid var(--border);
}
.topbar-inner {
  max-width: 1080px; margin: 0 auto; padding: 0 24px;
  height: 56px; display: flex; align-items: center; justify-content: space-between;
}
.brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 18px; letter-spacing: -0.01em; cursor: pointer; border: none; background: none; color: var(--ink); }
.brand-dot { width: 9px; height: 9px; border-radius: 50%; background: linear-gradient(135deg, var(--cat-security), var(--cat-rights)); }
.top-actions { display: flex; align-items: center; gap: 12px; }
.last-updated { font-size: 12px; color: var(--ink-muted); font-weight: 550; white-space: nowrap; }
@media (max-width: 560px) { .last-updated { display: none; } }
.icon-btn {
  width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border);
  background: var(--bg-elevated); color: var(--ink); display: flex; align-items: center; justify-content: center;
  transition: transform .15s var(--ease), background .15s;
}
.icon-btn:hover { background: var(--bg-card-hover); transform: scale(1.06); }
.icon-btn svg { width: 17px; height: 17px; }
.avatar-btn {
  width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border-strong);
  padding: 0; overflow: hidden; transition: transform .15s var(--ease);
}
.avatar-btn:hover { transform: scale(1.07); }
.avatar-btn svg, .avatar-mini svg { width: 100%; height: 100%; display: block; }

/* ---------- Greeting / Home header ---------- */
.greeting { padding: 46px 0 22px; }
.greeting-eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 10px; }
.greeting-title { font-size: 38px; line-height: 1.12; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 10px; max-width: 720px; }
.greeting-sub { font-size: 16px; color: var(--ink-secondary); margin: 0; max-width: 620px; }
@media (max-width: 640px) { .greeting-title { font-size: 28px; } }

.pref-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 22px 0 8px; }
.pref-chip {
  border: 1px solid var(--border); background: var(--bg-elevated); color: var(--ink-secondary);
  border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 600; transition: all .15s var(--ease);
}
.pref-chip.active { color: #fff; border-color: transparent; }
.pref-chip:hover { border-color: var(--border-strong); }

/* ---------- Story grid / cards ---------- */
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px; padding: 18px 0 60px; }
@media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }

.card {
  background: var(--bg-card); border-radius: var(--radius-l); overflow: hidden;
  border: 1px solid var(--border); cursor: pointer;
  transition: transform .28s var(--ease), box-shadow .28s var(--ease), background .2s;
  display: flex; flex-direction: column;
}
.card:hover { transform: translateY(-3px); box-shadow: var(--shadow); background: var(--bg-card-hover); }

.media { position: relative; width: 100%; overflow: hidden; background: var(--bg-elevated); }
.media .fallback {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  background: var(--fb-grad, linear-gradient(135deg, var(--cat-c1), var(--cat-c2)));
}
.media .fallback svg { width: 34%; height: 34%; opacity: .92; }
.media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }

.card-media { aspect-ratio: 16/10.5; border-radius: var(--radius-l) var(--radius-l) 0 0; }
.card-media::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.55), rgba(0,0,0,0) 55%);
}
.cat-chip {
  position: absolute; top: 12px; left: 12px; z-index: 2;
  font-size: 11.5px; font-weight: 700; letter-spacing: .02em; color: #fff;
  padding: 5px 11px; border-radius: 999px; backdrop-filter: blur(6px);
  background: color-mix(in srgb, var(--cat-color) 78%, #000 6%);
}
.save-btn {
  position: absolute; top: 10px; right: 10px; z-index: 3;
  width: 32px; height: 32px; border-radius: 50%; border: none;
  background: rgba(0,0,0,0.38); backdrop-filter: blur(6px);
  display: flex; align-items: center; justify-content: center; color: #fff;
  transition: transform .15s var(--ease), background .15s;
}
.save-btn:hover { transform: scale(1.08); background: rgba(0,0,0,0.55); }
.save-btn svg { width: 16px; height: 16px; }
.save-btn.saved svg path { fill: currentColor; }

.card-body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.card-title { font-size: 18px; font-weight: 750; letter-spacing: -0.012em; line-height: 1.28; margin: 0; }
.card-dek {
  font-size: 14px; color: var(--ink-secondary); line-height: 1.5; margin: 0;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.card-meta { margin-top: auto; padding-top: 6px; font-size: 12.5px; color: var(--ink-muted); display: flex; gap: 8px; align-items: center; }
.card-meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--ink-muted); }

/* ---------- Overlay / Detail view ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 100; background: var(--bg);
  transform: translateY(100%); transition: transform .38s var(--ease);
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.overlay.open { transform: translateY(0); }
.overlay-topbar {
  position: sticky; top: 0; z-index: 20; display: flex; justify-content: space-between; align-items: center;
  padding: 12px 18px; background: var(--overlay-bg); backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
}
.pill-btn {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border-strong);
  background: var(--bg-elevated); color: var(--ink); border-radius: 999px; padding: 8px 14px;
  font-size: 13.5px; font-weight: 600; transition: background .15s;
}
.pill-btn:hover { background: var(--bg-card-hover); }
.pill-btn svg { width: 14px; height: 14px; }

.detail-hero { position: relative; width: 100%; aspect-ratio: 16/8.2; margin-bottom: -64px; }
@media (max-width: 640px) { .detail-hero { aspect-ratio: 4/3.4; margin-bottom: -46px; } }
.detail-hero::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(to top, var(--bg-soft) 0%, var(--bg-soft) 4%, var(--scrim-bottom) 22%, transparent 62%);
}

.detail-content { position: relative; max-width: 760px; margin: 0 auto; padding: 0 24px 90px; }
.detail-eyebrow { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; font-size: 13px; color: var(--ink-muted); font-weight: 600; }
.detail-cat-chip { color: #fff; padding: 4px 11px; border-radius: 999px; font-size: 11.5px; font-weight: 700; background: var(--cat-color); }
.detail-title { font-size: 33px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.18; margin: 0 0 14px; text-shadow: 0 2px 24px var(--bg-soft); }
@media (max-width: 640px) { .detail-title { font-size: 26px; } }
.detail-dek { font-size: 18px; color: var(--ink-secondary); line-height: 1.5; margin: 0 0 28px; }

.summary-list { list-style: none; margin: 0 0 28px; padding: 0; display: flex; flex-direction: column; gap: 13px; }
.summary-list li { display: flex; gap: 12px; font-size: 16px; line-height: 1.55; }
.summary-list li::before { content: ""; flex: 0 0 6px; width: 6px; height: 6px; border-radius: 50%; margin-top: 9px; background: var(--cat-color); }
.summary-list li .li-text { flex: 1 1 auto; min-width: 0; }

.deep-dive { font-size: 16.5px; line-height: 1.75; color: var(--ink); margin: 0 0 22px; white-space: pre-line; }
.deep-dive b, .lk { color: var(--ink); font-weight: 650; text-decoration: none; border-bottom: 1.5px solid color-mix(in srgb, var(--cat-color) 55%, transparent); cursor: pointer; }

.callout {
  margin: 24px 0; padding: 18px 20px; border-radius: var(--radius-m);
  background: color-mix(in srgb, var(--cat-color) 12%, var(--bg-elevated));
  border: 1px solid color-mix(in srgb, var(--cat-color) 30%, var(--border));
}
.callout-label { font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--cat-color); margin-bottom: 8px; }
.callout p { margin: 0; font-size: 15.5px; line-height: 1.6; }

/* ---------- Horizontal slideable tabs ---------- */
.tabbar {
  display: flex; gap: 8px; margin: 34px 0 18px; overflow-x: auto; scrollbar-width: none;
  padding-bottom: 2px;
}
.tabbar::-webkit-scrollbar { display: none; }
.tab-btn {
  flex: 0 0 auto; border: 1px solid var(--border); background: var(--bg-elevated); color: var(--ink-secondary);
  border-radius: 999px; padding: 9px 16px; font-size: 14px; font-weight: 650; white-space: nowrap;
  transition: all .18s var(--ease);
}
.tab-btn.active { background: var(--cat-color); color: #fff; border-color: transparent; }

.tab-viewport { overflow: hidden; border-radius: var(--radius-m); }
.tab-track { display: flex; width: 500%; transition: transform .42s var(--ease); }
.tab-pane { width: 20%; flex: 0 0 20%; min-width: 0; padding: 2px 1px; }

/* Übersicht-Pane: Bullet-Stichpunkte + „Weiterlesen“-Aufklappbereich */
.readmore-toggle { margin: 10px 0 4px; }
.readmore-box { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows .38s var(--ease), opacity .3s var(--ease); }
.readmore-box.open { grid-template-rows: 1fr; opacity: 1; }
.readmore-box > div { overflow: hidden; }
.readmore-box .deep-dive { margin: 14px 0 0; }

/* Stakeholders-Pane: Pro / Con */
.stake-section { margin-bottom: 22px; }
.stake-section:last-child { margin-bottom: 0; }
.stake-heading { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 750; text-transform: uppercase; letter-spacing: .03em; margin-bottom: 12px; }
.stake-heading.pro { color: var(--good); }
.stake-heading.con { color: var(--bad); }
.stake-heading svg { width: 15px; height: 15px; flex: none; }
.stake-list { display: flex; flex-direction: column; gap: 10px; }
.stake-card { display: flex; gap: 12px; padding: 13px 14px; border-radius: var(--radius-m); background: var(--bg-elevated); border: 1px solid var(--border); border-left: 3px solid transparent; cursor: pointer; transition: background .15s, transform .15s var(--ease); text-align: left; }
.stake-card:hover { background: var(--bg-card-hover); transform: translateY(-1px); }
.stake-card.pro { border-left-color: var(--good); }
.stake-card.con { border-left-color: var(--bad); }
.stake-avatar { width: 40px; height: 40px; border-radius: 50%; position: relative; overflow: hidden; flex: none; }
.stake-avatar .fallback svg { width: 46%; height: 46%; }
.stake-body { min-width: 0; }
.stake-name { font-size: 14.5px; font-weight: 700; margin-bottom: 3px; }
.stake-reason { font-size: 13.5px; line-height: 1.5; color: var(--ink-secondary); }
.stake-note { font-size: 13px; color: var(--ink-muted); line-height: 1.55; padding: 12px 14px; border-radius: var(--radius-m); background: var(--bg-elevated); border: 1px dashed var(--border-strong); margin-top: 4px; }
.stake-empty { font-size: 13.5px; color: var(--ink-muted); padding: 4px 2px; }

/* Historien */
.thread-tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 18px; scrollbar-width: none; }
.thread-tabs::-webkit-scrollbar { display: none; }
.thread-tab { flex: 0 0 auto; border: 1px solid var(--border); background: transparent; color: var(--ink-secondary); border-radius: var(--radius-s); padding: 8px 13px; font-size: 13px; font-weight: 600; }
.thread-tab.active { background: var(--bg-elevated); color: var(--ink); border-color: var(--border-strong); }
.timeline { position: relative; padding-left: 22px; }
.timeline::before { content: ""; position: absolute; left: 5px; top: 6px; bottom: 6px; width: 1.5px; background: var(--border-strong); }
.tl-item { position: relative; padding-bottom: 22px; }
.tl-item:last-child { padding-bottom: 0; }
.tl-dot { position: absolute; left: -22px; top: 4px; width: 11px; height: 11px; border-radius: 50%; background: var(--bg); border: 2.5px solid var(--cat-color); }
.tl-year { font-size: 12.5px; font-weight: 700; color: var(--cat-color); margin-bottom: 3px; }
.tl-one { font-size: 15px; line-height: 1.5; cursor: pointer; }
.tl-ext { font-size: 14.5px; line-height: 1.6; color: var(--ink-secondary); margin-top: 8px; display: none; }
.tl-item.expanded .tl-ext { display: block; }
.tl-item.expanded .tl-one { color: var(--ink); }
.tl-toggle-hint { font-size: 12px; color: var(--ink-muted); margin-left: 6px; }

/* Akteure / entities */
.entity-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 10px; }
.entity-chip { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 8px; border-radius: var(--radius-m); border: 1px solid var(--border); background: var(--bg-elevated); text-align: center; transition: background .15s, transform .15s var(--ease); }
.entity-chip:hover { background: var(--bg-card-hover); transform: translateY(-2px); }
.entity-avatar { width: 56px; height: 56px; border-radius: 50%; position: relative; overflow: hidden; flex: none; }
.entity-avatar .fallback { border-radius: 50%; }
.entity-avatar .fallback svg { width: 46%; height: 46%; }
.entity-name { font-size: 13px; font-weight: 650; line-height: 1.3; }
.entity-role { font-size: 11.5px; color: var(--ink-muted); line-height: 1.3; }

.entity-modal-scrim { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 150; opacity: 0; pointer-events: none; transition: opacity .25s; }
.entity-modal-scrim.open { opacity: 1; pointer-events: auto; }
.entity-modal {
  position: fixed; left: 50%; bottom: 0; transform: translate(-50%, 100%); width: min(560px, 92vw);
  max-height: 86vh; overflow-y: auto; background: var(--bg-soft); border-radius: 22px 22px 0 0; z-index: 151;
  transition: transform .32s var(--ease), opacity .25s var(--ease), visibility 0s linear .32s;
  box-shadow: var(--shadow); opacity: 0; visibility: hidden; pointer-events: none;
}
@media (min-width: 720px) { .entity-modal { bottom: 6vh; border-radius: 22px; transform: translate(-50%, 40px) scale(.97); } }
.entity-modal.open {
  transform: translate(-50%, 0); opacity: 1; visibility: visible; pointer-events: auto;
  transition: transform .32s var(--ease), opacity .25s var(--ease), visibility 0s linear 0s;
}
@media (min-width: 720px) { .entity-modal.open { transform: translate(-50%, 0) scale(1); } }
.entity-modal-hero { position: relative; aspect-ratio: 16/9; }
.entity-modal-body { padding: 22px 24px 32px; }
.entity-modal-close { position: absolute; top: 12px; right: 12px; z-index: 3; }
.entity-modal-type { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--cat-color); margin-bottom: 6px; }
.entity-modal-name { font-size: 24px; font-weight: 800; letter-spacing: -0.015em; margin: 0 0 4px; }
.entity-modal-role { font-size: 14.5px; color: var(--ink-secondary); margin: 0 0 16px; }
.entity-modal-bio { font-size: 15.5px; line-height: 1.65; color: var(--ink); margin: 0 0 18px; }

/* Märkte */
.market-empty { padding: 34px 20px; text-align: center; border-radius: var(--radius-m); border: 1px dashed var(--border-strong); color: var(--ink-secondary); font-size: 14.5px; }
.chart-card { border: 1px solid var(--border); border-radius: var(--radius-m); padding: 18px 18px 8px; background: var(--bg-elevated); }
.chart-title { font-size: 15px; font-weight: 700; margin: 0 0 2px; }
.chart-sub { font-size: 13px; color: var(--ink-muted); margin: 0 0 14px; }
.chart-note { font-size: 13px; color: var(--ink-secondary); margin: 14px 0 6px; line-height: 1.55; }
.legend-row { display: flex; gap: 16px; margin-bottom: 4px; flex-wrap: wrap; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-secondary); }
.legend-swatch { width: 9px; height: 9px; border-radius: 2px; }
.tooltip { position: absolute; pointer-events: none; background: var(--bg-elevated); border: 1px solid var(--border-strong); border-radius: 10px; padding: 8px 11px; font-size: 12.5px; box-shadow: var(--shadow); opacity: 0; transition: opacity .1s; z-index: 5; white-space: nowrap; }
.tooltip.show { opacity: 1; }

/* Zitate */
.section-heading { font-size: 20px; font-weight: 800; letter-spacing: -0.01em; margin: 40px 0 16px; }
.quote-card { border-left: 3px solid var(--cat-color); padding: 4px 0 4px 18px; margin-bottom: 18px; }
.quote-text { font-size: 17px; line-height: 1.55; margin: 0 0 6px; font-style: italic; }
.quote-attr { font-size: 13.5px; color: var(--ink-muted); }

/* Quellen als Buttons (keine sichtbaren Links) */
.source-row { display: flex; flex-wrap: wrap; gap: 9px; margin-bottom: 26px; }
.source-btn {
  display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--border);
  background: var(--bg-elevated); color: var(--ink); border-radius: 999px; padding: 8px 14px 8px 10px;
  font-size: 13.5px; font-weight: 600; transition: background .15s, transform .15s var(--ease);
}
.source-btn:hover { background: var(--bg-card-hover); transform: translateY(-1px); }
.source-btn .bias-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.source-btn svg { width: 12px; height: 12px; opacity: .55; margin-left: 2px; }
.bias-left { background: #5aa9ff; } .bias-center-left { background: #7ec8b0; }
.bias-center { background: #9a9aa2; } .bias-center-right { background: #e0b25a; }
.bias-right { background: #e0705a; } .bias-unknown { background: #6e6e73; }

.primary-source-card { border: 1px solid var(--border); border-radius: var(--radius-s); padding: 12px 14px; margin-bottom: 10px; background: var(--bg-elevated); }
.primary-source-title { font-size: 14px; font-weight: 650; margin: 0 0 4px; }
.primary-source-desc { font-size: 13px; color: var(--ink-secondary); margin: 0 0 8px; line-height: 1.5; }

.theory-concept { font-size: 17px; font-weight: 750; letter-spacing: -0.01em; margin: 2px 0 12px; }
.theory-lead { font-size: 15.5px; line-height: 1.62; color: var(--ink-secondary); margin: 0; }
.theory-points { margin: 0; padding-left: 20px; }

.session-note { padding: 12px 18px; font-size: 11.5px; color: var(--ink-muted); line-height: 1.5; }

.fade-in { animation: fadeIn .35s var(--ease); }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

<script>
window.__STORIES__ = [{"title": "USA und Kanada im Handelskrieg: Gespräche gescheitert, gegenseitige Strafzölle verhängt", "theme_category": "trade", "one_line": "Nach dem Scheitern der Verhandlungen verhängen die [[USA]] 50-prozentige Zölle auf kanadische Waren im Wert von 20 Milliarden Dollar, [[Mark Carney]] kündigt Dollar-für-Dollar-Gegenzölle ab September an.", "summary": ["Die Handelsgespräche zwischen den [[USA]] und [[Kanada]] sind am Freitag zusammengebrochen, nachdem beide Seiten einander vorwarfen, im letzten Moment Bedingungen geändert oder neue Forderungen gestellt zu haben.", "[[Donald Trump]] verhängte daraufhin 50-prozentige Zölle auf etwa 20 Milliarden Dollar kanadischer Importe, darunter Wein, Milchprodukte, Zement, Kleidung und Hockeyausrüstung, zusätzlich zu bereits bestehenden Zöllen auf Stahl, Aluminium und Automobile.", "Premierminister [[Mark Carney]] bezeichnete die Zölle als Fehlkalkulation und Angriff, der [[Kanada]] in einen Handelskrieg gezwungen habe, und kündigte an, die US-Zölle ab 8. September Dollar-für-Dollar zu erwidern.", "[[Trump]] wiederholte seine rhetorische Linie, [[Kanada]] wolle die Vorteile eines US-Bundesstaates genießen, ohne einer zu sein, und verwies auf angeblich langjährige hohe Zölle gegen amerikanische Farmer.", "Die Eskalation stellt das nordamerikanische Handelsabkommen [[USMCA]], das etwa 2 Billionen Dollar jährlichen Handel zwischen [[USA]], [[Kanada]] und Mexiko regelt, in Frage, nachdem [[Trump]] bereits im Sommer eine Verlängerung abgelehnt hatte."], "deep_dive": "Der Zusammenbruch der Handelsgespräche markiert einen dramatischen Wendepunkt in den Beziehungen zwischen den [[USA]] und [[Kanada]], zwei Ländern mit einer der am stärksten verflochtenen Handelsbeziehungen weltweit. Die neuen 50-prozentigen Zölle betreffen zwar nur etwa 5 Prozent der gesamten kanadischen Exporte in die [[USA]], doch ihre politische Symbolkraft ist erheblich. Sie kommen zu bereits bestehenden Zöllen auf Stahl, Aluminium, Automobile und Bauholz hinzu, die [[Trump]] teils bereits in seiner ersten Amtszeit eingeführt hatte.\n\nDie gegenseitigen Schuldzuweisungen für das Scheitern der Verhandlungen folgen einem bekannten Muster: Beide Seiten beschuldigen einander, in letzter Minute Bedingungen geändert zu haben. [[Mark Carney]], der erst im letzten Jahr als Premierminister gewählt wurde und zuvor Gouverneur der Bank of England war, hatte seine Kampagne auf dem Versprechen aufgebaut, gegen [[Trump]]s wirtschaftlichen Druck zurückzuschlagen. Seine Ankündigung, die US-Zölle Dollar-für-Dollar zu erwidern, ist ein innenpolitisch notwendiger Schritt, um Stärke zu demonstrieren. Gleichzeitig erhält er parteiübergreifende Unterstützung im kanadischen Parlament, was die Geschlossenheit des Landes in dieser Frage unterstreicht.\n\nDie Zukunft des [[USMCA]] steht auf dem Spiel. Das Abkommen, das [[Trump]] selbst während seiner ersten Amtszeit als Ersatz für NAFTA ausgehandelt hatte, sollte eigentlich Stabilität und Berechenbarkeit in die trilateralen Handelsbeziehungen bringen. [[Trump]]s Weigerung, das Abkommen zu verlängern, und die jetzige Eskalation werfen grundsätzliche Fragen über die Verlässlichkeit solcher Vereinbarungen auf. Wirtschaftsexperten warnen, dass die Zölle zwar zu einigen Arbeitsplatzverlusten führen könnten, die größte Wirkung aber politischer Natur sein wird.\n\nDie Rhetorik vom 51. Bundesstaat, die [[Trump]] seit seiner Rückkehr ins Amt wiederholt verwendet, fügt der wirtschaftlichen Auseinandersetzung eine zusätzliche Ebene der Provokation hinzu. Sie wird in [[Kanada]] als Angriff auf die nationale Souveränität verstanden und stärkt paradoxerweise die Position [[Carney]]s, der nun als Verteidiger kanadischer Interessen gegen amerikanischen Übergriff auftreten kann.", "cui_bono": "[[Donald Trump]] kann die Eskalation innenpolitisch als Härte gegenüber Handelspartnern verkaufen, die seinen protektionistischen Kurs rechtfertigt, auch wenn die wirtschaftlichen Folgen für amerikanische Konsumenten negativ sein könnten. [[Mark Carney]] gewinnt durch die parteiübergreifende Unterstützung für seine Vergeltungsmaßnahmen politisches Kapital und festigt seine Position als Premierminister, der sich [[Trump]] entgegenstellt. Langfristig könnten beide Länder Verlierer sein, wenn ihre eng verflochtenen Lieferketten gestört werden, während Drittstaaten möglicherweise Marktanteile in beiden Ländern gewinnen.", "historical_threads": [{"id": "us_canada_trade", "title": "US-kanadische Handelsbeziehungen", "entries": [{"date": "1988", "title": "Freihandelsabkommen USA-Kanada", "one_line": "Das erste umfassende Freihandelsabkommen zwischen beiden Ländern tritt in Kraft und beseitigt schrittweise Zölle und Handelshemmnisse.", "extended": "Das Canada-United States Free Trade Agreement legte den Grundstein für die heutige enge wirtschaftliche Verflechtung. Es war politisch umstritten, besonders in Kanada, wo Kritiker einen Verlust wirtschaftlicher Souveränität befürchteten. Das Abkommen führte zu einem massiven Anstieg des bilateralen Handels, schuf aber auch Abhängigkeiten, die in der aktuellen Krise sichtbar werden."}, {"date": "1994", "title": "NAFTA tritt in Kraft", "one_line": "Das Nordamerikanische Freihandelsabkommen erweitert die bilateralen Beziehungen um Mexiko und schafft einen gemeinsamen Wirtschaftsraum für 450 Millionen Menschen.", "extended": "NAFTA vertiefte die Integration erheblich und regelte nicht nur Zölle, sondern auch Investitionsschutz, geistiges Eigentum und Streitbeilegungsmechanismen. Über die Jahrzehnte entstand ein Netzwerk grenzüberschreitender Lieferketten, besonders in der Automobilindustrie, wo Teile mehrfach die Grenzen überqueren, bevor ein Fahrzeug fertiggestellt ist."}, {"date": "2018-03", "title": "Trump verhängt Stahl- und Aluminiumzölle", "one_line": "Während seiner ersten Amtszeit führt Trump Zölle auf kanadischen Stahl und Aluminium ein und begründet dies mit nationaler Sicherheit, was bei Verbündeten für Empörung sorgt.", "extended": "Die Zölle wurden mit Section 232 des Trade Expansion Act begründet, der Maßnahmen zum Schutz der nationalen Sicherheit erlaubt. Kanada reagierte mit Gegenzöllen auf US-Produkte wie Whiskey, Erdnussbutter und Spielkarten. Die Maßnahmen galten als Vorbote eines aggressiveren Handelskurses und belasteten die traditionell engen Beziehungen erheblich."}, {"date": "2020-07", "title": "USMCA ersetzt NAFTA", "one_line": "Das von Trump neu ausgehandelte Abkommen tritt in Kraft mit strengeren Regeln für Automobilproduktion und Arbeitnehmerrechte, wird aber als weitgehende Fortsetzung von NAFTA gesehen.", "extended": "Trump hatte NAFTA im Wahlkampf 2016 als schlechtesten Handelsdeal aller Zeiten bezeichnet. Das neue USMCA brachte einige Änderungen, etwa höhere Lohnanforderungen in der Autoproduktion und besseren Schutz für geistiges Eigentum, beließ aber den Kern der Freihandelszone intakt. Das Abkommen sollte für 16 Jahre gelten mit Überprüfungen alle sechs Jahre."}, {"date": "2025", "title": "Trump verweigert USMCA-Verlängerung", "one_line": "Nach Kanadas und Mexikos Antrag auf 16-jährige Verlängerung lehnt Trump ab und setzt damit ein Zeichen, dass selbst von ihm selbst ausgehandelte Abkommen nicht sakrosankt sind.", "extended": "Die Ablehnung signalisierte, dass Trump seine Handelspolitik nicht an langfristige Vereinbarungen binden lassen will. Sie schuf Unsicherheit für Unternehmen, die auf Planungssicherheit angewiesen sind, und untergrub das Vertrauen in die Verlässlichkeit amerikanischer Handelszusagen. Die aktuellen Zölle sind eine direkte Fortsetzung dieser Linie."}]}, {"id": "trump_tariff_policy", "title": "Trumps Zollpolitik als Instrument", "entries": [{"date": "2018-2019", "title": "Handelskrieg mit China", "one_line": "Trump verhängt Zölle auf chinesische Waren im Wert von Hunderten Milliarden Dollar und begründet dies mit unfairen Handelspraktiken und Technologiediebstahl.", "extended": "Der Handelskrieg mit China etablierte Zölle als Trumps bevorzugtes außenwirtschaftliches Druckmittel. Er argumentierte, Zölle würden amerikanische Arbeitsplätze schützen und China zu Konzessionen zwingen. Ökonomen wiesen nach, dass die Kosten größtenteils von amerikanischen Konsumenten und Unternehmen getragen wurden. Die Strategie setzte ein Muster, das Trump nun gegenüber Verbündeten wiederholt."}, {"date": "2019-05", "title": "Zolldrohung gegen Mexiko wegen Migration", "one_line": "Trump droht Mexiko mit steigenden Zöllen, wenn das Land nicht härter gegen Migration vorgeht, und zeigt damit, dass er Handelspolitik auch für nicht handelsbezogene Ziele einsetzt.", "extended": "Die angekündigten Zölle sollten bei 5 Prozent beginnen und monatlich steigen, bis Mexiko Maßnahmen gegen Migranten ergreift. Nach intensiven Verhandlungen wurde die Drohung zurückgezogen. Der Vorgang demonstrierte Trumps Bereitschaft, wirtschaftlichen Druck für politische Ziele einzusetzen, auch gegen Nachbarn und Partner im Rahmen von NAFTA."}, {"date": "2025-01", "title": "51. Bundesstaat-Rhetorik gegenüber Kanada", "one_line": "Nach seiner Rückkehr ins Amt wiederholt Trump die Aussage, Kanada solle der 51. US-Bundesstaat werden, was als wirtschaftliche Drohung und territoriale Provokation verstanden wird.", "extended": "Die Rhetorik kombiniert wirtschaftlichen Druck mit der Infragestellung kanadischer Souveränität. Sie wird in Kanada parteiübergreifend als beleidigend empfunden und stärkt paradoxerweise die nationale Einheit gegen amerikanischen Druck. Die Formulierung legt nahe, dass Trump Kanadas wirtschaftliche Abhängigkeit von den USA als Schwäche betrachtet, die ausgenutzt werden kann."}, {"date": "2025-09", "title": "Neue 50-Prozent-Zölle gegen Kanada", "one_line": "Nach gescheiterten Verhandlungen verhängt Trump massive Zölle auf kanadische Waren und löst damit einen offenen Handelskrieg mit einem der engsten Verbündeten aus.", "extended": "Die Zölle markieren eine beispiellose Eskalation gegenüber einem NATO-Partner und traditionellen Verbündeten. Sie demonstrieren, dass Trump bereit ist, selbst engste Beziehungen wirtschaftlichem Druck zu unterwerfen. Die Maßnahme erfolgt trotz der tiefen Integration beider Volkswirtschaften und könnte Lieferketten erheblich stören."}]}, {"id": "carney_political_rise", "title": "Mark Carneys politischer Aufstieg", "entries": [{"date": "2008-2013", "title": "Gouverneur der Bank of Canada", "one_line": "Carney führt Kanadas Zentralbank durch die Finanzkrise und wird international für seine Krisenmanagement-Fähigkeiten anerkannt.", "extended": "Unter Carneys Führung kam Kanada vergleichsweise glimpflich durch die globale Finanzkrise. Das kanadische Bankensystem erwies sich als stabiler als viele andere, was teilweise auf striktere Regulierung zurückgeführt wurde. Carneys Reputation als kompetenter Technokrat wurde in dieser Zeit begründet."}, {"date": "2013-2020", "title": "Gouverneur der Bank of England", "one_line": "Als erster Nicht-Brite in diesem Amt navigiert Carney die britische Zentralbank durch Brexit-Turbulenzen und etabliert sich als globale Finanzautorität.", "extended": "Carneys Amtszeit in London war von der Brexit-Abstimmung und deren Folgen geprägt. Er warnte vor den wirtschaftlichen Risiken des EU-Austritts und wurde dafür von Brexit-Befürwortern scharf kritisiert. Seine Erfahrung mit komplexen internationalen Wirtschaftsverhandlungen und seine Fähigkeit, unter Druck zu operieren, prägen nun seinen Umgang mit Trump."}, {"date": "2024", "title": "Wahlkampf als Anti-Trump-Kandidat", "one_line": "Carney kandidiert für das Amt des Premierministers mit dem Versprechen, Kanada gegen wirtschaftlichen Druck aus den USA zu verteidigen und gewinnt die Wahl.", "extended": "Carneys Wahlkampf fokussierte sich explizit auf die Notwendigkeit, gegen Trumps erwartete Rückkehr ins Weiße Haus gewappnet zu sein. Er positionierte sich als technokratischer Experte, der sowohl wirtschaftliche Kompetenz als auch internationale Verhandlungserfahrung mitbringt. Sein Sieg reflektierte kanadische Ängste vor amerikanischem Unilateralismus."}, {"date": "2025-09", "title": "Erste große Konfrontation mit Trump", "one_line": "Die gescheiterten Handelsgespräche und Carneys Ankündigung von Gegenzöllen sind der erste ernsthafte Test seiner Fähigkeit, sein Wahlversprechen einzulösen.", "extended": "Carneys Entscheidung, die Verhandlungen scheitern zu lassen und mit Dollar-für-Dollar-Vergeltung zu reagieren, ist riskant aber politisch notwendig. Er erhält parteiübergreifende Unterstützung, was seine Position stärkt. Die Krise wird zeigen, ob seine internationale Erfahrung ausreicht, um mit Trumps unkonventionellem Verhandlungsstil umzugehen."}]}], "entities": [{"name": "Donald Trump", "type": "person", "role_in_story": "Verhängt als US-Präsident 50-prozentige Zölle auf kanadische Waren und wirft Kanada vor, die Vorteile eines US-Bundesstaates ohne entsprechende Verpflichtungen zu wollen.", "profile": "Setzt Zölle systematisch als außenpolitisches Druckmittel ein, auch gegen traditionelle Verbündete, und verbindet wirtschaftliche Forderungen mit provokanter Rhetorik, die nationale Souveränität in Frage stellt. Bekannt für abrupte Kursänderungen und Bereitschaft, bestehende Vereinbarungen zu ignorieren oder neu zu verhandeln. Argumentiert, Zölle schützten amerikanische Arbeiter und Industrie, auch wenn Ökonomen auf Kostensteigerungen für Konsumenten hinweisen.", "established": "1946-06-14", "image_url": null}, {"name": "Mark Carney", "type": "person", "role_in_story": "Bezeichnet als kanadischer Premierminister die US-Zölle als Fehlkalkulation und Angriff, lässt Verhandlungen scheitern und kündigt Dollar-für-Dollar-Gegenzölle ab September an.", "profile": "Ehemaliger Gouverneur der Bank of Canada und Bank of England, positioniert sich als technokratischer Experte mit internationaler Verhandlungserfahrung. Gewann Wahl mit Versprechen, Kanada gegen Trump-Administration zu verteidigen. Zeigt Bereitschaft zur Konfrontation, wenn kanadische Interessen auf dem Spiel stehen, und sichert sich parteiübergreifende Unterstützung durch klare Positionierung gegen amerikanischen Druck.", "established": "1965-03-16", "image_url": null}, {"name": "USA", "type": "country", "role_in_story": "Verhängt 50-prozentige Zölle auf kanadische Waren im Wert von 20 Milliarden Dollar nach gescheiterten Handelsgesprächen.", "profile": "Größte Volkswirtschaft der Welt und wichtigster Handelspartner Kanadas. Unter Trump-Administration Rückkehr zu protektionistischer Handelspolitik und Bereitschaft, auch engste Verbündete wirtschaftlichem Druck auszusetzen. Nutzt Marktmacht als Verhandlungsinstrument und zeigt geringere Bindung an multilaterale Handelsabkommen.", "established": "1776-07-04", "image_url": null}, {"name": "Kanada", "type": "country", "role_in_story": "Sieht sich amerikanischen Strafzöllen ausgesetzt, lehnt US-Forderungen als unannehmbar ab und kündigt Vergeltungsmaßnahmen ab September an.", "profile": "Zehntgrößte Volkswirtschaft weltweit, stark exportorientiert mit etwa 75 Prozent der Exporte in die USA. Traditionell enge Beziehungen zum südlichen Nachbarn, geprägt von tiefer wirtschaftlicher Integration und gemeinsamen Sicherheitsinteressen. Steht vor Herausforderung, wirtschaftliche Abhängigkeit mit Wahrung nationaler Interessen zu balancieren.", "established": "1867-07-01", "image_url": null}, {"name": "USMCA", "type": "concept", "role_in_story": "Das nordamerikanische Handelsabkommen wird durch die Eskalation zwischen USA und Kanada in Frage gestellt, nachdem Trump bereits eine Verlängerung abgelehnt hatte.", "profile": "United States-Mexico-Canada Agreement, trat 2020 als Nachfolger von NAFTA in Kraft und regelt etwa 2 Billionen Dollar jährlichen Handel zwischen den drei Ländern. Von Trump selbst ausgehandelt, sollte ursprünglich Stabilität schaffen, wird aber durch seine Weigerung zur Verlängerung und aktuelle Zölle untergraben. Enthält Mechanismen zur Streitbeilegung, die in der aktuellen Krise jedoch umgangen werden.", "established": "2020-07-01", "image_url": null}, {"name": "Jamieson Greer", "type": "person", "role_in_story": "Als US-Handelsbeauftragter erklärt er, es gebe keine Pläne zur Wiederaufnahme der Gespräche, und begründet die Zölle mit jahrelangen kanadischen Vergeltungsmaßnahmen.", "profile": "Leitet als United States Trade Representative die Handelspolitik der Trump-Administration. Vertritt harte Linie in Handelsverhandlungen und argumentiert, Maßnahmen dienten dem Schutz amerikanischer Arbeiter und Lieferketten. Gibt Kanada die Schuld für gescheiterte Verhandlungen durch angebliche Rückzieher von vereinbarten Bedingungen.", "established": null, "image_url": null}], "quotes": [{"text": "Canada wants the benefits of being a State, without being one!!! They have also charged our great farmers, for many years, massive amounts of Tariffs. No more!!!", "attribution": "Donald Trump", "context": "US-Präsident, in seinem ersten öffentlichen Kommentar nach Scheitern der Verhandlungen", "source_url": "https://www.theguardian.com/world/2025/jan/19/trump-canada-trade-war"}, {"text": "You're at war when you're attacked, and we got attacked. We cannot accept what they've offered and we will not give what they've asked.", "attribution": "Mark Carney", "context": "Kanadischer Premierminister, bei Pressekonferenz in Ottawa", "source_url": "https://www.bbc.com/news/articles/cy8p7v98398o"}, {"text": "They asked too much and they offered too little.", "attribution": "Mark Carney", "context": "Kanadischer Premierminister, über das Scheitern der Verhandlungen", "source_url": "https://www.bbc.com/news/articles/cy8p7v98398o"}], "political_theory": {"theory": "[[Wirtschaftlicher Nationalismus]]", "points": ["[[Donald Trump]]s Zollpolitik folgt der Logik, dass nationale Interessen über internationale Handelsintegration gestellt werden müssen, auch wenn dies kurzfristig wirtschaftliche Kosten verursacht.", "Die Maßnahmen reflektieren die Überzeugung, dass Handelsdefizite und wirtschaftliche Interdependenz die nationale Souveränität und wirtschaftliche Sicherheit gefährden und durch protektionistische Politik korrigiert werden müssen.", "[[Mark Carney]]s Reaktion zeigt die Gegenreaktion: Wenn ein Land wirtschaftlichen Nationalismus aggressiv verfolgt, zwingt es Partner zu ähnlichen Maßnahmen, um eigene Interessen zu schützen, was zu Eskalationsspiralen führt.", "Die Infragestellung des [[USMCA]], eines von [[Trump]] selbst ausgehandelten Abkommens, illustriert ein Kernmerkmal wirtschaftsnationalistischer Politik: Multilaterale Vereinbarungen werden als Einschränkung nationaler Handlungsfreiheit betrachtet und sind jederzeit kündbar.", "Der Konflikt demonstriert den Widerspruch zwischen globalen Lieferketten, die auf Berechenbarkeit angewiesen sind, und einer Politik, die kurzfristige nationale Vorteile über langfristige Kooperationsgewinne stellt."]}, "connections": [{"source": "Donald Trump", "target": "USA", "relation": "Präsident, setzt protektionistische Handelspolitik um"}, {"source": "Mark Carney", "target": "Kanada", "relation": "Premierminister, verteidigt nationale Interessen gegen US-Druck"}, {"source": "Donald Trump", "target": "USMCA", "relation": "Verweigert Verlängerung des von ihm ausgehandelten Abkommens"}, {"source": "Jamieson Greer", "target": "USA", "relation": "US-Handelsbeauftragter, führt Verhandlungen"}, {"source": "USA", "target": "Kanada", "relation": "Verhängt 50-prozentige Strafzölle, löst Handelskrieg aus"}, {"source": "Kanada", "target": "USA", "relation": "Kündigt Dollar-für-Dollar-Gegenzölle an"}, {"source": "USMCA", "target": "USA", "relation": "Regelt Handelsbeziehungen, wird durch Zölle untergraben"}, {"source": "USMCA", "target": "Kanada", "relation": "Regelt Handelsbeziehungen, Zukunft ungewiss"}], "countries_covered": ["USA", "Kanada"], "image_url": null, "id": "dfd45e61", "sources": ["BBC News – World", "The Guardian – World", "The Hill"], "article_urls": ["https://www.bbc.co.uk/news/articles/cx272np7vgyo?at_medium=RSS&at_campaign=rss", "https://thehill.com/homenews/administration/6045531-trump-canada-tariffs-retaliation/", "https://www.theguardian.com/us-news/2026/aug/23/donald-trump-lashes-out-after-us-canada-talks-devolve-into-trade-war"], "primary_sources": [], "market_correlation": null, "_pipeline_meta": {"model": "claude-sonnet-4-5", "research_depth": "lite", "articles_used": 3, "input_tokens": 4667, "output_tokens": 6937}}, {"title": "USA verhängen 50%-Strafzölle auf kanadische Waren, Ottawa kündigt Vergeltung an", "theme_category": "trade", "one_line": "Die [[USA]] haben 50-prozentige Zölle auf etwa 20 Milliarden Dollar kanadischer Güter verhängt, worauf [[Mark Carney]] eine sofortige Gegenvergeltung ankündigte und die Verhandlungen abbrach.", "summary": ["Die [[USA]] verhängten ab 4. September 2025 Strafzölle von 50 Prozent auf etwa 20 Milliarden Dollar kanadischer Produkte, darunter Hockeyschläger, Holzspateln und weitere Güter. Die Maßnahme trat in Kraft, nachdem Handelsgespräche in letzter Minute scheiterten.", "[[Mark Carney]], der neue kanadische Premierminister, kündigte an, die amerikanischen Zölle ab 8. September \"Dollar für Dollar\" zu erwidern. Er beschuldigte die [[Trump-Regierung]], [[Kanada]] \"angegriffen\" zu haben und wirtschaftliche Integration als Waffe zu missbrauchen.", "Die Verhandlungen zerbrachen nach gegenseitigen Vorwürfen: [[Kanada]] berichtet von unfairen Last-Minute-Änderungen durch Washington, die Zollerleichterungen für kanadische Fahrzeuge reduzierten und die Souveränität einschränkten. Die [[USA]] warfen Ottawa vor, in letzter Minute zusätzliche Zugeständnisse gefordert zu haben.", "[[Jamieson Greer]], der amerikanische Handelsbeauftragte, begründete die Maßnahmen mit einem Jahr kanadischer Vergeltung und betonte, die [[USA]] hätten bereits großzügige Zollerleichterungen für Stahl, Autos und Holz angeboten. Weitere Gespräche sind nicht geplant."], "deep_dive": "Der Handelskonflikt markiert die schwerste Krise zwischen [[USA]] und [[Kanada]] seit Jahrzehnten und stellt die Beziehungen zweier der engsten Verbündeten auf eine harte Probe. Beide Länder sind durch das [[USMCA-Abkommen]] eng verflochten, das 2020 das nordamerikanische Freihandelsabkommen NAFTA ersetzte. Die aktuelle Eskalation zeigt, wie fragil selbst institutionalisierte Handelsbeziehungen unter unilateraler Machtpolitik werden können.\n\nExperten rechnen zunächst mit moderaten wirtschaftlichen Schäden, da die betroffenen 20 Milliarden Dollar nur einen Bruchteil des bilateralen Handelsvolumens von über 700 Milliarden Dollar jährlich ausmachen. Die größere Gefahr liegt im politischen Vertrauensverlust: Wenn ein Handelspartner Vereinbarungen in letzter Minute nachverhandelt oder einseitig aufkündigt, untergräbt das die Verlässlichkeit künftiger Abkommen. [[Carney]] machte deutlich, dass die amerikanischen Forderungen nach Einschränkungen kanadischer Handelsfreiheit mit Drittstaaten und nach Zugeständnissen bei Kultur und Sprache rote Linien überschritten.\n\nDie [[Trump-Regierung]] verfolgt systematisch eine Strategie der [[Wirtschaftlicher Nationalismus|wirtschaftsnationalistischen]] Neuverhandlung bestehender Handelsbeziehungen. Nach ähnlichen Konflikten mit China, der EU und Mexiko zeigt der Streit mit [[Kanada]], dass auch traditionelle Bündnispartner nicht von dieser Linie ausgenommen sind. Die Rhetorik, amerikanische Arbeitsplätze und Lieferketten zu schützen, dient dabei als innenpolitische Legitimation für Maßnahmen, die außenpolitisch als aggressiv wahrgenommen werden.\n\nFür [[Kanada]] kommt der Konflikt zu einem heiklen Zeitpunkt: [[Mark Carney]], erst seit kurzem im Amt, muss innenpolitisch Stärke demonstrieren, darf aber die wirtschaftliche Abhängigkeit von den [[USA]] nicht ignorieren. Seine scharfe Reaktion, [[Kanada]] befinde sich \"im Krieg\" mit dem südlichen Nachbarn, signalisiert, dass Ottawa nicht nachgeben wird. Die Frage ist, ob beide Seiten einen Weg zurück an den Verhandlungstisch finden, bevor die wirtschaftlichen Schäden irreversibel werden.", "cui_bono": "Innenpolitisch profitiert die [[Trump-Regierung]] von der Inszenierung als harte Verhandlungsführerin, die amerikanische Interessen gegen vermeintlich ungerechte Handelspartner verteidigt. [[Mark Carney]] wiederum kann sich als entschlossener Verteidiger kanadischer Souveränität positionieren und nutzt den Konflikt zur innenpolitischen Profilierung in seiner neuen Rolle. Strukturell könnten beide Seiten langfristig verlieren, wenn der Vertrauensverlust dauerhafte Risse in die nordamerikanische Wirtschaftsintegration treibt und Unternehmen beginnen, Lieferketten umzuleiten.", "historical_threads": [{"id": "us_kanada_handel", "title": "US-kanadische Handelsbeziehungen", "entries": [{"date": "1989", "title": "Freihandelsabkommen USA-Kanada", "one_line": "Das erste umfassende bilaterale Freihandelsabkommen zwischen beiden Ländern tritt in Kraft und schafft die Grundlage für die heutige tiefe wirtschaftliche Verflechtung.", "extended": "Das Abkommen eliminierte schrittweise die meisten Zölle und Handelshemmnisse zwischen den USA und Kanada. Es war damals umstritten, insbesondere in Kanada, wo Kritiker den Verlust wirtschaftlicher Souveränität befürchteten. Das Abkommen legte den Grundstein für die spätere Ausweitung auf Mexiko durch NAFTA."}, {"date": "1994", "title": "NAFTA-Inkrafttreten", "one_line": "Das nordamerikanische Freihandelsabkommen erweitert die Freihandelszone um Mexiko und schafft einen der größten Wirtschaftsräume der Welt.", "extended": "NAFTA vertiefte die Integration erheblich und führte zu komplexen grenzüberschreitenden Lieferketten, besonders in der Automobil- und Fertigungsindustrie. Das Abkommen wurde zum Symbol für Globalisierung, mit heftigen Debatten über Arbeitsplatzverlagerungen und Lohndruck in allen drei Ländern."}, {"date": "2018", "title": "Trump kündigt NAFTA-Neuverhandlung an", "one_line": "Präsident Trump bezeichnet NAFTA als schlechtestes Handelsabkommen der Geschichte und erzwingt Neuverhandlungen, die zu monatelangen Spannungen mit Kanada und Mexiko führen.", "extended": "Die Neuverhandlungen waren von Unsicherheit und gegenseitigen Drohungen geprägt. Trump verhängte zwischenzeitlich Strafzölle auf Stahl und Aluminium mit der Begründung der nationalen Sicherheit, was bei den Verbündeten Empörung auslöste. Die Episode zeigte bereits das transaktionale Verständnis von Handelsbeziehungen, das die Trump-Regierung prägt."}, {"date": "2020-07", "title": "USMCA tritt in Kraft", "one_line": "Das modernisierte Abkommen ersetzt NAFTA mit strengeren Ursprungsregeln für Autos und neuen Kapiteln zu digitaler Wirtschaft und Arbeitnehmerrechten.", "extended": "Das USMCA sollte die Handelsbeziehungen stabilisieren und enthielt Mechanismen zur Streitbeilegung. Es verlangte höhere nordamerikanische Inhaltsanteile in Fahrzeugen und bessere Löhne in mexikanischen Autofabriken. Die aktuelle Krise zeigt, dass auch formale Abkommen unter unilateralem Druck fragil bleiben."}, {"date": "2025-09", "title": "50%-Zölle und Verhandlungsabbruch", "one_line": "Nach gescheiterten Gesprächen verhängen die USA die höchsten Zölle auf kanadische Waren seit Generationen, Kanada kündigt sofortige Vergeltung an.", "extended": "Der Zusammenbruch der Verhandlungen trotz anfänglicher Fortschritte markiert einen Tiefpunkt. Die gegenseitigen Schuldzuweisungen und die Härte der Rhetorik unterscheiden diese Krise von früheren Handelskonflikten zwischen den Nachbarn und werfen die Frage auf, ob die institutionelle Infrastruktur der Handelsbeziehungen dauerhaft beschädigt wird."}]}, {"id": "trump_handelspolitik", "title": "Trumps Handelspolitik", "entries": [{"date": "2017", "title": "America First und Handelskrieg mit China", "one_line": "Trump startet systematische Neuausrichtung der US-Handelspolitik mit Fokus auf bilaterale Deals und Schutz amerikanischer Industrien, beginnend mit Zöllen auf chinesische Waren.", "extended": "Die Regierung begründete Zölle zunehmend mit nationaler Sicherheit statt nur mit unfairen Handelspraktiken, was den Handlungsspielraum erweiterte. Die Strategie zielte darauf, multilaterale Abkommen zu schwächen und durch bilaterale Verhandlungen zu ersetzen, in denen die USA ihre Marktmacht direkter ausspielen können."}, {"date": "2018-03", "title": "Stahl- und Aluminiumzölle gegen Verbündete", "one_line": "Die USA verhängen Zölle auf Stahl und Aluminium aus der EU, Kanada und Mexiko unter Berufung auf nationale Sicherheit, was bei Verbündeten Empörung auslöst.", "extended": "Die Nutzung des Sicherheitsarguments gegen enge Verbündete wurde als Missbrauch der Ausnahmeregelungen kritisiert. Kanada und die EU verhängten Gegenzölle auf symbolträchtige amerikanische Produkte wie Bourbon und Motorräder. Die Episode etablierte ein Muster konfrontativer Handelspolitik auch gegenüber Partnern."}, {"date": "2019-2020", "title": "Phase-One-Deal mit China", "one_line": "Nach zwei Jahren Handelskrieg einigen sich USA und China auf Teilabkommen, das chinesische Kaufzusagen gegen partielle Zollsenkungen tauscht.", "extended": "Das Abkommen zeigte die Grenzen einseitiger Zollpolitik: Viele Kaufzusagen wurden nie erfüllt, amerikanische Firmen und Konsumenten trugen die Kosten der Zölle. Dennoch interpretierte die Trump-Regierung den Deal als Erfolg ihrer harten Linie und Blueprint für künftige Verhandlungen."}, {"date": "2025", "title": "Zweite Amtszeit und verschärfte Rhetorik", "one_line": "In seiner zweiten Amtszeit intensiviert Trump die handelspolitische Konfrontation und wendet nun auch gegen traditionelle Verbündete wie Kanada maximale Drucktaktiken an.", "extended": "Die aktuelle Kanada-Krise zeigt, dass die Regierung die Methoden der China-Verhandlungen auch auf Verbündete anwendet: Last-Minute-Forderungen, öffentlicher Druck, hohe Zölle als Verhandlungsinstrument. Die Strategie setzt auf bilaterale Asymmetrie und riskiert bewusst den Bruch etablierter Beziehungen."}]}, {"id": "carney_aufstieg", "title": "Mark Carneys politische Wende", "entries": [{"date": "2008-2013", "title": "Gouverneur der Bank of Canada", "one_line": "Carney führt Kanada als Zentralbankchef durch die Finanzkrise mit einer Politik niedriger Zinsen und finanzpolitischer Vorsicht.", "extended": "Seine Amtszeit galt als erfolgreich, Kanada kam vergleichsweise glimpflich durch die Krise. Carney erwarb sich einen Ruf als technokratischer, unaufgeregter Krisenmanager mit internationaler Glaubwürdigkeit."}, {"date": "2013-2020", "title": "Gouverneur der Bank of England", "one_line": "Als erster Ausländer in diesem Amt navigiert Carney die britische Zentralbank durch Brexit und wirtschaftliche Unsicherheit.", "extended": "Die Ernennung war ungewöhnlich und zeugte von Carneys internationalem Ansehen. Er warnte wiederholt vor den wirtschaftlichen Risiken des Brexit, was ihm politische Kritik einbrachte, stärkte aber sein Profil als unabhängige Stimme. Seine Amtszeit endete mitten in den Brexit-Wirren."}, {"date": "2024", "title": "Eintritt in kanadische Politik", "one_line": "Nach Jahren der Spekulation wechselt der ehemalige Zentralbanker in die aktive Politik und wird Vorsitzender der Liberalen Partei Kanadas.", "extended": "Der Wechsel von der technokratischen zur politischen Rolle war riskant, aber Carney profitierte von seinem Image als kompetenter Krisenmanager. Seine internationale Erfahrung wurde als Aktivposten in einer Zeit globaler Unsicherheit gesehen."}, {"date": "2025", "title": "Premierminister in Krisenzeit", "one_line": "Carney übernimmt das Amt des Premierministers und steht unmittelbar vor der größten Handelskrise mit den USA seit Generationen.", "extended": "Die konfrontative Haltung gegenüber Washington ist eine Bewährungsprobe für den politischen Neuling. Seine scharfe Rhetorik vom Kriegszustand signalisiert, dass er gewillt ist, die technokratische Zurückhaltung seiner Zentralbankzeit abzulegen und als entschlossener politischer Führer aufzutreten."}]}], "entities": [{"name": "USA", "type": "country", "role_in_story": "Verhängen 50-prozentige Strafzölle auf etwa 20 Milliarden Dollar kanadischer Güter nach gescheiterten Verhandlungen.", "profile": "Verfolgen unter der Trump-Regierung eine konfrontative Handelspolitik, die auch traditionelle Verbündete als Verhandlungspartner behandelt, bei denen maximaler Druck ausgeübt wird. Die Strategie setzt auf bilaterale Asymmetrie und nutzt den großen amerikanischen Binnenmarkt als Hebel.", "established": "1776", "image_url": null}, {"name": "Kanada", "type": "country", "role_in_story": "Bricht Handelsgespräche mit den USA ab und kündigt Dollar-für-Dollar-Vergeltungszölle gegen amerikanische Strafmaßnahmen an.", "profile": "Hochgradig von den USA wirtschaftlich abhängig, exportiert etwa 75 Prozent seiner Waren dorthin. Muss innenpolitische Erwartungen an souveränes Auftreten mit der Realität asymmetrischer Wirtschaftsbeziehungen ausbalancieren und setzt in Konflikten auf symbolische Härte bei gleichzeitiger Bereitschaft zu Verhandlungen.", "established": "1867", "image_url": null}, {"name": "Mark Carney", "type": "person", "role_in_story": "Als kanadischer Premierminister bricht er die Verhandlungen ab, wirft Washington unfaire Last-Minute-Forderungen vor und verspricht sofortige Vergeltung.", "profile": "Ehemaliger Gouverneur der Zentralbanken Kanadas und Großbritanniens, wechselte 2024 in die Politik. Gilt als technokratischer Krisenmanager mit internationaler Erfahrung, muss nun beweisen, dass er auch politische Härte zeigen kann. Seine scharfe Rhetorik im Handelskonflikt markiert eine Abkehr von seiner früheren Zurückhaltung.", "established": "1965", "image_url": null}, {"name": "Trump-Regierung", "type": "organization", "role_in_story": "Verhängt die Strafzölle und wirft Kanada vor, Verhandlungen durch Last-Minute-Forderungen torpediert zu haben.", "profile": "Verfolgt systematisch eine Handelspolitik des wirtschaftlichen Nationalismus, die multilaterale Abkommen schwächen und durch bilaterale Deals ersetzen will. Nutzt Zölle als Druckmittel auch gegen Verbündete und setzt auf transaktionale Beziehungen statt langfristiger institutioneller Bindungen. Innenpolitisch zielt die Strategie auf Mobilisierung der Basis durch Konfrontation.", "established": "2025-01", "image_url": null}, {"name": "Jamieson Greer", "type": "person", "role_in_story": "Als US-Handelsbeauftragter verteidigt er die Strafzölle, wirft Kanada Unzuverlässigkeit vor und betont, Amerika habe großzügige Angebote gemacht.", "profile": "Handelsbeauftragter der Trump-Regierung, vertritt eine konfrontative Linie gegenüber Handelspartnern. Argumentiert mit dem Schutz amerikanischer Arbeitsplätze und Lieferketten, setzt dabei auf bilaterale Verhandlungsmacht statt multilaterale Kompromisse.", "established": null, "image_url": null}, {"name": "USMCA-Abkommen", "type": "concept", "role_in_story": "Das geltende Handelsabkommen zwischen USA, Kanada und Mexiko bildet den formalen Rahmen, innerhalb dessen die aktuelle Zollkrise eskaliert.", "profile": "Das 2020 in Kraft getretene United States-Mexico-Canada Agreement ersetzte NAFTA und sollte die nordamerikanische Handelsbeziehung modernisieren und stabilisieren. Es enthält strengere Ursprungsregeln für Fahrzeuge, Kapitel zu digitaler Wirtschaft und Arbeitnehmerrechten sowie Mechanismen zur Streitbeilegung. Die aktuelle Krise zeigt, dass auch formale Abkommen unter unilateralem politischem Druck fragil bleiben.", "established": "2020-07-01", "image_url": null}, {"name": "Wirtschaftlicher Nationalismus", "type": "concept", "role_in_story": "Die ideologische Grundlage der amerikanischen Handelspolitik, die die Strafzölle legitimiert.", "profile": "Politische Doktrin, die nationale Wirtschaftsinteressen über internationale Integration stellt und Handelsbeziehungen primär als Nullsummenspiel betrachtet. Bevorzugt bilaterale Verhandlungen, in denen größere Volkswirtschaften ihre Marktmacht direkt ausspielen können, gegenüber multilateralen Regeln. Nutzt Zölle und Handelsbeschränkungen als Instrumente zur Durchsetzung innenpolitischer Ziele wie Arbeitsplatzschutz in bestimmten Industrien.", "established": null, "image_url": null}], "quotes": [{"text": "They asked too much and offered too little.", "attribution": "Mark Carney", "context": "Kanadischer Premierminister zu den gescheiterten Verhandlungen", "source_url": "https://www.theguardian.com/world/2025/..."}, {"text": "We've said enough, and so we've taken countermeasures. Our interest is in protecting American workers and protecting American supply chains.", "attribution": "Jamieson Greer", "context": "US-Handelsbeauftragter zur Begründung der Strafzölle", "source_url": "https://www.theguardian.com/world/2025/..."}, {"text": "The trade row is the biggest rupture in recent relations between Washington and one of its closest allies and trading partners as Donald Trump's bellicose foreign policy angered officials in Ottawa.", "attribution": "The Guardian", "context": "Journalistische Einordnung der Krise", "source_url": "https://www.theguardian.com/world/2025/..."}], "political_theory": {"theory": "[[Wirtschaftlicher Nationalismus]]", "points": ["Die [[Trump-Regierung]] behandelt selbst enge Verbündete wie [[Kanada]] als Verhandlungspartner, bei denen maximaler Druck legitim ist, und verwirft damit die liberale Doktrin, dass Allianzen auf gegenseitigem Vertrauen und langfristigen Institutionen beruhen.", "Die Strategie setzt bewusst auf bilaterale statt multilaterale Verhandlungen, da die [[USA]] in direkten Zweierbeziehungen ihre überlegene Marktmacht besser ausspielen können. Das [[USMCA-Abkommen]] wird dabei nicht als bindender Rahmen, sondern als jederzeit neu verhandelbares Instrument betrachtet.", "Innenpolitisch dient die konfrontative Handelspolitik der Mobilisierung: Die Inszenierung als Verteidiger amerikanischer Arbeiter gegen ungerechte Partner legitimiert Maßnahmen, die außenpolitisch als Vertrauensbruch gelten.", "[[Mark Carney]] reagiert mit nationalistischer Gegenrhetorik vom 'Kriegszustand', was zeigt, wie wirtschaftsnationalistische Politik Gegenbewegungen in anderen Ländern provoziert und eine Abwärtsspirale in Gang setzt.", "Die Krise illustriert das zentrale Dilemma des wirtschaftlichen Nationalismus: Kurzfristige Verhandlungserfolge werden mit langfristigem Vertrauensverlust erkauft, der die Grundlage künftiger Kooperation untergräbt."]}, "connections": [{"source": "Trump-Regierung", "target": "USA", "relation": "regiert und setzt Handelspolitik um"}, {"source": "Mark Carney", "target": "Kanada", "relation": "führt als Premierminister"}, {"source": "Jamieson Greer", "target": "Trump-Regierung", "relation": "ist Handelsbeauftragter"}, {"source": "USA", "target": "Kanada", "relation": "verhängt Strafzölle gegen"}, {"source": "Kanada", "target": "USA", "relation": "kündigt Vergeltungszölle an gegen"}, {"source": "USMCA-Abkommen", "target": "USA", "relation": "regelt Handel zwischen"}, {"source": "USMCA-Abkommen", "target": "Kanada", "relation": "regelt Handel zwischen"}, {"source": "Trump-Regierung", "target": "Wirtschaftlicher Nationalismus", "relation": "verfolgt Politik basierend auf"}, {"source": "Mark Carney", "target": "Wirtschaftlicher Nationalismus", "relation": "reagiert mit eigener Version von"}], "countries_covered": ["USA", "Kanada"], "image_url": null, "id": "3e059306", "sources": ["NPR – World", "The Guardian – World", "The New York Times – World"], "article_urls": ["https://www.npr.org/2026/08/22/nx-s1-5941584/us-canada-tariffs", "https://www.theguardian.com/world/2026/aug/22/canada-tariffs-trump-trade-deal-talks-fail", "https://www.nytimes.com/2026/08/23/world/canada/canada-us-trade-war-trump-carney.html"], "primary_sources": [], "market_correlation": null, "_pipeline_meta": {"model": "claude-sonnet-4-5", "research_depth": "lite", "articles_used": 3, "input_tokens": 4074, "output_tokens": 6550}}];

    }

  function seededRand(seed) {

    size = size || 40;
    var hues = [ (seed * 360) % 360, (seed * 360 + 55) % 360 ];
    var c1 = "hsl(" + hues[0].toFixed(0) + " 78% 62%)";
    var c2 = "hsl(" + hues[1].toFixed(0) + " 78% 45%)";
    var rot = Math.floor(seededRand(seed + 1) * 360);
    var blobs = "";
    for (var i = 0; i < 3; i++) {
      var r = 8 + seededRand(seed + i + 2) * 10;
      var cx = 15 + seededRand(seed + i + 5) * 70;
      var cy = 15 + seededRand(seed + i + 9) * 70;
      blobs += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="#fff" fill-opacity="' + (0.10 + i*0.05) + '"/>';
    }
    return '<svg viewBox="0 0 100 100" width="'+size+'" height="'+size+'" xmlns="http://www.w3.org/2000/svg">' +
      '<defs><linearGradient id="g' + Math.round(seed*1e6) + '" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(' + rot + ' .5 .5)">' +
      '<stop offset="0" stop-color="' + c1 + '"/><stop offset="1" stop-color="' + c2 + '"/></linearGradient></defs>' +
      '<rect width="100" height="100" fill="url(#g' + Math.round(seed*1e6) + ')"/>' + blobs + '</svg>';
  }

  function greetingBucket(hour) {
    if (hour >= 23 || hour < 5) return "night";
    if (hour < 8) return "early";
    if (hour < 11) return "morning";
    if (hour < 14) return "noon";
    if (hour < 17) return "after";
    if (hour < 20) return "evening";
    return "late";
  }
  function pickGreeting() {

  }

      html += '<button class="pref-chip' + (active ? " active" : "") + '" data-cat="' + key + '" style="' +
        (active ? "background:var(--cat-" + key + ")" : "") + '">' + escapeHtml(catLabel(key)) + "</button>";
    });
    el.innerHTML = html;
    el.querySelectorAll(".pref-chip").forEach(function (btn) {
      btn.onclick = function () {
        var key = btn.getAttribute("data-cat");
        if (state.activeCats.has(key)) { if (state.activeCats.size > 1) state.activeCats.delete(key); }
        else state.activeCats.add(key);
        renderHome();
      };
    });
  }

    document.getElementById("greetEyebrow").textContent = new Date().toLocaleDateString(

    document.getElementById("greetTitle").textContent = pickGreeting();
    var n = storyCounts();
    document.getElementById("greetSub").textContent = state.lang === "de"
      ? n + " Storys aufbereitet, mit Historie, Akteuren und ehrlicher Markteinordnung."
      : n + " stories broken down, with history, stakeholders and honest market context.";

  function cardHtml(story) {
    var img = mediaTag(story.image_url, { iconType: "event", catKey: story.theme_category, cls: "card-media", alt: story.title });
    var isSaved = state.saved.has(story.id);
    var nSources = (story.article_urls || story.sources || []).length;
    return '<div class="card" data-id="' + story.id + '" style="--cat-color: var(--cat-' + story.theme_category + ')">' +
      '<div style="position:relative">' + img +
        '<span class="cat-chip">' + escapeHtml(catLabel(story.theme_category)) + '</span>' +
        '<button class="save-btn' + (isSaved ? " saved" : "") + '" data-save="' + story.id + '">' + (isSaved ? BOOKMARK_IN : BOOKMARK_OUT) + '</button>' +
      '</div>' +
      '<div class="card-body">' +
        '<h3 class="card-title">' + escapeHtml(story.title) + '</h3>' +
        '<p class="card-dek">' + escapeHtml(stripLinks(story.one_line)) + '</p>' +
        '<div class="card-meta"><span>' + t("sources")(nSources) + '</span></div>' +
      '</div></div>';

  function stripLinks(text) { return (text || "").replace(/\[\[([^\]]+)\]\]/g, "$1"); }

        if (e.target.closest("[data-save]")) return;
        openDetail(card.getAttribute("data-id"));
      });
    });

      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        toggleSave(btn.getAttribute("data-save"));
      });
    });

  function toggleSave(id) {
    if (state.saved.has(id)) state.saved.delete(id); else state.saved.add(id);

      overlayBtn.innerHTML = (saved ? BOOKMARK_IN : BOOKMARK_OUT);

    state.activeTab = 0;
    document.getElementById("detailOverlay").innerHTML = detailHtml(story);
    document.getElementById("detailOverlay").classList.add("open");
    document.body.style.overflow = "hidden";
    wireDetail(story);
    document.getElementById("detailOverlay").scrollTop = 0;
