er, der auch unkonventionelle Wege geht.", "established": "1946", "image_url": "https://commons.wikimedia.org/wiki/Special:FilePath/Donald_Trump_official_portrait%2C_2025_%28cropped_headshot%29.jpg", "context_image_url": "https://commons.wikimedia.org/wiki/Special:FilePath/Donald_Trump_official_portrait%2C_2025_%28cropped_headshot%29.jpg", "wikipedia_url": "https://de.wikipedia.org/wiki/Donald_Trump"}, {"name": "Israel", "type": "country", "role_in_story": "Steht im Zentrum der Kritik von sieben muslimischen Staaten wegen öffentlicher Ablehnung des Friedensplans, während faktisch Deeskalation und Vorbereitung auf Phasen des Plans stattfinden.", "profile": "Demokratischer Staat im permanenten Sicherheitsdilemma, geprägt von wiederkehrenden Konflikten mit Palästinensern und regionalen Akteuren. Innenpolitisch tief gespalten zwischen säkularen und religiösen, liberalen und nationalistischen Kräften. Außenpolitisch hochgradig abhängig von US-Unterstützung, gleichzeitig um regionale Normalisierung bemüht.", "established": "1948", "image_url": "https://commons.wikimedia.org/wiki/Special:FilePath/Flag_of_Israel.svg", "context_image_url": "https://commons.wikimedia.org/wiki/Special:FilePath/Flag_of_Israel.svg", "wikipedia_url": "https://de.wikipedia.org/wiki/Israel"}, {"name": "Hamas", "type": "organization", "role_in_story": "Hat Trumps Friedensplan am 30. Juli akzeptiert und bekräftigt weiterhin Engagement für die Roadmap, während sie Garantien für Waffenstillstand, Rückzug und Wiederaufbau fordert.", "profile": "Islamistische palästinensische Bewegung, die Gaza seit 2007 kontrolliert. Von Israel, USA und EU als Terrororganisation eingestuft. Kombiniert bewaffneten Widerstand mit Sozialleistungen und Verwaltung. Historisch auf maximale Forderungen fixiert, zeigt in aktueller Situation ungewöhnliche Verhandlungsbereitschaft, möglicherweise geschwächt durch langen Krieg.", "established": "1987", "image_url": "https://commons.wikimedia.org/wiki/Special:FilePath/Flag_of_Hamas.svg", "context_image_url": "https://commons.wikimedia.org/wiki/Special:FilePath/Flag_of_Hamas.svg", "wikipedia_url": "https://de.wikipedia.org/wiki/Hamas"}, {"name": "Jared Kushner", "type": "person", "role_in_story": "Trifft am 16. August Hamas-Führer Khalil al-Hayya in Ägypten, drängt auf Beginn der Entwaffnung und Ende bewaffneter Auftritte in Gaza.", "profile": "Schwiegersohn Trumps und dessen wichtigster Nahost-Unterhändler, war Architekt der Abraham-Abkommen. Verfolgt geschäftsorientierte Diplomatie, die wirtschaftliche Anreize mit politischen Zielen verbindet. Bereit, mit allen Seiten zu sprechen, inklusive direkter Hamas-Kontakte, die unter früheren US-Regierungen tabu waren.", "established": "1981", "image_url": "https://commons.wikimedia.org/wiki/Special:FilePath/Jared_Kushner_2025.jpg", "context_image_url": "https://commons.wikimedia.org/wiki/Special:FilePath/Jared_Kushner_2025.jpg", "wikipedia_url": "https://de.wikipedia.org/wiki/Jared_Kushner"}, {"name": "IDF", "type": "organization", "role_in_story": "Bereitet im Stillen zweite Phase des Friedensplans vor, baut Infrastruktur in Rafah wieder auf und plant Basis für internationale Stabilisierungstruppe.", "profile": "Israel Defense Forces, israelische Streitkräfte mit Wehrpflicht für jüdische Bürger. Hochgradig professionalisiert und technologisch fortgeschritten, gleichzeitig politisch in Entscheidungen der gewählten Regierung eingebunden. Operiert in Gaza unter komplexen Bedingungen zwischen militärischen Zielen und humanitären Erwägungen.", "established": "1948", "image_url": "https://commons.wikimedia.org/wiki/Special:FilePath/Badge_of_the_Israel_Defense_Forces.svg", "context_image_url": "https://commons.wikimedia.org/wiki/Special:FilePath/Badge_of_the_Israel_Defense_Forces.svg", "wikipedia_url": "https://de.wikipedia.org/wiki/Israelische_Verteidigungsstreitkr%C3%A4fte"}, {"name": "Ägypten", "type": "country", "role_in_story": "Gastgeber für Kushner-Hamas-Treffen, Mitunterzeichner der Verurteilung Israels, und traditioneller Vermittler im Gaza-Konflikt.", "profile": "Wichtigster arabischer Vermittler zwischen Israel und Palästinensern aufgrund von Friedensvertrag mit Israel (1979) und geografischer Nähe zu Gaza. Hat eigenes Interesse an Stabilität im Grenzgebiet und Kontrolle über Rafah-Übergang. Unter Präsident al-Sisi enge Sicherheitskooperation mit Israel gegen islamistische Gruppen.", "established": null, "image_url": "https://commons.wikimedia.org/wiki/Special:FilePath/Flag_of_Egypt.svg", "context_image_url": "https://commons.wikimedia.org/wiki/Special:FilePath/Flag_of_Egypt.svg", "wikipedia_url": "https://de.wikipedia.org/wiki/%C3%84gypten"}, {"name": "Jordanien", "type": "country", "role_in_story": "Mitunterzeichner der gemeinsamen Erklärung, die Israel für Scheitern der Friedensbemühungen verantwortlich macht.", "profile": "Haschemitisches Königreich mit Friedensvertrag mit Israel (1994) und großer palästinensischer Bevölkerung. Balanciert zwischen westlichen Bündnissen und arabischer Solidarität mit Palästinensern. Innenpolitisch unter Druck, wenn wahrgenommen wird, dass palästinensische Interessen vernachlässigt werden.", "established": null, "image_url": "https://commons.wikimedia.org/wiki/Special:FilePath/Flag_of_Jordan.svg", "context_image_url": "https://commons.wikimedia.org/wiki/Special:FilePath/Flag_of_Jordan.svg", "wikipedia_url": "https://de.wikipedia.org/wiki/Jordanien"}, {"name": "Vereinigten Arabischen Emiraten", "type": "country", "role_in_story": "Unterzeichner der Verurteilung Israels trotz Abraham-Abkommen, signalisiert, dass Normalisierung von Fortschritten bei Gaza-Frage abhängt.", "profile": "Golfstaat, der 2020 im Rahmen der Abraham-Abkommen diplomatische Beziehungen mit Israel aufnahm. Verfolgt pragmatische, wirtschaftsorientierte Außenpolitik, nutzt aber Gaza-Frage, um sich als Anwalt arabischer Interessen zu positionieren. Aktiver Vermittler in regionalen Konflikten.", "established": null, "image_url": "https://commons.wikimedia.org/wiki/Special:FilePath/Flag_of_the_United_Arab_Emirates.svg", "context_image_url": "https://commons.wikimedia.org/wiki/Special:FilePath/Flag_of_the_United_Arab_Emirates.svg", "wikipedia_url": "https://de.wikipedia.org/wiki/Vereinigte_Arabische_Emirate"}, {"name": "Katar", "type": "country", "role_in_story": "Vermittler bei Kushner-Hamas-Treffen und Unterzeichner der Verurteilung Israels, unterhält direkte Kommunikationskanäle zur Hamas-Führung.", "profile": "Kleiner, aber einflussreicher Golfstaat, der Hamas politisch und finanziell unterstützt und Hamas-Führung auf seinem Territorium toleriert. Fungiert als unverzichtbarer Vermittler, weil er mit allen Seiten sprechen kann. Nutzt diese Rolle zur Stärkung regionaler Position trotz kleiner Größe.", "established": null, "image_url": "https://commons.wikimedia.org/wiki/Special:FilePath/Flag_of_Qatar.svg", "context_image_url": "https://commons.wikimedia.org/wiki/Special:FilePath/Flag_of_Qatar.svg", "wikipedia_url": "https://de.wikipedia.org/wiki/Katar"}, {"name": "Türkei", "type": "country", "role_in_story": "Vermittler beim Kushner-Hamas-Treffen und Unterzeichner der Verurteilung Israels, nutzt palästinensische Sache für innenpolitische und regionale Profilierung.", "profile": "NATO-Mitglied unter Präsident Erdoğan, das zunehmend islamistische und anti-israelische Rhetorik pflegt, gleichzeitig aber Handelsbeziehungen mit Israel aufrechterhält. Positioniert sich als Anführer der muslimischen Welt und Schutzmacht der Palästinenser, während innenpolitisch autoritäre Tendenzen zunehmen.", "established": null, "image_url": "https://commons.wikimedia.org/wiki/Special:FilePath/Flag_of_Turkey.svg", "context_image_url": "https://commons.wikimedia.org/wiki/Special:FilePath/Flag_of_Turkey.svg", "wikipedia_url": "https://de.wikipedia.org/wiki/T%C3%BCrkei"}, {"name": "Pakistan", "type": "country", "role_in_story": "Unterzeichner der Verurteilung Israels, repräsentiert breitere muslimische Weltöffentlichkeit ohne direkte regionale Rolle.", "profile": "Nuklearmacht mit großer muslimischer Bevölkerung, die keine diplomatischen Beziehungen zu Israel unterhält. Palästina-Solidarität ist innenpolitisch populär und dient zur Legitimierung. Tatsächlicher Einfluss auf Gaza-Konflikt begrenzt, symbolische Positionierung aber wichtig für heimische Öffentlichkeit.", "established": null, "image_url": "https://commons.wikimedia.org/wiki/Special:FilePath/Flag_of_Pakistan.svg", "context_image_url": "https://commons.wikimedia.org/wiki/Special:FilePath/Flag_of_Pakistan.svg", "wikipedia_url": "https://de.wikipedia.org/wiki/Pakistan"}, {"name": "Indonesien", "type": "country", "role_in_story": "Unterzeichner der Verurteilung Israels, repräsentiert mit größter muslimischer Bevölkerung weltweit die globale islamische Dimension des Konflikts.", "profile": "Bevölkerungsreichstes muslimisches Land, demokratisch verfasst, mit traditioneller Unterstützung für palästinensische Sache. Keine diplomatischen Beziehungen zu Israel. Nutzt Palästina-Frage zur Profilierung in Organisation für Islamische Zusammenarbeit, während Fokus außenpolitisch vor allem auf südostasiatischer Region liegt.", "established": null, "image_url": "https://commons.wikimedia.org/wiki/Special:FilePath/Flag_of_Indonesia.svg", "context_image_url": "https://commons.wikimedia.org/wiki/Special:FilePath/Flag_of_Indonesia.svg", "wikipedia_url": "https://de.wikipedia.org/wiki/Indonesien"}, {"name": "Board of Peace", "type": "organization", "role_in_story": "Internationale Vermittlungsstruktur, die den gestaffelten Entwaffnungs- und Rückzugsrahmen entwickelt hat, dessen Umsetzung jetzt blockiert ist.", "profile": "Von Trump-Administration eingerichtete multilaterale Struktur zur Gaza-Vermittlung unter Sondergesandtem Nickolay Mladenov. Bringt USA, regionale arabische Staaten und europäische Partner zusammen. Entwickelte detaillierte Roadmap mit Entwaffnung aller bewaffneten Gruppen, schrittweisem israelischen Rückzug und Einsatz internationaler Stabilisierungstruppen.", "established": "2025", "image_url": null}, {"name": "Nickolay Mladenov", "type": "person", "role_in_story": "Sondergesandter des Board of Peace, der den Mechanismus mit schrittweisem Rückzug aus waffenfreien Zonen und Ersatz durch internationale Truppen entwickelt hat.", "profile": "Bulgarischer Diplomat, ehemaliger UN-Sonderkoordinator für den Nahost-Friedensprozess (2015-2020). Erfahren in komplexen Vermittlungen und vertraut mit allen regionalen Akteuren. Gilt als pragmatisch und detail-orientiert, fokussiert auf umsetzbare Mechanismen statt großer politischer Visionen.", "established": "1972", "image_url": null, "wikipedia_url": "https://de.wikipedia.org/wiki/Nikolaj_Mladenow"}, {"name": "Israel Katz", "type": "person", "role_in_story": "Israelischer Verteidigungsminister, der gemeinsam mit Netanyahu im Geheimen die Wiederaufbauarbeiten in Rafah genehmigt hat.", "profile": "Langjähriger Likud-Politiker und enger Verbündeter Netanyahus, bekannt für harte Positionen in Sicherheitsfragen. Als Verteidigungsminister verantwortlich für IDF-Operationen in Gaza. Teil des inneren Kreises, der tatsächliche Politik jenseits öffentlicher Rhetorik koordiniert.", "established": "1955", "image_url": "https://commons.wikimedia.org/wiki/Special:FilePath/Israel_Katz_on_July_3%2C_2024_%28cropped%29.jpg", "context_image_url": "https://commons.wikimedia.org/wiki/Special:FilePath/Israel_Katz_on_July_3%2C_2024_%28cropped%29.jpg", "wikipedia_url": "https://de.wikipedia.org/wiki/Israel_Katz_(Politiker,_1955)"}, {"name": "Khalil al-Hayya", "type": "person", "role_in_story": "Hamas-Führer, der am 16. August Jared Kushner in Ägypten trifft und zu Entwaffnung und Ende bewaffneter Auftritte gedrängt wird.", "profile": "Hochrangiger Hamas-Funktionär, der oft im Ausland lebt und Verhandlungen führt. Teil des politischen Flügels der Hamas, der pragmatischer agiert als der militärische Arm. Sein direktes Treffen mit Kushner markiert beispiellose Öffnung für direkte US-Hamas-Gespräche.", "established": null, "image_url": "https://commons.wikimedia.org/wiki/Special:FilePath/Khalil_al-Hayya_2024_%28cropped%29.jpg", "context_image_url": "https://commons.wikimedia.org/wiki/Special:FilePath/Khalil_al-Hayya_2024_%28cropped%29.jpg", "wikipedia_url": "https://de.wikipedia.org/wiki/Khalil_al-Hayya"}, {"name": "Two-Level Game (Putnam)", "type": "concept", "role_in_story": "Zentraler Fachbegriff der politikwissenschaftlichen Einordnung dieser Story.", "profile": "Von Robert Putnam (1988) entwickeltes Modell internationaler Verhandlungen: Politische Führungen verhandeln gleichzeitig auf internationaler Ebene mit anderen Staaten UND auf innenpolitischer Ebene mit der eigenen Wählerschaft oder Koalition — beide Ebenen begrenzen sich gegenseitig.", "wikipedia_url": "https://en.wikipedia.org/wiki/Two-level_game_theory"}, {"name": "Win-Set", "type": "concept", "role_in_story": "Zentraler Fachbegriff der politikwissenschaftlichen Einordnung dieser Story.", "profile": "Fachbegriff innerhalb der Two-Level-Game-Theorie: die Menge aller auf internationaler Ebene ausgehandelten Vereinbarungen, die auf der innenpolitischen Ebene tatsächlich ratifiziert bzw. akzeptiert würden. Ein enges Win-Set schränkt den Verhandlungsspielraum stark ein."}], "quotes": [{"text": "Israel bears responsibility for disrupting peace efforts in Gaza and the Palestinian territories", "attribution": "Gemeinsame Erklärung von Ägypten, Jordanien, VAE, Katar, Türkei, Pakistan und Indonesien", "context": "Verurteilung von Israels Ablehnung des Trump-Plans am 16. August 2026", "source_url": null}, {"text": "the Israeli army received no order to freeze preparations for the plan's second phase, and rehabilitation work in eastern Rafah proceeded quietly with the secret approval of Netanyahu and Defense Minister Israel Katz", "attribution": "Al Jazeera", "context": "Bericht über die Diskrepanz zwischen Netanyahus öffentlicher Ablehnung und tatsächlichen Vorbereitungen", "source_url": null}, {"text": "an Israeli pullback would occur incrementally from weapon-free areas, with international forces replacing Israeli troops, and that disarmament would extend to all armed groups, not just Hamas", "attribution": "Nickolay Mladenov, Board of Peace-Sondergesandter", "context": "Erklärung des gestaffelten Mechanismus für Rückzug und Entwaffnung", "source_url": null}], "political_theory": {"theory": "[[Two-Level Game (Putnam)]]", "points": ["Netanyahu muss gleichzeitig auf zwei Ebenen verhandeln: international mit Trump und regionalen Akteuren, innenpolitisch mit rechtsextremen Koalitionspartnern und Wählern vor der Oktober-Wahl.", "Die öffentliche Ablehnung des Plans dient der innenpolitischen Ebene (rechte Basis, Koalitionspartner), während die geheimen Vorbereitungen die internationale Ebene bedienen (USA, Vermittler).", "Das [[Win-Set]], also der Bereich akzeptabler Vereinbarungen, ist durch die rechtsextreme Koalition stark eingeschränkt, was Netanyahu nur durch Diskrepanz zwischen Rhetorik und Handeln überbrücken kann.", "Trumps direktes Engagement mit Hamas durch Kushner erweitert dessen innenpolitisches Win-Set, da er als nicht-traditioneller Politiker weniger an diplomatische Konventionen gebunden ist.", "Die gemeinsame Erklärung der sieben muslimischen Staaten verengt Netanyahus Win-Set auf internationaler Ebene, indem sie Israel international isoliert und Druck für Zugeständnisse erhöht."]}, "connections": [{"source": "Benjamin Netanyahu", "target": "Donald Trump", "relation": "Steht unter dessen diplomatischem Druck, Gaza-Friedensplan zu akzeptieren"}, {"source": "Benjamin Netanyahu", "target": "Israel Katz", "relation": "Koordiniert mit ihm geheime Genehmigung von Wiederaufbauarbeiten trotz öffentlicher Ablehnung"}, {"source": "Donald Trump", "target": "Jared Kushner", "relation": "Nutzt ihn als Sondergesandten für direkte Verhandlungen mit Hamas"}, {"source": "Jared Kushner", "target": "Khalil al-Hayya", "relation": "Trifft ihn am 16. August in Ägypten, dr     var img = mediaTag(story.image_url, { iconType: "event", catKey: story.theme_category, cls: "card-media", alt: story.title });
    var isSaved = state.saved.has(story.id);
    var nSources = (story.article_urls || story.sources || []).length;
    return '<div class="card" data-id="' + story.id + '" style="--cat-color: var(--cat-' + story.theme_category + ')">' +
      '<div style="position:relative">' + img +
        '<span class="cat-chip">' + escapeHtml(catLabel(story.theme_category)) + '</span>' +
        '<button class="save-btn' + (isSaved ? " saved" : "") + '" data-save="' + story.id + '">' + (isSaved ? BOOKMARK_IN : BOOKMARK_OUT) + '</button>' +
      '</div>' +
      '<div class="card-body">' +
        '<h3 class="card-title">' + escapeHtml(story.title) + '</h3>' +
        '<p class="card-dek">' + escapeHtml(stripLinks(story.one_line)) + '</p>' +
        '<div class="card-meta"><span>' + t("sources")(nSources) + '</span></div>' +
      '</div></div>';

  function stripLinks(text) { return (text || "").replace(/\[\[([^\]]+)\]\]/g, "$1"); }

  function renderHome() {
    document.getElementById("brandLabel").textContent = t("brand");
    renderGreeting();
    renderPrefRow();
    var grid = document.getElementById("storyGrid");
    var visible = STORIES.filter(function (s) { return state.activeCats.has(s.theme_category); });
    if (!visible.length) {
      grid.innerHTML = '<div class="empty-state">' + t("noStories") + "</div>";
    } else {
      grid.innerHTML = visible.map(cardHtml).join("");
    }
    grid.querySelectorAll(".card").forEach(function (card) {
      card.addEventListener("click", function (e) {
        if (e.target.closest("[data-save]")) return;
        openDetail(card.getAttribute("data-id"));
      });
    });
    grid.querySelectorAll("[data-save]").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        toggleSave(btn.getAttribute("data-save"));
      });
    });
  }

  function toggleSave(id) {
    if (state.saved.has(id)) state.saved.delete(id); else state.saved.add(id);
    if (state.view === "home") renderHome();
    if (state.view === "saved") renderSavedView();
    var overlayBtn = document.querySelector("#detailOverlay [data-save-detail]");
    if (overlayBtn) {
      var saved = state.saved.has(id);
      overlayBtn.classList.toggle("saved", saved);
      overlayBtn.innerHTML = (saved ? BOOKMARK_IN : BOOKMARK_OUT);
    }
  }

  /* ---------------- detail view ---------------- */
  function getStory(id) { return STORIES.find(function (s) { return s.id === id; }); }

  function openDetail(id) {
    var story = getStory(id);
    if (!story) return;
    if (state.history.indexOf(id) === -1) state.history.unshift(id); else { state.history.splice(state.history.indexOf(id),1); state.history.unshift(id); }
    state.currentStoryId = id;
    state.activeTab = 0;
    document.getElementById("detailOverlay").innerHTML = detailHtml(story);
    document.getElementById("detailOverlay").classList.add("open");
    document.body.style.overflow = "hidden";
    wireDetail(story);
    document.getElementById("detailOverlay").scrollTop = 0;
  }
  function closeDetail() {
    document.getElementById("detailOverlay").classList.remove("open");
    document.body.style.overflow = "";
  }

  var DEFAULT_TAB = 1; /* Übersicht ist der Startpunkt: links Historien, rechts Stakeholders/Märkte */

  function detailHtml(story) {
    var cat = story.theme_category;
    var hero = mediaTag(story.image_url, { iconType: "event", catKey: cat, cls: "detail-hero", alt: story.title });
    var isSaved = state.saved.has(story.id);
    return '<div style="--cat-color: var(--cat-' + cat + ')">' +
      '<div class="overlay-topbar">' +
        '<button class="pill-btn" id="btnBack">' + BACK_ICON + t("back") + '</button>' +
        '<button class="icon-btn' + (isSaved ? " saved" : "") + '" data-save-detail>' + (isSaved ? BOOKMARK_IN : BOOKMARK_OUT) + '</button>' +
      '</div>' +
      '<div style="position:relative">' + hero + '</div>' +
      '<div class="detail-content">' +
        '<div class="detail-eyebrow"><span class="detail-cat-chip">' + escapeHtml(catLabel(cat)) + '</span>' +
          '<span>' + t("sources")((story.article_urls||story.sources||[]).length) + '</span></div>' +
        '<h1 class="detail-title">' + escapeHtml(story.title) + '</h1>' +
        '<p class="detail-dek">' + linkify(story.one_line, story) + '</p>' +
        tabbarHtml() +
        '<div class="tab-viewport"><div class="tab-track" id="tabTrack">' +
          '<div class="tab-pane">' + threadsHtml(story) + '</div>' +

          '<div class="tab-pane">' + stakeholdersHtml(story) + '</div>' +
          '<div class="tab-pane">' + marketHtml(story) + '</div>' +

  function tabbarHtml() {
    var tabs = [t("historien"), t("uebersicht"), t("stakeholdersTab"), t("maerkte"), t("theorieTab")];
    return '<div class="tabbar" id="detailTabbar">' + tabs.map(function (label, i) {

  function overviewHtml(story) {
    return '<ul class="summary-list">' + (story.summary||[]).map(function(b){ return "<li><span class=\"li-text\">" + linkify(b, story) + "</span></li>"; }).join("") + '</ul>' +

        '<div class="readmore-toggle"><button class="pill-btn" id="btnReadMore">' + t("readMore") + '</button></div>' +

  function threadsHtml(story) {
    var threads = story.historical_threads || [];

  var BIAS_CLASS = { left: "bias-left", "center-left": "bias-center-left", center: "bias-center", "center-right": "bias-center-right", right: "bias-right" };

  var DOMAIN_LABELS = {
    "npr.org": "NPR", "aljazeera.com": "Al Jazeera", "cbsnews.com": "CBS News",
    "reuters.com": "Reuters", "apnews.com": "AP News", "bbc.co.uk": "BBC", "bbci.co.uk": "BBC",
    "nbcnews.com": "NBC News", "foxnews.com": "Fox News", "cnn.com": "CNN",
    "washingtonpost.com": "Washington Post", "nytimes.com": "NYT", "wsj.com": "WSJ",
    "theguardian.com": "The Guardian", "politico.com": "Politico", "axios.com": "Axios",
    "thehill.com": "The Hill", "dw.com": "DW", "france24.com": "France24",
    "themoscowtimes.com": "Moscow Times", "irishtimes.com": "Irish Times",
    "timesofisrael.com": "Times of Israel", "csis.org": "CSIS",
    "defensenews.com": "Defense News", "aei.org": "AEI", "usnews.com": "US News",
    "fortune.com": "Fortune", "pbs.org": "PBS", "senate.gov": "US-Senat",
    "congress.gov": "Congress.gov", "state.gov": "US State Dept.",
    "whitehouse.gov": "White House", "hrw.org": "Human Rights Watch"
  };
  function hostLabel(url) {
    try {
      var h = new URL(url).hostname.replace(/^www\./, "");
      for (var domain in DOMAIN_LABELS) { if (h === domain || h.indexOf("." + domain) === h.length - domain.length - 1) return DOMAIN_LABELS[domain]; }
      var base = h.split(".").slice(0, -1).join(".") || h;
      base = base.split(".")[0];
      return base.charAt(0).toUpperCase() + base.slice(1);
    } catch (e) { return "Quelle"; }
  }
  function biasForLabel(label) {
    var keys = Object.keys(SOURCE_BIAS);
    for (var i = 0; i < keys.length; i++) {
      if (keys[i].toLowerCase().indexOf(label.toLowerCase()) === 0) return SOURCE_BIAS[keys[i]];
    }
    return null;
  }

  function quotesAndSourcesHtml(story) {
    var quotes = story.quotes || [];
    var urls = story.article_urls || [];
    var primary = story.primary_sources || [];
    var html = "";
    if (quotes.length) {
      html += '<h2 class="section-heading">' + t("quotes") + '</h2>';
      quotes.forEach(function (q) {
        html += '<div class="quote-card"><p class="quote-text">“' + escapeHtml(q.text) + '”</p><div class="quote-attr">' + escapeHtml(q.attribution || "") + (q.context ? " · " + escapeHtml(q.context) : "") + '</div></div>';
      });
    }
    if (urls.length) {
      html += '<h2 class="section-heading">' + t("sourcesHead") + '</h2><div class="source-row">';
      urls.forEach(function (url) {
        var label = hostLabel(url);
        var bias = biasForLabel(label);
        var biasCls = BIAS_CLASS[bias] || "bias-unknown";
        html += '<button class="source-btn" data-open="' + escapeHtml(url || "") + '"><span class="bias-dot ' + biasCls + '"></span>' + escapeHtml(label) + EXTERNAL + '</button>';
      });
      html += '</div>';
    }
    if (primary.length) {
      html += '<h2 class="section-heading">' + t("primarySources") + '</h2>';

          (p.note ? '<div class="primary-source-desc">' + escapeHtml(p.note) + '</div>' : '') +
          '<button class="source-btn" data-open="' + escapeHtml(p.url || "") + '">' + escapeHtml(p.issuer || "Dokument öffnen") + EXTERNAL + '</button></div>';

  var TAB_COUNT = 5;
  function setActiveTab(i, silent) {
    state.activeTab = i;
    document.querySelectorAll("#detailTabbar .tab-btn").forEach(function (b, idx) {
      b.classList.toggle("active", idx === i);
    });
    var track = document.getElementById("tabTrack");
    if (track) track.style.transform = "translateX(-" + (i * (100 / TAB_COUNT)) + "%)";
  }

  function wireSwipe(track) {
    if (!track) return;
    var startX = null;
    track.parentElement.addEventListener("touchstart", function (e) { startX = e.touches[0].clientX; }, { passive: true });
    track.parentElement.addEventListener("touchend", function (e) {
      if (startX == null) return;
      var dx = e.changedTouches[0].clientX - startX;
      if (Math.abs(dx) > 40) {
        var next = state.activeTab + (dx < 0 ? 1 : -1);
        next = Math.max(0, Math.min(TAB_COUNT - 1, next));
        setActiveTab(next);
      }
      startX = null;
    }, { passive: true });
  }

  function wireThreadTabs(story) {
    document.querySelectorAll(".thread-tab").forEach(function (btn) {
      btn.onclick = function () {
        state.activeThread[story.id] = parseInt(btn.getAttribute("data-thread"), 10);

  /* ---------------- market chart (dataviz: single hue, index=100, crosshair+tooltip) ---------------- */
  function drawMarketChart(story) {
    var mc = story.market_correlation;
    var svg = document.getElementById("mcChart");
    if (!svg || !mc || !mc.series || !mc.series.length) return;
    var allSeries = mc.series;
    var maxLen = Math.max.apply(null, allSeries.map(function (s) { return (s.points || []).length; }));
    if (!maxLen) return;
    var W = 640, H = 240, padL = 40, padR = 10, padT = 16, padB = 28;
    var allVals = [];
    allSeries.forEach(function (s) { (s.points || []).forEach(function (p) { allVals.push(p.value); }); });
    var yMin = Math.min.apply(null, allVals), yMax = Math.max.apply(null, allVals);
    var pad = (yMax - yMin) * 0.15 || 2;
    yMin -= pad; yMax += pad;
    function X(i, n) { return padL + (i / (n - 1 || 1)) * (W - padL - padR); }
    function Y(v) { return padT + (1 - (v - yMin) / (yMax - yMin || 1)) * (H - padT - padB); }
    var accent = getComputedStyle(document.documentElement).getPropertyValue("--cat-" + story.theme_category).trim() || "#0a84ff";
    var muted = getComputedStyle(document.documentElement).getPropertyValue("--ink-muted").trim() || "#7b7b83";

    var gridLines = "";
    for (var g = 0; g <= 2; g++) {
      var yy = padT + (g / 2) * (H - padT - padB);
      gridLines += '<line x1="' + padL + '" y1="' + yy + '" x2="' + (W-padR) + '" y2="' + yy + '" stroke="var(--border)" stroke-width="1"/>';
      var val = yMax - (g / 2) * (yMax - yMin);
      gridLines += '<text x="4" y="' + (yy+4) + '" font-size="11" fill="var(--ink-muted)">' + val.toFixed(0) + '</text>';
    }
    var baseline = (yMin < 100 && yMax > 100) ? '<line x1="'+padL+'" y1="'+Y(100).toFixed(1)+'" x2="'+(W-padR)+'" y2="'+Y(100).toFixed(1)+'" stroke="var(--ink-muted)" stroke-dasharray="3 3" stroke-width="1"/>' : "";

    var body = gridLines + baseline;
    var allDots = [];
    allSeries.forEach(function (series, si) {
      var pts = series.points || [];
      if (!pts.length) return;
      var color = si === 0 ? accent : muted;
      var dash = si === 0 ? "" : ' stroke-dasharray="5 4"';
      var path = pts.map(function (p, i) { return (i === 0 ? "M" : "L") + X(i, pts.length).toFixed(1) + "," + Y(p.value).toFixed(1); }).join(" ");
      body += '<path d="' + path + '" fill="none" stroke="' + color + '" stroke-width="2.5"' + dash + '/>';
      pts.forEach(function (p, i) {
        allDots.push({ x: X(i, pts.length), y: Y(p.value), color: color, date: p.date, label: series.label, value: p.value });
      });
    });
    body += allDots.map(function (d, idx) {
      return '<circle cx="' + d.x.toFixed(1) + '" cy="' + d.y.toFixed(1) + '" r="3.5" fill="var(--bg-elevated)" stroke="' + d.color + '" stroke-width="2" data-idx="' + idx + '"/>';
    }).join("");
    svg.innerHTML = body;

    var tooltip = document.getElementById("mcTooltip");
    svg.querySelectorAll("circle").forEach(function (c) {
      c.style.cursor = "pointer";
      c.addEventListener("mouseenter", function () {
        var d = allDots[parseInt(c.getAttribute("data-idx"), 10)];
        tooltip.textContent = (d.date || "") + " · " + (d.label || "") + ": " + d.value.toFixed(1);
        var rect = svg.getBoundingClientRect();
        var cx = (d.x / W) * rect.width;
        var cy = (d.y / H) * rect.height;
        tooltip.style.left = cx + "px";
        tooltip.style.top = (cy - 40) + "px";
        tooltip.classList.add("show");
      });
      c.addEventListener("mouseleave", function () { tooltip.classList.remove("show"); });
    });
  }

  /* ---------------- profile panel ---------------- */
  function renderProfilePanel() {
    var panel = document.getElementById("profilePanel");
    var html = '<div class="profile-head"><div class="profile-avatar-lg">' + avatarSVG(state.avatarSeed, 48) + '</div>' +
      '<div><div class="profile-name">' + t("profile") + '</div><button class="profile-shuffle" id="btnShuffleAvatar">' + t("newAvatar") + '</button></div></div>' +
      '<div class="profile-section"><div class="profile-label">' + t("language") + '</div>' +
      '<div class="seg-control"><button class="seg-btn' + (state.lang==="de"?" active":"") + '" data-lang="de">Deutsch</button>' +
      '<button class="seg-btn' + (state.lang==="en"?" active":"") + '" data-lang="en">English</button></div>' +
      (state.lang === "en" ? '<div style="font-size:11.5px;color:var(--ink-muted);margin-top:8px;">' + t("langNote") + '</div>' : '') + '</div>' +
      '<div class="profile-section"><div class="profile-label">' + t("appearance") + '</div>' +
      '<div class="seg-control"><button class="seg-btn' + (state.theme==="dark"?" active":"") + '" data-theme="dark">' + t("dark") + '</button>' +
      '<button class="seg-btn' + (state.theme==="light"?" active":"") + '" data-theme="light">' + t("light") + '</button></div></div>' +
      '<div class="profile-section"><div class="profile-label">' + t("contentPrefs") + '</div>' +
      Object.keys(CATEGORIES).map(function (key) {
        return '<label class="check-row"><input type="checkbox" data-catcheck="' + key + '"' + (state.activeCats.has(key) ? " checked" : "") + '>' + escapeHtml(catLabel(key)) + '</label>';
      }).join("") + '</div>' +
      '<div class="profile-section">' +
        '<button class="menu-link" id="btnGoHistory"><span>' + t("history") + ' (' + state.history.length + ')</span><span class="chev">›</span></button>' +
        '<button class="menu-link" id="btnGoSaved"><span>' + t("saved") + ' (' + state.saved.size + ')</span><span class="chev">›</span></button>' +
      '</div>' +
      '<div class="session-note">' + t("sessionNote") + '</div>';
    panel.innerHTML = html;

    document.getElementById("btnShuffleAvatar").onclick = function () { state.avatarSeed = Math.random(); updateAvatarButtons(); renderProfilePanel(); };
    panel.querySelectorAll("[data-lang]").forEach(function (b) { b.onclick = function () { state.lang = b.getAttribute("data-lang"); fullRerender(); }; });
    panel.querySelectorAll("[data-theme]").forEach(function (b) { b.onclick = function () { setTheme(b.getAttribute("data-theme")); renderProfilePanel(); }; });
    panel.querySelectorAll("[data-catcheck]").forEach(function (cb) {
      cb.onchange = function () {
        var key = cb.getAttribute("data-catcheck");
        if (cb.checked) {
          state.activeCats.add(key);
        } else if (state.activeCats.size > 1) {
          state.activeCats.delete(key);
        } else {
          cb.checked = true; // mindestens eine Kategorie muss aktiv bleiben
        }
        if (state.view === "home") renderHome();
      };
    });
    document.getElementById("btnGoHistory").onclick = function () { closeProfile(); openList("history"); };
    document.getElementById("btnGoSaved").onclick = function () { closeProfile(); openList("saved"); };
  }

  function updateAvatarButtons() {
    document.getElementById("btnProfile").innerHTML = avatarSVG(state.avatarSeed, 36);
  }

  function setTheme(mode) {
    state.theme = mode;
    document.documentElement.setAttribute("data-theme", mode);
  }

  var profileOpen = false;
  function toggleProfile() {
    profileOpen = !profileOpen;
    document.getElementById("profilePanel").classList.toggle("open", profileOpen);
    document.getElementById("profileScrim").classList.toggle("open", profileOpen);
    if (profileOpen) renderProfilePanel();
  }
  function closeProfile() {
    profileOpen = false;
    document.getElementById("profilePanel").classList.remove("open");
    document.getElementById("profileScrim").classList.remove("open");
  }

  /* ---------------- history / saved list views ---------------- */
  function openList(kind) {
    state.view = kind;
    document.getElementById("homeView").style.display = "none";
    document.getElementById("listView").style.display = "";
    document.getElementById("listTitle").textContent = kind === "history" ? t("history") : t("saved");
    var ids = kind === "history" ? state.history : Array.from(state.saved);
    var body = document.getElementById("listBody");
    if (!ids.length) {
      body.innerHTML = '<div class="empty-state">' + (kind === "history" ? t("emptyHistory") : t("emptySaved")) + "</div>";
      return;
    }
    body.innerHTML = ids.map(function (id) {
      var s = getStory(id);
      if (!s) return "";
      var thumb = mediaTag(s.image_url, { iconType: "event", catKey: s.theme_category, cls: "list-thumb", alt: s.title });
      return '<div class="list-row" data-id="' + id + '">' + thumb +
        '<div><div class="card-title-sm">' + escapeHtml(s.title) + '</div><div class="list-meta">' + escapeHtml(catLabel(s.theme_category)) + '</div></div></div>';
    }).join("");
    body.querySelectorAll(".list-row").forEach(function (row) {
      row.onclick = function () { openDetail(row.getAttribute("data-id")); };
    });
  }
  function goHome() {
    state.view = "home";
    document.getElementById("homeView").style.display = "";
    document.getElementById("listView").style.display = "none";
    closeDetail();
  }

  function fullRerender() {
    updateAvatarButtons();
    renderLastUpdated();
    if (state.view === "home") renderHome();
    else if (state.view === "history" || state.view === "saved") openList(state.view);
    if (document.getElementById("profilePanel").classList.contains("open")) renderProfilePanel();
  }

  /* ---------------- init ---------------- */
  function renderLastUpdated() {
    var el = document.getElementById("lastUpdated");
    if (!el) return;
    var iso = window.__BUILD_DATE__;
    var label = iso;
    try {
      var d = new Date(iso + "T00:00:00");
      if (!isNaN(d.getTime())) {
        label = d.toLocaleDateString(state.lang === "de" ? "de-DE" : "en-US", { day: "numeric", month: "long", year: "numeric" });
      }
    } catch (e) {}
    el.textContent = t("standLabel")(label);
  }

  function init() {
    document.documentElement.setAttribute("data-theme", state.theme);
    updateAvatarButtons();
    document.getElementById("btnProfile").onclick = toggleProfile;
    document.getElementById("profileScrim").onclick = closeProfile;
    document.getElementById("btnHome").onclick = goHome;
    document.getElementById("entityScrim").onclick = closeEntityModal;
    renderLastUpdated();
    renderHome();
  }

  document.addEventListener("DOMContentLoaded", init);
})();

</script>
</body>
</html>
