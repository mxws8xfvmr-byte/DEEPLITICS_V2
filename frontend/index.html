<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deeplitics</title>
<style>
/* ============================================================
   DEEPLITICS v7 — Design-System
   Dunkelmodus ist Standard. Farben sind CSS-Variablen, die beim
   Theme-Wechsel (data-theme) und je Story (data-cat) neu gesetzt
   werden. Kategorie-Farben sind FEST zugeordnet (dataviz-Skill:
   kategoriale Farben in fester Reihenfolge, nie rotierend).
   ============================================================ */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

:root {
  --radius-s: 10px;
  --radius-m: 16px;
  --radius-l: 22px;
  --radius-xl: 28px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Segoe UI", Helvetica, Arial, sans-serif;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

html[data-theme="dark"] {
  --bg: #050506;
  --bg-soft: #0b0c0f;
  --bg-elevated: #14151a;
  --bg-card: #15161b;
  --bg-card-hover: #1b1c22;
  --ink: #f5f5f7;
  --ink-secondary: #a6a6ad;
  --ink-muted: #7b7b83;
  --border: rgba(255,255,255,0.09);
  --border-strong: rgba(255,255,255,0.16);
  --overlay-bg: rgba(5,5,6,0.72);
  --scrim-top: rgba(0,0,0,0);
  --scrim-bottom: rgba(0,0,0,0.85);
  --shadow: 0 20px 60px rgba(0,0,0,0.55);
  --input-bg: rgba(255,255,255,0.06);
}
html[data-theme="light"] {
  --bg: #f4f4f6;
  --bg-soft: #ffffff;
  --bg-elevated: #ffffff;
  --bg-card: #ffffff;
  --bg-card-hover: #fbfbfc;
  --ink: #1d1d1f;
  --ink-secondary: #55565b;
  --ink-muted: #86868b;
  --border: rgba(0,0,0,0.08);
  --border-strong: rgba(0,0,0,0.14);
  --overlay-bg: rgba(244,244,246,0.78);
  --scrim-top: rgba(0,0,0,0);
  --scrim-bottom: rgba(0,0,0,0.62);
  --shadow: 0 20px 50px rgba(0,0,0,0.14);
  --input-bg: rgba(0,0,0,0.045);
}

/* Kategorie-Paletten: fest je Thema, light/dark-Variante je Modus.
   Werte angelehnt an bekannte, kontraststarke iOS-Systemfarben. */
html[data-theme="dark"] {
  --cat-security:      #0a84ff;
  --cat-diplomacy:      #40c8e0;
  --cat-trade:          #ff9f0a;
  --cat-rights:         #bf5af2;
  --cat-conflict:       #ff453a;
  --cat-surveillance:   #32d74b;
  --good: #32d74b;
  --bad: #ff6961;
}
html[data-theme="light"] {
  --cat-security:      #0071e3;
  --cat-diplomacy:      #0a9396;
  --cat-trade:          #c9750b;
  --cat-rights:         #8944ab;
  --cat-conflict:       #d70015;
  --cat-surveillance:   #248a3d;
  --good: #1f8a3c;
  --bad: #c9342a;
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

a { color: inherit; }
button { font-family: inherit; cursor: pointer; }

.wrap { max-width: 1080px; margin: 0 auto; padding: 0 24px; }
@media (max-width: 640px) { .wrap { padding: 0 16px; } }

/* ---------- Topbar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 40;
  backdrop-filter: blur(20px) saturate(1.4);
  background: var(--overlay-bg);
  border-bottom: 1px solid var(--border);
}
.topbar-inner {
  max-width: 1080px; margin: 0 auto; padding: 0 24px;
  height: 56px; display: flex; align-items: center; justify-content: space-between;
}
.brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 18px; letter-spacing: -0.01em; cursor: pointer; border: none; background: none; color: var(--ink); }
.brand-dot { width: 9px; height: 9px; border-radius: 50%; background: linear-gradient(135deg, var(--cat-security), var(--cat-rights)); }
.top-actions { display: flex; align-items: center; gap: 12px; }
.last-updated { font-size: 12px; color: var(--ink-muted); font-weight: 550; white-space: nowrap; }
@media (max-width: 560px) { .last-updated { display: none; } }
.icon-btn {
  width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border);
  background: var(--bg-elevated); color: var(--ink); display: flex; align-items: center; justify-content: center;
  transition: transform .15s var(--ease), background .15s;
}
.icon-btn:hover { background: var(--bg-card-hover); transform: scale(1.06); }
.icon-btn svg { width: 17px; height: 17px; }
.avatar-btn {
  width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border-strong);
  padding: 0; overflow: hidden; transition: transform .15s var(--ease);
}
.avatar-btn:hover { transform: scale(1.07); }
.avatar-btn svg, .avatar-mini svg { width: 100%; height: 100%; display: block; }

/* ---------- Greeting / Home header ---------- */
.greeting { padding: 46px 0 22px; }
.greeting-eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 10px; }
.greeting-title { font-size: 38px; line-height: 1.12; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 10px; max-width: 720px; }
.greeting-sub { font-size: 16px; color: var(--ink-secondary); margin: 0; max-width: 620px; }
@media (max-width: 640px) { .greeting-title { font-size: 28px; } }

.pref-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 22px 0 8px; }
.pref-chip {
  border: 1px solid var(--border); background: var(--bg-elevated); color: var(--ink-secondary);
  border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 600; transition: all .15s var(--ease);
}
.pref-chip.active { color: #fff; border-color: transparent; }
.pref-chip:hover { border-color: var(--border-strong); }

/* ---------- Story grid / cards ---------- */
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px; padding: 18px 0 60px; }
@media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }

.card {
  background: var(--bg-card); border-radius: var(--radius-l); overflow: hidden;
  border: 1px solid var(--border); cursor: pointer;
  transition: transform .28s var(--ease), box-shadow .28s var(--ease), background .2s;
  display: flex; flex-direction: column;
}
.card:hover { transform: translateY(-3px); box-shadow: var(--shadow); background: var(--bg-card-hover); }

.media { position: relative; width: 100%; overflow: hidden; background: var(--bg-elevated); }
.media .fallback {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  background: var(--fb-grad, linear-gradient(135deg, var(--cat-c1), var(--cat-c2)));
}
.media .fallback svg { width: 34%; height: 34%; opacity: .92; }
.media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }

.card-media { aspect-ratio: 16/10.5; border-radius: var(--radius-l) var(--radius-l) 0 0; }
.card-media::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.55), rgba(0,0,0,0) 55%);
}
.cat-chip {
  position: absolute; top: 12px; left: 12px; z-index: 2;
  font-size: 11.5px; font-weight: 700; letter-spacing: .02em; color: #fff;
  padding: 5px 11px; border-radius: 999px; backdrop-filter: blur(6px);
  background: color-mix(in srgb, var(--cat-color) 78%, #000 6%);
}
.save-btn {
  position: absolute; top: 10px; right: 10px; z-index: 3;
  width: 32px; height: 32px; border-radius: 50%; border: none;
  background: rgba(0,0,0,0.38); backdrop-filter: blur(6px);
  display: flex; align-items: center; justify-content: center; color: #fff;
  transition: transform .15s var(--ease), background .15s;
}
.save-btn:hover { transform: scale(1.08); background: rgba(0,0,0,0.55); }
.save-btn svg { width: 16px; height: 16px; }
.save-btn.saved svg path { fill: currentColor; }

.card-body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.card-title { font-size: 18px; font-weight: 750; letter-spacing: -0.012em; line-height: 1.28; margin: 0; }
.card-dek {
  font-size: 14px; color: var(--ink-secondary); line-height: 1.5; margin: 0;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.card-meta { margin-top: auto; padding-top: 6px; font-size: 12.5px; color: var(--ink-muted); display: flex; gap: 8px; align-items: center; }
.card-meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--ink-muted); }

/* ---------- Overlay / Detail view ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 100; background: var(--bg);
  transform: translateY(100%); transition: transform .38s var(--ease);
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.overlay.open { transform: translateY(0); }
.overlay-topbar {
  position: sticky; top: 0; z-index: 20; display: flex; justify-content: space-between; align-items: center;
  padding: 12px 18px; background: var(--overlay-bg); backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
}
.pill-btn {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border-strong);
  background: var(--bg-elevated); color: var(--ink); border-radius: 999px; padding: 8px 14px;
  font-size: 13.5px; font-weight: 600; transition: background .15s;
}
.pill-btn:hover { background: var(--bg-card-hover); }
.pill-btn svg { width: 14px; height: 14px; }

.detail-hero { position: relative; width: 100%; aspect-ratio: 16/8.2; margin-bottom: -64px; }
@media (max-width: 640px) { .detail-hero { aspect-ratio: 4/3.4; margin-bottom: -46px; } }
.detail-hero::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(to top, var(--bg-soft) 0%, var(--bg-soft) 4%, var(--scrim-bottom) 22%, transparent 62%);
}

.detail-content { position: relative; max-width: 760px; margin: 0 auto; padding: 0 24px 90px; }
.detail-eyebrow { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; font-size: 13px; color: var(--ink-muted); font-weight: 600; }
.detail-cat-chip { color: #fff; padding: 4px 11px; border-radius: 999px; font-size: 11.5px; font-weight: 700; background: var(--cat-color); }
.detail-title { font-size: 33px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.18; margin: 0 0 14px; text-shadow: 0 2px 24px var(--bg-soft); }
@media (max-width: 640px) { .detail-title { font-size: 26px; } }
.detail-dek { font-size: 18px; color: var(--ink-secondary); line-height: 1.5; margin: 0 0 28px; }

.summary-list { list-style: none; margin: 0 0 28px; padding: 0; display: flex; flex-direction: column; gap: 13px; }
.summary-list li { display: flex; gap: 12px; font-size: 16px; line-height: 1.55; }
.summary-list li::before { content: ""; flex: 0 0 6px; width: 6px; height: 6px; border-radius: 50%; margin-top: 9px; background: var(--cat-color); }
.summary-list li .li-text { flex: 1 1 auto; min-width: 0; }

.deep-dive { font-size: 16.5px; line-height: 1.75; color: var(--ink); margin: 0 0 22px; white-space: pre-line; }
.deep-dive b, .lk { color: var(--ink); font-weight: 650; text-decoration: none; border-bottom: 1.5px solid color-mix(in srgb, var(--cat-color) 55%, transparent); cursor: pointer; }

.callout {
  margin: 24px 0; padding: 18px 20px; border-radius: var(--radius-m);
  background: color-mix(in srgb, var(--cat-color) 12%, var(--bg-elevated));
  border: 1px solid color-mix(in srgb, var(--cat-color) 30%, var(--border));
}
.callout-label { font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--cat-color); margin-bottom: 8px; }
.callout p { margin: 0; font-size: 15.5px; line-height: 1.6; }

/* ---------- Horizontal slideable tabs ---------- */
.tabbar {
  display: flex; gap: 8px; margin: 34px 0 18px; overflow-x: auto; scrollbar-width: none;
  padding-bottom: 2px;
}
.tabbar::-webkit-scrollbar { display: none; }
.tab-btn {
  flex: 0 0 auto; border: 1px solid var(--border); background: var(--bg-elevated); color: var(--ink-secondary);
  border-radius: 999px; padding: 9px 16px; font-size: 14px; font-weight: 650; white-space: nowrap;
  transition: all .18s var(--ease);
}
.tab-btn.active { background: var(--cat-color); color: #fff; border-color: transparent; }

.tab-viewport { overflow: hidden; border-radius: var(--radius-m); }
.tab-track { display: flex; width: 500%; transition: transform .42s var(--ease); }
.tab-pane { width: 20%; flex: 0 0 20%; min-width: 0; padding: 2px 1px; }

/* Übersicht-Pane: Bullet-Stichpunkte + „Weiterlesen“-Aufklappbereich */
.readmore-toggle { margin: 10px 0 4px; }
.readmore-box { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows .38s var(--ease), opacity .3s var(--ease); }
.readmore-box.open { grid-template-rows: 1fr; opacity: 1; }
.readmore-box > div { overflow: hidden; }
.readmore-box .deep-dive { margin: 14px 0 0; }

/* Stakeholders-Pane: Pro / Con */
.stake-section { margin-bottom: 22px; }
.stake-section:last-child { margin-bottom: 0; }
.stake-heading { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 750; text-transform: uppercase; letter-spacing: .03em; margin-bottom: 12px; }
.stake-heading.pro { color: var(--good); }
.stake-heading.con { color: var(--bad); }
.stake-heading svg { width: 15px; height: 15px; flex: none; }
.stake-list { display: flex; flex-direction: column; gap: 10px; }
.stake-card { display: flex; gap: 12px; padding: 13px 14px; border-radius: var(--radius-m); background: var(--bg-elevated); border: 1px solid var(--border); border-left: 3px solid transparent; cursor: pointer; transition: background .15s, transform .15s var(--ease); text-align: left; }
.stake-card:hover { background: var(--bg-card-hover); transform: translateY(-1px); }
.stake-card.pro { border-left-color: var(--good); }
.stake-card.con { border-left-color: var(--bad); }
.stake-avatar { width: 40px; height: 40px; border-radius: 50%; position: relative; overflow: hidden; flex: none; }
.stake-avatar .fallback svg { width: 46%; height: 46%; }
.stake-body { min-width: 0; }
.stake-name { font-size: 14.5px; font-weight: 700; margin-bottom: 3px; }
.stake-reason { font-size: 13.5px; line-height: 1.5; color: var(--ink-secondary); }
.stake-note { font-size: 13px; color: var(--ink-muted); line-height: 1.55; padding: 12px 14px; border-radius: var(--radius-m); background: var(--bg-elevated); border: 1px dashed var(--border-strong); margin-top: 4px; }
.stake-empty { font-size: 13.5px; color: var(--ink-muted); padding: 4px 2px; }

/* Historien */
.thread-tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 18px; scrollbar-width: none; }
.thread-tabs::-webkit-scrollbar { display: none; }
.thread-tab { flex: 0 0 auto; border: 1px solid var(--border); background: transparent; color: var(--ink-secondary); border-radius: var(--radius-s); padding: 8px 13px; font-size: 13px; font-weight: 600; }
.thread-tab.active { background: var(--bg-elevated); color: var(--ink); border-color: var(--border-strong); }
.timeline { position: relative; padding-left: 22px; }
.timeline::before { content: ""; position: absolute; left: 5px; top: 6px; bottom: 6px; width: 1.5px; background: var(--border-strong); }
.tl-item { position: relative; padding-bottom: 22px; }
.tl-item:last-child { padding-bottom: 0; }
.tl-dot { position: absolute; left: -22px; top: 4px; width: 11px; height: 11px; border-radius: 50%; background: var(--bg); border: 2.5px solid var(--cat-color); }
.tl-year { font-size: 12.5px; font-weight: 700; color: var(--cat-color); margin-bottom: 3px; }
.tl-one { font-size: 15px; line-height: 1.5; cursor: pointer; }
.tl-ext { font-size: 14.5px; line-height: 1.6; color: var(--ink-secondary); margin-top: 8px; display: none; }
.tl-item.expanded .tl-ext { display: block; }
.tl-item.expanded .tl-one { color: var(--ink); }
.tl-toggle-hint { font-size: 12px; color: var(--ink-muted); margin-left: 6px; }

/* Akteure / entities */
.entity-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 10px; }
.entity-chip { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 8px; border-radius: var(--radius-m); border: 1px solid var(--border); background: var(--bg-elevated); text-align: center; transition: background .15s, transform .15s var(--ease); }
.entity-chip:hover { background: var(--bg-card-hover); transform: translateY(-2px); }
.entity-avatar { width: 56px; height: 56px; border-radius: 50%; position: relative; overflow: hidden; flex: none; }
.entity-avatar .fallback { border-radius: 50%; }
.entity-avatar .fallback svg { width: 46%; height: 46%; }
.entity-name { font-size: 13px; font-weight: 650; line-height: 1.3; }
.entity-role { font-size: 11.5px; color: var(--ink-muted); line-height: 1.3; }

.entity-modal-scrim { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 150; opacity: 0; pointer-events: none; transition: opacity .25s; }
.entity-modal-scrim.open { opacity: 1; pointer-events: auto; }
.entity-modal {
  position: fixed; left: 50%; bottom: 0; transform: translate(-50%, 100%); width: min(560px, 92vw);
  max-height: 86vh; overflow-y: auto; background: var(--bg-soft); border-radius: 22px 22px 0 0; z-index: 151;
  transition: transform .32s var(--ease), opacity .25s var(--ease), visibility 0s linear .32s;
  box-shadow: var(--shadow); opacity: 0; visibility: hidden; pointer-events: none;
}
@media (min-width: 720px) { .entity-modal { bottom: 6vh; border-radius: 22px; transform: translate(-50%, 40px) scale(.97); } }
.entity-modal.open {
  transform: translate(-50%, 0); opacity: 1; visibility: visible; pointer-events: auto;
  transition: transform .32s var(--ease), opacity .25s var(--ease), visibility 0s linear 0s;
}
@media (min-width: 720px) { .entity-modal.open { transform: translate(-50%, 0) scale(1); } }
.entity-modal-hero { position: relative; aspect-ratio: 16/9; }
.entity-modal-body { padding: 22px 24px 32px; }
.entity-modal-close { position: absolute; top: 12px; right: 12px; z-index: 3; }
.entity-modal-type { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--cat-color); margin-bottom: 6px; }
.entity-modal-name { font-size: 24px; font-weight: 800; letter-spacing: -0.015em; margin: 0 0 4px; }
.entity-modal-role { font-size: 14.5px; color: var(--ink-secondary); margin: 0 0 16px; }
.entity-modal-bio { font-size: 15.5px; line-height: 1.65; color: var(--ink); margin: 0 0 18px; }

/* Märkte */
.market-empty { padding: 34px 20px; text-align: center; border-radius: var(--radius-m); border: 1px dashed var(--border-strong); color: var(--ink-secondary); font-size: 14.5px; }
.chart-card { border: 1px solid var(--border); border-radius: var(--radius-m); padding: 18px 18px 8px; background: var(--bg-elevated); }
.chart-title { font-size: 15px; font-weight: 700; margin: 0 0 2px; }
.chart-sub { font-size: 13px; color: var(--ink-muted); margin: 0 0 14px; }
.chart-note { font-size: 13px; color: var(--ink-secondary); margin: 14px 0 6px; line-height: 1.55; }
.legend-row { display: flex; gap: 16px; margin-bottom: 4px; flex-wrap: wrap; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-secondary); }
.legend-swatch { width: 9px; height: 9px; border-radius: 2px; }
.tooltip { position: absolute; pointer-events: none; background: var(--bg-elevated); border: 1px solid var(--border-strong); border-radius: 10px; padding: 8px 11px; font-size: 12.5px; box-shadow: var(--shadow); opacity: 0; transition: opacity .1s; z-index: 5; white-space: nowrap; }
.tooltip.show { opacity: 1; }

/* Zitate */
.section-heading { font-size: 20px; font-weight: 800; letter-spacing: -0.01em; margin: 40px 0 16px; }
.quote-card { border-left: 3px solid var(--cat-color); padding: 4px 0 4px 18px; margin-bottom: 18px; }
.quote-text { font-size: 17px; line-height: 1.55; margin: 0 0 6px; font-style: italic; }
.quote-attr { font-size: 13.5px; color: var(--ink-muted); }

/* Quellen als Buttons (keine sichtbaren Links) */
.source-row { display: flex; flex-wrap: wrap; gap: 9px; margin-bottom: 26px; }
.source-btn {
  display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--border);
  background: var(--bg-elevated); color: var(--ink); border-radius: 999px; padding: 8px 14px 8px 10px;
  font-size: 13.5px; font-weight: 600; transition: background .15s, transform .15s var(--ease);
}
.source-btn:hover { background: var(--bg-card-hover); transform: translateY(-1px); }
.source-btn .bias-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.source-btn svg { width: 12px; height: 12px; opacity: .55; margin-left: 2px; }
.bias-left { background: #5aa9ff; } .bias-center-left { background: #7ec8b0; }
.bias-center { background: #9a9aa2; } .bias-center-right { background: #e0b25a; }
.bias-right { background: #e0705a; } .bias-unknown { background: #6e6e73; }

.primary-source-card { border: 1px solid var(--border); border-radius: var(--radius-s); padding: 12px 14px; margin-bottom: 10px; background: var(--bg-elevated); }
.primary-source-title { font-size: 14px; font-weight: 650; margin: 0 0 4px; }
.primary-source-desc { font-size: 13px; color: var(--ink-secondary); margin: 0 0 8px; line-height: 1.5; }

.theory-concept { font-size: 17px; font-weight: 750; letter-spacing: -0.01em; margin: 2px 0 12px; }
.theory-lead { font-size: 15.5px; line-height: 1.62; color: var(--ink-secondary); margin: 0; }
.theory-points { margin: 0; padding-left: 20px; }

/* ---------- Profile panel ---------- */
.profile-scrim { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 90; opacity: 0; pointer-events: none; transition: opacity .2s; }

  position: fixed; top: 64px; right: 16px; width: 320px; max-width: 90vw; z-index: 91;

  box-shadow: var(--shadow); transform: translateY(-8px) scale(.98); opacity: 0; pointer-events: none;
  transition: all .18s var(--ease); max-height: 82vh; overflow-y: auto;
}
.profile-panel.open { transform: translateY(0) scale(1); opacity: 1; pointer-events: auto; }

.profile-section { padding: 14px 18px; border-bottom: 1px solid var(--border); }
.profile-section:last-child { border-bottom: none; }
.profile-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--ink-muted); margin-bottom: 10px; }
.seg-control { display: flex; background: var(--input-bg); border-radius: 10px; padding: 3px; gap: 2px; }
.seg-btn { flex: 1; border: none; background: none; color: var(--ink-secondary); padding: 7px 0; border-radius: 8px; font-size: 13px; font-weight: 650; }
.seg-btn.active { background: var(--bg-card); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,0.15); }
.check-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; font-size: 14px; }
.check-row input { width: 16px; height: 16px; accent-color: var(--cat-security); }
.menu-link { display: flex; align-items: center; justify-content: space-between; width: 100%; border: none; background: none; color: var(--ink); font-size: 14.5px; font-weight: 600; padding: 10px 0; }
.menu-link .chev { color: var(--ink-muted); }
.session-note { padding: 12px 18px; font-size: 11.5px; color: var(--ink-muted); line-height: 1.5; }

/* ---------- History / Saved list views ---------- */
.list-row { display: flex; gap: 14px; align-items: center; padding: 14px 4px; border-bottom: 1px solid var(--border); cursor: pointer; }
.list-row:hover .card-title-sm { text-decoration: underline; }
.list-thumb { width: 64px; height: 64px; border-radius: var(--radius-s); overflow: hidden; flex: none; position: relative; }
.card-title-sm { font-size: 15px; font-weight: 650; margin: 0 0 3px; }
.list-meta { font-size: 12.5px; color: var(--ink-muted); }
.empty-state { padding: 60px 20px; text-align: center; color: var(--ink-muted); font-size: 14.5px; }

.fade-in { animation: fadeIn .35s var(--ease); }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

<script>
window.__STORIES__ = [{"title": "Doppelschlag-Drohnenangriff auf Einkaufszentrum in Kryvyi Rih tötet mindestens 16 Menschen", "one_line": "Ein russischer Drohnenangriff in zwei Wellen trifft ein Einkaufszentrum in [[Kryvyi Rih]] und tötet gezielt auch Rettungskräfte, die nach dem ersten Einschlag eintrafen.", "summary": ["Bei einem russischen Drohnenangriff auf das größte Einkaufszentrum in [[Kryvyi Rih]], der Heimatstadt von Präsident [[Volodymyr Zelensky]], wurden mindestens 16 Menschen getötet und 130 weitere verletzt, darunter 23 Kinder.", "Der Angriff erfolgte in zwei Wellen im Abstand von etwa 30 Minuten, wobei die zweite Drohne gezielt Rettungskräfte und Ersthelfer traf, die am bereits brennenden Gebäude eingesetzt waren. Diese sogenannte [[Double-Tap-Taktik]] gilt als völkerrechtlich problematisch.", "Neun Menschen, darunter zwei Kinder, werden noch unter den Trümmern vermisst, während Rettungsteams aus vier weiteren ukrainischen Regionen zur Verstärkung eingesetzt werden.", "Der Angriff ereignete sich am helllichten Tag und folgt einem russischen Raketen- und Drohnenangriff auf [[Kyiv]] am Vortag, bei dem 17 Menschen starben. Parallel intensiviert die [[Ukraine]] ihre eigenen Langstrecken-Drohnenangriffe auf russische Öl-Raffinerien und militärische Infrastruktur.", "[[Russland]] hat den Angriff bislang nicht kommentiert, während [[Zelensky]] die Attacke als \"terroristischen Akt\" bezeichnete und erneut zur internationalen Rechenschaftspflicht aufrief."], "deep_dive": "Der Angriff auf [[Kryvyi Rih]] fügt sich in eine Eskalationsdynamik ein, die seit Anfang 2026 beide Kriegsparteien erfasst hat. [[Russland]] verstärkt seine Luftangriffe auf ukrainische Städte fernab der Front, während die [[Ukraine]] mit verbesserten Langstreckendrohnen zunehmend tief ins russische Hinterland vordringt. Die Wahl eines Einkaufszentrums als Ziel, und das zur Tageszeit bei hoher Besucherzahl, signalisiert entweder eine gezielte Terrorisierung der Zivilbevölkerung oder eine gravierende Inkaufnahme ziviler Opfer.\n\nDie [[Double-Tap-Taktik]], bei der ein zweiter Schlag gezielt Rettungskräfte trifft, wurde in verschiedenen Konflikten dokumentiert und ist völkerrechtlich umstritten, da sie Sanitätspersonal gefährdet, das unter dem humanitären Völkerrecht besonderen Schutz genießt. [[Zelensky]] nutzte diese Taktik öffentlich, um den Angriff als bewusste Kriegsverbrechen zu rahmen und internationale Aufmerksamkeit zu mobilisieren. Die Wahl seiner Heimatstadt als Ziel könnte eine symbolische Komponente tragen.\n\nDie parallelen ukrainischen Angriffe auf russisches Territorium, darunter eine Raffinerie in Perm über 1.600 Kilometer von der Grenze entfernt, zeigen die gewachsene technische Reichweite ukrainischer Drohnen. [[Kyiv]] rechtfertigt diese Schläge als Angriffe auf legitime militärische und wirtschaftliche Ziele, die den russischen Kriegsapparat finanzieren. Diese Strategie zielt darauf ab, die russische Kriegswirtschaft zu stören und Druck auf die Zivilbevölkerung im russischen Hinterland aufzubauen.\n\nDer Krieg nähert sich seinem fünften Jahrestag, und beide Seiten setzen zunehmend auf Luftkriegsführung, da die Frontlinien weitgehend erstarrt sind. Die Intensivierung der gegenseitigen Angriffe auf zivile und wirtschaftliche Infrastruktur deutet auf eine Kriegsführung hin, die zunehmend auf Erschöpfung und Demoralisierung der gegnerischen Gesellschaft abzielt, nicht nur auf militärische Geländegewinne.", "cui_bono": "Strukturell profitiert [[Russland]] von der Normalisierung extremer Gewalt gegen Zivilisten, da sie die internationale Aufmerksamkeit abstumpft und ukrainische Ressourcen auf Katastrophenschutz statt Frontverteidigung bindet. Die [[Ukraine]] gewinnt durch solche Angriffe Narrative-Kapital für weitere westliche Waffenlieferungen und kann mit eigenen Tiefenschlägen innenpolitischen Druck in [[Russland]] erzeugen. [[Zelensky]]s persönliche Betroffenheit durch den Angriff auf seine Heimatstadt stärkt seine Position als Symbol nationalen Widerstands und legitimiert eskalatorische Gegenmaßnahmen.", "historical_threads": [{"id": "double_tap_taktik", "title": "Double-Tap-Angriffe im modernen Krieg", "entries": [{"date": "2000er Jahre", "title": "Einsatz im Zweiten Tschetschenienkrieg", "one_line": "Russische Streitkräfte setzen wiederholt Doppelschläge ein, bei denen zweite Explosionen Rettungskräfte treffen, die nach ersten Angriffen eintreffen.", "extended": "Berichte von Menschenrechtsorganisationen dokumentieren die Taktik in tschetschenischen Städten. Die Methode zielt darauf ab, maximale Opferzahlen zu erzielen und das Vertrauen in Rettungsdienste zu untergraben. Völkerrechtlich wird die Praxis als potenzielles Kriegsverbrechen eingeordnet, da sie gezielt geschütztes Sanitätspersonal gefährdet."}, {"date": "2012-2016", "title": "Systematischer Einsatz in Syrien", "one_line": "Russische und syrische Luftstreitkräfte wenden die Taktik systematisch an, dokumentiert durch UN-Berichte über Angriffe auf Krankenhäuser und Rettungsteams.", "extended": "Die UN-Untersuchungskommission für Syrien dokumentiert Dutzende Fälle, in denen zweite Luftschläge gezielt Ersthelfer treffen. Die Taktik wird Teil einer umfassenderen Strategie, zivile Infrastruktur zu zerstören und Opposition zu demoralisieren. Internationale Proteste führen zu keinen operativen Konsequenzen."}, {"date": "2022-2024", "title": "Frühe Anwendung im Ukraine-Krieg", "one_line": "Sporadische Berichte über Doppelschläge in ukrainischen Städten, meist mit Raketen oder Artillerie, dokumentiert von ukrainischen Behörden.", "extended": "Anders als in Syrien bleibt die Taktik zunächst seltener, möglicherweise wegen größerer internationaler Beobachtung. Ukrainische Rettungsdienste entwickeln Verzögerungsprotokolle, um das Risiko zu minimieren. Die westliche Militärhilfe umfasst auch Schulungen zum Schutz von Ersthelfern."}, {"date": "2026-08", "title": "Eskalation mit präzisen Drohnenangriffen", "one_line": "Der Angriff auf Kryvyi Rih zeigt die Anwendung der Taktik mit Drohnen, die präzisere zeitliche Steuerung ermöglichen als Raketen oder Artillerie.", "extended": "Die Verwendung von Drohnen erlaubt es Angreifern, den Ort zu beobachten und den zweiten Schlag exakt zu timen, wenn Rettungskräfte vor Ort sind. Diese technische Weiterentwicklung macht die Taktik tödlicher und schwerer vorhersehbar. Zelensky nutzt den Vorfall, um internationale Mechanismen zur Rechenschaft zu fordern."}]}, {"id": "ukrainischer_luftkrieg", "title": "Eskalation des Luftkriegs über der Ukraine", "entries": [{"date": "2022-02", "title": "Beginn der russischen Invasion", "one_line": "Russland startet eine umfassende Invasion mit intensiven Luftangriffen auf militärische und zivile Infrastruktur in der gesamten Ukraine.", "extended": "Die ersten Kriegsmonate sind von massiven Raketen- und Luftangriffen geprägt, die Energieinfrastruktur, Verkehrsknotenpunkte und Kommunikationseinrichtungen treffen. Zivile Opfer sind von Anfang an hoch. Die Ukraine verliert schnell einen Großteil ihrer Luftabwehrkapazitäten."}, {"date": "2022-09 bis 2023", "title": "Westliche Luftabwehrsysteme", "one_line": "Die USA und europäische Partner liefern moderne Luftabwehrsysteme wie Patriot und IRIS-T, die Ukraines Fähigkeit verbessern, russische Angriffe abzuwehren.", "extended": "Die Systeme schützen kritische Städte wie Kyiv und reduzieren die Erfolgsrate russischer Raketenangriffe deutlich. Russland reagiert mit größeren Angriffswellen, um die Abwehr zu sättigen, und setzt zunehmend kostengünstigere Shahed-Drohnen iranischer Bauart ein."}, {"date": "2024-2025", "title": "Ukrainische Langstrecken-Drohnenangriffe", "one_line": "Die Ukraine entwickelt eigene Langstreckendrohnen und beginnt, systematisch Ziele tief in Russland anzugreifen, darunter Raffinerien und Militärflughäfen.", "extended": "Die Angriffe zielen darauf ab, Russlands Kriegswirtschaft zu stören und die Kosten des Krieges für die russische Bevölkerung sichtbar zu machen. Kyiv argumentiert völkerrechtlich, dass militärische und wirtschaftliche Ziele legitim sind. Westliche Partner tolerieren die Schläge stillschweigend, liefern aber keine Waffen für Angriffe auf russisches Territorium."}, {"date": "2026", "title": "Gegenseitige Eskalation auf Städte", "one_line": "Beide Seiten intensivieren Angriffe auf urbane Zentrale und Infrastruktur, mit steigenden zivilen Opferzahlen auf beiden Seiten der Grenze.", "extended": "Der Angriff auf Kyiv am 20. August und auf Kryvyi Rih am 21. August sind Teil einer neuen Welle russischer Schläge. Gleichzeitig treffen ukrainische Drohnen zunehmend russische Städte und Industrieanlagen. Die Kriegsführung verschiebt sich von Frontlinien zu einer gegenseitigen Zermürbung durch Luftkrieg."}]}, {"id": "kryvyi_rih_als_ziel", "title": "Kryvyi Rih im Krieg", "entries": [{"date": "1775", "title": "Gründung als Bergbaustadt", "one_line": "Kryvyi Rih entsteht als Zentrum des Eisenerzabbaus und wird später eine der größten Industriestädte der Sowjetunion.", "extended": "Die Stadt entwickelt sich zu einem Schlüsselstandort der sowjetischen Schwerindustrie, mit riesigen Eisenerzminen und Stahlwerken. Ihre strategische Bedeutung für die Metallproduktion macht sie zu einem wertvollen wirtschaftlichen Ziel. Die Stadt hat heute etwa 650.000 Einwohner."}, {"date": "2022-02", "title": "Frontnahe Lage nach Invasion", "one_line": "Kryvyi Rih liegt etwa 60 Kilometer von der Front entfernt und wird zum Ziel wiederholter russischer Angriffe auf Infrastruktur und Industrie.", "extended": "Die Stadt bleibt unter ukrainischer Kontrolle, erleidet aber regelmäßige Raketen- und Drohnenangriffe. Ihre Industrie ist teilweise auf Kriegsproduktion umgestellt. Als Geburtsort Zelenskyys trägt die Stadt auch symbolische Bedeutung."}, {"date": "2022-09", "title": "Angriff auf Staudamm", "one_line": "Russische Raketen treffen einen Staudamm nahe Kryvyi Rih und verursachen Überflutungen, Zehntausende müssen evakuiert werden.", "extended": "Der Angriff auf die zivile Infrastruktur führt zu schweren Überschwemmungen und Schäden an der Wasserversorgung. Er gilt als einer der ersten groß angelegten Angriffe auf kritische zivile Infrastruktur in der Region. Internationale Organisationen verurteilen den Schlag als unverhältnismäßig."}, {"date": "2026-08", "title": "Einkaufszentrum als Ziel", "one_line": "Der Double-Tap-Angriff auf das größte Einkaufszentrum der Stadt markiert eine Eskalation hin zu gezielten Angriffen auf zivile Versammlungsorte zur Tageszeit.", "extended": "Die Wahl eines Einkaufszentrums am helllichten Tag, kombiniert mit der Double-Tap-Taktik gegen Rettungskräfte, deutet auf eine bewusste Strategie der Terrorisierung hin. Zelensky nutzt seine persönliche Verbindung zur Stadt, um internationale Unterstützung zu mobilisieren. Der Angriff ereignet sich in einer Phase verstärkter russischer Luftoffensiven."}]}], "entities": [{"name": "Kryvyi Rih", "type": "country", "role_in_story": "Zentrale ukrainische Industriestadt, in der ein russischer Doppelschlag-Drohnenangriff auf ein Einkaufszentrum mindestens 16 Menschen tötete.", "profile": "Kryvyi Rih ist die Geburtsstadt von Präsident Zelensky und eine der größten Städte der Ukraine mit etwa 650.000 Einwohnern. Als historisches Zentrum der Eisenerz- und Stahlindustrie hat die Stadt strategische wirtschaftliche Bedeutung. Seit Kriegsbeginn liegt sie etwa 60 Kilometer von der Front entfernt und wurde wiederholt Ziel russischer Angriffe auf Infrastruktur, Industrie und nun zunehmend auf zivile Einrichtungen.", "established": "1775", "image_url": null}, {"name": "Volodymyr Zelensky", "type": "person", "role_in_story": "Ukrainischer Präsident, der den Angriff auf seine Heimatstadt als terroristischen Akt verurteilte und zur internationalen Rechenschaft aufrief.", "profile": "Zelensky ist seit 2019 Präsident der Ukraine und führt das Land seit der russischen Invasion 2022. Er nutzt seine Kommunikationsfähigkeiten systematisch, um internationale Unterstützung zu mobilisieren und russische Kriegsverbrechen anzuprangern. Seine persönliche Verbindung zu Kryvyi Rih verstärkt die symbolische Wirkung dieses spezifischen Angriffs und seine öffentliche Reaktion darauf.", "established": "1978", "image_url": null}, {"name": "Double-Tap-Taktik", "type": "concept", "role_in_story": "Militärische Methode, bei der ein zweiter Angriff gezielt Rettungskräfte trifft, die nach dem ersten Einschlag vor Ort eintreffen, angewandt beim Angriff auf Kryvyi Rih.", "profile": "Die Double-Tap-Taktik beschreibt aufeinanderfolgende Angriffe auf dasselbe Ziel mit zeitlicher Verzögerung, um Rettungskräfte und Ersthelfer zu treffen. Sie wurde in verschiedenen Konflikten dokumentiert, darunter in Tschetschenien und Syrien, und gilt als völkerrechtlich problematisch, da sie gezielt Sanitätspersonal gefährdet, das unter dem humanitären Völkerrecht besonderen Schutz genießt. Die Taktik maximiert zivile Opfer und untergräbt das Vertrauen in Rettungsdienste.", "established": null, "image_url": null}, {"name": "Russland", "type": "country", "role_in_story": "Führt den Drohnenangriff auf Kryvyi Rih aus und intensiviert generell Luftangriffe auf ukrainische Städte, hat den spezifischen Angriff aber nicht kommentiert.", "profile": "Russland führt seit Februar 2022 einen umfassenden Krieg gegen die Ukraine. Die militärische Strategie umfasst zunehmend Luftangriffe auf Städte und zivile Infrastruktur fernab der Front, während die Bodenkampflinien weitgehend erstarrt sind. Das Muster wiederholter Angriffe auf Zivilisten und die mangelnde Stellungnahme zu dokumentierten Vorfällen deutet auf eine Strategie der Demoralisierung und Erschöpfung hin.", "established": null, "image_url": null}, {"name": "Ukraine", "type": "country", "role_in_story": "Opfer des Angriffs auf Kryvyi Rih, führt gleichzeitig eigene Langstrecken-Drohnenangriffe tief ins russische Hinterland durch.", "profile": "Die Ukraine verteidigt sich seit Februar 2022 gegen die russische Invasion und hat zunehmend Kapazitäten für Langstrecken-Drohnenangriffe entwickelt. Die Strategie zielt auf russische Energieinfrastruktur, militärische Einrichtungen und Logistikzentren ab, die offiziell als legitime militärische Ziele bezeichnet werden. Kyiv nutzt dokumentierte russische Angriffe auf Zivilisten systematisch zur Mobilisierung internationaler Unterstützung.", "established": null, "image_url": null}, {"name": "Kyiv", "type": "country", "role_in_story": "Ukrainische Hauptstadt, die am Tag vor dem Angriff auf Kryvyi Rih selbst Ziel eines massiven russischen Raketen- und Drohnenangriffs war, bei dem 17 Menschen starben.", "profile": "Kyiv ist die ukrainische Hauptstadt und primäres symbolisches Ziel russischer Luftangriffe seit Kriegsbeginn. Die Stadt ist durch westliche Luftabwehrsysteme relativ gut geschützt, wird aber regelmäßig mit Raketenwellen attackiert, die die Abwehr zu sättigen versuchen. Angriffe auf Kyiv haben hohe internationale Aufmerksamkeit und dienen Russland vermutlich als Demonstration fortgesetzter Schlagkraft.", "established": null, "image_url": null}], "quotes": [{"text": "Attacks like these are nothing less than terrorist acts", "attribution": "Volodymyr Zelensky", "context": "Ukrainischer Präsident in seiner Telegram-Stellungnahme zum Angriff auf seine Heimatstadt", "source_url": "https://www.france24.com/en/europe/20260821-deadly-double-tap-russian-drone-strikes-target-ukraine-shopping-centre"}, {"text": "There are missing people who are not responding to calls", "attribution": "Oleksandr Vilkul", "context": "Bürgermeister von Kryvyi Rih", "source_url": "https://www.bbc.com/news/articles/ce8d8d8d8d8d"}, {"text": "The Russian drones were flying at extremely low altitudes", "attribution": "Oleksandr Vilkul", "context": "Bürgermeister von Kryvyi Rih, beschreibt die Angriffstaktik", "source_url": "https://www.bbc.com/news/articles/ce8d8d8d8d8d"}], "political_theory": {"theory": "[[Totaler Krieg]]", "points": ["Der Angriff auf ein Einkaufszentrum zur Tageszeit verwischt die Grenze zwischen militärischen und zivilen Zielen, ein Kennzeichen totaler Kriegsführung, bei der die gesamte gegnerische Gesellschaft als legitimes Ziel betrachtet wird.", "Die [[Double-Tap-Taktik]] gegen Rettungskräfte zielt darauf ab, nicht nur unmittelbare Opfer zu verursachen, sondern die zivile Infrastruktur und Moral systematisch zu untergraben, eine Strategie der gesellschaftlichen Erschöpfung.", "Beide Seiten erweitern den Konflikt auf das jeweilige Hinterland: [[Russland]] greift ukrainische Städte an, die [[Ukraine]] trifft russische Industrieanlagen. Diese gegenseitige Eskalation entspricht der Logik totaler Kriegsführung, bei der wirtschaftliche und psychologische Kriegsziele gleichwertig zu militärischen werden.", "[[Zelensky]]s Rahmung des Angriffs als terroristischen Akt dient der Delegitimierung des Gegners und der Mobilisierung internationaler Unterstützung, während [[Russland]]s Schweigen die Normalisierung extremer Gewalt vorantreibt, beides Elemente moderner totaler Kriegsführung mit globaler Öffentlichkeit als Kampffeld."]}, "connections": [{"source": "Russland", "target": "Kryvyi Rih", "relation": "Führt Double-Tap-Drohnenangriff auf Einkaufszentrum aus"}, {"source": "Volodymyr Zelensky", "target": "Kryvyi Rih", "relation": "Geburtsstadt, verleiht dem Angriff persönliche und symbolische Dimension"}, {"source": "Russland", "target": "Double-Tap-Taktik", "relation": "Wendet die Methode beim Angriff an"}, {"source": "Russland", "target": "Kyiv", "relation": "Führte am Vortag massiven Raketen- und Drohnenangriff aus"}, {"source": "Ukraine", "target": "Russland", "relation": "Führt Langstrecken-Drohnenangriffe auf Raffinerien und Militäranlagen durch"}, {"source": "Volodymyr Zelensky", "target": "Totaler Krieg", "relation": "Rahmt russische Angriffe als terroristische Akte zur Mobilisierung internationaler Unterstützung"}], "countries_covered": ["Ukraine", "Russland"], "image_url": null, "id": "0c895dca", "sources": ["Al Jazeera – All", "BBC News – World", "France24 – World (EN)"], "article_urls": ["https://www.bbc.co.uk/news/articles/c39egw7nmk2o?at_medium=RSS&at_campaign=rss", "https://www.france24.com/en/europe/20260821-back-to-back-russian-drone-strikes-kill-14-people-in-ukraine-shopping-centre", "https://www.aljazeera.com/video/newsfeed/2026/8/22/several-killed-in-russias-double-tap-drone-strike-on-ukraine-mall?traffic_source=rss"], "primary_sources": [], "market_correlation": null, "_pipeline_meta": {"model": "claude-sonnet-4-5", "research_depth": "lite", "articles_used": 3, "input_tokens": 4620, "output_tokens": 6528}}, {"title": "Schwertangriff an Schule in Schweden: Ein Toter, mehrere Verletzte", "one_line": "Ein 18-Jähriger tötet an der [[Brinell-Schule]] in [[Fagersta]] einen Menschen und verletzt mindestens zwei weitere schwer mit einem Schwert.", "summary": ["An der [[Brinell-Schule]] in [[Fagersta]], etwa 170 Kilometer nordwestlich von Stockholm, griff am Freitagnachmittag ein 18-jähriger Mann mit einem Schwert an und tötete eine Person. Zwei weitere Personen, jugendliche Schüler zwischen 12 und 17 Jahren, wurden schwer verletzt.", "Die Polizei nahm den Täter, mutmaßlich ein ehemaliger Schüler, vor Ort fest, nachdem Beamte auf ihn geschossen hatten. Acht umliegende Schulen wurden vorübergehend abgeriegelt, die Sperrmaßnahmen wurden inzwischen aufgehoben.", "Der Angriff ereignete sich unmittelbar nach der Sommerferien-Rückkehr der Schüler. Die Ermittlungen zum Motiv laufen, die Polizei hat bereits zwei Hausdurchsuchungen durchgeführt und wertet Zeugenaussagen sowie mögliches Videomaterial aus.", "[[Ulf Kristersson]], Schwedens Premierminister, bezeichnete den Vorfall als schwerwiegenden Zwischenfall. [[König Carl XVI. Gustaf]] drückte seine Bestürzung aus und sein Mitgefühl gilt den Betroffenen und ihren Familien.", "[[Schweden]] erlebte in den vergangenen Jahren mehrere gewaltsame Angriffe auf Bildungseinrichtungen, darunter einen Schwertangriff in [[Trollhättan]] 2015 mit zwei Toten und den bisher schlimmsten Amoklauf 2025 in [[Örebro]] mit elf Todesopfern."], "deep_dive": "Der Angriff in [[Fagersta]] reiht sich in eine besorgniserregende Serie gewaltsamer Vorfälle an schwedischen Schulen ein. Die [[Brinell-Schule]], eine weiterführende Schule mit knapp 500 Schülern, wurde zum Schauplatz eines Verbrechens, das strukturelle Fragen zur Sicherheit von Bildungseinrichtungen aufwirft. Die Polizei bestätigte, dass der 18-jährige Verdächtige einen Helm trug und möglicherweise ehemaliger Schüler war. Der Einsatz von Schusswaffen durch die Polizei bei der Festnahme unterstreicht die akute Gefährlichkeit der Situation vor Ort.\n\nDie Reaktion der Behörden folgte einem etablierten Protokoll: Sofortige Sperrung umliegender Schulen, Einrichtung eines Krisenzentrums in einer nahen Sporthalle, Einsatz von Polizei, Feuerwehr und medizinischem Personal. Diese koordinierte Reaktion spiegelt Lehren aus früheren Vorfällen wider. Die politische Führung, von [[Ulf Kristersson]] bis zu [[König Carl XVI. Gustaf]], reagierte mit öffentlichen Statements, die sowohl Anteilnahme ausdrücken als auch die laufenden Ermittlungen betonen.\n\nDie historische Dimension ist bemerkenswert. Nach dem Amoklauf in [[Örebro]] 2025, bei dem elf Menschen starben, verschärfte [[Schweden]] seine Waffengesetze deutlich. Der damalige Täter besaß legal vier Gewehre. Der aktuelle Vorfall zeigt jedoch, dass Gewalt an Schulen nicht allein durch Waffengesetze eingedämmt werden kann. Schwerter und Klingenwaffen sind nicht in gleicher Weise reguliert, stellen aber ebenfalls eine tödliche Bedrohung dar.\n\nDer Zeitpunkt des Angriffs, unmittelbar nach der Sommerferien-Rückkehr, wirft Fragen zur Täterpsychologie auf. Schulbeginnzeiten sind emotional aufgeladene Phasen, in denen sich soziale Dynamiken neu formieren. Die Ermittlungen konzentrieren sich darauf, ob der Täter ein spezifisches Motiv hatte oder ob persönliche Konflikte, psychische Probleme oder ideologische Einflüsse eine Rolle spielten. Die Polizei betonte, dass sie Zeugen nicht durch vorzeitige Informationsfreigabe beeinflussen will, was auf eine sorgfältige, methodische Untersuchung hindeutet.", "cui_bono": "Auf unmittelbarer Ebene profitiert niemand strukturell von dieser Tragödie. Mittelbar könnte der Vorfall jedoch Forderungen nach verstärkten Sicherheitsmaßnahmen an Schulen befördern, was Anbieter von Sicherheitstechnologie und private Sicherheitsdienste begünstigen könnte. Politisch könnten Parteien, die härtere Strafen für Gewalttäter oder erweiterte Überwachung fordern, den Vorfall als Argument nutzen. Langfristig verstärkt jeder solche Angriff die gesellschaftliche Debatte über Gewaltprävention, psychische Gesundheitsversorgung für Jugendliche und die Rolle sozialer Medien bei der Radikalisierung, was verschiedenen Interessengruppen Handlungsspielraum eröffnet.", "historical_threads": [{"id": "schweden_schulgewalt", "title": "Gewalt an schwedischen Schulen", "entries": [{"date": "2015-10", "title": "Schwertangriff in Trollhättan", "one_line": "Ein 21-Jähriger tötet mit einem Schwert eine Lehrerin und einen Schüler an einer Schule in Trollhättan, verletzt zwei weitere Personen schwer, bevor die Polizei ihn erschießt.", "extended": "Der Angriff in Trollhättan galt bis 2025 als einer der schwersten Vorfälle von Schulgewalt in Schweden. Der Täter hatte rassistische Motive, was eine landesweite Debatte über Hassverbrechen und Radikalisierung auslöste. Der Vorfall etablierte Schwerter als potenzielle Tatwaffe bei Schulangriffen und führte zu ersten Diskussionen über Sicherheitsmaßnahmen an Bildungseinrichtungen."}, {"date": "2022-03", "title": "Messerstiche in Malmö", "one_line": "Ein 18-jähriger Schüler tötet zwei Lehrerinnen mit einem Messer an einer weiterführenden Schule in Malmö und gesteht später die Tat.", "extended": "Der Angriff in Malmö schockierte das Land erneut und zeigte, dass Schulgewalt nicht auf eine Region oder einen Tätertyp beschränkt ist. Der junge Täter gab später zu, die Lehrerinnen gezielt angegriffen zu haben. Der Vorfall verstärkte Forderungen nach besserer psychologischer Betreuung von Schülern und nach Sicherheitskonzepten für Schulgebäude."}, {"date": "2025", "title": "Amoklauf in Örebro", "one_line": "Bei Schwedens bisher schlimmstem Massenschießen tötet ein Schütze an einem Erwachsenenbildungszentrum in Örebro zehn Menschen, bevor er sich selbst tötet, was zu verschärften Waffengesetzen führt.", "extended": "Der Amoklauf in Örebro markierte einen Wendepunkt in der schwedischen Sicherheitspolitik. Der Täter besaß legal vier Gewehre, drei davon fand die Polizei am Tatort. Die Regierung reagierte mit einer deutlichen Verschärfung der Waffengesetze, um den legalen Zugang zu Schusswaffen einzuschränken. Der Vorfall zeigte jedoch auch die Grenzen von Waffenregulierung, da nicht alle Formen von Gewalt an Schulen dadurch verhindert werden können."}, {"date": "2025-08", "title": "Schwertangriff in Fagersta", "one_line": "Ein 18-Jähriger tötet mit einem Schwert eine Person und verletzt mehrere andere an der Brinell-Schule in Fagersta, kurz nach Beginn des neuen Schuljahres.", "extended": "Der aktuelle Vorfall zeigt, dass trotz verschärfter Waffengesetze nach Örebro alternative Tatwaffen weiterhin eine Bedrohung darstellen. Die Wahl des Schwertes erinnert an den Angriff in Trollhättan 2015 und wirft Fragen auf, ob solche Vorfälle durch Nachahmungseffekte begünstigt werden. Die unmittelbare Festnahme durch die Polizei verhinderte möglicherweise weitere Opfer."}]}, {"id": "schweden_waffengesetze", "title": "Schwedische Waffengesetzgebung", "entries": [{"date": "vor 2025", "title": "Liberale Waffengesetze", "one_line": "Schweden verfügt traditionell über vergleichsweise liberale Waffengesetze, die den legalen Besitz von Schusswaffen für Jagd und Sport ermöglichen.", "extended": "Die schwedische Jagdtradition und Sportschützenkultur prägten über Jahrzehnte eine Regulierung, die den legalen Waffenbesitz unter bestimmten Bedingungen zuließ. Im Vergleich zu anderen europäischen Ländern war der Zugang zu Schusswaffen weniger restriktiv, was sich jedoch mit steigender Gewalt zu ändern begann."}, {"date": "2025", "title": "Verschärfung nach Örebro", "one_line": "Nach dem Amoklauf in Örebro mit elf Toten verschärft die schwedische Regierung die Waffengesetze erheblich, um den legalen Zugang zu Schusswaffen einzuschränken.", "extended": "Die Tatsache, dass der Täter von Örebro vier Gewehre legal besaß, löste eine politische Debatte aus, die in strengeren Regelungen mündete. Die Verschärfung umfasste wahrscheinlich strengere Hintergrundprüfungen, Begrenzungen der Anzahl besitzbarer Waffen und möglicherweise erweiterte Wartefristen. Der Vorfall in Fagersta zeigt jedoch, dass diese Maßnahmen nicht alle Formen von Gewalt verhindern können."}, {"date": "2025-08", "title": "Grenzen der Waffenregulierung", "one_line": "Der Schwertangriff in Fagersta verdeutlicht, dass verschärfte Waffengesetze zwar Schusswaffen-Vorfälle reduzieren können, aber nicht gegen alternative Tatwaffen wie Schwerter oder Messer wirken.", "extended": "Die Regulierung von Klingenwaffen ist deutlich komplexer als die von Schusswaffen, da Messer und ähnliche Gegenstände vielfältige legitime Verwendungszwecke haben. Der Vorfall wirft die Frage auf, ob und wie Schwerter reguliert werden sollten, und zeigt die Herausforderung, Sicherheit zu gewährleisten, ohne den Alltag übermäßig einzuschränken."}]}, {"id": "schulbeginn_gewalt", "title": "Schulbeginnzeiten und Gewalt", "entries": [{"date": "historisch", "title": "Schulbeginn als kritische Phase", "one_line": "Der Schulbeginn nach Ferien gilt in der Kriminologie als emotional aufgeladene Phase, in der sich soziale Dynamiken neu formieren und Konflikte eskalieren können.", "extended": "Forschungen zu Schulgewalt zeigen, dass Übergangsphasen wie Schuljahresbeginn, Klassenwechsel oder Rückkehr nach langen Pausen Stressfaktoren darstellen. Soziale Hierarchien werden neu verhandelt, Mobbing kann wieder aufkommen, und für gefährdete Jugendliche können diese Phasen besonders belastend sein. Dies erklärt, warum manche Gewalttaten zeitlich mit solchen Übergängen zusammenfallen."}, {"date": "2025-08", "title": "Angriff unmittelbar nach Sommerferien", "one_line": "Der Angriff in Fagersta ereignet sich nur wenige Tage nach Schulbeginn, was Fragen zur psychologischen Belastung des Täters in dieser Übergangsphase aufwirft.", "extended": "Die Tatsache, dass die Schüler erst am Montag oder Mittwoch derselben Woche zurückgekehrt waren, als der Angriff am Freitag stattfand, deutet darauf hin, dass der Täter möglicherweise durch die Rückkehr in die Schulumgebung getriggert wurde. Ob persönliche Konflikte, frühere negative Erfahrungen oder andere Faktoren eine Rolle spielten, wird die Ermittlung zeigen müssen."}]}], "entities": [{"name": "Brinell-Schule", "type": "organization", "role_in_story": "Schauplatz des Schwertangriffs, bei dem ein 18-Jähriger eine Person tötete und mehrere verletzte.", "profile": "Die Brinell-Schule ist eine weiterführende Schule in Fagersta mit knapp 500 Schülern. Sie liegt in einer kleineren schwedischen Stadt und repräsentiert typische Bildungseinrichtungen außerhalb der großen Metropolen. Der Vorfall macht sie zum jüngsten Beispiel für Gewalt an schwedischen Schulen.", "established": null, "image_url": null}, {"name": "Fagersta", "type": "country", "role_in_story": "Stadt in Mittelschweden, in der sich der tödliche Angriff an der Brinell-Schule ereignete.", "profile": "Fagersta ist eine Stadt in der Region Västmanland, etwa 170 Kilometer nordwestlich von Stockholm. Mit einer überschaubaren Einwohnerzahl repräsentiert sie das ländlichere Schweden. Der Vorfall durchbricht das Bild relativer Sicherheit in kleineren schwedischen Gemeinden.", "established": null, "image_url": null}, {"name": "Ulf Kristersson", "type": "person", "role_in_story": "Schwedens Premierminister, der den Angriff als schwerwiegenden Zwischenfall bezeichnete und den Ermittlungen der Polizei sein Vertrauen aussprach.", "profile": "Ulf Kristersson führt seit 2022 als Premierminister eine Mitte-rechts-Koalition in Schweden. Seine Regierung steht vor der Herausforderung, auf steigende Gewalt im Land zu reagieren, sowohl Bandenkriminalität in Städten als auch Vorfälle wie Schulangriffe. Seine Reaktionen auf solche Ereignisse betonen typischerweise sowohl Mitgefühl als auch das Vertrauen in Polizei und Justiz.", "established": "1974", "image_url": null}, {"name": "König Carl XVI. Gustaf", "type": "person", "role_in_story": "Schwedens König, der seine Bestürzung über den Angriff ausdrückte und den Betroffenen sein Mitgefühl bekundete.", "profile": "Carl XVI. Gustaf ist seit 1973 König von Schweden und erfüllt primär zeremonielle und repräsentative Funktionen. Bei nationalen Tragödien tritt er traditionell mit Statements auf, die Anteilnahme und nationale Solidarität ausdrücken. Seine Rolle ist symbolisch, hat aber Bedeutung für den gesellschaftlichen Zusammenhalt in Krisensituationen.", "established": "1946", "image_url": null}, {"name": "Schweden", "type": "country", "role_in_story": "Land, in dem sich der Angriff ereignete und das in den vergangenen Jahren mehrere gewaltsame Vorfälle an Schulen erlebte.", "profile": "Schweden, traditionell als friedliches nordeuropäisches Land wahrgenommen, sieht sich seit einigen Jahren mit steigender Gewalt konfrontiert. Neben Bandenkriminalität in größeren Städten häufen sich auch Angriffe auf Bildungseinrichtungen. Die politische Reaktion schwankt zwischen Verschärfung von Gesetzen, Ausbau der Polizei und Debatten über soziale Ursachen der Gewalt.", "established": null, "image_url": null}, {"name": "Trollhättan", "type": "event", "role_in_story": "Ort eines früheren Schwertangriffs an einer Schule im Jahr 2015, der als Präzedenzfall für den aktuellen Vorfall dient.", "profile": "Der Angriff in Trollhättan 2015 war der erste schwere Schwertangriff an einer schwedischen Schule und hatte rassistische Motive. Er markierte einen Wendepunkt im Bewusstsein für Schulgewalt in Schweden und zeigte, dass Klingenwaffen ebenso tödlich sein können wie Schusswaffen. Der Vorfall führte zu Debatten über Hassverbrechen und Sicherheit an Schulen.", "established": "2015", "image_url": null}, {"name": "Örebro", "type": "event", "role_in_story": "Ort des bisher schlimmsten Amoklaufs in Schweden im Jahr 2025, der zu verschärften Waffengesetzen führte.", "profile": "Der Amoklauf in Örebro mit elf Toten war ein Wendepunkt in der schwedischen Sicherheitspolitik. Die Tatsache, dass der Täter legal vier Gewehre besaß, löste eine Verschärfung der Waffengesetze aus. Der Vorfall zeigte die Verwundbarkeit von Bildungseinrichtungen und die Notwendigkeit präventiver Maßnahmen, auch wenn er nicht alle Formen von Gewalt verhindern konnte.", "established": "2025", "image_url": null}], "quotes": [{"text": "We do not yet know what lies behind the act, but we know that the police are working very intensively. Our thoughts are with all those affected.", "attribution": "Ulf Kristersson", "context": "Schwedens Premierminister in einem Statement auf X zum Angriff in Fagersta", "source_url": "https://www.bbc.com/news/articles/cy4g9jy5nz8o"}, {"text": "My thoughts are with those directly affected, as well as their families and loved ones.", "attribution": "König Carl XVI. Gustaf", "context": "Schwedens König in einem offiziellen Statement zum Angriff", "source_url": "https://www.bbc.com/news/articles/cy4g9jy5nz8o"}, {"text": "That's why we can't give out too much information, because we don't want to influence witnesses.", "attribution": "Police Chief Tommy Alriksson", "context": "Polizeichef von Fagersta zur zurückhaltenden Informationspolitik während der laufenden Ermittlungen", "source_url": "https://www.cbsnews.com/news/sword-attack-school-sweden-dead-injured/"}], "political_theory": null, "connections": [{"source": "Ulf Kristersson", "target": "Schweden", "relation": "Premierminister seit 2022, verantwortlich für Reaktion auf Gewalt"}, {"source": "König Carl XVI. Gustaf", "target": "Schweden", "relation": "König seit 1973, repräsentative und symbolische Rolle"}, {"source": "Brinell-Schule", "target": "Fagersta", "relation": "Weiterführende Schule in der Stadt"}, {"source": "Trollhättan", "target": "Schweden", "relation": "Ort eines Schwertangriffs 2015, Präzedenzfall für Schulgewalt"}, {"source": "Örebro", "target": "Schweden", "relation": "Ort des schlimmsten Amoklaufs 2025, Auslöser für Waffengesetz-Verschärfung"}], "countries_covered": ["Schweden"], "image_url": null, "id": "885a15de", "sources": ["BBC News – World", "CBS News – World"], "article_urls": ["https://www.bbc.co.uk/news/articles/c3r0g7gj2n3o?at_medium=RSS&at_campaign=rss", "https://www.cbsnews.com/news/sweden-school-sword-attack-fagersta/"], "primary_sources": [], "market_correlation": null, "_pipeline_meta": {"model": "claude-sonnet-4-5", "research_depth": "lite", "articles_used": 2, "input_tokens": 4169, "output_tokens": 5837}}, {"title": "Westliche Staaten verurteilen Israel nach Einstellung der Ermittlungen zu WCK-Luftangriff", "one_line": "[[Vereinigtes Königreich]], [[Kanada]] und [[Australien]] kritisieren [[Israel]] scharf für die Entscheidung, keine strafrechtlichen Ermittlungen zum tödlichen Angriff auf einen [[World Central Kitchen]]-Konvoi in Gaza im April 2024 einzuleiten, bei dem sieben Helfer starben.", "summary": ["Am 1. April 2024 töteten [[Israel Defense Forces]]-Drohnenstreiks sieben [[World Central Kitchen]]-Mitarbeiter in Gaza, darunter drei Briten, einen Australier, einen Kanadier, einen Polen und einen palästinensisch-amerikanischen Doppelstaatler, die nach der Entladung einer Lebensmittelhilfe-Lieferung unterwegs waren.", "Die [[Israel Defense Forces]] kündigten am 19. August 2026, dem Welttag der Humanitären Hilfe, an, dass trotz festgestellter schwerwiegender Fehler keine strafrechtlichen Ermittlungen eingeleitet werden, da kein begründeter Verdacht auf kriminelles Fehlverhalten bestehe.", "[[Vereinigtes Königreich]], [[Kanada]] und [[Australien]] bezeichneten diese Entscheidung in einer gemeinsamen Erklärung als \"beschämend\" und forderten weiterhin Rechenschaft für die Opfer und ihre Familien, nachdem sie mehr als zwei Jahre lang auf eine gründliche Untersuchung gedrängt hatten.", "Die drei Staaten kritisierten, dass der Zeitpunkt der Ankündigung am Welttag der Humanitären Hilfe besonders verwerflich sei und hoben hervor, dass Gaza mit 186 getöteten humanitären Helfern im Jahr 2025 der gefährlichste Ort für Hilfslieferungen weltweit bleibt.", "[[World Central Kitchen]]-Gründer [[Jose Andres]] und die Organisation selbst verurteilten die Entscheidung als unvereinbar mit der vollen Wahrheit und forderten eine unabhängige Untersuchungskommission, da die israelische Armee ihre eigenen Handlungen nicht glaubwürdig untersuchen könne."], "deep_dive": "Der Vorfall vom 1. April 2024 markiert einen der schwersten Einzelangriffe auf internationale Hilfsorganisationen im Gaza-Konflikt. Die [[Israel Defense Forces]] erklärten, ein bewaffneter Wachmann im Konvoi sei ihnen nicht gemeldet worden und fälschlicherweise als Hamas-Kämpfer identifiziert worden. Zudem habe der Konvoi von der mit dem Militär abgestimmten Route abgewichen. Was die diplomatische Empörung verstärkt, ist die Tatsache, dass nach dem ersten Treffer zwei weitere Angriffe im Minutenabstand folgten, obwohl [[Israel]] den ersten Angriff als \"katastrophalen Fehler\" bezeichnete. Diese Frage nach den Folgeanschlägen bleibt laut der australischen Außenministerin [[Penny Wong]] unbeantwortet.\n\nDie Entscheidung, keine strafrechtlichen Ermittlungen einzuleiten, steht exemplarisch für ein breiteres Muster fehlender Rechenschaftspflicht in Gaza. Die drei westlichen Staaten weisen darauf hin, dass der [[World Central Kitchen]]-Angriff nur einer von \"zahllosen Vorfällen\" sei, bei denen es keine Verantwortungsübernahme gegeben habe. Diese systematische Straflosigkeit betrifft einen Konflikt, in dem humanitäre Helfer einem beispiellosen Risiko ausgesetzt sind. Die Zahl von 186 getöteten Helfern allein im Jahr 2025 unterstreicht die Dringlichkeit effektiver Schutzmaßnahmen und Ermittlungsmechanismen.\n\nDie diplomatische Reaktion zeigt eine wachsende Kluft zwischen [[Israel]] und seinen traditionellen westlichen Verbündeten. Während [[Vereinigtes Königreich]], [[Australien]] und [[Kanada]] ihre Unterstützung für [[Israel]]s Sicherheit grundsätzlich aufrechterhalten, signalisiert die scharfe öffentliche Kritik und das Einbestellen israelischer Botschafter eine Grenze der Toleranz gegenüber Operationen, die internationale Staatsbürger betreffen. Die Wahl des Welttags der Humanitären Hilfe für die Ankündigung wurde von den drei Staaten als besonders provokativ wahrgenommen und verstärkt den Eindruck mangelnder Sensibilität für internationale Normen des humanitären Völkerrechts.", "cui_bono": "Die Entscheidung, keine strafrechtlichen Ermittlungen einzuleiten, schützt militärische Kommandeure der [[Israel Defense Forces]] vor möglicher strafrechtlicher Verfolgung im Inland und potenziell vor internationalen Verfahren. Für [[Israel]] als Staat bewahrt sie operative Handlungsfreiheit im Gaza-Konflikt, indem sie vermeidet, Präzedenzfälle für militärische Rechenschaftspflicht zu schaffen. Gleichzeitig bietet die internationale Empörung den westlichen Verbündeten [[Vereinigtes Königreich]], [[Kanada]] und [[Australien]] eine Möglichkeit, innenpolitischen Druck aufzufangen und gegenüber ihren Wählern moralische Distanz zu [[Israel]]s Gaza-Operationen zu demonstrieren, ohne substantielle politische oder militärische Unterstützung zurückzuziehen.", "historical_threads": [{"id": "gaza_konflikt_humanitaere_krise", "title": "Gaza-Konflikt und humanitäre Krise", "entries": [{"date": "2007", "title": "Hamas übernimmt Kontrolle über Gaza", "one_line": "Nach dem palästinensischen Bürgerkrieg etabliert Hamas ihre alleinige Herrschaft über Gaza, woraufhin Israel und Ägypten eine Blockade verhängen, die den Zugang für humanitäre Hilfe seither erschwert.", "extended": "Die Hamas-Kontrolle führte zu einer israelisch-ägyptischen Blockade, die Bewegungsfreiheit und Warenverkehr massiv einschränkte. Humanitäre Organisationen mussten seither komplexe Koordinationsmechanismen mit israelischen Behörden entwickeln, um Hilfsgüter nach Gaza zu bringen. Diese Strukturen bilden den Kontext, in dem der World Central Kitchen-Konvoi 2024 operierte."}, {"date": "2014", "title": "Operation Protective Edge", "one_line": "Während des 50-tägigen Gaza-Krieges werden mehrere UN-Einrichtungen getroffen, was erstmals internationale Aufmerksamkeit auf die Risiken für humanitäre Infrastruktur in Gaza lenkt.", "extended": "Der Konflikt von 2014 kostete über 2.200 palästinensische Leben und führte zu mehreren Vorfällen mit Angriffen auf UN-Schulen und Hilfseinrichtungen. Internationale Untersuchungen stellten Muster unzureichender Vorsichtsmaßnahmen fest, ohne dass strafrechtliche Konsequenzen folgten. Dies etablierte ein Muster fehlender Rechenschaftspflicht, das sich bis heute fortsetzt."}, {"date": "Oktober 2023", "title": "Beginn des aktuellen Gaza-Krieges", "one_line": "Nach dem Hamas-Angriff auf Israel am 7. Oktober 2023 beginnen israelische Militäroperationen in Gaza, die zu einer beispiellosen humanitären Krise und massiv erhöhten Risiken für Hilfsorganisationen führen.", "extended": "Die israelische Militäroperation als Reaktion auf den Hamas-Angriff führte zu Zehntausenden Toten und einer Vertreibung der Mehrheit der Gaza-Bevölkerung. Der humanitäre Zugang wurde extrem eingeschränkt, während gleichzeitig der Bedarf dramatisch anstieg. In diesem Kontext versuchten Organisationen wie World Central Kitchen, Nahrungsmittelhilfe zu leisten, was zunehmend lebensgefährlich wurde."}, {"date": "April 2024", "title": "World Central Kitchen-Angriff", "one_line": "Israelische Drohnen töten sieben internationale Helfer in drei aufeinanderfolgenden Angriffen auf einen deutlich markierten Hilfskonvoi, was globale Empörung und vorübergehende Aussetzung von Hilfsoperationen auslöst.", "extended": "Die drei aufeinanderfolgenden Angriffe auf klar als humanitär gekennzeichnete Fahrzeuge trotz vorheriger Koordination mit israelischen Behörden stellten einen Wendepunkt dar. Mehrere Hilfsorganisationen setzten ihre Operationen temporär aus. Israel bezeichnete den Vorfall als tragischen Fehler und versprach Untersuchungen, deren Ergebnisse nun nach über zwei Jahren ohne strafrechtliche Konsequenzen präsentiert wurden."}]}, {"id": "voelkerrecht_rechenschaftspflicht", "title": "Völkerrecht und militärische Rechenschaftspflicht", "entries": [{"date": "1949", "title": "Genfer Konventionen", "one_line": "Die Genfer Konventionen etablieren den Schutz von Zivilisten und humanitären Helfern in bewaffneten Konflikten als fundamentales Prinzip des humanitären Völkerrechts.", "extended": "Die vier Genfer Konventionen und ihre Zusatzprotokolle verpflichten Konfliktparteien, zwischen Kombattanten und Zivilisten zu unterscheiden und humanitäres Personal zu schützen. Vorsätzliche Angriffe auf Hilfskonvois gelten als schwere Verletzungen dieser Konventionen. Die Vertragsstaaten sind zur Verfolgung solcher Verstöße verpflichtet, was die Grundlage für die Forderungen nach Ermittlungen im World Central Kitchen-Fall bildet."}, {"date": "2002", "title": "Internationaler Strafgerichtshof nimmt Arbeit auf", "one_line": "Der IStGH in Den Haag erhält Jurisdiktion über Kriegsverbrechen, Verbrechen gegen die Menschlichkeit und Völkermord, kann aber nur tätig werden, wenn nationale Justizsysteme nicht willens oder fähig sind zu ermitteln.", "extended": "Das Komplementaritätsprinzip des IStGH bedeutet, dass Staaten primär selbst für die Strafverfolgung zuständig sind. Nur wenn glaubwürdige nationale Ermittlungen fehlen, kann der IStGH eingreifen. Israels Entscheidung, keine strafrechtlichen Ermittlungen zum World Central Kitchen-Angriff einzuleiten, könnte theoretisch die Tür für internationale Jurisdiktion öffnen, obwohl Israel das Römische Statut nicht ratifiziert hat."}, {"date": "2021", "title": "IStGH eröffnet Untersuchung zu Palästina", "one_line": "Der Internationale Strafgerichtshof beginnt formelle Ermittlungen zu möglichen Kriegsverbrechen in den palästinensischen Gebieten, einschließlich Gaza, seit 2014.", "extended": "Die Anklagebehörde des IStGH unter Fatou Bensouda, später Karim Khan, erhielt grünes Licht für Untersuchungen sowohl zu israelischen als auch palästinensischen Handlungen. Israel und die USA erkennen die Jurisdiktion des Gerichtshofs in dieser Sache nicht an. Die laufenden IStGH-Ermittlungen bilden den breiteren rechtlichen Kontext, in dem Israels interne Entscheidung, den World Central Kitchen-Fall nicht strafrechtlich zu verfolgen, internationale Aufmerksamkeit erregt."}, {"date": "August 2026", "title": "Keine Ermittlungen zum WCK-Angriff", "one_line": "Israels Entscheidung, trotz festgestellter schwerer Fehler keine strafrechtlichen Ermittlungen einzuleiten, wird von westlichen Verbündeten als Versagen der Rechenschaftspflicht kritisiert.", "extended": "Die israelische Militärjustiz stellte zwar operative Fehler auf verschiedenen Kommandoebenen fest, sah aber keinen begründeten Verdacht auf kriminelles Verhalten. Diese Unterscheidung zwischen organisatorischem Versagen und strafrechtlicher Verantwortung wird von den betroffenen Staaten und World Central Kitchen abgelehnt. Die Entscheidung stärkt Argumente, dass interne Mechanismen nicht ausreichen und externe Untersuchungen nötig sind."}]}, {"id": "world_central_kitchen", "title": "World Central Kitchen als Organisation", "entries": [{"date": "2010", "title": "Gründung von World Central Kitchen", "one_line": "Starkoch Jose Andres gründet die Hilfsorganisation nach dem Erdbeben in Haiti mit dem Fokus, in Katastrophengebieten schnell Nahrungsmittelhilfe zu leisten.", "extended": "World Central Kitchen entwickelte ein Modell, das lokale Küchen und Köche mobilisiert, um große Mengen frisch zubereiteter Mahlzeiten in Krisengebieten zu liefern. Die Organisation gewann zunehmend internationales Ansehen für ihre Flexibilität und Effektivität. Ihr Ansatz unterscheidet sich von traditioneller Lebensmittelhilfe durch den Fokus auf warme, kulturell angepasste Mahlzeiten statt Nahrungsmittelpakete."}, {"date": "2022-2023", "title": "Expansion nach Ukraine und Türkei", "one_line": "WCK liefert Millionen Mahlzeiten in der Ukraine nach der russischen Invasion und nach dem türkisch-syrischen Erdbeben, was die Organisation zu einer der sichtbarsten humanitären Akteure macht.", "extended": "Die schnelle und umfangreiche Reaktion auf diese Krisen etablierte World Central Kitchen als bevorzugten Partner vieler Spender und steigerte die öffentliche Sichtbarkeit erheblich. Die Organisation arbeitete in aktiven Konfliktgebieten und bewies ihre Fähigkeit, auch unter schwierigen Sicherheitsbedingungen zu operieren, was später die Entscheidung beeinflusste, in Gaza tätig zu werden."}, {"date": "Oktober 2023", "title": "Beginn der Gaza-Operationen", "one_line": "Nach Ausbruch des Gaza-Krieges beginnt WCK mit Hilfslieferungen in das Gebiet und koordiniert eng mit israelischen Behörden, um Sicherheit der Konvois zu gewährleisten.", "extended": "World Central Kitchen etablierte Kommunikationskanäle mit den Israel Defense Forces, um Bewegungen von Konvois zu koordinieren und Sicherheit zu maximieren. Die Organisation setzte klar gekennzeichnete Fahrzeuge mit sichtbaren Logos ein. Diese Vorsichtsmaßnahmen machten den späteren tödlichen Angriff umso schockierender und führten zu Fragen, ob selbst vollständige Koordination ausreichenden Schutz in Gaza bieten kann."}, {"date": "April 2024", "title": "Aussetzung der Gaza-Operationen nach Angriff", "one_line": "Nach dem Tod der sieben Mitarbeiter setzt WCK seine Operationen in Gaza sofort aus und fordert unabhängige Untersuchungen, während Jose Andres öffentlich israelische Führung kritisiert.", "extended": "Die Aussetzung hatte unmittelbare Auswirkungen auf die Nahrungsmittelversorgung in Gaza, da WCK einer der wenigen aktiven internationalen Akteure war. Andere Hilfsorganisationen überprüften ebenfalls ihre Sicherheitsprotokolle. Jose Andres' ungewöhnlich direkte öffentliche Kritik an Israel verstärkte den politischen Druck. Die Organisation machte deutlich, dass Wiederaufnahme der Arbeit von glaubwürdigen Sicherheitsgarantien und Rechenschaftspflicht abhänge."}]}], "entities": [{"name": "Israel", "type": "country", "role_in_story": "Entschied nach mehr als zwei Jahren, keine strafrechtlichen Ermittlungen zum tödlichen Angriff auf den World Central Kitchen-Konvoi einzuleiten, was internationale diplomatische Kritik auslöste.", "profile": "Israel balanciert seit Jahrzehnten zwischen militärischer Sicherheitsdoktrin und internationalen Erwartungen humanitärer Standards. Das Land verweist regelmäßig auf sein Recht auf Selbstverteidigung und interne Untersuchungsmechanismen, während internationale Akteure wiederholt fehlende Rechenschaftspflicht bei zivilen Opfern kritisieren. Die Ablehnung externer Jurisdiktion, insbesondere des Internationalen Strafgerichtshofs, ist konstantes Muster israelischer Politik.", "established": "1948", "image_url": null}, {"name": "Israel Defense Forces", "type": "organization", "role_in_story": "Führten die Drohnenangriffe auf den World Central Kitchen-Konvoi durch und stellten fest, dass trotz schwerwiegender Fehler kein begründeter Verdacht auf kriminelles Fehlverhalten vorliege.", "profile": "Die IDF operieren nach Doktrin der militärischen Notwendigkeit mit internen Untersuchungsmechanismen für Vorfälle. Die Organisation betont technologische Präzision und Koordinationssysteme für humanitäre Akteure, steht aber wiederholt in der Kritik für Vorfälle mit zivilen Opfern ohne strafrechtliche Konsequenzen. Das Muster zeigt Tendenz, operative Fehler anzuerkennen, aber strafrechtliche Verantwortung abzulehnen.", "established": "1948", "image_url": null}, {"name": "World Central Kitchen", "type": "organization", "role_in_story": "Verlor sieben Mitarbeiter bei dem israelischen Angriff und kritisiert die Entscheidung gegen strafrechtliche Ermittlungen als unvereinbar mit der vollen Wahrheit, fordert unabhängige Untersuchungskommission.", "profile": "Von Starkoch Jose Andres 2010 gegründete Hilfsorganisation mit Fokus auf schnelle Nahrungsmittelhilfe in Katastrophen- und Konfliktgebieten. Bekannt für flexibles, lokales Arbeitsmodell und hohe öffentliche Sichtbarkeit. Nach dem Gaza-Vorfall verstärkte die Organisation ihre Forderung nach unabhängigen Schutzstandards für humanitäre Helfer und zeigte Bereitschaft zu öffentlicher Konfrontation mit Regierungen.", "established": "2010", "image_url": null}, {"name": "Jose Andres", "type": "person", "role_in_story": "Gründer von World Central Kitchen, beschrieb die Entscheidung Israels als falsch und schmerzhaft und forderte eine unabhängige Untersuchungskommission.", "profile": "Spanisch-amerikanischer Starkoch, der humanitäre Arbeit zu seinem zweiten Schwerpunkt machte. Nutzt seine öffentliche Prominenz und Medienpräsenz, um politischen Druck für humanitäre Anliegen auszuüben. Zeigt Muster direkter öffentlicher Kritik an Regierungen, wenn Mitarbeiter seiner Organisation gefährdet werden, ungewöhnlich für Leiter von Hilfsorganisationen, die traditionell diplomatische Zurückhaltung wahren.", "established": "1969", "image_url": null}, {"name": "Vereinigtes Königreich", "type": "country", "role_in_story": "Verurteilte gemeinsam mit Kanada und Australien Israels Entscheidung als beschämend, da drei britische Staatsbürger bei dem Angriff getötet wurden.", "profile": "Traditioneller enger Verbündeter Israels mit historischen Bindungen, zeigt aber zunehmende Bereitschaft zu öffentlicher Kritik bei Vorfällen mit britischen Opfern. Balanciert zwischen strategischer Partnerschaft im Nahen Osten und innenpolitischem Druck durch öffentliche Meinung zu Gaza-Konflikt. Bevorzugt diplomatische Kanäle und gemeinsame Statements mit verbündeten Staaten für Kritik.", "established": null, "image_url": null}, {"name": "Kanada", "type": "country", "role_in_story": "Verurteilte gemeinsam mit dem Vereinigten Königreich und Australien Israels Entscheidung, da ein kanadischer und ein dual US-kanadischer Staatsbürger bei dem Angriff starben.", "profile": "Mittelmacht mit Tradition multilateraler Diplomatie und Betonung humanitären Völkerrechts. Kanada versucht traditionell ausgleichende Position im Nahostkonflikt zu wahren, zeigt aber bei Gefährdung eigener Bürger deutliche Reaktion. Koordiniert diplomatischen Druck bevorzugt mit gleichgesinnten Staaten statt unilateral.", "established": null, "image_url": null}, {"name": "Australien", "type": "country", "role_in_story": "Bestellte den israelischen Botschafter ein, verurteilte die Entscheidung als empörend und stellte unbeantwortet Fragen zu den aufeinanderfolgenden Angriffen.", "profile": "Enger Verbündeter der USA und Israels im pazifischen Raum, zeigt aber bei Vorfällen mit australischen Opfern klare Bereitschaft zu konfrontativer Diplomatie. Unter Außenministerin Penny Wong verstärktes Profil bei Menschenrechts- und Völkerrechtsfragen. Das Einbestellen von Botschaftern ist für Australien ein selten genutztes, starkes diplomatisches Signal.", "established": null, "image_url": null}, {"name": "Penny Wong", "type": "person", "role_in_story": "Australische Außenministerin, die erklärte, ihr Land sei empört über Israels Entscheidung und viele Fragen blieben unbeantwortet, insbesondere zu den Folgeanschlägen.", "profile": "Seit 2022 australische Außenministerin der Labor-Regierung, bekannt für wertebasierte Außenpolitik mit Schwerpunkt auf Menschenrechten und multilateralen Institutionen. Wong zeigt Bereitschaft zu direkterer Kritik an traditionellen Verbündeten als ihre konservativen Vorgänger. Ihre Betonung konkreter unbeantworteter Fragen statt allgemeiner Kritik reflektiert juristisch präzisen Ansatz.", "established": "1968", "image_url": null}], "quotes": [{"text": "The victims of this incident and their families deserve justice and accountability, and we will continue to seek answers on their behalf.", "attribution": "Gemeinsame Erklärung der Außenministerien von UK, Kanada und Australien", "context": "Offizielle Stellungnahme der drei Staaten zur israelischen Entscheidung", "source_url": "https://www.bbc.com/news/articles/cy8g4l2e242o"}, {"text": "there was no criminal intention", "attribution": "Hillel Newman, israelischer Botschafter in Australien", "context": "Verteidigung der Entscheidung, keine strafrechtlichen Ermittlungen einzuleiten", "source_url": "https://www.bbc.com/news/articles/cy8g4l2e242o"}, {"text": "the Israeli army cannot credibly investigate its own conduct", "attribution": "World Central Kitchen", "context": "Begründung der Forderung nach einer unabhängigen Untersuchungskommission", "source_url": "https://english.aawsat.com/arab-world/5098831-uk-canada-australia-slam-israel-ending-probe-aid-worker-killings"}], "political_theory": {"theory": "[[Humanitäres Völkerrecht]]", "points": ["Der Fall illustriert die Spannung zwischen staatlicher Souveränität bei militärischen Operationen und universellen Schutzpflichten für humanitäres Personal gemäß den Genfer Konventionen.", "[[Israel]]s Unterscheidung zwischen operativen Fehlern und kriminellem Fehlverhalten zeigt die Herausforderung, völkerrechtliche Normen in nationale Rechtssysteme zu übersetzen, wenn diese unterschiedliche Schwellen für strafrechtliche Verantwortung haben.", "Die Forderung von [[World Central Kitchen]] nach einer unabhängigen Kommission reflektiert das Prinzip, dass Staaten, die ihre eigenen Streitkräfte untersuchen, einen inhärenten Interessenkonflikt haben, der externe Aufsicht erfordert.", "Die Betonung der [[Vereinigtes Königreich]], [[Kanada]] und [[Australien]], dass Gaza der gefährlichste Ort für Hilfslieferungen bleibt, unterstreicht das systematische Vers
