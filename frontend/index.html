ach gründliche Untersuchungen, doch strukturelle Probleme blieben ungelöst."}, {"date": "2025-05", "title": "Absturz im Samburu County mit internationalen Opfern", "one_line": "Der jüngste Unfall mit fünf US-Bürgern und einem ecuadorianischen Geheimdienstchef verstärkt internationalen Druck auf Kenias Luftfahrtregulierung.", "extended": "Die Beteiligung prominenter internationaler Opfer bringt diplomatische Aufmerksamkeit und könnte zu externen Nachfragen über Sicherheitsstandards führen. Die Tourismusbranche, eine Haupteinnahmequelle Kenias, steht vor der Herausforderung, Vertrauen zu erhalten, während die Regierung unter Druck steht, strengere Kontrollen durchzusetzen."}]}, {"id": "kenya_tourism_infrastructure", "title": "Kenias Safari-Tourismusmodell", "entries": [{"date": "1960er", "title": "Aufbau des modernen Safari-Tourismus", "one_line": "Nach der Unabhängigkeit entwickelt Kenia ein Geschäftsmodell, das auf exklusivem Naturzugang für zahlungskräftige Touristen basiert.", "extended": "Kenia positionierte sich als führendes Safari-Ziel Afrikas, mit einem Fokus auf Luxusreisen und Wildtierbeobachtung. Der Tourismus wurde zu einer zentralen Einnahmequelle. Private Schutzgebiete und Lodges entstanden, die auf Helikopter angewiesen waren, um Gäste in entlegene Regionen zu transportieren."}, {"date": "1990er", "title": "Privatisierung von Schutzgebieten", "one_line": "Private Conservancies wie Suyian und Loisaba entstehen, die auf Helikopterlogistik setzen, um wohlhabende Besucher anzuziehen.", "extended": "Diese privaten Naturschutzgebiete bieten exklusive Erlebnisse abseits der Massen und arbeiten eng mit Helikopterunternehmen zusammen. Das Modell ermöglicht schnellen Zugang zu abgelegenen Orten, schafft aber auch Abhängigkeit von sicheren Lufttransporten. Die Nachfrage nach Charter-Helikoptern wuchs stetig."}, {"date": "2010er", "title": "Boom des Luxus-Safarimarkts", "one_line": "Internationale Reiseveranstalter wie +Beyond expandieren in Kenia und bieten High-End-Safaris mit Helikoptertransfer an.", "extended": "Unternehmen wie +Beyond etablierten sich als führende Anbieter exklusiver Safari-Erlebnisse, die oft Helikopterflüge zwischen entlegenen Lodges beinhalten. Die Zielgruppe sind wohlhabende Reisende, die bereit sind, für Komfort und Exklusivität zu zahlen. Das Geschäftsmodell verstärkt die Abhängigkeit von privaten Luftfahrtdiensten."}, {"date": "2020", "title": "Pandemie-Einbruch und Erholung", "one_line": "COVID-19 lähmt den Tourismus, doch die Branche erholt sich schnell mit Fokus auf vermögende Individualtouristen.", "extended": "Die Pandemie führte zu einem fast vollständigen Stillstand des internationalen Tourismus in Kenia. Bei der Erholung setzte die Branche verstärkt auf private, sichere Reiseerlebnisse, was die Nachfrage nach Helikoptercharter weiter erhöhte. Die Konkurrenz unter Anbietern nahm zu, möglicherweise auf Kosten von Sicherheitsstandards."}]}, {"id": "ecuador_intelligence_apparatus", "title": "Ecuadors Geheimdienst und Sicherheitspolitik", "entries": [{"date": "2009", "title": "Gründung des nationalen Geheimdienstes", "one_line": "Ecuador etabliert eine zentrale Nachrichtenbehörde nach Jahren fragmentierter Sicherheitsdienste.", "extended": "Die Schaffung des Centro de Inteligencia Nacional zielte darauf ab, inländische und ausländische Bedrohungen besser zu koordinieren. Die Behörde operierte in einem politisch aufgeladenen Umfeld unter Präsident Rafael Correa und wurde mehrfach reorganisiert. Die Rolle des Geheimdienstes in der ecuadorianischen Politik blieb kontrovers."}, {"date": "2020er", "title": "Organisiertes Verbrechen als Hauptbedrohung", "one_line": "Ecuadors Geheimdienst konzentriert sich zunehmend auf Drogenkartelle und Bandengewalt, die das Land destabilisieren.", "extended": "Ecuador erlebte einen dramatischen Anstieg der organisierten Kriminalität, insbesondere durch mexikanische und kolumbianische Kartelle. Der Geheimdienst wurde beauftragt, diese Bedrohungen zu bekämpfen und mit internationalen Partnern zu kooperieren. Die Arbeit ist gefährlich und politisch sensibel."}, {"date": "2025-05", "title": "Tod des Geheimdienstchefs im Ausland", "one_line": "Der Verlust von Michele Sensi-Contugi während eines Privaturlaubs stellt Ecuador vor eine Führungslücke in kritischer Sicherheitslage.", "extended": "Sensi-Contugis Tod ereignet sich zu einem Zeitpunkt, an dem Ecuador mit anhaltender Gewalt und organisiertem Verbrechen kämpft. Die ecuadorianische Regierung muss schnell einen Nachfolger finden, während sie den Verlust diplomatisch verarbeitet. Der Vorfall wirft Fragen auf über die Sicherheitsvorkehrungen für hochrangige Beamte im Ausland."}]}], "entities": [{"name": "Kenia", "type": "country", "role_in_story": "Kenia ist der Ort des Helikopterabsturzes und ein führendes Safari-Reiseziel, dessen Tourismusbranche stark auf Lufttransporte angewiesen ist.", "profile": "Kenia hat sich seit der Unabhängigkeit 1963 als führende Safari-Destination Afrikas etabliert und setzt auf Luxus-Tourismus als wichtige Einnahmequelle. Das Land steht vor der Herausforderung, Naturschutz, wirtschaftliche Entwicklung und Sicherheitsstandards in der Luftfahrt in Einklang zu bringen. Die wiederholten Helikopterabstürze werfen Fragen zur Regulierungsdurchsetzung auf.", "established": null, "image_url": null}, {"name": "José Suárez", "type": "person", "role_in_story": "José Suárez war ein 55-jähriger Führungskraft von Telemundo und starb beim Absturz während einer Safari-Reise in Kenia.", "profile": "Suárez war President und General Manager mehrerer Telemundo-Sender in Florida und eine prominente Figur im spanischsprachigen US-Mediengeschäft. Er repräsentiert die wachsende Bedeutung lateinamerikanischer Medien in den USA und ihre wirtschaftliche Rolle in Staaten wie Florida.", "established": null, "image_url": null}, {"name": "Telemundo", "type": "organization", "role_in_story": "Telemundo ist das spanischsprachige TV-Netzwerk, für das José Suárez arbeitete und mehrere Sender leitete.", "profile": "Telemundo ist ein großes spanischsprachiges Fernsehnetzwerk in den USA, im Besitz von NBCUniversal, und richtet sich an die lateinamerikanische Bevölkerung. Es konkurriert mit Univision um Marktanteile und spielt eine wichtige Rolle in der Medienlandschaft für Hispanics in den USA.", "established": "1984", "image_url": null}, {"name": "Michele Sensi-Contugi", "type": "person", "role_in_story": "Michele Sensi-Contugi war Direktor des ecuadorianischen Geheimdienstes und starb zusammen mit seiner Frau beim Absturz während eines Privatbesuchs als Tourist in Kenia.", "profile": "Als Chef des nationalen Geheimdienstes Ecuadors war Sensi-Contugi verantwortlich für die Koordination der Bekämpfung organisierter Kriminalität und Drogenhandels in einem Land, das zunehmend von Bandengewalt betroffen ist. Sein Tod hinterlässt eine kritische Führungslücke in Ecuadors Sicherheitsapparat.", "established": null, "image_url": null}, {"name": "Lady Lori Helicopters", "type": "organization", "role_in_story": "Lady Lori Helicopters ist das kenianische Unternehmen, das den abgestürzten Helikopter betrieb.", "profile": "Lady Lori Helicopters ist ein lokaler Anbieter von Charter-Helikopterflügen in Kenia, der vor allem Safari-Touristen bedient. Das Unternehmen muss sich nun mit der Untersuchung des Absturzes und möglichen Reputationsschäden auseinandersetzen, während es in einem kompetitiven Markt tätig ist.", "established": null, "image_url": null}, {"name": "Samburu County", "type": "country", "role_in_story": "Samburu County ist die Verwaltungsregion im Norden Kenias, in der sich der Absturz ereignete.", "profile": "Samburu County ist bekannt für seine spektakulären Landschaften, Wildtierreservate und die Samburu-Kultur. Die Region ist ein beliebtes Ziel für Safari-Touristen, liegt aber in schwer zugänglichem, bergigem Terrain, was Helikopterflüge sowohl attraktiv als auch riskant macht.", "established": null, "image_url": null}, {"name": "Kenya Civil Aviation Authority", "type": "organization", "role_in_story": "Die Kenya Civil Aviation Authority ist die Luftfahrtbehörde, die den Absturz untersucht.", "profile": "Die Behörde wurde im Jahr 2000 gegründet, um die kenianische Luftfahrt zu regulieren und internationale Sicherheitsstandards umzusetzen. Sie steht unter Druck, die Häufung von Helikopterabstürzen zu adressieren und strengere Kontrollen durchzusetzen, um das Vertrauen in Kenias Tourismusbranche zu erhalten.", "established": "2000", "image_url": null}, {"name": "+Beyond", "type": "organization", "role_in_story": "+Beyond ist das Luxus-Reiseunternehmen, für dessen Gäste der abgestürzte Helikopter unterwegs war.", "profile": "+Beyond ist ein führender Anbieter von High-End-Safari-Erlebnissen in Afrika und anderen Regionen. Das Unternehmen setzt auf exklusive, private Reiseerlebnisse und arbeitet eng mit Helikopterunternehmen zusammen, um Gästen Zugang zu entlegenen Gebieten zu ermöglichen. Sicherheitsvorfälle gefährden das Markenversprechen.", "established": "1991", "image_url": null}, {"name": "US-Außenministerium", "type": "organization", "role_in_story": "Das US-Außenministerium bestätigte den Tod der fünf US-Bürger und bietet konsularische Unterstützung für die Angehörigen.", "profile": "Das Außenministerium ist verantwortlich für den Schutz amerikanischer Staatsbürger im Ausland und die diplomatische Vertretung der USA. In Fällen wie diesem koordiniert es mit lokalen Behörden, unterstützt Familien und kann diplomatischen Druck ausüben, um Untersuchungen und Sicherheitsstandards zu verbessern.", "established": "1789", "image_url": null}, {"name": "Ecuador", "type": "country", "role_in_story": "Ecuador ist das Heimatland von Michele Sensi-Contugi und seiner Frau, die beide beim Absturz starben.", "profile": "Ecuador kämpft seit Jahren mit zunehmender organisierter Kriminalität, Drogenhandel und Bandengewalt. Der Verlust des Geheimdienstchefs stellt das Land vor eine Herausforderung in einer kritischen Sicherheitslage. Die Regierung muss schnell einen Nachfolger finden und die Arbeit der Sicherheitsbehörden fortführen.", "established": null, "image_url": null}, {"name": "Stephany Hollihan Vasconez", "type": "person", "role_in_story": "Stephany Hollihan Vasconez war die Frau von Michele Sensi-Contugi und starb ebenfalls beim Absturz.", "profile": "Sie war sowohl US-amerikanische als auch ecuadorianische Staatsbürgerin und hinterlässt zwei Kinder. Ihre doppelte Staatsbürgerschaft illustriert die engen familiären und wirtschaftlichen Verbindungen zwischen den USA und Ecuador.", "established": null, "image_url": null}, {"name": "USA", "type": "country", "role_in_story": "Die USA sind das Heimatland von fünf der sieben Todesopfer, darunter José Suárez.", "profile": "Die USA sind ein wichtiger Akteur in internationalen Sicherheits- und Tourismusfragen. Der Tod mehrerer US-Bürger bei einem Unfall im Ausland löst konsularische Unterstützung aus und kann zu diplomatischen Nachfragen über lokale Sicherheitsstandards führen. Die Trump-Administration betonte die Priorität des Schutzes amerikanischer Bürger.", "established": null, "image_url": null}], "quotes": [{"text": "We are heartbroken to learn the tragic news that José was killed in a helicopter accident in Kenya", "attribution": "NBCUniversal and Telemundo leadership", "context": "Gemeinsame Erklärung zum Tod von José Suárez", "source_url": "https://www.theguardian.com/world/2025/may/21/kenya-helicopter-crash-telemundo-executive-ecuador-intelligence-chief"}, {"text": "The Trump Administration has no higher priority than the safety and security of Americans", "attribution": "US State Department", "context": "Offizielle Stellungnahme zum Tod der fünf US-Bürger", "source_url": "https://www.foxnews.com/world/5-americans-killed-helicopter-crash-kenya-including-telemundo-executive"}, {"text": "In this moment of deep sorrow, the government extends its heartfelt condolences to his family, loved ones and close associates", "attribution": "Ecuador presidency", "context": "Erklärung zum Tod von Michele Sensi-Contugi auf X", "source_url": "https://www.theguardian.com/world/2025/may/21/kenya-helicopter-crash-telemundo-executive-ecuador-intelligence-chief"}], "political_theory": null, "connections": [{"source": "José Suárez", "target": "Telemundo", "relation": "war President und General Manager mehrerer Sender"}, {"source": "Michele Sensi-Contugi", "target": "Ecuador", "relation": "leitete den nationalen Geheimdienst"}, {"source": "Lady Lori Helicopters", "target": "+Beyond", "relation": "führte Charterflug für Gäste des Reiseunternehmens durch"}, {"source": "Kenya Civil Aviation Authority", "target": "Kenia", "relation": "staatliche Luftfahrtbehörde, die Unfälle untersucht"}, {"source": "US-Außenministerium", "target": "USA", "relation": "vertritt amerikanische Interessen und unterstützt Bürger im Ausland"}, {"source": "Stephany Hollihan Vasconez", "target": "Michele Sensi-Contugi", "relation": "Ehefrau"}, {"source": "Stephany Hollihan Vasconez", "target": "USA", "relation": "hatte US-Staatsbürgerschaft"}, {"source": "Stephany Hollihan Vasconez", "target": "Ecuador", "relation": "hatte ecuadorianische Staatsbürgerschaft"}], "countries_covered": ["Kenia", "USA", "Ecuador"], "image_url": null, "id": "2d7909d2", "sources": ["Fox News – World", "The Guardian – World"], "article_urls": ["https://www.theguardian.com/world/2026/aug/19/kenya-helicopter-safari-crash", "https://www.foxnews.com/world/5-americans-killed-helicopter-crash-kenya-including-telemundo-executive"], "primary_sources": [], "market_correlation": null, "_pipeline_meta": {"model": "claude-sonnet-4-5", "research_depth": "lite", "articles_used": 2, "input_tokens": 4372, "output_tokens": 7094}}, {"title": "Erste Abschiebungen nach Haiti nach Ende des TPS-Schutzes", "one_line": "Die USA haben mehr als 160 Personen nach Haiti abgeschoben, nachdem die [[Trump-Administration]] einen Rechtsstreit zur Beendigung des [[Temporary Protected Status]] für etwa 350.000 Haitianer gewonnen hatte.", "summary": ["Ein Flugzeug mit 161 Abgeschobenen landete in Cap-Haitien im Norden Haitis, weil der internationale Flughafen in Port-au-Prince aufgrund anhaltender Bandengewalt als zu gefährlich gilt. Die USA haben derzeit ein Verbot für kommerzielle Flüge in die Hauptstadt bis Anfang September verhängt.", "Unter den Abgeschobenen waren sowohl ehemalige [[Temporary Protected Status]]-Inhaber, die seit 2010 legal in den USA gelebt und gearbeitet hatten, als auch Haitianer, die Haftstrafen verbüßt hatten. Einige der Abgeschobenen wurden nicht in Haiti geboren, sind aber haitianischer Abstammung.", "Die Abschiebungen erfolgten erstmals, nachdem der [[Supreme Court der Vereinigten Staaten]] im Juni 2025 die Beendigung des TPS-Programms erlaubte, was etwa eine Million Menschen aus mehr als einem Dutzend Ländern betrifft. Am 5. August hob ein Bundesrichter in Washington, D.C., die Anordnung auf, die Abschiebungen von Haitianern mit TPS verhindert hatte.", "Gangs kontrollieren schätzungsweise 70 Prozent von Port-au-Prince und weite Gebiete darüber hinaus, was die Rückkehr extrem gefährlich macht. Viele Abgeschobene bedeckten ihre Gesichter aus Angst vor Vergeltung, und einige planen gefährliche Reisen in südliche Regionen, wo Gangs bekanntermaßen wahllos auf vorbeifahrende Fahrzeuge schießen.", "Die haitianischen Einwanderungsbehörden boten den Abgeschobenen maximal 65 US-Dollar sowie Essen und Trinken an. Mehr als die Hälfte der fast 12 Millionen Einwohner Haitis benötigt aufgrund eskalierender Bandengewalt und zunehmender Armut humanitäre Hilfe."], "deep_dive": "Die Abschiebungen markieren einen Wendepunkt in einem jahrzehntelangen humanitären Schutzprogramm. Der [[Temporary Protected Status]] wurde nach dem verheerenden Erdbeben 2010 in Haiti eingeführt und sollte haitianischen Staatsangehörigen temporären Schutz vor Abschiebung gewähren, solange ihr Heimatland als unsicher galt. Über 15 Jahre hinweg bauten Hunderttausende Haitianer ein Leben in den USA auf, arbeiteten legal, gründeten Familien und wurden Teil amerikanischer Gemeinden. Die [[Trump-Administration]] hatte bereits in ihrer ersten Amtszeit versucht, das Programm zu beenden, stieß dabei jedoch auf juristischen Widerstand.\n\nDer juristische Kampf um das TPS-Programm zog sich über mehrere Instanzen. Bundesgerichte hatten zunächst Abschiebungen blockiert, doch die Entscheidung des [[Supreme Court der Vereinigten Staaten]] im Juni 2025 beendete diesen Schutz effektiv für etwa eine Million Menschen aus verschiedenen Ländern. Die Aufhebung der einstweiligen Verfügung durch einen Bundesrichter Anfang August war nur noch eine Formalität. Aktivisten und humanitäre Organisationen kritisierten die Entscheidung scharf und verwiesen auf die katastrophale Sicherheitslage in Haiti, wo Gangs weite Teile des Landes kontrollieren und staatliche Strukturen weitgehend kollabiert sind.\n\nDie aktuelle Situation in Haiti ist eine der schwersten humanitären Krisen der westlichen Hemisphäre. Bandengewalt hat Hunderttausende vertrieben, die Wirtschaft liegt am Boden, und mehr als die Hälfte der Bevölkerung ist auf humanitäre Hilfe angewiesen. Der Flughafen in Port-au-Prince ist so unsicher, dass selbst die USA dort keine kommerziellen Flüge mehr erlauben. In diese Lage werden nun Menschen abgeschoben, von denen einige seit 15 Jahren nicht mehr in Haiti waren und einige dort nie gelebt haben. Ein Abgeschobener aus der Dominikanischen Republik kannte Haiti überhaupt nicht, obwohl er haitianischer Abstammung ist.\n\nDie haitianische Regierung betonte, dass sie die Abschiebungen nicht angefordert habe, sondern lediglich ihrer Pflicht nachkomme, Rückkehrer zu empfangen. Mit 65 US-Dollar und begrenzter Infrastruktur ist die Unterstützung minimal für Menschen, die in ein Land zurückkehren, das vielen fremd geworden ist. Die Reisewege innerhalb Haitis sind lebensgefährlich, da Gangs Hauptverkehrsrouten kontrollieren. Die Abschiebungen werfen grundsätzliche Fragen über die Balance zwischen nationalem Einwanderungsrecht und humanitären Verpflichtungen auf, besonders wenn Abschiebungen in Länder erfolgen, die selbst die abschiebende Regierung als zu gefährlich für ihre eigenen Bürger einstuft.", "cui_bono": "Die [[Trump-Administration]] setzt mit den Abschiebungen ein zentrales innenpolitisches Signal um: strikte Durchsetzung von Einwanderungsrecht unabhängig von humanitären Bedenken, was die eigene Wählerbasis mobilisiert. Strukturell profitieren politische Akteure, die Einwanderung als Sicherheits- und Souveränitätsfrage rahmen können, da die Bilder von Abschiebungen diese Narrative verstärken. Gleichzeitig entsteht eine neue Abhängigkeit: Abgeschobene in einem instabilen Haiti könnten erneute Migrationsbewegungen auslösen, was wiederum Rechtfertigungen für härtere Grenzpolitik liefert.", "historical_threads": [{"id": "tps_programm", "title": "TPS-Programm und US-Einwanderungspolitik", "entries": [{"date": "1990", "title": "Einführung des Temporary Protected Status", "one_line": "Der US-Kongress schuf das TPS-Programm im Rahmen des Immigration Act, um Staatsangehörigen aus Ländern mit Naturkatastrophen, bewaffneten Konflikten oder außergewöhnlichen Bedingungen temporären Schutz vor Abschiebung zu gewähren.", "extended": "Das Programm war als flexible humanitäre Antwort gedacht, die dem Präsidenten erlaubt, schnell auf Krisen zu reagieren, ohne den langwierigen Asylprozess zu durchlaufen. Es sollte temporär sein, wurde aber für viele Länder wiederholt verlängert, was zu Jahrzehnten langer De-facto-Aufenthaltsgenehmigung führte. Diese Praxis schuf eine rechtliche Grauzone zwischen temporärem Schutz und dauerhafter Einwanderung."}, {"date": "2010-01", "title": "TPS für Haiti nach Erdbeben", "one_line": "Nach dem verheerenden Erdbeben, das über 200.000 Menschen tötete und Haiti verwüstete, gewährten die USA etwa 350.000 Haitianern TPS-Schutz für zunächst 18 Monate.", "extended": "Die humanitäre Katastrophe war so gravierend, dass beide politischen Parteien die Maßnahme unterstützten. Was als temporäre Hilfe begann, wurde über 15 Jahre hinweg regelmäßig verlängert, da sich die Bedingungen in Haiti nie stabilisierten. Zehntausende Haitianer bauten in dieser Zeit ein neues Leben in den USA auf, bekamen Kinder und integrierten sich in Gemeinden."}, {"date": "2017-2018", "title": "Erste Trump-Administration versucht TPS-Beendigung", "one_line": "Die erste Trump-Regierung kündigte die Beendigung von TPS für mehrere Länder an, argumentierte, dass die ursprünglichen Katastrophenbedingungen nicht mehr bestünden, und löste jahrelange juristische Auseinandersetzungen aus.", "extended": "Gerichte blockten die Beendigungsversuche mit der Begründung, sie seien diskriminierend motiviert und würden die realen Bedingungen in den betroffenen Ländern ignorieren. Die Biden-Administration verlängerte dann TPS erneut für mehrere Länder. Diese Hin- und Her-Bewegung illustrierte den grundlegenden Konflikt zwischen präsidialer Autorität und gerichtlicher Überprüfung in der Einwanderungspolitik."}, {"date": "2025-06", "title": "Supreme Court erlaubt TPS-Beendigung", "one_line": "Der Supreme Court entschied, dass die Exekutive weitreichende Befugnis zur Beendigung des TPS-Programms hat, was etwa eine Million Menschen aus mehr als einem Dutzend Ländern betrifft.", "extended": "Das Urteil stärkte die präsidiale Autorität in der Einwanderungspolitik erheblich und reduzierte den Spielraum für gerichtliche Eingriffe. Kritiker warnten, dass damit humanitäre Überlegungen der politischen Opportunität untergeordnet würden. Die Entscheidung ging die Fälle an untere Gerichte zurück, aber die praktische Wirkung war eindeutig: Der Weg für Abschiebungen war frei."}, {"date": "2025-08-05", "title": "Bundesrichter hebt Abschiebungssperre auf", "one_line": "Ein Bundesrichter in Washington, D.C., hob die letzte juristische Barriere gegen Abschiebungen haitianischer TPS-Inhaber auf, was als Formalität nach dem Supreme Court-Urteil galt.", "extended": "Mit dieser Entscheidung endete über ein Jahrzehnt juristischer Schutz für Hunderttausende. Die Arbeitserlaubnisse wurden nicht verlängert, was viele TPS-Inhaber in eine prekäre Lage brachte: legal anwesend, aber ohne Recht zu arbeiten, und mit der ständigen Gefahr der Abschiebung."}, {"date": "2025-08", "title": "Erste Abschiebungen nach Haiti", "one_line": "161 Personen, darunter ehemalige TPS-Inhaber, wurden nach Haiti abgeschoben, trotz anhaltender Warnungen über die katastrophale Sicherheitslage und des US-Flugverbots nach Port-au-Prince.", "extended": "Die Abschiebungen erfolgten in ein Land, das die USA selbst als zu gefährlich für ihre eigenen Bürger einstufen. Diese Diskrepanz zwischen dem Verbot kommerzieller Flüge aus Sicherheitsgründen und der gleichzeitigen Abschiebung dorthin verdeutlicht den Vorrang politischer über humanitäre Überlegungen. Viele Abgeschobene bedeckten ihre Gesichter aus Angst vor Bandengewalt."}]}, {"id": "haiti_krise", "title": "Haitis Sicherheits- und Staatskollaps", "entries": [{"date": "2010-01", "title": "Erdbeben und humanitäre Katastrophe", "one_line": "Ein Erdbeben der Stärke 7,0 tötete über 200.000 Menschen, zerstörte die Infrastruktur und löste eine internationale Hilfsaktion aus, von der sich Haiti nie vollständig erholte.", "extended": "Die Katastrophe traf eine bereits fragile Staatlichkeit. Trotz Milliarden an internationaler Hilfe blieb der Wiederaufbau chaotisch, korruptionsbehaftet und unvollständig. Die schwachen staatlichen Strukturen wurden weiter ausgehöhlt, was den Boden für spätere Instabilität bereitete. Hunderttausende lebten jahrelang in provisorischen Lagern."}, {"date": "2021-07", "title": "Ermordung von Präsident Jovenel Moïse", "one_line": "Die Ermordung des Präsidenten durch ein Kommando verschärfte das Machtvakuum und die politische Instabilität dramatisch und beschleunigte den Aufstieg bewaffneter Gangs.", "extended": "Das Attentat war symptomatisch für tiefer liegende Staatskrisen: umstrittene Wahlen, Verfassungskonflikte und konkurrierende Machtansprüche. In der Folge nahm die Bandengewalt exponentiell zu, da staatliche Sicherheitskräfte zunehmend machtlos wurden. Gangs, oft mit politischen Verbindungen, füllten das Machtvakuum."}, {"date": "2023-2024", "title": "Bandenübernahme von Port-au-Prince", "one_line": "Bewaffnete Gangs eroberten systematisch Stadtteile der Hauptstadt und kontrollierten schließlich geschätzte 70 Prozent von Port-au-Prince sowie wichtige Verkehrsrouten landesweit.", "extended": "Die Gangs agieren als De-facto-Regierungen in ihren Territorien, erheben Wegzölle, kontrollieren Märkte und terrorisieren die Bevölkerung. Vergewaltigungen, Entführungen und Massaker wurden alltäglich. Hunderttausende wurden vertrieben. Der internationale Flughafen wurde mehrfach angegriffen, was zu Flugverboten führte. Staatliche Institutionen existieren nur noch nominell."}, {"date": "2024-2025", "title": "Internationale Interventionsversuche scheitern", "one_line": "Eine von Kenia geführte internationale Polizeimission zur Stabilisierung Haitis blieb unterfinanziert und weitgehend wirkungslos, während die humanitäre Lage sich weiter verschlechterte.", "extended": "Die internationale Gemeinschaft zeigte wenig Bereitschaft zu substantiellem Engagement. Die kenianische Mission erreichte nie ihre geplante Stärke und blieb auf kleine Gebiete beschränkt. Mehr als die Hälfte der Bevölkerung benötigt nun humanitäre Hilfe, Hunger breitet sich aus, und es gibt faktisch keine funktionierende Regierung mehr, die die Abschiebungen bewältigen könnte."}]}, {"id": "trump_einwanderung", "title": "Trump-Administrations Einwanderungsagenda", "entries": [{"date": "2017-01", "title": "Travel Ban und Einwanderungshärte", "one_line": "Die erste Trump-Administration führte unmittelbar nach Amtsantritt ein Einreiseverbot für mehrere muslimisch geprägte Länder ein und signalisierte damit eine grundsätzliche Neuausrichtung der Einwanderungspolitik.", "extended": "Der sogenannte Muslim Ban wurde mehrfach gerichtlich blockiert und umformuliert, etablierte aber das Muster der Administration: maximale exekutive Autorität in Einwanderungsfragen, Konfrontation mit Gerichten und Priorität nationaler Souveränität über humanitäre Verpflichtungen. Diese Strategie prägte auch den späteren Umgang mit TPS."}, {"date": "2018-2019", "title": "Familientrennungen an der Grenze", "one_line": "Die Zero-Tolerance-Politik führte zur systematischen Trennung von Migrantenfamilien an der US-Mexiko-Grenze, was internationalen Aufschrei auslöste, aber die innenpolitische Basis mobilisierte.", "extended": "Tausende Kinder wurden von ihren Eltern getrennt, viele verloren sich im Bürokratie-Labyrinth. Gerichte ordneten die Beendigung und Familienzusammenführung an, doch viele Familien blieben getrennt. Die Politik demonstrierte die Bereitschaft, humanitäre Kosten für Abschreckungswirkung in Kauf zu nehmen, ein Kalkül, das auch die TPS-Beendigung prägt."}, {"date": "2024-11", "title": "Trumps Wahlkampf auf Massenabschiebung", "one_line": "Trump gewann die Präsidentschaftswahl 2024 teilweise mit dem Versprechen der größten Abschiebeoperation in der US-Geschichte, was Einwanderung erneut zum zentralen politischen Thema machte.", "extended": "Der Wahlkampf rahmte irreguläre Migration als existenzielle Bedrohung für nationale Sicherheit und kulturelle Identität. Die Rhetorik war schärfer als 2016, und die angekündigten Maßnahmen weitreichender. Die Wählerschaft hatte damit ein klares Mandat erteilt, oder zumindest interpretierten Trump und seine Administration es so."}, {"date": "2025", "title": "Systematische Umsetzung der Abschiebungsagenda", "one_line": "Die zweite Trump-Administration setzte nach Amtsantritt konsequent auf Massenabschiebungen, gestärkt durch den Supreme Court-Sieg beim TPS-Programm und mit dem Ziel, die rechtlichen Grenzen exekutiver Einwanderungsmacht auszuloten.", "extended": "Die Haiti-Abschiebungen sind Teil einer breiteren Strategie, die alle verfügbaren rechtlichen Instrumente nutzt, um Abschiebungen zu maximieren. Die Administration profitiert davon, dass der konservativ dominierte Supreme Court exekutive Autorität in Einwanderungsfragen tendenziell weitreichend auslegt. Die Botschaft ist innen- wie außenpolitisch: Die USA setzen ihre Einwanderungsgesetze durch, unabhängig von internationaler Kritik."}]}], "entities": [{"name": "Trump-Administration", "type": "organization", "role_in_story": "Gewann den juristischen Kampf zur Beendigung des TPS-Programms und führte die ersten Abschiebungen nach Haiti durch.", "profile": "Die zweite Trump-Regierung verfolgt eine konsequent restriktive Einwanderungspolitik, die nationale Souveränität und strikte Rechtsdurchsetzung über humanitäre Überlegungen stellt. Das Muster zeigt sich in der Konfrontation mit Gerichten, der Ausreizung exekutiver Befugnisse und der Bereitschaft, international kritisierte Maßnahmen umzusetzen, wenn sie innenpolitisch die eigene Basis mobilisieren. Die Administration nutzt jeden juristischen Sieg zur Ausweitung ihrer Handlungsspielräume.", "established": null, "image_url": null}, {"name": "Temporary Protected Status", "type": "concept", "role_in_story": "Das humanitäre Schutzprogramm wurde für haitianische Staatsangehörige beendet, was die rechtliche Grundlage für die Abschiebungen schuf.", "profile": "TPS ist ein US-Einwanderungsprogramm, das seit 1990 Staatsangehörigen aus Krisenländern temporären Schutz vor Abschiebung und Arbeitserlaubnis gewährt. Konzipiert als flexible Notfallmaßnahme, entwickelte es sich faktisch zu einem langfristigen Aufenthaltsstatus für Hunderttausende, da viele Länder nie stabil genug für sichere Rückkehr wurden. Die Diskrepanz zwischen temporärer Konzeption und dauerhafter Realität macht TPS zum Brennpunkt im Konflikt zwischen humanitärer Verantwortung und Einwanderungskontrolle.", "established": "1990", "image_url": null}, {"name": "Supreme Court der Vereinigten Staaten", "type": "organization", "role_in_story": "Entschied im Juni 2025, dass die Exekutive das TPS-Programm beenden darf, was den Weg für die Abschiebungen freimachte.", "profile": "Das höchste Gericht der USA hat unter seiner aktuellen konservativen Mehrheit wiederholt weitreichende exekutive Befugnisse in Einwanderungs- und Sicherheitsfragen bestätigt. Die Rechtsprechung zeigt ein Muster der Zurückhaltung bei der Überprüfung präsidialer Entscheidungen in diesem Bereich, was der Exekutive erheblichen Spielraum gibt. Dies verstärkt die Machtverschiebung vom Kongress und den Gerichten zur Präsidentschaft in der Einwanderungspolitik.", "established": "1789", "image_url": null}, {"name": "Jean Négot Bonheur Delva", "type": "person", "role_in_story": "Als Generaldirektor des haitianischen Nationalen Migrationsamtes empfing er die Abgeschobenen und organisierte ihre Weiterreise.", "profile": "Delva leitet eine Behörde in einem weitgehend kollabierten Staat und muss Abschiebungen bewältigen, die seine Regierung nicht angefordert hat und für die Haiti kaum Kapazitäten besitzt. Seine öffentlichen Äußerungen betonen die humanitäre Mission seiner Behörde und die Bemühungen um Familienwiedervereinigung, können aber die fundamentale Überforderung des haitianischen Staates nicht verbergen.", "established": null, "image_url": null}], "quotes": [{"text": "It is not the Haitian state that asks for them to be sent back. Our mission is to welcome migrants of forced return. … We welcome them with the aim of accompanying them to their home.", "attribution": "Jean Négot Bonheur Delva", "context": "Generaldirektor des haitianischen Nationalen Migrationsamtes", "source_url": "https://www.cbsnews.com/news/haiti-deportees-arrive-us-ends-tps-protection/"}, {"text": "There is one migrant who knows nothing about Haiti because he said he was coming from the Dominican Republic; that's where he was born.", "attribution": "Jean Négot Bonheur Delva", "context": "Über einen der Abgeschobenen, der nie in Haiti gelebt hatte", "source_url": "https://www.cbsnews.com/news/haiti-deportees-arrive-us-ends-tps-protection/"}], "political_theory": {"theory": "[[Souveränität versus humanitäre Verpflichtung]]", "points": ["Die Abschiebungen illustrieren den Konflikt zwischen staatlicher Souveränität in Einwanderungsfragen und völkerrechtlichen sowie moralischen humanitären Verpflichtungen, besonders wenn Abschiebeziele nachweislich gefährlich sind.", "Die [[Trump-Administration]] rahmt Einwanderungskontrolle als Kernbestandteil nationaler Souveränität, der Vorrang vor internationalen Normen oder humanitären Erwägungen hat. Der juristische Sieg beim [[Supreme Court der Vereinigten Staaten]] stärkt diese Position institutionell.", "Die USA schieben Menschen in ein Land ab, das sie selbst als zu gefährlich für ihre eigenen Bürger einstufen, was die Spannung zwischen rechtlicher Befugnis und faktischer Schutzverantwortung offenlegt. Das US-Flugverbot nach Port-au-Prince kollidiert direkt mit der Abschiebepolitik.", "Das Prinzip des Non-Refoulement, das Abschiebungen in Gefahrensituationen verbietet, wird faktisch ausgehöhlt, wenn temporäre Schutzprogramme wie [[Temporary Protected Status]] politisch beendet werden können, unabhängig von den realen Bedingungen im Zielland.", "Die haitianische Regierung betont, die Abschiebungen nicht angefordert zu haben, was die asymmetrische Machtdynamik zwischen starken und schwachen Staaten in Migrationsfragen verdeutlicht: Haiti muss Abschiebungen akzeptieren, die es weder will noch bewältigen kann."]}, "connections": [{"source": "Trump-Administration", "target": "Temporary Protected Status", "relation": "beendete das Programm nach juristischem Sieg"}, {"source": "Supreme Court der Vereinigten Staaten", "target": "Temporary Protected Status", "relation": "erlaubte die Beendigung durch Urteil im Juni 2025"}, {"source": "Trump-Administration", "target": "Supreme Court der Vereinigten Staaten", "relation": "nutzte konservative Gerichtsmehrheit für Durchsetzung der Einwanderungsagenda"}, {"source": "Jean Négot Bonheur Delva", "target": "Trump-Administration", "relation": "empfing die von den USA abgeschobenen Personen"}], "countries_covered": ["USA", "Haiti"], "image_url": null, "id": "707da719", "sources": ["ABC News – International", "CBS News – World"], "article_urls": ["https://www.cbsnews.com/news/haiti-deportees-us-ends-tps-protection/", "https://abcnews.com/International/wireStory/group-deportees-arrives-troubled-haiti-after-us-ends-135827934"], "primary_sources": [], "market_correlation": null, "_pipeline_meta": {"model": "claude-sonnet-4-5", "research_depth": "lite", "articles_used": 2, "input_tokens": 4477, "output_tokens": 7023}}];

    concept: '<svg viewBox="0 0 24 24" fill="none"><path d="M9 18h6M10 21h4" stroke="#fff" stroke-opacity=".92" stroke-width="1.7" stroke-linecap="round"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.4.3.6.8.6 1.3V16h6v-.9c0-.5.2-1 .6-1.3A6 6 0 0 0 12 3Z" fill="none" stroke="#fff" stroke-opacity=".92" stroke-width="1.7"/></svg>',

  var TYPE_LABEL = {
    de: { person: "Person", organization: "Organisation", country: "Land", concept: "Konzept", event: "Ereignis" },
    en: { person: "Person", organization: "Organization", country: "Country", concept: "Concept", event: "Event" }
  };
  function typeLabel(type) { return (TYPE_LABEL[state.lang] && TYPE_LABEL[state.lang][type]) || type; }

  function fmtTlDate(raw) {
    if (!raw) return "";
    if (/^\d{4}-\d{2}-\d{2}$/.test(raw)) {
      var d = new Date(raw + "T00:00:00");
      if (!isNaN(d.getTime())) {
        return d.toLocaleDateString(state.lang === "de" ? "de-DE" : "en-US", { day: "2-digit", month: "short", year: "numeric" });
      }
    }
    return raw; // reines Jahr o.ae. unveraendert
  }

  var BOOKMARK_OUT = '<svg viewBox="0 0 24 24" fill="none"><path d="M6 3.5h12a1 1 0 0 1 1 1V21l-7-4-7 4V4.5a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>';
  var BOOKMARK_IN = '<svg viewBox="0 0 24 24" fill="none"><path d="M6 3.5h12a1 1 0 0 1 1 1V21l-7-4-7 4V4.5a1 1 0 0 1 1-1Z" fill="currentColor"/></svg>';
  var EXTERNAL = '<svg viewBox="0 0 24 24" fill="none"><path d="M9 6h9v9M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var CLOSE_ICON = '<svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>';
  var BACK_ICON = '<svg viewBox="0 0 24 24" fill="none"><path d="M15 5 8 12l7 7" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  /* ---------------- avatars (random, no upload) ---------------- */
  function seededRand(seed) {
    var x = Math.sin(seed * 999) * 10000;
    return x - Math.floor(x);
  }
  function avatarSVG(seed, size) {
    size = size || 40;
    var hues = [ (seed * 360) % 360, (seed * 360 + 55) % 360 ];
    var c1 = "hsl(" + hues[0].toFixed(0) + " 78% 62%)";
    var c2 = "hsl(" + hues[1].toFixed(0) + " 78% 45%)";
    var rot = Math.floor(seededRand(seed + 1) * 360);
    var blobs = "";
    for (var i = 0; i < 3; i++) {
      var r = 8 + seededRand(seed + i + 2) * 10;
      var cx = 15 + seededRand(seed + i + 5) * 70;
      var cy = 15 + seededRand(seed + i + 9) * 70;
      blobs += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="#fff" fill-opacity="' + (0.10 + i*0.05) + '"/>';
    }
    return '<svg viewBox="0 0 100 100" width="'+size+'" height="'+size+'" xmlns="http://www.w3.org/2000/svg">' +
      '<defs><linearGradient id="g' + Math.round(seed*1e6) + '" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(' + rot + ' .5 .5)">' +
      '<stop offset="0" stop-color="' + c1 + '"/><stop offset="1" stop-color="' + c2 + '"/></linearGradient></defs>' +
      '<rect width="100" height="100" fill="url(#g' + Math.round(seed*1e6) + ')"/>' + blobs + '</svg>';
  }

  /* ---------------- media (image + graceful fallback) ---------------- */
  function fallbackGradientVars(catKey) {
    var c = "var(--cat-" + (catKey || "diplomacy") + ")";
    return 'style="--cat-c1:' + c + '; --cat-c2: color-mix(in srgb, ' + c + ' 55%, #000 30%);"';
  }
  function mediaTag(url, opts) {
    opts = opts || {};
    var iconType = opts.iconType || "concept";
    var catKey = opts.catKey || "diplomacy";
    var cls = opts.cls || "";
    var alt = escapeHtml(opts.alt || "");
    var img = url ? '<img src="' + escapeHtml(url) + '" alt="' + alt + '" onerror="this.style.display=\'none\'">' : "";
    return '<div class="media ' + cls + '" ' + fallbackGradientVars(catKey) + '>' +
      '<span class="fallback">' + typeIcon(iconType) + '</span>' + img + '</div>';
  }

  /* ---------------- greeting ---------------- */
  var GREETINGS = {

      night:   ["Nachteule? Wir auch.", "Um diese Zeit liest man Krimis oder Weltpolitik. Willkommen bei Letzterem.", "Die Welt schläft nie — du offenbar auch nicht.", "Ruhige Stunden, unruhige Weltlage."],

      after:   ["Der Nachmittag ist da, die Schlagzeilen auch.", "Zwischen Terminen: ein Blick auf das große Ganze.", "Tief durchatmen und eintauchen."],
      evening: ["Feierabend. Zeit zu verstehen, was heute wirklich passiert ist.", "Der Tag neigt sich, die Analyse beginnt.", "Jetzt wird's ruhiger — genug Zeit für die tieferen Zusammenhänge."],
      late:    ["Der Abend gehört dir — und ein bisschen der Weltpolitik.", "Bevor der Tag endet: ein Blick hinter die Kulissen.", "Noch wach? Die Diplomatie ist es auch."]
    },
    en: {
      night:   ["Night owl? Same here.", "At this hour it's either crime novels or world politics. Welcome to the latter.", "The world never sleeps — clearly, neither do you."],
      early:   ["Already up? Here's what happened overnight.", "Coffee poured? Good, let's get into it.", "The day is young, the news cycle isn't."],
      morning: ["Good morning — here's your overview.", "Well rested? Politics wasn't.", "A new day, the same old conflicts."],
      noon:    ["Lunch break? Perfect timing for some world affairs.", "Halfway through the day — here's where things stand."],
      after:   ["The afternoon is here, so are the headlines.", "Between meetings: a look at the bigger picture."],
      evening: ["Day's done. Time to understand what actually happened today.", "The day winds down, the analysis begins."],

  function greetingBucket(hour) {
    if (hour >= 23 || hour < 5) return "night";
    if (hour < 8) return "early";
    if (hour < 11) return "morning";
    if (hour < 14) return "noon";
    if (hour < 17) return "after";
    if (hour < 20) return "evening";
    return "late";
  }
  function pickGreeting() {
    var now = new Date();
    var bucket = greetingBucket(now.getHours());
    var pool = GREETINGS[state.lang][bucket];
    return pool[Math.floor(Math.random() * pool.length)];
  }

  /* ---------------- rendering: home ---------------- */
  function storyCounts() {
    return STORIES.filter(function (s) { return state.activeCats.has(s.theme_category); }).length;
  }

  function renderPrefRow() {
    var el = document.getElementById("prefRow");
    var html = "";
    Object.keys(CATEGORIES).forEach(function (key) {
      var active = state.activeCats.has(key);
      html += '<button class="pref-chip' + (active ? " active" : "") + '" data-cat="' + key + '" style="' +
        (active ? "background:var(--cat-" + key + ")" : "") + '">' + escapeHtml(catLabel(key)) + "</button>";
    });
    el.innerHTML = html;
    el.querySelectorAll(".pref-chip").forEach(function (btn) {
      btn.onclick = function () {
        var key = btn.getAttribute("data-cat");
        if (state.activeCats.has(key)) { if (state.activeCats.size > 1) state.activeCats.delete(key); }
        else state.activeCats.add(key);
        renderHome();
      };
    });
  }

  function renderGreeting() {
    document.getElementById("greetEyebrow").textContent = new Date().toLocaleDateString(
      state.lang === "de" ? "de-DE" : "en-US", { weekday: "long", day: "numeric", month: "long" }
    );
    document.getElementById("greetTitle").textContent = pickGreeting();
    var n = storyCounts();
    document.getElementById("greetSub").textContent = state.lang === "de"
      ? n + " Storys aufbereitet, mit Historie, Akteuren und ehrlicher Markteinordnung."
      : n + " stories broken down, with history, stakeholders and honest market context.";
  }

  function cardHtml(story) {
    var img = mediaTag(story.image_url, { iconType: "event", catKey: story.theme_category, cls: "card-media", alt: story.title });
    var isSaved = state.saved.has(story.id);
    var nSources = (story.article_urls || story.sources || []).length;
    return '<div class="card" data-id="' + story.id + '" style="--cat-color: var(--cat-' + story.theme_category + ')">' +
      '<div style="position:relative">' + img +
        '<span class="cat-chip">' + escapeHtml(catLabel(story.theme_category)) + '</span>' +
        '<button class="save-btn' + (isSaved ? " saved" : "") + '" data-save="' + story.id + '">' + (isSaved ? BOOKMARK_IN : BOOKMARK_OUT) + '</button>' +
      '</div>' +
      '<div class="card-body">' +
        '<h3 class="card-title">' + escapeHtml(story.title) + '</h3>' +
        '<p class="card-dek">' + escapeHtml(stripLinks(story.one_line)) + '</p>' +
        '<div class="card-meta"><span>' + t("sources")(nSources) + '</span></div>' +
      '</div></div>';
  }
  function stripLinks(text) { return (text || "").replace(/\[\[([^\]]+)\]\]/g, "$1"); }

  function renderHome() {
    document.getElementById("brandLabel").textContent = t("brand");
    renderGreeting();
    renderPrefRow();
    var grid = document.getElementById("storyGrid");
    var visible = STORIES.filter(function (s) { return state.activeCats.has(s.theme_category); });
    if (!visible.length) {
      grid.innerHTML = '<div class="empty-state">' + t("noStories") + "</div>";
    } else {
      grid.innerHTML = visible.map(cardHtml).join("");
    }
    grid.querySelectorAll(".card").forEach(function (card) {
      card.addEventListener("click", function (e) {
        if (e.target.closest("[data-save]")) return;
        openDetail(card.getAttribute("data-id"));
      });
    });
    grid.querySelectorAll("[data-save]").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        toggleSave(btn.getAttribute("data-save"));
      });
    });
  }

  function toggleSave(id) {
    if (state.saved.has(id)) state.saved.delete(id); else state.saved.add(id);
    if (state.view === "home") renderHome();
    if (state.view === "saved") renderSavedView();
    var overlayBtn = document.querySelector("#detailOverlay [data-save-detail]");
    if (overlayBtn) {
      var saved = state.saved.has(id);
      overlayBtn.classList.toggle("saved", saved);
      overlayBtn.innerHTML = (saved ? BOOKMARK_IN : BOOKMARK_OUT);
    }
  }

  /* ---------------- detail view ---------------- */
  function getStory(id) { return STORIES.find(function (s) { return s.id === id; }); }

  function openDetail(id) {
    var story = getStory(id);
    if (!story) return;
    if (state.history.indexOf(id) === -1) state.history.unshift(id); else { state.history.splice(state.history.indexOf(id),1); state.history.unshift(id); }
    state.currentStoryId = id;
    state.activeTab = 0;
    document.getElementById("detailOverlay").innerHTML = detailHtml(story);
    document.getElementById("detailOverlay").classList.add("open");
    document.body.style.overflow = "hidden";
    wireDetail(story);
    document.getElementById("detailOverlay").scrollTop = 0;
  }
  function closeDetail() {
    document.getElementById("detailOverlay").classList.remove("open");
    document.body.style.overflow = "";

  var DEFAULT_TAB = 1; /* Übersicht ist der Startpunkt: links Historien, rechts Stakeholders/Märkte */

      '<div class="overlay-topbar">' +
        '<button class="pill-btn" id="btnBack">' + BACK_ICON + t("back") + '</button>' +

      '</div>' +
      '<div style="position:relative">' + hero + '</div>' +
      '<div class="detail-content">' +
        '<div class="detail-eyebrow"><span class="detail-cat-chip">' + escapeHtml(catLabel(cat)) + '</span>' +
          '<span>' + t("sources")((story.article_urls||story.sources||[]).length) + '</span></div>' +
        '<h1 class="detail-title">' + escapeHtml(story.title) + '</h1>' +

  function threadsHtml(story) {

  var CHECK_ICON = '<svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var MINUS_ICON = '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M8 12h8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';

  var BIAS_CLASS = { left: "bias-left", "center-left": "bias-center-left", center: "bias-center", "center-right": "bias-center-right", right: "bias-right" };

  var DOMAIN_LABELS = {
    "npr.org": "NPR", "aljazeera.com": "Al Jazeera", "cbsnews.com": "CBS News",
    "reuters.com": "Reuters", "apnews.com": "AP News", "bbc.co.uk": "BBC", "bbci.co.uk": "BBC",
    "nbcnews.com": "NBC News", "foxnews.com": "Fox News", "cnn.com": "CNN",
    "washingtonpost.com": "Washington Post", "nytimes.com": "NYT", "wsj.com": "WSJ",
    "theguardian.com": "The Guardian", "politico.com": "Politico", "axios.com": "Axios",
    "thehill.com": "The Hill", "dw.com": "DW", "france24.com": "France24",
    "themoscowtimes.com": "Moscow Times", "irishtimes.com": "Irish Times",
    "timesofisrael.com": "Times of Israel", "csis.org": "CSIS",
    "defensenews.com": "Defense News", "aei.org": "AEI", "usnews.com": "US News",

  function hostLabel(url) {
    try {
      var h = new URL(url).hostname.replace(/^www\./, "");
      for (var domain in DOMAIN_LABELS) { if (h === domain || h.indexOf("." + domain) === h.length - domain.length - 1) return DOMAIN_LABELS[domain]; }
      var base = h.split(".").slice(0, -1).join(".") || h;
      base = base.split(".")[0];
      return base.charAt(0).toUpperCase() + base.slice(1);
    } catch (e) { return "Quelle"; }
  }
  function biasForLabel(label) {
    var keys = Object.keys(SOURCE_BIAS);
    for (var i = 0; i < keys.length; i++) {
      if (keys[i].toLowerCase().indexOf(label.toLowerCase()) === 0) return SOURCE_BIAS[keys[i]];
    }
    return null;
  }

  function quotesAndSourcesHtml(story) {
    var quotes = story.quotes || [];
    var urls = story.article_urls || [];
    var primary = story.primary_sources || [];
    var html = "";
    if (quotes.length) {
      html += '<h2 class="section-heading">' + t("quotes") + '</h2>';
      quotes.forEach(function (q) {
        html += '<div class="quote-card"><p class="quote-text">“' + escapeHtml(q.text) + '”</p><div class="quote-attr">' + escapeHtml(q.attribution || "") + (q.context ? " · " + escapeHtml(q.context) : "") + '</div></div>';
      });
    }
    if (urls.length) {
      html += '<h2 class="section-heading">' + t("sourcesHead") + '</h2><div class="source-row">';
      urls.forEach(function (url) {
        var label = hostLabel(url);
        var bias = biasForLabel(label);
        var biasCls = BIAS_CLASS[bias] || "bias-unknown";
        html += '<button class="source-btn" data-open="' + escapeHtml(url || "") + '"><span class="bias-dot ' + biasCls + '"></span>' + escapeHtml(label) + EXTERNAL + '</button>';
      });
      html += '</div>';
    }
    if (primary.length) {
      html += '<h2 class="section-heading">' + t("primarySources") + '</h2>';
      primary.forEach(function (p) {
        html += '<div class="primary-source-card"><div class="primary-source-title">' + escapeHtml(p.title || "") + '</div>' +
          (p.note ? '<div class="primary-source-desc">' + escapeHtml(p.note) + '</div>' : '') +
          '<button class="source-btn" data-open="' + escapeHtml(p.url || "") + '">' + escapeHtml(p.issuer || "Dokument öffnen") + EXTERNAL + '</button></div>';
      });
    }
    return html;
  }

  function theoryPaneHtml(story) {
    var theory = story.political_theory;
    if (!theory || !theory.theory) return '<div class="market-empty">' + t("noTheory") + '</div>';
    var points = theory.points || [];
    var lead = points.length ? points[0] : "";
    var rest = points.slice(1);
    return '<div class="theory-concept">' + linkify(theory.theory, story) + '</div>' +
      (lead ? '<p class="theory-lead">' + linkify(lead, story) + '</p>' : '') +
      (rest.length ? (
        '<div class="readmore-toggle"><button class="pill-btn" id="btnTheoryMore">' + t("readMore") + '</button></div>' +
        '<div class="readmore-box" id="theoryReadMoreBox"><div><ul class="theory-points">' +
          rest.map(function (p) { return "<li>" + linkify(p, story) + "</li>"; }).join("") +
        '</ul></div></div>'
      ) : '');
  }

  function wireDetail(story) {
    document.getElementById("btnBack").onclick = closeDetail;
    var saveBtn = document.querySelector("[data-save-detail]");
    if (saveBtn) saveBtn.onclick = function () { toggleSave(story.id); };

    document.querySelectorAll("#detailTabbar .tab-btn").forEach(function (btn) {
      btn.onclick = function () { setActiveTab(parseInt(btn.getAttribute("data-tab"), 10)); };
    });
    setActiveTab(DEFAULT_TAB, true);

    wireThreadTabs(story);
    wireTimelineToggle();

    var readMoreBtn = document.getElementById("btnReadMore");
    if (readMoreBtn) {
      readMoreBtn.onclick = function () {
        var box = document.getElementById("readMoreBox");
        var open = box.classList.toggle("open");
        readMoreBtn.textContent = open ? t("readLess") : t("readMore");
      };
    }
    var theoryMoreBtn = document.getElementById("btnTheoryMore");
    if (theoryMoreBtn) {
      theoryMoreBtn.onclick = function () {
        var box = document.getElementById("theoryReadMoreBox");
        var open = box.classList.toggle("open");
        theoryMoreBtn.textContent = open ? t("readLess") : t("readMore");
      };
    }

    document.querySelectorAll("[data-entity-open]").forEach(function (chip) {
      chip.onclick = function () {
        var ent = findEntity(story, chip.getAttribute("data-entity-open"));
        if (ent) openEntityModal(ent, story);
      };
    });
    document.querySelectorAll(".lk").forEach(function (span) {
      span.onclick = function () {
        var ent = findEntity(story, span.getAttribute("data-entity"));
        if (ent) openEntityModal(ent, story);
      };
    });
    document.querySelectorAll("[data-open]").forEach(function (btn) {
      btn.onclick = function () {
        var url = btn.getAttribute("data-open");
        if (url) window.open(url, "_blank", "noopener,noreferrer");
      };
    });
    drawMarketChart(story);
    wireSwipe(document.getElementById("tabTrack"));
  }

  var TAB_COUNT = 5;
  function setActiveTab(i, silent) {
    state.activeTab = i;
    document.querySelectorAll("#detailTabbar .tab-btn").forEach(function (b, idx) {
      b.classList.toggle("active", idx === i);
    });
    var track = document.getElementById("tabTrack");
    if (track) track.style.transform = "translateX(-" + (i * (100 / TAB_COUNT)) + "%)";
  }

  function wireSwipe(track) {
    if (!track) return;
    var startX = null;
    track.parentElement.addEventListener("touchstart", function (e) { startX = e.touches[0].clientX; }, { passive: true });
    track.parentElement.addEventListener("touchend", function (e) {
      if (startX == null) return;
      var dx = e.changedTouches[0].clientX - startX;
      if (Math.abs(dx) > 40) {
        var next = state.activeTab + (dx < 0 ? 1 : -1);
        next = Math.max(0, Math.min(TAB_COUNT - 1, next));
        setActiveTab(next);
      }
      startX = null;
    }, { passive: true });
  }

  function wireThreadTabs(story) {
    document.querySelectorAll(".thread-tab").forEach(function (btn) {
      btn.onclick = function () {
        state.activeThread[story.id] = parseInt(btn.getAttribute("data-thread"), 10);
        var pane = document.querySelectorAll(".tab-pane")[0];
        pane.innerHTML = threadsHtml(story);
        wireThreadTabs(story);
        wireTimelineToggle();
      };
    });
  }
  function wireTimelineToggle() {
    document.querySelectorAll(".tl-item").forEach(function (item) {
      item.querySelector(".tl-one").onclick = function () { item.classList.toggle("expanded"); };
    });
  }

  /* ---------------- entity modal ---------------- */
  function openEntityModal(ent, story) {
    var cat = story.theme_category;
    var heroUrl = ent.context_image_url || ent.image_url;
    var hero = mediaTag(heroUrl, { iconType: ent.type, catKey: cat, cls: "entity-modal-hero", alt: ent.name });
    var isKey = (ent.profile || "").length > 300;
    var html = '<div style="--cat-color: var(--cat-' + cat + ')">' +
      '<div style="position:relative">' + hero +
        '<button class="icon-btn entity-modal-close" id="btnEntityClose" style="background:rgba(0,0,0,.4);color:#fff;border-color:transparent">' + CLOSE_ICON + '</button>' +
      '</div>' +
      '<div class="entity-modal-body">' +
        '<div class="entity-modal-type">' + escapeHtml(typeLabel(ent.type)) + (isKey ? ' · ' + t("keyFigure") : '') + '</div>' +
        '<h2 class="entity-modal-name">' + escapeHtml(ent.name) + '</h2>' +
        (ent.role_in_story ? '<p class="entity-modal-role">' + escapeHtml(ent.role_in_story) + '</p>' : '') +
        '<p class="entity-modal-bio">' + escapeHtml(ent.profile || "") + '</p>' +
        (ent.wikipedia_url ? '<button class="pill-btn" id="btnEntityWiki">' + t("wikipedia") + EXTERNAL + '</button>' : '') +
      '</div></div>';
    document.getElementById("entityModal").innerHTML = html;
    document.getElementById("entityModal").classList.add("open");
    document.getElementById("entityScrim").classList.add("open");
    document.getElementById("btnEntityClose").onclick = closeEntityModal;
    document.getElementById("entityScrim").onclick = closeEntityModal;
    var wikiBtn = document.getElementById("btnEntityWiki");
    if (wikiBtn) wikiBtn.onclick = function () { window.open(ent.wikipedia_url, "_blank", "noopener,noreferrer"); };
  }
  function closeEntityModal() {
    document.getElementById("entityModal").classList.remove("open");
    document.getElementById("entityScrim").classList.remove("open");
  }

  /* ---------------- market chart (dataviz: single hue, index=100, crosshair+tooltip) ---------------- */
  function drawMarketChart(story) {
    var mc = story.market_correlation;
    var svg = document.getElementById("mcChart");
    if (!svg || !mc || !mc.series || !mc.series.length) return;
    var allSeries = mc.series;
    var maxLen = Math.max.apply(null, allSeries.map(function (s) { return (s.points || []).length; }));
    if (!maxLen) return;
    var W = 640, H = 240, padL = 40, padR = 10, padT = 16, padB = 28;
    var allVals = [];
    allSeries.forEach(function (s) { (s.points || []).forEach(function (p) { allVals.push(p.value); }); });
    var yMin = Math.min.apply(null, allVals), yMax = Math.max.apply(null, allVals);
    var pad = (yMax - yMin) * 0.15 || 2;
    yMin -= pad; yMax += pad;
    function X(i, n) { return padL + (i / (n - 1 || 1)) * (W - padL - padR); }
    function Y(v) { return padT + (1 - (v - yMin) / (yMax - yMin || 1)) * (H - padT - padB); }
    var accent = getComputedStyle(document.documentElement).getPropertyValue("--cat-" + story.theme_category).trim() || "#0a84ff";
    var muted = getComputedStyle(document.documentElement).getPropertyValue("--ink-muted").trim() || "#7b7b83";

    var gridLines = "";
    for (var g = 0; g <= 2; g++) {
      var yy = padT + (g / 2) * (H - padT - padB);
      gridLines += '<line x1="' + padL + '" y1="' + yy + '" x2="' + (W-padR) + '" y2="' + yy + '" stroke="var(--border)" stroke-width="1"/>';
      var val = yMax - (g / 2) * (yMax - yMin);
      gridLines += '<text x="4" y="' + (yy+4) + '" font-size="11" fill="var(--ink-muted)">' + val.toFixed(0) + '</text>';
    }
    var baseline = (yMin < 100 && yMax > 100) ? '<line x1="'+padL+'" y1="'+Y(100).toFixed(1)+'" x2="'+(W-padR)+'" y2="'+Y(100).toFixed(1)+'" stroke="var(--ink-muted)" stroke-dasharray="3 3" stroke-width="1"/>' : "";

    var body = gridLines + baseline;
    var allDots = [];
    allSeries.forEach(function (series, si) {
      var pts = series.points || [];
      if (!pts.length) return;
      var color = si === 0 ? accent : muted;
      var dash = si === 0 ? "" : ' stroke-dasharray="5 4"';
      var path = pts.map(function (p, i) { return (i === 0 ? "M" : "L") + X(i, pts.length).toFixed(1) + "," + Y(p.value).toFixed(1); }).join(" ");
      body += '<path d="' + path + '" fill="none" stroke="' + color + '" stroke-width="2.5"' + dash + '/>';
      pts.forEach(function (p, i) {
        allDots.push({ x: X(i, pts.length), y: Y(p.value), color: color, date: p.date, label: series.label, value: p.value });
      });
    });
    body += allDots.map(function (d, idx) {
      return '<circle cx="' + d.x.toFixed(1) + '" cy="' + d.y.toFixed(1) + '" r="3.5" fill="var(--bg-elevated)" stroke="' + d.color + '" stroke-width="2" data-idx="' + idx + '"/>';
    }).join("");
    svg.innerHTML = body;

    var tooltip = document.getElementById("mcTooltip");
    svg.querySelectorAll("circle").forEach(function (c) {
      c.style.cursor = "pointer";
      c.addEventListener("mouseenter", function () {
        var d = allDots[parseInt(c.getAttribute("data-idx"), 10)];
        tooltip.textContent = (d.date || "") + " · " + (d.label || "") + ": " + d.value.toFixed(1);
        var rect = svg.getBoundingClientRect();
        var cx = (d.x / W) * rect.width;
        var cy = (d.y / H) * rect.height;
        tooltip.style.left = cx + "px";
        tooltip.style.top = (cy - 40) + "px";
        tooltip.classList.add("show");
      });
      c.addEventListener("mouseleave", function () { tooltip.classList.remove("show"); });
    });
  }

  /* ---------------- profile panel ---------------- */
  function renderProfilePanel() {
    var panel = document.getElementById("profilePanel");
    var html = '<div class="profile-head"><div class="profile-avatar-lg">' + avatarSVG(state.avatarSeed, 48) + '</div>' +
      '<div><div class="profile-name">' + t("profile") + '</div><button class="profile-shuffle" id="btnShuffleAvatar">' + t("newAvatar") + '</button></div></div>' +
      '<div class="profile-section"><div class="profile-label">' + t("language") + '</div>' +
      '<div class="seg-control"><button class="seg-btn' + (state.lang==="de"?" active":"") + '" data-lang="de">Deutsch</button>' +
      '<button class="seg-btn' + (state.lang==="en"?" active":"") + '" data-lang="en">English</button></div>' +
      (state.lang === "en" ? '<div style="font-size:11.5px;color:var(--ink-muted);margin-top:8px;">' + t("langNote") + '</div>' : '') + '</div>' +
      '<div class="profile-section"><div class="profile-label">' + t("appearance") + '</div>' +
      '<div class="seg-control"><button class="seg-btn' + (state.theme==="dark"?" active":"") + '" data-theme="dark">' + t("dark") + '</button>' +
      '<button class="seg-btn' + (state.theme==="light"?" active":"") + '" data-theme="light">' + t("light") + '</button></div></div>' +
      '<div class="profile-section"><div class="profile-label">' + t("contentPrefs") + '</div>' +
      Object.keys(CATEGORIES).map(function (key) {
        return '<label class="check-row"><input type="checkbox" data-catcheck="' + key + '"' + (state.activeCats.has(key) ? " checked" : "") + '>' + escapeHtml(catLabel(key)) + '</label>';
      }).join("") + '</div>' +
      '<div class="profile-section">' +
        '<button class="menu-link" id="btnGoHistory"><span>' + t("history") + ' (' + state.history.length + ')</span><span class="chev">›</span></button>' +
        '<button class="menu-link" id="btnGoSaved"><span>' + t("saved") + ' (' + state.saved.size + ')</span><span class="chev">›</span></button>' +
      '</div>' +
      '<div class="session-note">' + t("sessionNote") + '</div>';
    panel.innerHTML = html;

    document.getElementById("btnShuffleAvatar").onclick = function () { state.avatarSeed = Math.random(); updateAvatarButtons(); renderProfilePanel(); };
    panel.querySelectorAll("[data-lang]").forEach(function (b) { b.onclick = function () { state.lang = b.getAttribute("data-lang"); fullRerender(); }; });
    panel.querySelectorAll("[data-theme]").forEach(function (b) { b.onclick = function () { setTheme(b.getAttribute("data-theme")); renderProfilePanel(); }; });
    panel.querySelectorAll("[data-catcheck]").forEach(function (cb) {
      cb.onchange = function () {
        var key = cb.getAttribute("data-catcheck");
        if (cb.checked) {
          state.activeCats.add(key);
        } else if (state.activeCats.size > 1) {
          state.activeCats.delete(key);
        } else {
          cb.checked = true; // mindestens eine Kategorie muss aktiv bleiben
        }
        if (state.view === "home") renderHome();
      };
    });
    document.getElementById("btnGoHistory").onclick = function () { closeProfile(); openList("history"); };
    document.getElementById("btnGoSaved").onclick = function () { closeProfile(); openList("saved"); };
  }

  function updateAvatarButtons() {
    document.getElementById("btnProfile").innerHTML = avatarSVG(state.avatarSeed, 36);
  }

  function setTheme(mode) {
    state.theme = mode;
    document.documentElement.setAttribute("data-theme", mode);
  }

  var profileOpen = false;
  function toggleProfile() {
    profileOpen = !profileOpen;
    document.getElementById("profilePanel").classList.toggle("open", profileOpen);
    document.getElementById("profileScrim").classList.toggle("open", profileOpen);
    if (profileOpen) renderProfilePanel();
  }
  function closeProfile() {
    profileOpen = false;
    document.getElementById("profilePanel").classList.remove("open");
    document.getElementById("profileScrim").classList.remove("open");
  }

  /* ---------------- history / saved list views ---------------- */
  function openList(kind) {
    state.view = kind;
    document.getElementById("homeView").style.display = "none";
    document.getElementById("listView").style.display = "";
    document.getElementById("listTitle").textContent = kind === "history" ? t("history") : t("saved");
    var ids = kind === "history" ? state.history : Array.from(state.saved);
    var body = document.getElementById("listBody");
    if (!ids.length) {
      body.innerHTML = '<div class="empty-state">' + (kind === "history" ? t("emptyHistory") : t("emptySaved")) + "</div>";
      return;
    }
    body.innerHTML = ids.map(function (id) {
      var s = getStory(id);
      if (!s) return "";
      var thumb = mediaTag(s.image_url, { iconType: "event", catKey: s.theme_category, cls: "list-thumb", alt: s.title });
      return '<div class="list-row" data-id="' + id + '">' + thumb +
        '<div><div class="card-title-sm">' + escapeHtml(s.title) + '</div><div class="list-meta">' + escapeHtml(catLabel(s.theme_category)) + '</div></div></div>';
    }).join("");
    body.querySelectorAll(".list-row").forEach(function (row) {
      row.onclick = function () { openDetail(row.getAttribute("data-id")); };
    });
  }
  function goHome() {
    state.view = "home";
    document.getElementById("homeView").style.display = "";
    document.getElementById("listView").style.display = "none";
    closeDetail();
  }

  function fullRerender() {
    updateAvatarButtons();
    renderLastUpdated();
    if (state.view === "home") renderHome();
    else if (state.view === "history" || state.view === "saved") openList(state.view);
    if (document.getElementById("profilePanel").classList.contains("open")) renderProfilePanel();
  }

  /* ---------------- init ---------------- */
  function renderLastUpdated() {
    var el = document.getElementById("lastUpdated");
    if (!el) return;
    var iso = window.__BUILD_DATE__;
    var label = iso;
    try {
      var d = new Date(iso + "T00:00:00");
      if (!isNaN(d.getTime())) {
        label = d.toLocaleDateString(state.lang === "de" ? "de-DE" : "en-US", { day: "numeric", month: "long", year: "numeric" });
      }
    } catch (e) {}
    el.textContent = t("standLabel")(label);
  }

  function init() {
    document.documentElement.setAttribute("data-theme", state.theme);
    updateAvatarButtons();
    document.getElementById("btnProfile").onclick = toggleProfile;
    document.getElementById("profileScrim").onclick = closeProfile;
    document.getElementById("btnHome").onclick = goHome;
    document.getElementById("entityScrim").onclick = closeEntityModal;
    renderLastUpdated();
    renderHome();
  }

  document.addEventListener("DOMContentLoaded", init);
})();

</script>
</body>
</html>
