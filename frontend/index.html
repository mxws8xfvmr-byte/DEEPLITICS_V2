<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deeplitics</title>
<style>
/* ============================================================
   DEEPLITICS v7 — Design-System
   Dunkelmodus ist Standard. Farben sind CSS-Variablen, die beim
   Theme-Wechsel (data-theme) und je Story (data-cat) neu gesetzt
   werden. Kategorie-Farben sind FEST zugeordnet (dataviz-Skill:
   kategoriale Farben in fester Reihenfolge, nie rotierend).
   ============================================================ */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

:root {
  --radius-s: 10px;
  --radius-m: 16px;
  --radius-l: 22px;
  --radius-xl: 28px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Segoe UI", Helvetica, Arial, sans-serif;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

html[data-theme="dark"] {
  --bg: #050506;
  --bg-soft: #0b0c0f;
  --bg-elevated: #14151a;
  --bg-card: #15161b;
  --bg-card-hover: #1b1c22;
  --ink: #f5f5f7;
  --ink-secondary: #a6a6ad;
  --ink-muted: #7b7b83;
  --border: rgba(255,255,255,0.09);
  --border-strong: rgba(255,255,255,0.16);
  --overlay-bg: rgba(5,5,6,0.72);
  --scrim-top: rgba(0,0,0,0);
  --scrim-bottom: rgba(0,0,0,0.85);
  --shadow: 0 20px 60px rgba(0,0,0,0.55);
  --input-bg: rgba(255,255,255,0.06);
}
html[data-theme="light"] {
  --bg: #f4f4f6;
  --bg-soft: #ffffff;
  --bg-elevated: #ffffff;
  --bg-card: #ffffff;
  --bg-card-hover: #fbfbfc;
  --ink: #1d1d1f;
  --ink-secondary: #55565b;
  --ink-muted: #86868b;
  --border: rgba(0,0,0,0.08);
  --border-strong: rgba(0,0,0,0.14);
  --overlay-bg: rgba(244,244,246,0.78);
  --scrim-top: rgba(0,0,0,0);
  --scrim-bottom: rgba(0,0,0,0.62);
  --shadow: 0 20px 50px rgba(0,0,0,0.14);
  --input-bg: rgba(0,0,0,0.045);
}

/* Kategorie-Paletten: fest je Thema, light/dark-Variante je Modus.
   Werte angelehnt an bekannte, kontraststarke iOS-Systemfarben. */
html[data-theme="dark"] {
  --cat-security:      #0a84ff;
  --cat-diplomacy:      #40c8e0;
  --cat-trade:          #ff9f0a;
  --cat-rights:         #bf5af2;
  --cat-conflict:       #ff453a;
  --cat-surveillance:   #32d74b;
  --good: #32d74b;
  --bad: #ff6961;
}
html[data-theme="light"] {
  --cat-security:      #0071e3;
  --cat-diplomacy:      #0a9396;
  --cat-trade:          #c9750b;
  --cat-rights:         #8944ab;
  --cat-conflict:       #d70015;
  --cat-surveillance:   #248a3d;
  --good: #1f8a3c;
  --bad: #c9342a;
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

a { color: inherit; }
button { font-family: inherit; cursor: pointer; }

.wrap { max-width: 1080px; margin: 0 auto; padding: 0 24px; }
@media (max-width: 640px) { .wrap { padding: 0 16px; } }

/* ---------- Topbar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 40;
  backdrop-filter: blur(20px) saturate(1.4);
  background: var(--overlay-bg);
  border-bottom: 1px solid var(--border);
}
.topbar-inner {
  max-width: 1080px; margin: 0 auto; padding: 0 24px;
  height: 56px; display: flex; align-items: center; justify-content: space-between;
}
.brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 18px; letter-spacing: -0.01em; cursor: pointer; border: none; background: none; color: var(--ink); }
.brand-dot { width: 9px; height: 9px; border-radius: 50%; background: linear-gradient(135deg, var(--cat-security), var(--cat-rights)); }
.top-actions { display: flex; align-items: center; gap: 12px; }
.last-updated { font-size: 12px; color: var(--ink-muted); font-weight: 550; white-space: nowrap; }
@media (max-width: 560px) { .last-updated { display: none; } }
.icon-btn {
  width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border);
  background: var(--bg-elevated); color: var(--ink); display: flex; align-items: center; justify-content: center;
  transition: transform .15s var(--ease), background .15s;
}
.icon-btn:hover { background: var(--bg-card-hover); transform: scale(1.06); }
.icon-btn svg { width: 17px; height: 17px; }
.avatar-btn {
  width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border-strong);
  padding: 0; overflow: hidden; transition: transform .15s var(--ease);
}
.avatar-btn:hover { transform: scale(1.07); }
.avatar-btn svg, .avatar-mini svg { width: 100%; height: 100%; display: block; }

/* ---------- Greeting / Home header ---------- */
.greeting { padding: 46px 0 22px; }
.greeting-eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 10px; }
.greeting-title { font-size: 38px; line-height: 1.12; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 10px; max-width: 720px; }
.greeting-sub { font-size: 16px; color: var(--ink-secondary); margin: 0; max-width: 620px; }
@media (max-width: 640px) { .greeting-title { font-size: 28px; } }

.pref-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 22px 0 8px; }
.pref-chip {
  border: 1px solid var(--border); background: var(--bg-elevated); color: var(--ink-secondary);
  border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 600; transition: all .15s var(--ease);
}
.pref-chip.active { color: #fff; border-color: transparent; }
.pref-chip:hover { border-color: var(--border-strong); }

/* ---------- Story grid / cards ---------- */
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px; padding: 18px 0 60px; }
@media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }

.card {
  background: var(--bg-card); border-radius: var(--radius-l); overflow: hidden;
  border: 1px solid var(--border); cursor: pointer;
  transition: transform .28s var(--ease), box-shadow .28s var(--ease), background .2s;
  display: flex; flex-direction: column;
}
.card:hover { transform: translateY(-3px); box-shadow: var(--shadow); background: var(--bg-card-hover); }

.media { position: relative; width: 100%; overflow: hidden; background: var(--bg-elevated); }
.media .fallback {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  background: var(--fb-grad, linear-gradient(135deg, var(--cat-c1), var(--cat-c2)));
}
.media .fallback svg { width: 34%; height: 34%; opacity: .92; }
.media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }

.card-media { aspect-ratio: 16/10.5; border-radius: var(--radius-l) var(--radius-l) 0 0; }
.card-media::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.55), rgba(0,0,0,0) 55%);
}
.cat-chip {
  position: absolute; top: 12px; left: 12px; z-index: 2;
  font-size: 11.5px; font-weight: 700; letter-spacing: .02em; color: #fff;
  padding: 5px 11px; border-radius: 999px; backdrop-filter: blur(6px);
  background: color-mix(in srgb, var(--cat-color) 78%, #000 6%);
}
.save-btn {
  position: absolute; top: 10px; right: 10px; z-index: 3;
  width: 32px; height: 32px; border-radius: 50%; border: none;
  background: rgba(0,0,0,0.38); backdrop-filter: blur(6px);
  display: flex; align-items: center; justify-content: center; color: #fff;
  transition: transform .15s var(--ease), background .15s;
}
.save-btn:hover { transform: scale(1.08); background: rgba(0,0,0,0.55); }
.save-btn svg { width: 16px; height: 16px; }
.save-btn.saved svg path { fill: currentColor; }

.card-body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.card-title { font-size: 18px; font-weight: 750; letter-spacing: -0.012em; line-height: 1.28; margin: 0; }
.card-dek {
  font-size: 14px; color: var(--ink-secondary); line-height: 1.5; margin: 0;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.card-meta { margin-top: auto; padding-top: 6px; font-size: 12.5px; color: var(--ink-muted); display: flex; gap: 8px; align-items: center; }
.card-meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--ink-muted); }

/* ---------- Overlay / Detail view ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 100; background: var(--bg);
  transform: translateY(100%); transition: transform .38s var(--ease);
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.overlay.open { transform: translateY(0); }
.overlay-topbar {
  position: sticky; top: 0; z-index: 20; display: flex; justify-content: space-between; align-items: center;
  padding: 12px 18px; background: var(--overlay-bg); backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
}
.pill-btn {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border-strong);
  background: var(--bg-elevated); color: var(--ink); border-radius: 999px; padding: 8px 14px;
  font-size: 13.5px; font-weight: 600; transition: background .15s;
}
.pill-btn:hover { background: var(--bg-card-hover); }
.pill-btn svg { width: 14px; height: 14px; }

.detail-hero { position: relative; width: 100%; aspect-ratio: 16/8.2; margin-bottom: -64px; }
@media (max-width: 640px) { .detail-hero { aspect-ratio: 4/3.4; margin-bottom: -46px; } }
.detail-hero::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(to top, var(--bg-soft) 0%, var(--bg-soft) 4%, var(--scrim-bottom) 22%, transparent 62%);
}

.detail-content { position: relative; max-width: 760px; margin: 0 auto; padding: 0 24px 90px; }
.detail-eyebrow { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; font-size: 13px; color: var(--ink-muted); font-weight: 600; }
.detail-cat-chip { color: #fff; padding: 4px 11px; border-radius: 999px; font-size: 11.5px; font-weight: 700; background: var(--cat-color); }
.detail-title { font-size: 33px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.18; margin: 0 0 14px; text-shadow: 0 2px 24px var(--bg-soft); }
@media (max-width: 640px) { .detail-title { font-size: 26px; } }
.detail-dek { font-size: 18px; color: var(--ink-secondary); line-height: 1.5; margin: 0 0 28px; }

.summary-list { list-style: none; margin: 0 0 28px; padding: 0; display: flex; flex-direction: column; gap: 13px; }
.summary-list li { display: flex; gap: 12px; font-size: 16px; line-height: 1.55; }
.summary-list li::before { content: ""; flex: 0 0 6px; width: 6px; height: 6px; border-radius: 50%; margin-top: 9px; background: var(--cat-color); }
.summary-list li .li-text { flex: 1 1 auto; min-width: 0; }

.deep-dive { font-size: 16.5px; line-height: 1.75; color: var(--ink); margin: 0 0 22px; white-space: pre-line; }
.deep-dive b, .lk { color: var(--ink); font-weight: 650; text-decoration: none; border-bottom: 1.5px solid color-mix(in srgb, var(--cat-color) 55%, transparent); cursor: pointer; }

.callout {
  margin: 24px 0; padding: 18px 20px; border-radius: var(--radius-m);
  background: color-mix(in srgb, var(--cat-color) 12%, var(--bg-elevated));
  border: 1px solid color-mix(in srgb, var(--cat-color) 30%, var(--border));
}
.callout-label { font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--cat-color); margin-bottom: 8px; }
.callout p { margin: 0; font-size: 15.5px; line-height: 1.6; }

/* ---------- Horizontal slideable tabs ---------- */
.tabbar {
  display: flex; gap: 8px; margin: 34px 0 18px; overflow-x: auto; scrollbar-width: none;
  padding-bottom: 2px;
}
.tabbar::-webkit-scrollbar { display: none; }
.tab-btn {
  flex: 0 0 auto; border: 1px solid var(--border); background: var(--bg-elevated); color: var(--ink-secondary);
  border-radius: 999px; padding: 9px 16px; font-size: 14px; font-weight: 650; white-space: nowrap;
  transition: all .18s var(--ease);
}
.tab-btn.active { background: var(--cat-color); color: #fff; border-color: transparent; }

.tab-viewport { overflow: hidden; border-radius: var(--radius-m); }
.tab-track { display: flex; width: 500%; transition: transform .42s var(--ease); }
.tab-pane { width: 20%; flex: 0 0 20%; min-width: 0; padding: 2px 1px; }

/* Übersicht-Pane: Bullet-Stichpunkte + „Weiterlesen“-Aufklappbereich */
.readmore-toggle { margin: 10px 0 4px; }
.readmore-box { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows .38s var(--ease), opacity .3s var(--ease); }
.readmore-box.open { grid-template-rows: 1fr; opacity: 1; }
.readmore-box > div { overflow: hidden; }
.readmore-box .deep-dive { margin: 14px 0 0; }

/* Stakeholders-Pane: Pro / Con */
.stake-section { margin-bottom: 22px; }
.stake-section:last-child { margin-bottom: 0; }
.stake-heading { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 750; text-transform: uppercase; letter-spacing: .03em; margin-bottom: 12px; }
.stake-heading.pro { color: var(--good); }
.stake-heading.con { color: var(--bad); }
.stake-heading svg { width: 15px; height: 15px; flex: none; }
.stake-list { display: flex; flex-direction: column; gap: 10px; }
.stake-card { display: flex; gap: 12px; padding: 13px 14px; border-radius: var(--radius-m); background: var(--bg-elevated); border: 1px solid var(--border); border-left: 3px solid transparent; cursor: pointer; transition: background .15s, transform .15s var(--ease); text-align: left; }
.stake-card:hover { background: var(--bg-card-hover); transform: translateY(-1px); }
.stake-card.pro { border-left-color: var(--good); }
.stake-card.con { border-left-color: var(--bad); }
.stake-avatar { width: 40px; height: 40px; border-radius: 50%; position: relative; overflow: hidden; flex: none; }
.stake-avatar .fallback svg { width: 46%; height: 46%; }
.stake-body { min-width: 0; }
.stake-name { font-size: 14.5px; font-weight: 700; margin-bottom: 3px; }
.stake-reason { font-size: 13.5px; line-height: 1.5; color: var(--ink-secondary); }
.stake-note { font-size: 13px; color: var(--ink-muted); line-height: 1.55; padding: 12px 14px; border-radius: var(--radius-m); background: var(--bg-elevated); border: 1px dashed var(--border-strong); margin-top: 4px; }
.stake-empty { font-size: 13.5px; color: var(--ink-muted); padding: 4px 2px; }

/* Historien */
.thread-tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 18px; scrollbar-width: none; }
.thread-tabs::-webkit-scrollbar { display: none; }
.thread-tab { flex: 0 0 auto; border: 1px solid var(--border); background: transparent; color: var(--ink-secondary); border-radius: var(--radius-s); padding: 8px 13px; font-size: 13px; font-weight: 600; }
.thread-tab.active { background: var(--bg-elevated); color: var(--ink); border-color: var(--border-strong); }
.timeline { position: relative; padding-left: 22px; }
.timeline::before { content: ""; position: absolute; left: 5px; top: 6px; bottom: 6px; width: 1.5px; background: var(--border-strong); }
.tl-item { position: relative; padding-bottom: 22px; }
.tl-item:last-child { padding-bottom: 0; }
.tl-dot { position: absolute; left: -22px; top: 4px; width: 11px; height: 11px; border-radius: 50%; background: var(--bg); border: 2.5px solid var(--cat-color); }
.tl-year { font-size: 12.5px; font-weight: 700; color: var(--cat-color); margin-bottom: 3px; }
.tl-one { font-size: 15px; line-height: 1.5; cursor: pointer; }
.tl-ext { font-size: 14.5px; line-height: 1.6; color: var(--ink-secondary); margin-top: 8px; display: none; }
.tl-item.expanded .tl-ext { display: block; }
.tl-item.expanded .tl-one { color: var(--ink); }
.tl-toggle-hint { font-size: 12px; color: var(--ink-muted); margin-left: 6px; }

/* Akteure / entities */
.entity-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 10px; }
.entity-chip { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 8px; border-radius: var(--radius-m); border: 1px solid var(--border); background: var(--bg-elevated); text-align: center; transition: background .15s, transform .15s var(--ease); }
.entity-chip:hover { background: var(--bg-card-hover); transform: translateY(-2px); }
.entity-avatar { width: 56px; height: 56px; border-radius: 50%; position: relative; overflow: hidden; flex: none; }
.entity-avatar .fallback { border-radius: 50%; }
.entity-avatar .fallback svg { width: 46%; height: 46%; }
.entity-name { font-size: 13px; font-weight: 650; line-height: 1.3; }
.entity-role { font-size: 11.5px; color: var(--ink-muted); line-height: 1.3; }

.entity-modal-scrim { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 150; opacity: 0; pointer-events: none; transition: opacity .25s; }
.entity-modal-scrim.open { opacity: 1; pointer-events: auto; }
.entity-modal {
  position: fixed; left: 50%; bottom: 0; transform: translate(-50%, 100%); width: min(560px, 92vw);
  max-height: 86vh; overflow-y: auto; background: var(--bg-soft); border-radius: 22px 22px 0 0; z-index: 151;
  transition: transform .32s var(--ease), opacity .25s var(--ease), visibility 0s linear .32s;
  box-shadow: var(--shadow); opacity: 0; visibility: hidden; pointer-events: none;
}
@media (min-width: 720px) { .entity-modal { bottom: 6vh; border-radius: 22px; transform: translate(-50%, 40px) scale(.97); } }
.entity-modal.open {
  transform: translate(-50%, 0); opacity: 1; visibility: visible; pointer-events: auto;
  transition: transform .32s var(--ease), opacity .25s var(--ease), visibility 0s linear 0s;
}
@media (min-width: 720px) { .entity-modal.open { transform: translate(-50%, 0) scale(1); } }
.entity-modal-hero { position: relative; aspect-ratio: 16/9; }
.entity-modal-body { padding: 22px 24px 32px; }
.entity-modal-close { position: absolute; top: 12px; right: 12px; z-index: 3; }
.entity-modal-type { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--cat-color); margin-bottom: 6px; }
.entity-modal-name { font-size: 24px; font-weight: 800; letter-spacing: -0.015em; margin: 0 0 4px; }
.entity-modal-role { font-size: 14.5px; color: var(--ink-secondary); margin: 0 0 16px; }
.entity-modal-bio { font-size: 15.5px; line-height: 1.65; color: var(--ink); margin: 0 0 18px; }

/* Märkte */
.market-empty { padding: 34px 20px; text-align: center; border-radius: var(--radius-m); border: 1px dashed var(--border-strong); color: var(--ink-secondary); font-size: 14.5px; }
.chart-card { border: 1px solid var(--border); border-radius: var(--radius-m); padding: 18px 18px 8px; background: var(--bg-elevated); }
.chart-title { font-size: 15px; font-weight: 700; margin: 0 0 2px; }
.chart-sub { font-size: 13px; color: var(--ink-muted); margin: 0 0 14px; }
.chart-note { font-size: 13px; color: var(--ink-secondary); margin: 14px 0 6px; line-height: 1.55; }
.legend-row { display: flex; gap: 16px; margin-bottom: 4px; flex-wrap: wrap; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-secondary); }
.legend-swatch { width: 9px; height: 9px; border-radius: 2px; }
.tooltip { position: absolute; pointer-events: none; background: var(--bg-elevated); border: 1px solid var(--border-strong); border-radius: 10px; padding: 8px 11px; font-size: 12.5px; box-shadow: var(--shadow); opacity: 0; transition: opacity .1s; z-index: 5; white-space: nowrap; }
.tooltip.show { opacity: 1; }

/* Zitate */
.section-heading { font-size: 20px; font-weight: 800; letter-spacing: -0.01em; margin: 40px 0 16px; }
.quote-card { border-left: 3px solid var(--cat-color); padding: 4px 0 4px 18px; margin-bottom: 18px; }
.quote-text { font-size: 17px; line-height: 1.55; margin: 0 0 6px; font-style: italic; }
.quote-attr { font-size: 13.5px; color: var(--ink-muted); }

/* Quellen als Buttons (keine sichtbaren Links) */
.source-row { display: flex; flex-wrap: wrap; gap: 9px; margin-bottom: 26px; }
.source-btn {
  display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--border);
  background: var(--bg-elevated); color: var(--ink); border-radius: 999px; padding: 8px 14px 8px 10px;
  font-size: 13.5px; font-weight: 600; transition: background .15s, transform .15s var(--ease);
}
.source-btn:hover { background: var(--bg-card-hover); transform: translateY(-1px); }
.source-btn .bias-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.source-btn svg { width: 12px; height: 12px; opacity: .55; margin-left: 2px; }
.bias-left { background: #5aa9ff; } .bias-center-left { background: #7ec8b0; }
.bias-center { background: #9a9aa2; } .bias-center-right { background: #e0b25a; }
.bias-right { background: #e0705a; } .bias-unknown { background: #6e6e73; }

.primary-source-card { border: 1px solid var(--border); border-radius: var(--radius-s); padding: 12px 14px; margin-bottom: 10px; background: var(--bg-elevated); }
.primary-source-title { font-size: 14px; font-weight: 650; margin: 0 0 4px; }
.primary-source-desc { font-size: 13px; color: var(--ink-secondary); margin: 0 0 8px; line-height: 1.5; }

.theory-concept { font-size: 17px; font-weight: 750; letter-spacing: -0.01em; margin: 2px 0 12px; }
.theory-lead { font-size: 15.5px; line-height: 1.62; color: var(--ink-secondary); margin: 0; }
.theory-points { margin: 0; padding-left: 20px; }

/* ---------- Profile panel ---------- */
.profile-scrim { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 90; opacity: 0; pointer-events: none; transition: opacity .2s; }

  position: fixed; top: 64px; right: 16px; width: 320px; max-width: 90vw; z-index: 91;

  box-shadow: var(--shadow); transform: translateY(-8px) scale(.98); opacity: 0; pointer-events: none;
  transition: all .18s var(--ease); max-height: 82vh; overflow-y: auto;
}
.profile-panel.open { transform: translateY(0) scale(1); opacity: 1; pointer-events: auto; }
.profile-head { display: flex; align-items: center; gap: 12px; padding: 18px; border-bottom: 1px solid var(--border); }

.profile-section { padding: 14px 18px; border-bottom: 1px solid var(--border); }
.profile-section:last-child { border-bottom: none; }
.profile-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--ink-muted); margin-bottom: 10px; }
.seg-control { display: flex; background: var(--input-bg); border-radius: 10px; padding: 3px; gap: 2px; }
.seg-btn { flex: 1; border: none; background: none; color: var(--ink-secondary); padding: 7px 0; border-radius: 8px; font-size: 13px; font-weight: 650; }
.seg-btn.active { background: var(--bg-card); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,0.15); }
.check-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; font-size: 14px; }
.check-row input { width: 16px; height: 16px; accent-color: var(--cat-security); }
.menu-link { display: flex; align-items: center; justify-content: space-between; width: 100%; border: none; background: none; color: var(--ink); font-size: 14.5px; font-weight: 600; padding: 10px 0; }
.menu-link .chev { color: var(--ink-muted); }
.session-note { padding: 12px 18px; font-size: 11.5px; color: var(--ink-muted); line-height: 1.5; }

/* ---------- History / Saved list views ---------- */
.list-row { display: flex; gap: 14px; align-items: center; padding: 14px 4px; border-bottom: 1px solid var(--border); cursor: pointer; }
.list-row:hover .card-title-sm { text-decoration: underline; }
.list-thumb { width: 64px; height: 64px; border-radius: var(--radius-s); overflow: hidden; flex: none; position: relative; }
.card-title-sm { font-size: 15px; font-weight: 650; margin: 0 0 3px; }
.list-meta { font-size: 12.5px; color: var(--ink-muted); }
.empty-state { padding: 60px 20px; text-align: center; color: var(--ink-muted); font-size: 14.5px; }

.fade-in { animation: fadeIn .35s var(--ease); }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

<script>
window.__STORIES__ = [{"title": "Iran droht Nachbarstaaten bei Teilnahme an US-Wirtschaftskrieg", "one_line": "[[Iran]] warnt regionale Staaten, sie als Feinde zu behandeln, wenn sie sich [[Donald Trump]]s angekündigtem \"wirtschaftlichen D-Day\" anschließen.", "summary": ["[[Mohsen Rezaei]], Sekretär des obersten nationalen Sicherheitsrats [[Iran]]s, erklärte im Staatsfernsehen, jedes Land, das sich an den US-Wirtschaftssanktionen beteilige, werde als Feind betrachtet und [[Iran]] werde deren Interessen schädigen.", "[[Donald Trump]] kündigte diese Woche eine \"beispiellose wirtschaftliche Kriegsführung und Isolation\" gegen [[Iran]] an und forderte Verbündete auf, sich einem \"wirtschaftlichen D-Day\" anzuschließen, wobei Details der Maßnahmen noch nicht veröffentlicht wurden.", "[[China]], [[Iran]]s größter Handelspartner, lehnte die US-Forderungen bereits ab und bezeichnete einseitige Sanktionen ohne UN-Sicherheitsrat-Mandat als illegal und nicht völkerrechtskonform.", "Ein iranischer Parlamentssprecher drohte explizit Golfstaaten wie [[Katar]], [[Kuwait]] und den [[Vereinigte Arabische Emirate|VAE]], die US-Militärflugzeuge und Tanker beherbergen, und warnte sie, später nicht zu klagen.", "Die Drohungen erfolgen vor dem Hintergrund gescheiterter Verhandlungen, nachdem ein Memorandum vom 17. Juni zur Beendigung der militärischen Operationen zwischen den [[Vereinigte Staaten|USA]] und [[Iran]] zusammenbrach, wobei die Kontrolle über die [[Straße von Hormus]] ein zentraler Streitpunkt bleibt."], "deep_dive": "Die aktuellen Drohungen markieren eine Eskalation in einem Konflikt, der seit dem 28. Februar in eine offene militärische Phase eingetreten ist, als [[Vereinigte Staaten|USA]] und [[Israel]] gemeinsame Angriffe gegen [[Iran]] starteten. [[Donald Trump]]s Ankündigung eines \"wirtschaftlichen D-Day\" stellt einen Versuch dar, den militärischen Druck durch wirtschaftliche Strangulierung zu ergänzen, eine Strategie, die historisch auf die \"Maximum Pressure\"-Kampagne seiner ersten Amtszeit zurückgeht.\n\nDie iranische Warnung an Nachbarstaaten reflektiert die verwundbare Position [[Iran]]s in der Region. Golfstaaten wie [[Katar]], [[Kuwait]] und die [[Vereinigte Arabische Emirate|VAE]] beherbergen US-Militärbasen und könnten als logistische Knotenpunkte für wirtschaftliche Sanktionsdurchsetzung dienen. Gleichzeitig sind diese Staaten wirtschaftlich auf stabile Handelswege angewiesen, was [[Iran]] durch seine Kontrolle über die [[Straße von Hormus]], durch die ein erheblicher Teil des weltweiten Öltransports fließt, als Druckmittel nutzen kann. [[Iran]] blockierte den Verkehr durch die Meerenge früh im Konflikt, was die Preise für Öl und Düngemittel in die Höhe trieb.\n\nDie Weigerung [[China]]s, sich den US-Sanktionen anzuschließen, unterstreicht die Grenzen amerikanischer Wirtschaftsmacht in einer multipolaren Weltordnung. Als [[Iran]]s größter Handelspartner kann [[China]] dem Land eine wirtschaftliche Lebensader bieten, die die Wirksamkeit westlicher Sanktionen erheblich mindert. Die Drei-Stufen-Strategie, die [[Mohsen Rezaei]] beschrieb, zunächst Verhandlungen, dann Abstandsversuche von den [[Vereinigte Staaten|USA]], schließlich Vergeltung, zeigt [[Iran]]s Kalkül, regionale Staaten von der US-Position zu isolieren.\n\nDie gescheiterten Verhandlungen und das kollabierte Memorandum vom 17. Juni verdeutlichen, dass diplomatische Lösungen derzeit blockiert sind. [[Donald Trump]]s Finanzminister [[Scott Bessent]] formulierte die amerikanische Position scharf: \"Entweder man ist mit uns oder gegen uns.\" Diese binäre Logik zwingt Drittstaaten zu einer Wahl, die erhebliche wirtschaftliche und sicherheitspolitische Konsequenzen in beide Richtungen hat. Ägyptens Vermittlungsversuche zwischen [[Iran]] und den [[Vereinigte Staaten|USA]] sowie die iranisch-omanischen Gespräche über die Verwaltung der [[Straße von Hormus]] deuten darauf hin, dass einige regionale Akteure nach Auswegen aus der Eskalationsspirale suchen.", "cui_bono": "Die wirtschaftliche Konfrontation stärkt die Position von Hardlinern auf beiden Seiten, die innenpolitisch von externer Bedrohung profitieren. [[China]] gewinnt strategischen Einfluss als unverzichtbarer Partner [[Iran]]s und kann seine Position als Alternative zur westlichen Ordnung festigen. Regionale Golfstaaten könnten mittelfristig von höheren Ölpreisen profitieren, falls die [[Straße von Hormus]] weiter blockiert bleibt, riskieren aber gleichzeitig, zu direkten Zielen iranischer Vergeltungsschläge zu werden. Vermittlerstaaten wie Ägypten und Oman können ihre regionale Bedeutung als diplomatische Brückenköpfe ausbauen.", "historical_threads": [{"id": "usa_iran_konflikt", "title": "USA-Iran-Konflikt", "entries": [{"date": "1979", "title": "Islamische Revolution und Geiselkrise", "one_line": "Der Sturz des Schahs und die 444-tägige Geiselnahme in der US-Botschaft begründeten die grundlegende Feindschaft zwischen den USA und Iran.", "extended": "Die Islamische Revolution beendete die enge Allianz zwischen den USA und dem Iran unter Schah Mohammad Reza Pahlavi. Die Geiselnahme von 52 amerikanischen Diplomaten traumatisierte die amerikanische Öffentlichkeit und prägt bis heute das Bild Irans in den USA. Das Regime unter Ayatollah Khomeini etablierte den Antiamerikanismus als Kernideologie."}, {"date": "2015", "title": "JCPOA-Atomabkommen", "one_line": "Das internationale Atomabkommen unter der Obama-Administration bot eine kurze Phase der Entspannung und hob Sanktionen gegen Iran auf.", "extended": "Das Joint Comprehensive Plan of Action begrenzte Irans Nuklearprogramm im Austausch für Sanktionserleichterungen. Es repräsentierte den Höhepunkt diplomatischer Bemühungen und wurde von den P5+1-Staaten (USA, Großbritannien, Frankreich, Russland, China und Deutschland) sowie der EU ausgehandelt. Das Abkommen wurde international als diplomatischer Erfolg gefeiert."}, {"date": "2018", "title": "Trumps Ausstieg aus JCPOA", "one_line": "Donald Trump zog die USA aus dem Atomabkommen zurück und startete seine 'Maximum Pressure'-Kampagne mit massiven Wirtschaftssanktionen.", "extended": "Trump bezeichnete das JCPOA als \"schlechtesten Deal aller Zeiten\" und verhängte sekundäre Sanktionen, die auch Drittstaaten betrafen, die mit Iran Handel trieben. Die Strategie zielte darauf ab, Irans Wirtschaft zu erdrosseln und das Regime zu einem neuen, umfassenderen Abkommen zu zwingen. Iran reagierte schrittweise mit der Verletzung der Atomabkommen-Verpflichtungen."}, {"date": "2020-01", "title": "Ermordung von Qassem Soleimani", "one_line": "Ein US-Drohnenangriff tötete den iranischen Generalkommandeur in Bagdad und brachte beide Länder an den Rand eines offenen Krieges.", "extended": "Die gezielte Tötung von Qassem Soleimani, dem Kommandeur der Quds-Einheit der Revolutionsgarden, markierte eine beispiellose Eskalation. Iran antwortete mit Raketenangriffen auf US-Stützpunkte im Irak. Die Episode zeigte die Bereitschaft beider Seiten zu direkter militärischer Konfrontation."}, {"date": "2025-02-28", "title": "Beginn der offenen Kriegshandlungen", "one_line": "USA und Israel starteten koordinierte Militärschläge gegen Iran, womit der Konflikt von einer verdeckten in eine offene militärische Phase überging.", "extended": "Diese Angriffe markierten einen qualitativen Sprung von Stellvertreterkriegen und verdeckten Operationen zu direkten militärischen Schlägen. Iran reagierte mit der Blockade der Straße von Hormus. Die internationale Gemeinschaft versuchte seither erfolglos, eine diplomatische Lösung zu vermitteln."}, {"date": "2025-06-17", "title": "Gescheitertes Memorandum", "one_line": "Ein Abkommen zur sofortigen Beendigung der Militäroperationen kollabierte, womit die letzte diplomatische Chance auf rasche Deeskalation verschwand.", "extended": "Das Memorandum of Understanding hätte eine permanente Einstellung der Kampfhandlungen vorsehen sollen. Der Zusammenbruch wird auf unüberbrückbare Differenzen über die Kontrolle der Straße von Hormus zurückgeführt. Seitdem stagnieren Verhandlungen, während sich beide Seiten auf eine Ausweitung der Konfrontation vorbereiten."}]}, {"id": "sanktionen_als_waffe", "title": "Wirtschaftssanktionen als Druckmittel", "entries": [{"date": "1990er", "title": "Sanktionen gegen Irak", "one_line": "Die UN-Sanktionen gegen Saddam Husseins Irak etablierten umfassende Wirtschaftsblockaden als Instrument zwischen Diplomatie und Militäreinsatz.", "extended": "Die Sanktionen nach dem Golfkrieg 1991 dauerten über ein Jahrzehnt und führten zu verheerenden humanitären Folgen. Sie prägten die internationale Debatte über die Wirksamkeit und Ethik von Wirtschaftskrieg. Die Erfahrung beeinflusste sowohl Befürworter als auch Kritiker späterer Sanktionsregime."}, {"date": "2006-2015", "title": "Internationale Sanktionen gegen Iran", "one_line": "Aufeinanderfolgende UN-Sicherheitsratsresolutionen und westliche Sanktionen wegen Irans Nuklearprogramm isolierten das Land wirtschaftlich.", "extended": "Die Sanktionen zielten auf Irans Finanz-, Energie- und Transportsektor. Sie zwangen Iran teilweise aus dem internationalen Bankensystem SWIFT aus und beschränkten Ölexporte drastisch. Der wirtschaftliche Druck trug letztlich zur iranischen Bereitschaft bei, 2015 das JCPOA zu verhandeln."}, {"date": "2014-2022", "title": "Russland-Sanktionen nach Krim-Annexion", "one_line": "Westliche Sanktionen gegen Russland schufen ein Präzedenzmodell für sektorale Wirtschaftsblockaden gegen Großmächte, das heute auf Iran angewandt wird.", "extended": "Die Sanktionen nach der Annexion der Krim zielten auf Finanzen, Energie und Rüstung. Sie wurden nach dem Einmarsch in die Ukraine 2022 massiv verschärft und umfassten beispiellose Maßnahmen wie die Beschlagnahmung von Zentralbankreserven. Die Erfahrung zeigte sowohl die Möglichkeiten als auch die Grenzen wirtschaftlicher Kriegsführung in einer vernetzten Weltwirtschaft."}, {"date": "2018-2021", "title": "Trumps 'Maximum Pressure' gegen Iran", "one_line": "Die erste Trump-Administration demonstrierte die Bereitschaft, sekundäre Sanktionen gegen Verbündete durchzusetzen, um totale wirtschaftliche Isolation zu erreichen.", "extended": "Die Kampagne zielte darauf ab, Irans Ölexporte auf null zu reduzieren. Auch europäische Unternehmen wurden mit Strafen bedroht, wenn sie mit Iran Geschäfte machten. Die Strategie erreichte zwar wirtschaftlichen Schaden, führte aber nicht zur beabsichtigten Verhaltensänderung des iranischen Regimes."}]}, {"id": "strasse_von_hormus", "title": "Straße von Hormus als strategische Engstelle", "entries": [{"date": "1980-1988", "title": "Tankerkrieg im Iran-Irak-Krieg", "one_line": "Beide Kriegsparteien griffen Öltanker in der Straße von Hormus an, was zu internationalen Marineoperationen zum Schutz der Schifffahrt führte.", "extended": "Der Tankerkrieg demonstrierte erstmals Irans Fähigkeit und Bereitschaft, die globale Energieversorgung als Waffe einzusetzen. Die USA starteten die Operation Earnest Will, bei der Tanker unter US-Flagge eskortierten wurden. Die Erfahrung prägte das strategische Denken über die Verwundbarkeit dieser Meerenge."}, {"date": "2019-07", "title": "Tanker-Zwischenfälle unter Trump", "one_line": "Iran beschlagnahmte britische Tanker als Vergeltung für die Festsetzung eines iranischen Schiffs, was die Fragilität der Schifffahrtsroute aufzeigte.", "extended": "Die Zwischenfälle folgten auf Angriffe auf Tanker im Golf von Oman, die den USA und Iran gegenseitig zuschrieben. Großbritannien bildete eine internationale Maritime Security Coalition zum Schutz der Schifffahrt. Die Episode zeigte, wie schnell lokale Spannungen die globale Energieversorgung gefährden können."}, {"date": "2025-02", "title": "Iranische Blockade nach Kriegsbeginn", "one_line": "Iran schloss die Straße von Hormus als Reaktion auf US-Angriffe, was Öl- und Düngemittelpreise weltweit in die Höhe trieb und alternative Handelsrouten erzwang.", "extended": "Die Blockade traf die Weltwirtschaft in einer bereits angespannten Lage. Etwa 21% des globalen Erdöls und ein Drittel des Flüssiggas-Handels passieren normalerweise die Meerenge. Golfstaaten mussten auf teurere Pipelines und längere Schifffahrtsrouten ausweichen. Die Maßnahme demonstrierte Irans wichtigstes strategisches Druckmittel."}]}], "entities": [{"name": "Iran", "type": "country", "role_in_story": "Droht Nachbarstaaten mit Vergeltung, falls diese sich US-Wirtschaftssanktionen anschließen, und verteidigt seine Kontrolle über die Straße von Hormus", "profile": "Die Islamische Republik nutzt seit 1979 asymmetrische Strategien gegen militärisch überlegene Gegner, kombiniert regionale Stellvertretermilizen mit der Kontrolle strategischer Handelswege. In Konflikten setzt Iran auf gestufte Eskalation, behält aber stets Optionen für weitere Druckausübung zurück. Die Drohung gegen Nachbarstaaten folgt diesem Muster, regionale Akteure von westlichen Bündnissen zu trennen.", "established": null, "image_url": null}, {"name": "Donald Trump", "type": "person", "role_in_story": "Kündigt beispiellose wirtschaftliche Kriegsführung gegen Iran an und fordert internationale Verbündete auf, sich einem 'wirtschaftlichen D-Day' anzuschließen", "profile": "Verfolgt eine konfrontative Iran-Politik seit seiner ersten Amtszeit, als er das Atomabkommen verließ. Setzt auf maximalen wirtschaftlichen Druck kombiniert mit militärischen Drohungen. Seine Rhetorik nutzt bewusst historische Anspielungen wie 'D-Day', um die Bedeutung der Maßnahmen zu unterstreichen und Verbündete zur Solidarität zu drängen.", "established": "1946-06-14", "image_url": null}, {"name": "Mohsen Rezaei", "type": "person", "role_in_story": "Warnt als Sekretär des obersten nationalen Sicherheitsrats Irans Nachbarstaaten vor Teilnahme am US-Wirtschaftskrieg und kündigt Vergeltung an", "profile": "Ehemaliger langjähriger Kommandeur der Revolutionsgarden (1981-1997), verfügt über tiefe Einblicke in Irans Sicherheitsapparat. Bekannt für harte Rhetorik gegenüber dem Westen. Seine dreistufige Strategie (Verhandlung, Trennung von USA, Vergeltung) reflektiert militärisches Denken in diplomatischer Sprache.", "established": "1954-09-09", "image_url": null}, {"name": "China", "type": "country", "role_in_story": "Lehnt als größter Handelspartner Irans die US-Sanktionsforderungen ab und bezeichnet einseitige Maßnahmen ohne UN-Mandat als illegal", "profile": "Positioniert sich konsequent gegen westliche unilaterale Sanktionen und besteht auf multilateralen Ansätzen über den UN-Sicherheitsrat. Die wirtschaftliche Partnerschaft mit Iran dient sowohl strategischen Interessen (Energiesicherheit, Belt and Road Initiative) als auch dem Prinzip multipolarer Weltordnung. Nutzt systematisch wirtschaftliche Abhängigkeiten, um geopolitischen Einfluss zu sichern.", "established": null, "image_url": null}, {"name": "Straße von Hormus", "type": "concept", "role_in_story": "Bleibt zentraler Streitpunkt in den gescheiterten Verhandlungen zwischen USA und Iran, Iran droht alternative Ölrouten aus dem Golf anzugreifen", "profile": "Die 39 Kilometer breite Meerenge zwischen Iran und Oman ist die weltweit wichtigste Engstelle für Erdöltransporte. Etwa 21% des globalen Erdöls und ein Drittel des maritimen Flüssiggas-Handels passieren sie. Irans geografische Position an ihrer Nordküste verschafft dem Land strategische Hebelwirkung, die wiederholt in Krisen genutzt wurde. Die Kontrolle über die Meerenge ist für Iran ein asymmetrisches Druckmittel gegen militärisch überlegene Gegner.", "established": null, "image_url": null}, {"name": "Katar", "type": "country", "role_in_story": "Wird von Iran als potenzielles Ziel genannt, da es US-Militärflugzeuge und Tanker auf seinem Territorium beherbergt", "profile": "Betreibt eine balancierte Außenpolitik zwischen USA (wichtiger Nicht-NATO-Verbündeter mit großer US-Luftwaffenbasis Al Udeid) und Iran. Das Emirat teilt mit Iran das weltgrößte Erdgasfeld im Persischen Golf. Diese doppelte Abhängigkeit zwingt Katar zu diplomatischer Vorsicht in regionalen Konflikten.", "established": null, "image_url": null}, {"name": "Kuwait", "type": "country", "role_in_story": "Wird von Iran gewarnt, dass die Bereitstellung von Infrastruktur für US-Militäroperationen Vergeltung nach sich ziehen könnte", "profile": "Beherbergt mehrere US-Militärbasen seit dem Golfkrieg 1991 und fungiert als logistisches Drehkreuz für amerikanische Operationen im Nahen Osten. Gleichzeitig pflegt Kuwait vorsichtige Beziehungen zu Iran, um regionale Stabilität zu wahren. Diese Position zwischen den Fronten wird durch die aktuelle Eskalation zunehmend unhaltbar.", "established": null, "image_url": null}, {"name": "Vereinigte Arabische Emirate", "type": "country", "role_in_story": "Werden von iranischen Politikern als legitime Ziele bezeichnet, falls sie weiterhin US-Militärpräsenz dulden", "profile": "Haben in den letzten Jahren ihre Position gegenüber Iran neu kalibriert, nachdem sie zuvor zu den härtesten regionalen Kritikern gehörten. Trotz umfangreicher Handelsbeziehungen mit Iran beherbergen die VAE weiterhin US-Militäreinrichtungen. Die Abraham-Abkommen mit Israel 2020 verschärften die Spannungen mit Iran, während gleichzeitig pragmatische Wirtschaftskontakte aufrechterhalten werden.", "established": null, "image_url": null}, {"name": "Israel", "type": "country", "role_in_story": "Führte gemeinsam mit den USA am 28. Februar koordinierte Angriffe gegen Iran durch, die den aktuellen Konflikt auslösten", "profile": "Betrachtet Irans Nuklearprogramm und regionale Präsenz als existenzielle Bedrohung. Führte über Jahre verdeckte Operationen gegen iranische Atomanlagen und Wissenschaftler durch. Die offene Militärallianz mit den USA gegen Iran markiert eine neue Eskalationsstufe im jahrzehntelangen Schattenkrieg.", "established": "1948-05-14", "image_url": null}, {"name": "Scott Bessent", "type": "person", "role_in_story": "Formuliert als US-Finanzminister die binäre Logik der Sanktionspolitik: 'Entweder man ist mit uns oder gegen uns'", "profile": "Hedgefonds-Manager, der als Trumps Finanzminister die wirtschaftliche Kriegsführung koordiniert. Seine Erfahrung in Finanzmärkten soll die technische Umsetzung umfassender Sanktionen optimieren. Die Formulierung 'with us or against us' erinnert bewusst an die Bush-Doktrin nach 9/11.", "established": "1962", "image_url": null}, {"name": "Vereinigte Staaten", "type": "country", "role_in_story": "Kündigen beispiellose Wirtschaftssanktionen gegen Iran an und fordern internationale Unterstützung für einen 'wirtschaftlichen D-Day'", "profile": "Setzen seit dem Ausstieg aus dem JCPOA 2018 auf eine Strategie maximalen wirtschaftlichen Drucks gegen Iran. Die militärische Konfrontation seit Februar 2025 kombiniert direkte Angriffe mit dem Versuch, Iran international zu isolieren. Die Forderung nach bedingungsloser Unterstützung durch Verbündete testet die Grenzen amerikanischer Hegemonie in einer multipolaren Welt.", "established": "1776-07-04", "image_url": null}], "quotes": [{"text": "We declare to all countries ... do not join the economic war waged by the United States. Any country participating in the imposition of economic restrictions against us is considered an enemy", "attribution": "Mohsen Rezaei, Sekretär des obersten nationalen Sicherheitsrats Irans", "context": "Warnung an regionale Staaten im iranischen Staatsfernsehen", "source_url": "https://www.cbsnews.com/news/iran-us-economic-war-trump-sanctions/"}, {"text": "This will be an ECONOMIC D-DAY, and we need all of our Allies to stand with the United States of America to isolate, and defeat, the Iran threat. These maniacs are on the ropes, and these HISTORIC MEASURES will cripple them and their ability to project terror worldwide.", "attribution": "Donald Trump", "context": "US-Präsident auf Truth Social", "source_url": "https://www.cbsnews.com/news/iran-us-economic-war-trump-sanctions/"}, {"text": "You're either with us or against us.", "attribution": "Scott Bessent, US-Finanzminister", "context": "Formulierung der binären Logik der US-Sanktionspolitik", "source_url": "https://www.aljazeera.com/news/2025/1/11/iran-warns-nearby-nations-against-joining-us-economic-war-efforts"}, {"text": "They hope that, if possible, they can break our unity with economic pressure and a group of protesters will take to the streets, and in a way, they will come to the aid of American F-35s", "attribution": "Mohsen Rezaei", "context": "Beschreibung der amerikanischen Strategie, gesellschaftliche Spaltung in Iran zu provozieren", "source_url": "https://www.aljazeera.com/news/2025/1/11/iran-warns-nearby-nations-against-joining-us-economic-war-efforts"}], "political_theory": {"theory": "[[Wirtschaftssanktionen als Instrument der Außenpolitik]]", "points": ["[[Donald Trump]]s 'wirtschaftlicher D-Day' repräsentiert den Versuch, durch totale wirtschaftliche Isolation Verhaltensänderungen zu erzwingen, ohne direkten Militäreinsatz eskalieren zu müssen.", "Die Drohung mit sekundären Sanktionen gegen Drittstaaten (extraterritoriale Anwendung) zeigt das Konzept wirtschaftlicher Hegemonie, bei dem der Zugang zum US-Finanz- und Handelssystem als Waffe eingesetzt wird.", "[[China]]s Weigerung demonstriert die Grenzen dieser Strategie in einer multipolaren Welt, in der alternative Wirtschaftssysteme und Handelspartnerschaften die Wirksamkeit westlicher Sanktionen mindern.", "[[Iran]]s Drei-Stufen-Gegenstrategie (Verhandlung, Separation, Vergeltung) illustriert, wie sanktionierte Staaten versuchen, Koalitionen gegen sie aufzubrechen und Kosten auf Drittstaaten zu verlagern.", "Der Streit um die [[Straße von Hormus]] zeigt asymmetrische Antworten auf wirtschaftlichen Druck: Kontrolle über kritische Infrastruktur als Gegengewicht zu finanzieller Überlegenheit."]}, "connections": [{"source": "Donald Trump", "target": "Iran", "relation": "droht mit beispielloser wirtschaftlicher Kriegsführung"}, {"source": "Mohsen Rezaei", "target": "Katar", "relation": "warnt vor Vergeltung bei Unterstützung der USA"}, {"source": "Mohsen Rezaei", "target": "Kuwait", "relation": "warnt vor Vergeltung bei Unterstützung der USA"}, {"source": "Mohsen Rezaei", "target": "Vereinigte Arabische Emirate", "relation": "warnt vor Vergeltung bei Unterstützung der USA"}, {"source": "China", "target": "Iran", "relation": "größter Handelspartner, lehnt US-Sanktionen ab"}, {"source": "Vereinigte Staaten", "target": "Israel", "relation": "führten gemeinsame Militärangriffe gegen Iran durch"}, {"source": "Iran", "target": "Straße von Hormus", "relation": "kontrolliert und blockiert die strategische Meerenge"}, {"source": "Scott Bessent", "target": "Donald Trump", "relation": "setzt als Finanzminister Sanktionsstrategie um"}, {"source": "Katar", "target": "Vereinigte Staaten", "relation": "beherbergt US-Militärbasen und -flugzeuge"}, {"source": "Kuwait", "target": "Vereinigte Staaten", "relation": "beherbergt US-Militärbasen und -flugzeuge"}, {"source": "Vereinigte Arabische Emirate", "target": "Vereinigte Staaten", "relation": "beherbergt US-Militärbasen und -flugzeuge"}], "countries_covered": ["Iran", "Vereinigte Staaten", "China", "Katar", "Kuwait", "Vereinigte Arabische Emirate", "Israel", "Ägypten", "Oman"], "image_url": null, "id": "4eac551f", "sources": ["Al Jazeera – All", "CBS News – World"], "article_urls": ["https://www.cbsnews.com/live-updates/iran-war-trump-economic-crackdown/", "https://www.aljazeera.com/video/newsfeed/2026/8/22/iran-threatens-countries-that-join-us-economic-d?traffic_source=rss", "https://www.aljazeera.com/news/2026/8/22/iran-warns-nearby-nations-against-joining-us-economic-war-efforts?traffic_source=rss"], "primary_sources": [], "market_correlation": null, "_pipeline_meta": {"model": "claude-sonnet-4-5", "research_depth": "lite", "articles_used": 3, "input_tokens": 4510, "output_tokens": 8036}}, {"title": "Kanada und USA: Handelsgespräche scheitern, Strafzölle eskalieren", "one_line": "[[Mark Carney]] bricht Verhandlungen mit der [[Trump-Administration]] ab und kündigt Gegenzölle an, nachdem die USA neue 50-Prozent-Zölle auf kanadische Waren verhängt haben.", "summary": ["Die Handelsgespräche zwischen Kanada und den USA sind am Freitag gescheitert, nachdem beide Seiten sich gegenseitig vorwarfen, in letzter Minute Bedingungen geändert zu haben. Premierminister [[Mark Carney]] bezeichnete die neuen US-Zölle als Fehlkalkulation und kündigte Dollar für Dollar Gegenzölle ab dem 8. September an.", "Die USA haben neue 50-Prozent-Zölle auf kanadische Waren im Wert von etwa 20 Milliarden US-Dollar verhängt, darunter Wein, Milchprodukte, Zement, Kleidung und Eishockeyausrüstung. Dies kommt zusätzlich zu bereits bestehenden Zöllen auf Stahl, Aluminium, Autos und Holz.", "[[Carney]] erklärte, die USA hätten zu viel gefordert und zu wenig geboten, unter anderem inakzeptable Einschränkungen der kanadischen Souveränität bei künftigen Handelsabkommen mit anderen Ländern. Der US-Handelsbeauftragte [[Jamieson Greer]] wies dies zurück und beschuldigte Kanada, neue Forderungen gestellt zu haben.", "Führende Politiker aller kanadischen Parteien, einschließlich der konservativen Opposition, stellen sich hinter [[Carney]]. Die Eskalation beendet vorerst die eng verflochtene Handelsbeziehung zwischen den beiden Verbündeten ohne erkennbaren Weg zur Lösung.", "[[Donald Trump]] hat sich bisher nicht zu dem Scheitern der Gespräche geäußert. Der US-Handelsbeauftragte bestätigte, dass keine Pläne zur Wiederaufnahme der Verhandlungen bestehen."], "deep_dive": "Der Zusammenbruch der Handelsgespräche zwischen Kanada und den USA markiert einen Wendepunkt in der nordamerikanischen Handelsarchitektur. Die beiden Länder teilen eine der am stärksten integrierten Wirtschaftsbeziehungen der Welt, mit täglich Milliarden Dollar an grenzüberschreitendem Handel. Die neuen 50-Prozent-Zölle betreffen zwar nur etwa fünf Prozent der kanadischen Exporte, doch die symbolische und praktische Bedeutung ist erheblich: Sie signalisieren das Ende einer jahrzehntelangen Ära des weitgehend reibungslosen Handels zwischen Nachbarn und Sicherheitspartnern.\n\nDie Zölle sind Teil der breiteren Handelspolitik der [[Trump-Administration]], die protektionistische Maßnahmen als Werkzeug zur Stärkung der amerikanischen Industrie einsetzt. Kritiker argumentieren, dass solche Zölle letztlich amerikanische Verbraucher durch höhere Preise belasten und globale Lieferketten destabilisieren. Für Kanada stellt die Situation eine existenzielle Herausforderung dar: Das Land ist wirtschaftlich stark von den USA abhängig, wobei etwa 75 Prozent der kanadischen Exporte in die USA gehen.\n\n[[Mark Carney]], der erst kürzlich das Amt des Premierministers übernommen hat, steht nun vor seiner ersten großen außenpolitischen Bewährungsprobe. Seine Entscheidung, die Verhandlungen abzubrechen und Gegenzölle anzukündigen, ist ein Balanceakt zwischen der Verteidigung kanadischer Interessen und dem Risiko einer weiteren Eskalation. Die parteiübergreifende Unterstützung in Kanada zeigt, dass die kanadische politische Klasse die US-Forderungen als Übergriff auf die nationale Souveränität betrachtet, insbesondere die Einschränkungen bei künftigen Handelsabkommen mit Drittländern.\n\nDie wirtschaftlichen Folgen werden auf beiden Seiten der Grenze spürbar sein. Kanadische Exporteure in betroffenen Sektoren wie Milchwirtschaft, Stahlindustrie und Bekleidung müssen mit Umsatzeinbußen rechnen. Gleichzeitig werden amerikanische Unternehmen und Verbraucher höhere Preise für importierte Waren zahlen. Die Unsicherheit über die Dauer und den Umfang des Handelskonflikts könnte Investitionsentscheidungen auf beiden Seiten hemmen und die nordamerikanische Wirtschaft insgesamt schwächen.", "cui_bono": "Die Eskalation nutzt innenpolitisch beiden Regierungschefs: [[Trump]] kann seiner Basis demonstrieren, dass er amerikanische Interessen kompromisslos durchsetzt, während [[Carney]] durch parteiübergreifende Unterstützung seine noch junge Regierung stabilisiert. Strukturell profitieren Industrien in beiden Ländern, die Konkurrenz aus dem Nachbarland fürchten, kurzfristig durch Marktabschottung. Langfristig könnten andere Handelspartner wie die EU oder China an Bedeutung gewinnen, wenn Kanada seine Handelsbeziehungen diversifiziert und sich vom US-Markt emanzipiert.", "historical_threads": [{"id": "us_kanada_handel", "title": "US-kanadische Handelsbeziehungen", "entries": [{"date": "1988", "title": "Kanadisch-amerikanisches Freihandelsabkommen (CUSFTA)", "one_line": "Die beiden Länder unterzeichnen ihr erstes umfassendes Freihandelsabkommen und schaffen damit die Grundlage für eine eng verflochtene Wirtschaftsbeziehung.", "extended": "Das CUSFTA beseitigte die meisten Zölle und Handelshemmnisse zwischen Kanada und den USA und schuf einen gemeinsamen Markt für Waren und Dienstleistungen. Das Abkommen war innenpolitisch umstritten, legte aber den Grundstein für die heutige wirtschaftliche Integration."}, {"date": "1994", "title": "NAFTA tritt in Kraft", "one_line": "Das Nordamerikanische Freihandelsabkommen erweitert die Handelszone um Mexiko und schafft einen der größten Wirtschaftsräume der Welt.", "extended": "NAFTA eliminierte schrittweise fast alle Zölle zwischen den drei Ländern und etablierte Streitschlichtungsmechanismen. Das Abkommen führte zu einer massiven Zunahme des grenzüberschreitenden Handels und der Integration von Lieferketten, wurde aber auch für Arbeitsplatzverluste in der US-Fertigung verantwortlich gemacht."}, {"date": "2018", "title": "Trump droht NAFTA aufzukündigen", "one_line": "Die Trump-Administration kritisiert NAFTA als unfair für die USA und fordert Neuverhandlungen, was zu erheblicher Unsicherheit führt.", "extended": "Trump bezeichnete NAFTA wiederholt als das schlechteste Handelsabkommen in der Geschichte und drohte mit dem Austritt. Die Unsicherheit belastete Investitionen und Unternehmensplanung. Nach zähen Verhandlungen wurde NAFTA schließlich durch das USMCA ersetzt."}, {"date": "2020", "title": "USMCA ersetzt NAFTA", "one_line": "Das neue Abkommen USMCA tritt in Kraft, mit strengeren Regeln für Automobilproduktion und Arbeitnehmerrechte, beendet aber zunächst die Handelsspannungen.", "extended": "Das USMCA (auch T-MEC genannt) aktualisierte die Handelsbedingungen für das digitale Zeitalter und verschärfte Ursprungsregeln, besonders im Automobilsektor. Es sollte die Handelsbeziehungen stabilisieren, doch die neuen Zölle zeigen, dass die grundlegenden Spannungen fortbestehen."}, {"date": "2025", "title": "Handelsgespräche scheitern, neue Zölle eskalieren", "one_line": "Nach dem Scheitern von Neuverhandlungen verhängen die USA 50-Prozent-Zölle auf ausgewählte kanadische Waren, Kanada kündigt Dollar für Dollar Gegenzölle an.", "extended": "Der Zusammenbruch der Gespräche beendet Jahrzehnte weitgehend stabiler Handelsbeziehungen. Die gegenseitigen Vorwürfe über Last-Minute-Änderungen und inakzeptable Bedingungen zeigen tiefe Risse in der Beziehung, ohne erkennbaren Weg zur Deeskalation."}]}, {"id": "trump_zollpolitik", "title": "Trump-Zollpolitik", "entries": [{"date": "2018-03", "title": "Stahl- und Aluminiumzölle gegen Verbündete", "one_line": "Trump verhängt 25-Prozent-Zölle auf Stahlimporte und 10 Prozent auf Aluminium, auch gegen traditionelle Verbündete wie Kanada und die EU, mit Verweis auf nationale Sicherheit.", "extended": "Die Zölle wurden unter Berufung auf Section 232 des Trade Expansion Act verhängt, der Handelsbeschränkungen aus Gründen der nationalen Sicherheit erlaubt. Verbündete reagierten empört auf die Klassifizierung als Sicherheitsbedrohung und verhängten Gegenzölle."}, {"date": "2018-07", "title": "Handelskrieg mit China beginnt", "one_line": "Die USA und China verhängen gegenseitige Zölle im Wert von Hunderten Milliarden Dollar, der Beginn eines mehrjährigen Handelskonflikts.", "extended": "Trump beschuldigte China des Diebstahls geistigen Eigentums und unfairer Handelspraktiken. Die eskalierende Zollspirale belastete beide Volkswirtschaften und globale Lieferketten. Der Konflikt wurde zeitweise durch ein Phase-1-Abkommen 2020 entschärft, blieb aber ungelöst."}, {"date": "2019", "title": "Zoll-Drohungen gegen Mexiko", "one_line": "Trump droht mit steigenden Zöllen auf mexikanische Waren, um die Regierung zu Maßnahmen gegen Migration zu zwingen, zieht die Drohung später zurück.", "extended": "Die Ankündigung, Zölle als Druckmittel in der Migrationspolitik einzusetzen, zeigte die Bereitschaft der Trump-Administration, Handelsinstrumente für nicht-wirtschaftliche Ziele zu nutzen. Mexiko stimmte schließlich verstärkten Grenzkontrollen zu."}, {"date": "2025", "title": "Neue Zollwelle gegen Kanada", "one_line": "Nach gescheiterten Neuverhandlungen verhängen die USA zusätzliche 50-Prozent-Zölle auf verschiedene kanadische Produkte, die sich zu bereits bestehenden Zöllen auf Stahl, Aluminium und Autos addieren.", "extended": "Die neuen Zölle treffen etwa fünf Prozent der kanadischen Exporte und umfassen Waren von Wein bis Eishockeyausrüstung. Sie markieren eine Ausweitung der protektionistischen Politik auch auf den engsten Handelspartner der USA, ohne Rücksicht auf die wirtschaftliche Integration."}]}, {"id": "carney_karriere", "title": "Mark Carneys politischer Aufstieg", "entries": [{"date": "2008-2013", "title": "Gouverneur der Bank of Canada", "one_line": "Carney führt Kanadas Zentralbank durch die globale Finanzkrise mit unkonventionellen geldpolitischen Maßnahmen und gewinnt internationales Ansehen.", "extended": "Unter Carneys Führung blieb das kanadische Bankensystem stabiler als viele andere Industrienationen. Seine pragmatische Krisenpolitik machte ihn zu einer respektierten Stimme in internationalen Finanzforen und öffnete ihm den Weg zu weiteren hochrangigen Positionen."}, {"date": "2013-2020", "title": "Gouverneur der Bank of England", "one_line": "Als erster Ausländer in diesem Amt steuert Carney die britische Geldpolitik durch Brexit-Unsicherheiten und erwirbt Reputation als technokratischer Problemlöser.", "extended": "Carney warnte vor den wirtschaftlichen Risiken des Brexit, was ihm Kritik von Brexit-Befürwortern einbrachte. Seine Amtszeit war geprägt von dem Versuch, die Bank of England durch politische Turbulenzen zu navigieren, ohne ihre Unabhängigkeit zu gefährden."}, {"date": "2024", "title": "Eintritt in die kanadische Politik", "one_line": "Nach Jahren der Spekulation tritt Carney der Liberalen Partei bei und wird als möglicher Nachfolger des Premierministers gehandelt.", "extended": "Carneys Wechsel von der Zentralbankwelt in die Parteipolitik wurde als Versuch gesehen, seine technokratische Expertise in konkrete Politik umzusetzen. Seine internationale Erfahrung und sein moderates Image machten ihn zu einem attraktiven Kandidaten für die Liberalen."}, {"date": "2025", "title": "Wird Premierminister Kanadas", "one_line": "Carney übernimmt das Amt des Premierministers und steht unmittelbar vor der Herausforderung, die Beziehungen zu den USA neu zu gestalten.", "extended": "Als frisch gewählter Premierminister fehlt Carney die lange parlamentarische Erfahrung vieler Vorgänger, bringt aber internationale Verhandlungserfahrung mit. Die gescheiterten Handelsgespräche mit den USA sind sein erster großer außenpolitischer Test und definieren seine frühe Amtszeit."}]}], "entities": [{"name": "Mark Carney", "type": "person", "role_in_story": "Kanadischer Premierminister, der die Handelsgespräche mit den USA abgebrochen hat und Gegenzölle angekündigt hat.", "profile": "Ehemaliger Gouverneur sowohl der Bank of Canada als auch der Bank of England, bekannt für seinen technokratischen, pragmatischen Ansatz in Wirtschaftsfragen. Carney bringt internationale Verhandlungserfahrung mit, muss aber als neuer Premierminister beweisen, dass er in der konfrontativen Welt der Hochpolitik bestehen kann. Sein Stil ist typischerweise zurückhaltend und analytisch, doch die Härte seiner Reaktion auf die US-Zölle signalisiert Bereitschaft zur Konfrontation, wenn kanadische Interessen auf dem Spiel stehen.", "established": null, "image_url": null}, {"name": "Donald Trump", "type": "person", "role_in_story": "US-Präsident, dessen Administration die neuen Zölle verhängt hat und die Handelsgespräche hat scheitern lassen.", "profile": "Verfolgt eine protektionistische Handelspolitik mit dem erklärten Ziel, amerikanische Industrien zu schützen und Arbeitsplätze zurückzuholen. Trump nutzt Zölle als Verhandlungsinstrument und Druckmittel, auch gegenüber traditionellen Verbündeten. Seine Handelspolitik ist geprägt von der Überzeugung, dass die USA in bisherigen Abkommen benachteiligt wurden, und der Bereitschaft, etablierte internationale Handelsstrukturen in Frage zu stellen oder abzubauen.", "established": null, "image_url": null}, {"name": "Jamieson Greer", "type": "person", "role_in_story": "US-Handelsbeauftragter, der Kanada beschuldigte, neue Forderungen gestellt zu haben, und bestätigte, dass keine Pläne zur Wiederaufnahme der Gespräche bestehen.", "profile": "Als oberster Handelsunterhändler der Trump-Administration setzt Greer die protektionistische Agenda um. Er verteidigt die US-Position öffentlich und ist Hauptakteur bei der Umsetzung von Zollpolitik. Seine Rolle ist es, die oft konfrontative Handelsstrategie der Administration zu koordinieren und zu rechtfertigen.", "established": null, "image_url": null}, {"name": "Trump-Administration", "type": "organization", "role_in_story": "Die US-Regierung unter Präsident Trump, die neue 50-Prozent-Zölle auf kanadische Waren verhängt hat und die Handelsgespräche zum Scheitern brachte.", "profile": "Verfolgt eine wirtschaftsnationalistische Agenda mit Fokus auf Protektion heimischer Industrien durch Zölle und restriktive Handelspolitik. Die Administration behandelt Handel als Nullsummenspiel und ist bereit, auch langjährige Verbündete unter Druck zu setzen. Ihre Handelspolitik ist Teil einer breiteren \"America First\"-Strategie, die multilaterale Abkommen skeptisch sieht und bilaterale Verhandlungen mit maximalem US-Leverage bevorzugt.", "established": "2025-01-20", "image_url": null}], "quotes": [{"text": "They asked too much and they offered too little", "attribution": "Mark Carney", "context": "Kanadischer Premierminister in seiner Ansprache an die Nation nach dem Scheitern der Handelsgespräche", "source_url": "https://www.bbc.com/news/world"}, {"text": "We clarified what was on offer and were continually disappointed by the answers.", "attribution": "Mark Carney", "context": "Carneys Zurückweisung der US-Behauptung, Kanada habe Last-Minute-Forderungen gestellt", "source_url": "https://www.bbc.com/news/world"}], "political_theory": {"theory": "[[Protektionismus]]", "points": ["Die Zollpolitik der [[Trump-Administration]] folgt klassischen protektionistischen Mustern: Schutz heimischer Industrien durch Handelshemmnisse, um Arbeitsplätze zu sichern und die inländische Produktion zu stärken.", "[[Mark Carney]]s Ankündigung von Dollar-für-Dollar-Gegenzöllen zeigt die typische Eskalationsdynamik protektionistischer Politik, bei der Vergeltungsmaßnahmen zu einer Spirale von Handelsbeschränkungen führen.", "Die Forderung der USA nach Einschränkung kanadischer Handelsabkommen mit Drittländern spiegelt eine merkantilistische Logik wider: die Kontrolle über Handelspartner zur Maximierung eigener Vorteile.", "Kritiker argumentieren, dass solche Maßnahmen letztlich beide Volkswirtschaften schädigen, da höhere Preise, reduzierte Effizienz und Unsicherheit die Vorteile des Freihandels zunichtemachen."]}, "connections": [{"source": "Mark Carney", "target": "Trump-Administration", "relation": "Führt gescheiterte Verhandlungen und verhängt Gegenzölle als Reaktion auf US-Zölle"}, {"source": "Donald Trump", "target": "Trump-Administration", "relation": "Leitet als Präsident die Regierung, die die Zollpolitik umsetzt"}, {"source": "Jamieson Greer", "target": "Trump-Administration", "relation": "Dient als US-Handelsbeauftragter und Chefunterhändler"}, {"source": "Trump-Administration", "target": "Protektionismus", "relation": "Verfolgt protektionistische Handelspolitik mit umfangreichen Zöllen"}], "countries_covered": ["USA", "Kanada"], "image_url": null, "id": "d78caecf", "sources": ["BBC News – World", "The New York Times – World"], "article_urls": ["https://www.bbc.co.uk/news/articles/cx272np7vgyo?at_medium=RSS&at_campaign=rss", "https://www.nytimes.com/2026/08/22/world/canada/carney-tariffs-trade-trump.html"], "primary_sources": [], "market_correlation": null, "_pipeline_meta": {"model": "claude-sonnet-4-5", "research_depth": "lite", "articles_used": 2, "input_tokens": 3834, "output_tokens": 5712}}, {"title": "Schwertangriff an schwedischer Schule tötet 17-Jährige", "one_line": "Ein 18-Jähriger tötete mit einem Schwert eine 17-jährige Schülerin an der [[Brinell School]] in [[Fagersta]] und verletzte drei weitere Personen, zwei davon schwer.", "summary": ["Am Freitagnachmittag griff ein 18-jähriger Mann die [[Brinell School]] in [[Fagersta]], etwa 170 Kilometer nordwestlich von Stockholm, mit einem Schwert an und tötete eine 17-jährige Schülerin. Der Angriff ereignete sich unmittelbar nach Ende der Sommerferien, während etwa 400 bis 500 Schüler im Unterricht waren.", "Drei weitere Personen wurden verletzt: ein 12-jähriger und ein 17-jähriger Junge erlitten schwere Verletzungen, eine dritte Person unter 18 Jahren wurde leicht verletzt und konnte das Krankenhaus bereits verlassen. Die Polizei gab Schüsse ab, als sie am Tatort eintraf, der Verdächtige wurde festgenommen.", "Der Verdächtige soll laut lokalen Medien ein ehemaliger Schüler der Schule sein und bei der Tat einen Helm getragen haben. Die Polizei hat bereits zwei Hausdurchsuchungen im Zusammenhang mit dem Fall durchgeführt und ermittelt wegen Mordes und versuchten Mordes.", "[[Ulf Kristersson]] und Oppositionsführerin [[Magdalena Andersson]] besuchten am Samstagmorgen die Schule, wo Bürger Blumen niederlegten und Kerzen entzündeten. Die Region hatte am Freitag den Notstand ausgerufen, der am Samstag wieder aufgehoben wurde.", "[[Schweden]] hat in den vergangenen Jahren eine Serie gewalttätiger Angriffe an Schulen erlebt, darunter der tödlichste Amoklauf der Landesgeschichte 2023 in Örebro mit elf Toten und tödliche Messerangriffe in Malmö 2022 und Trollhättan 2015."], "deep_dive": "Der Angriff in [[Fagersta]] reiht sich in eine beunruhigende Serie von Gewaltakten an schwedischen Bildungseinrichtungen ein, die das skandinavische Land in den letzten zehn Jahren erschüttert haben. Die Wahl einer Nahkampfwaffe wie eines Schwerts erinnert an frühere Attacken, bei denen Täter bewusst auf Klingen statt Schusswaffen setzten, möglicherweise aufgrund der strengeren Waffengesetze in [[Schweden]]. Die Tatsache, dass der Verdächtige laut lokalen Medien ein ehemaliger Schüler sein soll, deutet auf eine mögliche persönliche Verbindung zur [[Brinell School]] hin, doch zum Motiv gibt es bislang keine offiziellen Angaben.\n\nDie Häufung solcher Vorfälle hat in [[Schweden]] eine intensive Debatte über Sicherheit an Schulen, psychische Gesundheitsversorgung und die gesellschaftliche Integration ausgelöst. Nach dem Amoklauf in Örebro 2023, der als schlimmster Massenmord in der schwedischen Geschichte gilt, kündigte die Regierung verschärfte Waffengesetze an. Der Angriff in Trollhättan 2015 wurde von den Behörden explizit als rassistisches Hassverbrechen eingestuft, da der Täter gezielt dunkelhäutige Personen auswählte. Dies zeigt, dass die Motive hinter schulbezogener Gewalt in [[Schweden]] vielfältig sind und von persönlichen Racheakten bis zu ideologisch motivierten Hassverbrechen reichen.\n\nDie rasche Reaktion von [[Ulf Kristersson]] und [[Magdalena Andersson]], die gemeinsam die Schule besuchten, unterstreicht die politische Brisanz des Themas über Parteigrenzen hinweg. In einem Land, das traditionell als sicher und friedlich gilt, stellen wiederholte Schulangriffe das Selbstverständnis der Gesellschaft in Frage. Die Polizei betont, dass viele Zeugen befragt werden müssen und daher noch keine detaillierten Informationen preisgegeben werden können, um die Aussagen nicht zu beeinflussen. Die beiden bereits durchgeführten Hausdurchsuchungen deuten darauf hin, dass Ermittler nach Hinweisen auf Planung und mögliche Mittäter suchen.\n\nDie Stadt [[Fagersta]] mit ihrer relativ kleinen Schule von knapp 500 Schülern ist eine typische schwedische Kleinstadt, in der solche Vorfälle besonders stark nachwirken. Die Einrichtung eines Krisenzentrums in einer Sporthalle nahe der Schule und die große Beteiligung von Polizei, Feuerwehr und Gesundheitspersonal zeigen, wie die Gemeinschaft mobilisiert wurde, um die Betroffenen zu unterstützen. König [[Carl XVI Gustaf]] drückte sein Entsetzen aus, was die nationale Bedeutung des Vorfalls unterstreicht.", "cui_bono": "Politisch profitieren könnten Kräfte, die für strengere Sicherheitsmaßnahmen an Schulen eintreten, sei es durch verstärkte Kontrollen, bauliche Veränderungen oder erhöhte Polizeipräsenz. Die wiederholten Vorfälle liefern auch Argumente für jene, die psychische Gesundheitsversorgung und Frühwarnsysteme für gefährdete Jugendliche ausbauen wollen. Für [[Ulf Kristersson]]s Regierung bietet die parteiübergreifende Reaktion mit [[Magdalena Andersson]] die Möglichkeit, als entschlossen und geeint aufzutreten, während gleichzeitig Druck entsteht, konkrete Maßnahmen vorzulegen, die weitere Angriffe verhindern.", "historical_threads": [{"id": "schweden_schulgewalt", "title": "Schulgewalt in Schweden", "entries": [{"date": "2015-10", "title": "Angriff in Trollhättan", "one_line": "Ein 21-jähriger Mann tötete drei Menschen mit einem Schwert und Messer in einer Schule in Trollhättan, bevor er von der Polizei erschossen wurde. Behörden klassifizierten die Tat als rassistisches Hassverbrechen.", "extended": "Der Täter wählte gezielt dunkelhäutige Personen aus und verschonte hellhäutige Schüler. Die Tat löste eine nationale Debatte über Rechtsextremismus, Online-Radikalisierung und Sicherheit an Schulen aus. Sie war der erste große Schulangriff in Schweden seit Jahrzehnten und markierte das Ende der Vorstellung, das Land sei gegen solche Gewalt immun."}, {"date": "2022", "title": "Messerangriff in Malmö", "one_line": "Ein 18-jähriger Mann tötete zwei Lehrerinnen mit Messer und Axt an einer Schule in Malmö. Die Tat verstärkte die Debatte über Gewaltprävention im Bildungssystem.", "extended": "Der Angriff zielte gezielt auf weibliche Lehrkräfte und schockierte die drittgrößte Stadt Schwedens. Er zeigte, dass Schulgewalt nicht nur ein Phänomen in Kleinstädten ist, sondern auch urbane Zentren betrifft. Die Wahl von Nahkampfwaffen statt Schusswaffen wurde als Muster bei schwedischen Schulangriffen erkennbar."}, {"date": "2023", "title": "Amoklauf in Örebro", "one_line": "Bei einem Angriff an einem Bildungszentrum in Örebro starben elf Menschen einschließlich des Schützen. Es gilt als schlimmster Massenmord in der schwedischen Geschichte.", "extended": "Der Vorfall, bei dem erstmals in größerem Umfang Schusswaffen zum Einsatz kamen, führte zu Regierungsplänen für verschärfte Waffengesetze. Die hohe Opferzahl übertraf alle vorherigen Vorfälle und markierte einen neuen Tiefpunkt in der schwedischen Sicherheitslage. Der Fall verstärkte Forderungen nach umfassenderen Sicherheitskonzepten für Bildungseinrichtungen."}, {"date": "2025-01", "title": "Schwertangriff in Fagersta", "one_line": "Ein 18-jähriger ehemaliger Schüler tötete eine 17-Jährige mit einem Schwert an der Brinell School und verletzte drei weitere Personen, was die Serie schwedischer Schulangriffe fortsetzt.", "extended": "Der Angriff ereignete sich unmittelbar nach der Rückkehr der Schüler aus den Sommerferien in einer Kleinstadt nordwestlich von Stockholm. Die schnelle gemeinsame Reaktion von Regierung und Opposition zeigt, wie sehr das Thema Schulgewalt die schwedische Politik über Parteigrenzen hinweg beschäftigt. Das Muster ehemaliger Schüler als Täter und die Nutzung von Klingenwaffen setzt sich fort."}]}, {"id": "schweden_sicherheitspolitik", "title": "Schwedens Sicherheitswende", "entries": [{"date": "2022-09", "title": "Wahlsieg der Konservativen", "one_line": "Ulf Kristersson wurde nach dem Wahlsieg der bürgerlichen Allianz Ministerpräsident und versprach eine harte Linie gegen Bandenkriminalität und Gewalt.", "extended": "Die Wahl wurde maßgeblich von Sicherheitsthemen dominiert, da Schweden mit einer Welle von Bandenkriminalität und Schießereien konfrontiert war. Kristerssons Moderate Partei bildete eine Koalition mit Unterstützung der rechtspopulistischen Schwedendemokraten, die härtere Gesetze zur Bedingung machten. Dies markierte einen Paradigmenwechsel in der traditionell liberalen schwedischen Politik."}, {"date": "2023", "title": "Verschärfte Waffengesetze angekündigt", "one_line": "Nach dem Amoklauf in Örebro kündigte die Regierung Kristersson strengere Waffengesetze an, um Zugang zu Schusswaffen weiter einzuschränken.", "extended": "Die Maßnahmen zielten sowohl auf legale Waffenbesitzer mit erhöhten Anforderungen als auch auf den illegalen Waffenhandel ab. Schweden hatte bereits relativ strenge Waffengesetze im europäischen Vergleich, doch die Regierung sah Nachbesserungsbedarf. Die Balance zwischen Jägerrechten, die in ländlichen Gebieten wichtig sind, und städtischer Sicherheit wurde zur Herausforderung."}, {"date": "2024", "title": "Ausweitung polizeilicher Befugnisse", "one_line": "Die Regierung erweiterte Polizeibefugnisse für Durchsuchungen und Überwachung in als gefährlich eingestuften Gebieten, was Datenschutzdebatten auslöste.", "extended": "Die Maßnahmen richteten sich primär gegen organisierte Kriminalität in städtischen Problemvierteln, wo Bandengewalt eskaliert war. Bürgerrechtsorganisationen warnten vor Übergrifflichkeit und ethnischem Profiling, während Sicherheitsbehörden argumentierten, neue Werkzeuge seien notwendig. Die Debatte spiegelt eine breitere europäische Diskussion über die Balance zwischen Sicherheit und Freiheit wider."}]}], "entities": [{"name": "Brinell School", "type": "organization", "role_in_story": "Die Schule in Fagersta war Schauplatz des tödlichen Schwertangriffs, bei dem eine Schülerin starb und drei weitere Personen verletzt wurden.", "profile": "Eine weiterführende Schule mit knapp 500 Schülern in der schwedischen Kleinstadt Fagersta, etwa 170 Kilometer nordwestlich von Stockholm. Die Schule gehört zum kommunalen Bildungssystem und unterrichtet Jugendliche in verschiedenen Altersstufen. Nach dem Angriff wurde sie zum Symbol für die anhaltende Debatte über Sicherheit an schwedischen Bildungseinrichtungen.", "established": null, "image_url": null}, {"name": "Fagersta", "type": "country", "role_in_story": "Die Kleinstadt in Mittelschweden, in der sich der Angriff ereignete, löste nach der Tat den regionalen Notstand aus.", "profile": "Eine Industriestadt in der Provinz Västmanland mit etwa 13.000 Einwohnern, historisch geprägt durch Stahlproduktion. Die Stadt liegt in einer ländlichen Region Mittelschwedens und repräsentiert das traditionelle industrielle Schweden. Solche Kleinstädte erleben Gewalttaten besonders intensiv, da die Gemeinschaften eng vernetzt sind.", "established": null, "image_url": null}, {"name": "Ulf Kristersson", "type": "person", "role_in_story": "Als schwedischer Ministerpräsident besuchte er zusammen mit der Oppositionsführerin die Schule und reagierte auf den Angriff als nationale Krisensituation.", "profile": "Vorsitzender der Moderaten Partei und seit September 2022 Ministerpräsident Schwedens an der Spitze einer bürgerlichen Koalition mit Unterstützung der rechtspopulistischen Schwedendemokraten. Seine Regierung hat Sicherheitspolitik zum Schwerpunkt erklärt, insbesondere den Kampf gegen Bandenkriminalität und Gewalt. Kristersson steht für eine konservative Wende in der traditionell sozialdemokratisch geprägten schwedischen Politik.", "established": "1977", "image_url": null}, {"name": "Magdalena Andersson", "type": "person", "role_in_story": "Die Oppositionsführerin und Vorsitzende der Sozialdemokratischen Partei besuchte gemeinsam mit dem Ministerpräsidenten die Schule, was parteiübergreifende Einigkeit signalisierte.", "profile": "Ehemalige Ministerpräsidentin Schwedens (2021-2022) und erste Frau in diesem Amt, heute Vorsitzende der Sozialdemokratischen Partei und Oppositionsführerin. Andersson war zuvor langjährige Finanzministerin und steht für den sozialdemokratischen Pragmatismus in Wirtschafts- und Sozialpolitik. Ihre Bereitschaft, bei Sicherheitsfragen mit der Regierung zusammenzuarbeiten, zeigt die überparteiliche Bedeutung des Themas.", "established": "1967", "image_url": null}, {"name": "Schweden", "type": "country", "role_in_story": "Das skandinavische Land erlebt eine Serie von Schulangriffen, die das nationale Selbstverständnis als sichere, friedliche Gesellschaft herausfordern.", "profile": "Traditionell als Wohlfahrtsstaat mit hoher Lebensqualität, sozialer Gleichheit und niedriger Kriminalität bekannt. In den letzten Jahren konfrontiert mit steigender Bandenkriminalität in urbanen Gebieten und wiederholten Gewaltakten an Schulen, was zu einem Paradigmenwechsel in der Sicherheitspolitik geführt hat. Die Serie von Schulangriffen seit 2015 hat eine intensive gesellschaftliche Debatte über Integration, psychische Gesundheit und Gewaltprävention ausgelöst.", "established": null, "image_url": null}, {"name": "Carl XVI Gustaf", "type": "person", "role_in_story": "Der schwedische König drückte sein Entsetzen über den Angriff aus und unterstrich damit die nationale Bedeutung des Vorfalls.", "profile": "Seit 1973 König von Schweden in einer konstitutionellen Monarchie ohne politische Macht, aber mit wichtiger repräsentativer Funktion. Seine öffentlichen Stellungnahmen zu nationalen Tragödien dienen der symbolischen Einheit und des kollektiven Trauerns. Carl XVI Gustaf hat während seiner langen Regentschaft Schweden durch große gesellschaftliche Veränderungen begleitet.", "established": "1946", "image_url": null}], "quotes": [{"text": "We do not know what lies behind the act, but we know that police are working very intensively", "attribution": "Ulf Kristersson", "context": "Schwedischer Ministerpräsident", "source_url": "https://www.bbc.com/news/articles/cn4x84kxq0yo"}, {"text": "We have no reason at this time to believe that there are multiple perpetrators", "attribution": "Tommy Alriksson", "context": "Schwedischer Polizeichef", "source_url": "https://www.cbsnews.com/news/sweden-school-sword-attack-fagersta-girl-killed/"}, {"text": "That's why we can't give out too much information, because we don't want to influence witnesses", "attribution": "Tommy Alriksson", "context": "Schwedischer Polizeichef zur Zurückhaltung bei Details", "source_url": "https://www.cbsnews.com/news/sweden-school-sword-attack-fagersta-girl-killed/"}], "political_theory": null, "connections": [{"source": "Ulf Kristersson", "target": "Magdalena Andersson", "relation": "Besuchten gemeinsam als Regierung und Opposition die Schule, zeigen parteiübergreifende Einigkeit bei Sicherheitsfragen"}, {"source": "Brinell School", "target": "Fagersta", "relation": "Schule liegt in der Kleinstadt und wurde nach dem Angriff zum Zentrum regionaler Krisenbewältigung"}, {"source": "Ulf Kristersson", "target": "Schweden", "relation": "Führt als Ministerpräsident eine Regierung, die auf harte Sicherheitspolitik nach Serie von Gewalttaten setzt"}, {"source": "Carl XVI Gustaf", "target": "Schweden", "relation": "Repräsentiert als König die nationale Einheit und kollektive Trauer bei Tragödien"}], "countries_covered": ["SE"], "image_url": null, "id": "1bec9322", "sources": ["BBC News – World", "CBS News – World"], "article_urls": ["https://www.bbc.co.uk/news/articles/c8jnjp0lwlwo?at_medium=RSS&at_campaign=rss", "https://www.cbsnews.com/news/sweden-school-sword-attack-fagersta/"], "primary_sources": [], "market_correlation": null, "_pipeline_meta": {"model": "claude-sonnet-4-5", "research_depth": "lite", "ar
